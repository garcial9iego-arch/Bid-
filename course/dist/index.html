  body: fig("iss1-schedule", "<b>ISS-1 Irrigation Sprinkler Schedule.</b> One row per sprinkler type: symbol, type, pattern, radius, pressure, flow, inlet, swing joint, riser or pop-up height, remarks.", "iss1-full") +
`<div class="tablewrap"><table>
<thead><tr><th>Symbol</th><th>What it is</th><th>Key data</th></tr></thead>
<tbody>
<tr><td>⑤ (circle 5)</td><td>Riser sprinkler, gear driven, part circle</td><td>40' radius, 50 psi, 3.5 GPM, ¾" inlet, Type I swing joint, 10" riser</td></tr>
<tr><td>[5] (square 5)</td><td>Same, full circle (F)</td><td>40' radius, 3.5 GPM</td></tr>
<tr><td>⑥</td><td>Pop-up, gear driven</td><td>12" pop-up with protector; required next to shoulders, curbs, sidewalks and dikes</td></tr>
<tr><td>● (large)</td><td>Riser, gear driven</td><td>48' radius, 7.5 GPM</td></tr>
<tr><td>⑪</td><td>Riser, gear driven</td><td>25' radius, 1.8 GPM</td></tr>
<tr><td>• (small)</td><td>Tree well sprinkler assembly</td><td>Flood bubbler, 30 psi, 0.5 GPM, ½" inlet, internal check valve, 4 per 24" box tree</td></tr>
</tbody></table></div>
<p>The circled numbers in Remarks point to the “applicable when circled” list: ⑦ adjustable arc, ⑧ matched precipitation nozzles, ③ check valve, ⑩ four bubblers per 24" box tree.</p>`,
  ex: `<p>For each row, price one complete assembly: head + nozzle + swing joint + riser or pop-up + fittings + labor. Bid items 51–53 are each “sprinkler assembly,” so that's the unit you price.</p>`
},

{ h: "ISS-1: notes that cost money",
  lead: "Eight notes. Each one changes how you build or what you buy.",
  body: fig("iss1-notes", "<b>ISS-1 notes 1–8.</b>", "iss1-full") +
`<div class="tablewrap"><table>
<thead><tr><th>Note</th><th>Cost impact</th></tr></thead>
<tbody>
<tr><td>1 · Equipment outside paved maintenance pullouts; valves at the exiting end</td><td>Layout and trench routing</td></tr>
<tr><td>2 · 90° turns in new main = two 45° elbows</td><td>More fittings and thrust blocks</td></tr>
<tr><td>3 · Recycled water: piping, equipment and caps purple or labeled per County DEH</td><td>Purple parts cost more; labeling labor</td></tr>
<tr><td>4 · No ponding, runoff or overspray of recycled water</td><td>Nozzle adjustment time; risk during establishment</td></tr>
<tr><td>5 · Unlabeled laterals are 1"</td><td>Default pipe size for takeoff</td></tr>
<tr><td>6 · 1" conduit for wire from master valve and flow sensor to controller</td><td>Conduit and pull boxes</td></tr>
<tr><td>7 · Calsense flow checking must stay on</td><td>Programming and troubleshooting time</td></tr>
<tr><td>8 · No storage within drip lines of existing trees</td><td>Staging space and material handling</td></tr>
</tbody></table></div>`
},

{ h: "ISS-1: legend and codes",
  lead: "The legend and the valve code tell you how to read every label on the irrigation plans.",
  body: `<div class="figrow">` + fig("iss1-codes", "<b>Valve code and valve box label code.</b>", "iss1-full") + fig("iss1-legend", "<b>Legend, applicable-when-circled list and pipe sizing chart.</b>", "iss1-full") + `</div>
<ul>
<li><strong>Valve code</strong> X-X(X)-XX-XX-XX: RCV size, Calsense group or hydraulic block, controller letter, station, GPM, number of sprinklers.</li>
<li><strong>Replace valve box cover labels</strong>: the code shows the old controller and station, then the new ones. Every “R” symbol on the plans is one label (bid item 48).</li>
<li><strong>Abbreviations:</strong> RWM recycled water meter · RWCA recycled water connection assembly · RWWS recycled water warning sign · CCTS cross-connection test station · CARV combination air release valve · CNC control and neutral conductors · Irr C irrigation conduit.</li>
<li><strong>Pipe sizing chart (tree well laterals):</strong> 1" for 1–24 bubblers, 1¼" for 25–44, 1½" for 45–60, 2" for 61–100, at 0.5 GPM each.</li>
<li><strong>GR Comm / SR Comm:</strong> cellular modem vs spread-spectrum radio controller communication.</li>
</ul>`
},

{ h: "IR sheets: what's there now and what goes",
  lead: `${T1} Removal plans show the existing system. Struck-through labels mean remove; “to remain” means don't touch.`,
  body: fig("ir4-callouts", "<b>IR-4 callouts near East Orange Ave:</b> remove and salvage satellite controllers 40(J) and 40(I); existing 3\" water meter and backflow to remain; flow sensor, master valve and gate valve struck through (removed).", "ir4-full") +
`<ul>
<li><strong>“REMOVE AND SALVAGE Exist ICC-SAT ‘40(J)’ · 40 stations available · 34 used”</strong>: take out the old controller and deliver it to Caltrans (items 34–35). Salvage means careful removal and a trip to the Kearny Mesa landscape office.</li>
<li><strong>“Exist 3" WM to remain · Exist 3" BPAE to remain”</strong>: the drinking water meter and backflow stay; you cut and cap downstream.</li>
<li><strong>Struck-through items</strong> (2" FS, 3" RCVM, 4" GV): removed.</li>
<li><strong>“CAP”</strong>: cap the existing line at that point.</li>
<li><strong>Station labels</strong> like J-8 to J-12: existing valves that stay and get renamed on the IP sheets.</li>
</ul>`,
  watch: `<p>Removal is lump-sum work with no quantities given. Count every removal, cap and salvage callout on all seven IR sheets yourself, then price the crew time.</p>`
},

<ol class="steps">
<li><div><b>Existing: 2 recycled water meters, 2 RWCAs, CCTS</b>Owned by the water district side; you connect downstream.</div></li>
<li><div><b>New 3" gate valve, 2" flow sensor, 3" master valve (two-wire)</b>Bid items 39, 50, 55.</div></li>
<li><div><b>New 4" gate valve, 1" CARV</b>Items 56, 65.</div></li>
<li class="hl"><div><b>New 4" Class 315 supply line</b>Runs north along the shoulder, sheet after sheet (item 63).</div></li>
<li><div><b>Antenna mast with Yagi antenna</b>Item 47; detail on ID-1.</div></li>
</ol>`
},

<p><strong>Turning the tree well detail into a price:</strong></p>
<ul>
<li>Parts per bubbler: flood bubbler, check valve, riser, swing joint, 4" perforated drain pipe, gravel, filter fabric, purple drain grate</li>
<li>Labor per bubbler: dig, assemble, set grate 1"–2" above grade, connect to lateral</li>
<li>4 per 24" box tree × 43 trees, plus shrubs that get 2 (“additional flood bubbler, two total where occurs”)</li>
</ul>`,
  watch: `<p>“(Mod)” after a detail name means Caltrans modified its standard version. Don't price from memory of the standard plan; price what this detail shows.</p>`

{ h: "IQ-1: the irrigation quantity table",
  lead: `${T1} The quantity table breaks down every irrigation bid item by plan sheet. It's your check, and Caltrans's.`,
  body: fig("iq1-main", "<b>IQ-1 Irrigation Quantities (main supply side), replaced by Addendum 1.</b> Columns are bid items; rows are IP sheets 1–7. The triangle marks the changed cell.", "iq1-full") +
`<ul>
<li><strong>Columns</strong>: one per item (controllers by name, antenna mast, valve box labels, flow sensor, RCVs by size, gate valves, PRV, CARV, pipe by size).</li>
<li><strong>Rows</strong>: IP-1 to IP-7, then subtotals, the lateral total (from the left table) and conduit pipe from IQ-2.</li>
<li><strong>(N)</strong>: “not a separate bid item, for information only.” CEC boxes, two-wire decoder, ground rod. You still build them; their cost goes into other items.</li>
<li><strong>The triangle ①</strong> under the 2" RCV column: changed by Addendum 1 (4 → 3).</li>
</ul>`,
  ex: `<p><strong>Totals vs bid items:</strong> 4" pipe 7,493 LF = item 63 exactly. Valve box cover labels 197 here, but item 48 says 200. Small round-ups like that are normal; big gaps are questions to ask.</p>`
},

{ h: "IQ-1: the lateral table and a question to ask",
  lead: "The left table lists lateral pipe and sprinklers by controller and valve. Add it up yourself.",
  body: fig("iq1-laterals", "<b>IQ-1 lateral supply side, by controller (97A, 97B, 97C, 97E, 97F, 97G) and valve.</b> Totals: 1\" 1,390 LF · 1¼\" 325 · 1½\" 60 · 2\" 172 · 2½\" 130 · tree well 172 · riser 15 · pop-up 1.", "iq1-full") +
`<ul>
<li>These totals match bid items 57, 58, 59 and 61 exactly. 2" pipe 172 + 20 on the main side = 192 = item 60.</li>
<li><strong>Tree wells: 36 + 44 + 48 + 44 = 172 here (43 trees × 4), but bid item 51 is 180.</strong> Caltrans rounded several measured items up a little on this job (labels 197 → 200, compost 282 → 290), so this is probably rounding. If you're not sure, a short bidder inquiry settles it: “IQ-1 totals 172 tree well sprinkler assemblies; the Bid Item List shows 180. Please confirm.”</li>
<li>Valve 97C-38 alone has 350 LF of 1" and 110 LF of 1¼": long laterals on that station. Look it up on the IP sheet to see why.</li>
</ul>`,

{ h: "PL-1: sequence of work and hatch patterns",
  lead: "The sequence table is your schedule. The hatches tell you which treatment each area gets.",
  body: `<div class="figrow">` + fig("pl1-sequence", "<b>Application and sequence of work:</b> 1 irrigation · 2 weed germination · 3 compost (medium, 200 CY/acre) · 4 planting · 5 wood chip mulch (3\" depth).", "pl1-full") + fig("pl1-hatches", "<b>Planting legend hatches:</b> compost + weed germination + remove groundcover; the same plus wood mulch; MEPA; wood mulch; existing trees; temporary protection fence (rope).", "pl1-full") + `</div>
<ul>
<li><strong>Compost at 200 CY per acre</strong>: 200 ÷ 43,560 SF × 1,000 = about 4.6 CY per 1,000 SF.</li>
<li><strong>Weed germination</strong> comes between irrigation and planting. The specs add a 21-day hold.</li>
<li><strong>MEPA</strong> (maintain existing planted areas) areas get maintenance, not new planting.</li>
<li><strong>TPFR</strong> (temporary protection fence, rope) protects existing trees and shrubs, or nests if found.</li>
</ul>`
},

{ h: "PP-6: reading a planting plan",
  lead: `${T1} On Caltrans planting plans, each area has a callout with the plant counts and quantities. You still check them.`,
  body: `<div class="figrow">` + fig("pp6-callouts-left", "<b>PP-6 south side:</b> 190 AEO HAW, 190 SED DEN, 13,450 CAR EDU, 64 CY compost, 1,540 SQYD weed germination, remove groundcover; 94,020 SF MEPA; remove pampas grass.", "pp6-full") + fig("pp6-callouts-right", "<b>PP-6 east end:</b> 60 each of five shrubs, compost, weed germination, 20 CY wood mulch, and 220 LF of temporary protection fence around existing trees and shrubs.", "pp6-full") + `</div>
<ul>
<li>Read each callout, find the hatch it points to, and confirm the treatment matches the legend.</li>
<li>Check the math: 13,450 iceplant cuttings at 1' spacing need about 13,450 SF of area. Measure the hatched area to confirm.</li>
<li>Work items that aren't plants also live here: <strong>remove pampas grass</strong> (the specs require bagging seed heads and same-day disposal), remove groundcover, protection fence.</li>
</ul>`,
  ex: `<p>This sheet also has a small hatched area at the top with its own callout: <strong>1,960 CAR EDU</strong>, 7 CY compost, 190 SQYD weed germination. That 1,960 was missing from the original quantity table. Addendum 1 raised the iceplant total from 60,015 to 61,975, exactly 1,960 more. Reading every callout catches errors like this.</p>`
},

`<ul>
<li><strong>Railing runs by station</strong>: “END Temp Railing (Type K) Sta 266+60 ‘SD-805’ line” is the addendum change that raised K-rail from 1,340 to 1,700 LF.</li>

<ol class="steps">

<li><div><b>IR-7</b>What exists at Palomar today.</div></li>
<li class="hl"><div><b>IP-7</b>“Exist IC ‘97A’ (GR Comm), 48 station, 35 used”; two-wire schematic; antenna mast.</div></li>
<li><div><b>ID-1</b>Detail “Modify irrigation controller and enclosure ‘97A’”: radio, Yagi antenna, two-wire terminal.</div></li>
<li><div><b>IQ-1</b>One “modify” in the IP-7 row; antenna mast count.</div></li>
<li><div><b>E-1 / E-2</b>Which existing service feeds the controller, and the breaker for irrigation.</div></li>
<li class="hl"><div><b>Special Provisions 20-10.02B(1)</b>The Calsense parts list and the quoted price: $6,708.64.</div></li>
<li><div><b>Bid item 40</b>Lump sum per each. The winner bid $14,000.</div></li>
</ol>`,
  ex: `<p>Do this for the five most expensive items on any job. You'll understand the design, catch conflicts, and know exactly what your price covers.</p>`
},

{ h: "Plan review checklist for bidding",
  lead: "Use this every time. Check each box before you start pricing.",
  body: `<ol class="steps">
<li><div><b>Complete set</b>Sheet count matches the title block; addendum sheets swapped in.</div></li>
<li><div><b>Scale verified</b>On every sheet you measure, using the border scale bar.</div></li>
<li><div><b>Legends learned</b>Every symbol and abbreviation on ISS and PL sheets.</div></li>
<li class="hl"><div><b>Water source found</b>Point of connection, meter, backflow, pressure; recycled or potable.</div></li>
<li><div><b>Removals counted</b>Every remove, cap, salvage and “to remain”.</div></li>
<li class="hl"><div><b>New work counted</b>Your own counts, by sheet, compared to the quantity tables.</div></li>
<li><div><b>Details listed</b>Every detail referenced, with its parts and any “(Mod)”.</div></li>
<li><div><b>Notes priced</b>Every note on Tier 1 sheets has a cost line or a “no cost” check.</div></li>
<li class="hl"><div><b>Questions written</b>Every mismatch, missing quantity or conflict, as a bidder inquiry.</div></li>
<li><div><b>Tier 2 sent out</b>Traffic, electrical, and anything else you'll sub, sent for quotes.</div></li>
</ol>`
},

{ t: "terms", h: "Words to know",
  lead: "Plan-reading words from this set.",
  terms: [
    ["Title block", "The box with the job, sheet number, signer and dates."],
    ["Sheet code", "The short name of a sheet, like IP-7 or PQ-1."],
    ["Scale", "How plan distance converts to real distance (1\" = 50')."],
    ["Relative border scale", "A printed bar to check if a sheet is full size."],
    ["Station", "Distance along a centerline in feet, written like 298+55."],
    ["Match line", "Where one sheet continues on another."],
    ["Callout", "Text with a leader line pointing to what it describes."],
    ["Legend", "The key to symbols and hatch patterns."],
    ["Sprinkler schedule", "The table defining each sprinkler symbol."],
    ["Detail", "A drawing showing how one item is built."],
    ["(Mod)", "A Caltrans standard detail modified for this job."],
    ["Quantity table", "A sheet breaking bid quantities down by plan sheet."],
    ["(N)", "Not a separate bid item; for information only."],
    ["Revision triangle", "The mark showing what an addendum changed."],
    ["Point of connection (POC)", "Where the irrigation system connects to the water supply."],
    ["RWCA / CCTS", "Recycled water connection assembly / cross-connection test station."],
    ["MEPA", "Maintain existing planted areas."],
    ["TPFR", "Temporary protection fence (rope)."],
    ["ETW / EP", "Edge of traveled way / edge of pavement."],
    ["R/W", "Right of way: the owner's property line."]
  ]
},

{ t: "quiz", id: "plans", h: "Check yourself",
  lead: "Every answer comes from the real sheets.",
  qs: [
    { q: "A sheet says SCALE 1\" = 50', but the 3-inch border scale bar measures 1.5\" on your print. What scale is your print?", a: ["1\" = 50'", "1\" = 100'", "1\" = 25'"], c: 1, why: "Your print is half size, so every inch is 100 feet. Double anything you measure." },

/* Real Bid Lab: price real Caltrans District 11 planting and irrigation jobs,
   then compare against every bidder's actual line-item prices. Data: window.REAL_BIDS. */
window.LAB = (function(){
const P = window.REAL_BIDS || [];
const CATS = [
  ["planting", "Planting & soil"],
  ["irrigation", "Irrigation"],
  ["erosion", "Erosion control"],
  ["general", "General, traffic & storm water"],
  ["civil", "Civil & other"]
];
const SUB_SCOPE = ["planting", "irrigation", "erosion"];
const store = {
  get(k, d){ try { const v = localStorage.getItem("clb:lab:" + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("clb:lab:" + k, JSON.stringify(v)); } catch(e){} }
};
const money = v => v == null || !isFinite(v) ? "—" : (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const unitMoney = v => v == null || !isFinite(v) ? "—" : "$" + v.toLocaleString("en-US", { minimumFractionDigits: v < 100 && v % 1 ? 2 : 0, maximumFractionDigits: 2 });
const pct = v => v == null || !isFinite(v) ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v * 100).toFixed(1) + "%";
const qtyFmt = v => v.toLocaleString("en-US", { maximumFractionDigits: 2 });
const dateFmt = s => { if(!s) return "—"; const d = new Date(s + "T12:00:00"); return isNaN(d) ? s : d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); };
const titleCase = s => s.toLowerCase().replace(/(^|[\s\-\/&(])([a-z])/g, (m, a, c) => a + c.toUpperCase())
  .replace(/\bLlc\b/g, "LLC").replace(/\bDba\b/g, "dba").replace(/\bSd\b/g, "SD");
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
function txt(tag, cls, t){ const e = document.createElement(tag); if(cls) e.className = cls; e.textContent = t; return e; }
function median(a){ const s = a.filter(x => x != null).sort((x, y) => x - y); if(!s.length) return null; const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }

function state(p){
  const s = store.get(p.id, null) || {};
  if(!s.prices) s.prices = {};
  if(!s.cats) s.cats = SUB_SCOPE.slice();
  return s;
}
function save(p, s){ store.set(p.id, s); }
function inScope(p, s){ return p.items.map((it, k) => ({ it, k })).filter(x => !x.it.deleted && s.cats.includes(x.it.cat)); }
function yourUnit(p, s, it, k){ return it.fixed ? p.prices[0][k] : (s.prices[it.no] === "" || s.prices[it.no] == null ? null : +s.prices[it.no]); }
function yourTotal(p, s){
  let t = 0, priced = 0, n = 0;
  inScope(p, s).forEach(({ it, k }) => { n++; const u = yourUnit(p, s, it, k); if(u != null && isFinite(u)){ t += u * it.qty; priced++; } });
  return { total: t, priced, n };
}
function bidderScopeTotal(p, s, j){ return inScope(p, s).reduce((a, { it, k }) => a + (p.prices[j][k] || 0) * it.qty, 0); }
function winnerIndex(p){ const w = p.bidders.findIndex(b => b.awarded); return w < 0 ? 0 : w; }
function fullScope(s){ return CATS.every(c => s.cats.includes(c[0])); }

/* ---------- Lab home ---------- */

  ].map(x => '<div><h3>' + x[0] + '</h3><p>' + x[1] + '</p></div>').join("");

  const tb = el("tbody");
  P.forEach(p => {
    const s = state(p); const yt = yourTotal(p, s);
    const tr = el("tr");
    tr.append(txt("td", null, p.level), txt("td", "mono", p.id));
    const td = el("td"); const b = txt("button", "rowlink", p.short); b.type = "button"; b.onclick = () => go("lab", p.id); td.append(b);
    td.append(txt("div", "note", p.why)); tr.append(td);
    tr.append(txt("td", null, dateFmt(p.bidOpen)), txt("td", "num", String(p.bidders.length)), txt("td", "num", money(p.advertised)));
    let st = "Not started";
    if(yt.priced) st = s.revealed ? "Revealed · " + pct(yt.total / bidderScopeTotal(p, s, winnerIndex(p)) - 1) + " vs winner" : yt.priced + " of " + yt.n + " items priced";
    tr.append(el("td", null, '<span class="status ' + (s.revealed ? "ready" : "soon") + '"></span>'));
    tr.lastChild.firstChild.textContent = st;
    tb.append(tr);
  });
  t.append(tb); wrap.append(t); main.append(wrap);
  main.append(el("p", "note", 'Source: Caltrans Contractors Corner (bid item lists, plans, Special Provisions and Bid Summaries). Every bidder\'s line items in this lab were re-added and match Caltrans\'s printed totals to the cent. These bids are from 2021–2022; costs have risen since, so pricing with today\'s costs will usually land higher.'));
  main.lastChild.style.marginTop = "14px";
}

    const b = txt("div", "note", yt.priced + " of " + yt.n + " items priced" + (yt.priced < yt.n ? " · unpriced items count as $0" : ""));
    totalBar.append(a, b);
  }

  function drawSheet(){
    const rev = !!s.revealed;
    const w = winnerIndex(p);
    const t = el("table", "items");
    t.innerHTML = '<thead><tr><th>No.</th><th>Item</th><th>Unit</th><th class="num">Qty</th><th class="num">Your unit price</th><th class="num">Your amount</th>' +
      (rev ? '<th class="num">Winner unit price</th><th class="num">All bidders (low–median–high)</th><th class="num">You vs winner</th>' : '') + '</tr></thead>';
    const tb = el("tbody");
    CATS.forEach(([key, label]) => {
      if(!s.cats.includes(key)) return;
      const rows = p.items.map((it, k) => ({ it, k })).filter(x => x.it.cat === key && !x.it.deleted);
      if(!rows.length) return;
      const hr = el("tr", "grouprow"); const hc = txt("td", null, label); hc.colSpan = rev ? 9 : 6; hr.append(hc); tb.append(hr);
      let sub = 0, subW = 0;
      rows.forEach(({ it, k }) => {
        const tr = el("tr");
        tr.append(txt("td", "mono", String(it.no)));
        const d = el("td", "desc"); d.append(txt("span", null, it.desc));
        d.append(txt("span", "code", "Item " + it.code + (it.fixed ? " · set by Caltrans" : "")));
        tr.append(d, txt("td", "mono", it.unit), txt("td", "num", qtyFmt(it.qty)));
        const pc = el("td", "num");
        const inp = document.createElement("input"); inp.type = "number"; inp.min = "0"; inp.step = "any"; inp.inputMode = "decimal";
        inp.id = "u-" + p.id + "-" + it.no; inp.setAttribute("aria-label", "Your unit price for item " + it.no + ", " + it.desc);
        if(it.fixed){ inp.value = p.prices[0][k]; inp.disabled = true; }
        else if(s.prices[it.no] != null) inp.value = s.prices[it.no];
        const amt = el("td", "num");
        const u0 = yourUnit(p, s, it, k);
        amt.textContent = u0 == null ? "—" : money(u0 * it.qty);
        if(u0 != null) sub += u0 * it.qty;
        inp.oninput = () => {
          s.prices[it.no] = inp.value === "" ? null : inp.value; save(p, s);
          const u = yourUnit(p, s, it, k); amt.textContent = u == null ? "—" : money(u * it.qty);
          drawTotal(); if(s.revealed) drawResults();
        };
        pc.append(inp); tr.append(pc, amt);
        if(rev){
          const wu = p.prices[w][k]; subW += (wu || 0) * it.qty;
          const col = p.prices.map(r => r[k]).filter(x => x != null);
          tr.append(txt("td", "num", unitMoney(wu)));
          tr.append(txt("td", "num range", unitMoney(Math.min(...col)) + " – " + unitMoney(median(col)) + " – " + unitMoney(Math.max(...col))));
          const diff = u0 != null && wu ? u0 / wu - 1 : null;
          const dc = txt("td", "num", diff == null ? "—" : pct(diff));
          if(diff != null && Math.abs(diff) > 0.25 && !it.fixed) dc.className += diff > 0 ? " hi" : " lo";
          tr.append(dc);
        }
        tb.append(tr);
      });
      const sr = el("tr", "subrow");
      const sl = txt("td", null, label + " subtotal"); sl.colSpan = 5; sr.append(sl, txt("td", "num", money(sub)));
      if(rev){ sr.append(txt("td", "num", money(subW))); sr.append(el("td")); sr.append(txt("td", "num", subW ? pct(sub / subW - 1) : "—")); }
      tb.append(sr);
    });
    t.append(tb); tableWrap.innerHTML = ""; tableWrap.append(t);
    drawTotal();
    drawActions();
    drawResults();
  }

  function drawActions(){
    actions.innerHTML = "";
    if(!s.revealed){
      const r = txt("button", "btn primary", "3 · Reveal the real bids"); r.type = "button";
      r.onclick = () => {
        const yt = yourTotal(p, s);
        actions.innerHTML = "";
        const c = el("div", "confirm");
        c.append(txt("span", null, yt.priced < yt.n ? "You've priced " + yt.priced + " of " + yt.n + " items. Reveal anyway? You can keep editing afterward." : "Reveal every bidder's prices? You can keep editing afterward."));
        const y = txt("button", "btn primary", "Reveal"); y.type = "button"; y.onclick = () => { s.revealed = true; save(p, s); drawSheet(); results.scrollIntoView({ block: "start" }); };
        const n = txt("button", "btn", "Not yet"); n.type = "button"; n.onclick = drawActions;
        c.append(y, n); actions.append(c);
      };
      actions.append(r);
    } else {
      const h = txt("button", "btn", "Hide results and try again"); h.type = "button"; h.onclick = () => { s.revealed = false; save(p, s); drawSheet(); };
      actions.append(h);
    }
    const cp = txt("button", "ghost", "Copy my bid"); cp.type = "button";
    cp.onclick = () => {
      const lines = [p.id + " " + p.short, "Item\tDescription\tUnit\tQty\tUnit price\tAmount"];
      inScope(p, s).forEach(({ it, k }) => { const u = yourUnit(p, s, it, k); lines.push([it.no, it.desc, it.unit, it.qty, u == null ? "" : u, u == null ? "" : (u * it.qty).toFixed(2)].join("\t")); });
      lines.push("TOTAL\t\t\t\t\t" + yourTotal(p, s).total.toFixed(2));
      const text = lines.join("\n");
      const done = () => { cp.textContent = "Copied"; setTimeout(() => cp.textContent = "Copy my bid", 1600); };
      try { navigator.clipboard.writeText(text).then(done, () => fallback(text)); } catch(e){ fallback(text); }
    };
    function fallback(text){ const ta = el("textarea", "copyfallback"); ta.value = text; ta.setAttribute("aria-label", "Your bid as text"); actions.append(ta); ta.select(); }
    const clr = txt("button", "ghost", "Clear my prices"); clr.type = "button";
    clr.onclick = () => {
      const box = el("span", "confirm"); clr.replaceWith(box);
      box.append(txt("span", null, "Erase every price you entered for this job?"));
      const y = txt("button", "btn", "Erase"); y.type = "button"; y.onclick = () => { s.prices = {}; s.revealed = false; save(p, s); renderProject(main, id, go); };
      const n = txt("button", "ghost", "Keep them"); n.type = "button"; n.onclick = drawActions;
      box.append(y, n);
    };
    actions.append(cp, clr);
  }

  function drawResults(){
    results.innerHTML = "";
    if(!s.revealed) return;
    const yt = yourTotal(p, s); const w = winnerIndex(p);
    const rows = p.bidders.map((b, j) => ({ name: titleCase(b.name), total: bidderScopeTotal(p, s, j), b, you: false }));
    rows.push({ name: "You", total: yt.total, you: true });
    const valid = rows.filter(r => r.you || !r.b.status);
    valid.sort((a, b) => a.total - b.total);
    // Ties count in your favor: your place is 1 + the number of bids strictly below yours.
    const rank = valid.filter(r => !r.you && r.total < yt.total).length + 1;
    const wTot = rows[w].total;
    const off = wTot ? yt.total / wTot - 1 : 0;
    const offText = Math.abs(off) < 0.0005 ? "right at" : pct(off).replace(/^[+−]/, "") + (off > 0 ? " above" : " below");
    results.append(txt("h2", null, "4 · How your bid compares"));
    const head = el("div", "verdict");
    const scopeName = fullScope(s) ? "the full bid" : "the items you priced (" + s.cats.map(c => CATS.find(x => x[0] === c)[1].toLowerCase()).join(", ") + ")";
    head.append(txt("p", "lead", "Across " + scopeName + ", you would have placed " + ordinal(rank) + " of " + valid.length + ". You were " + offText + " the winning bid of " + money(wTot) + " (" + titleCase(p.bidders[w].name) + ")."));
    if(yt.priced < yt.n) head.append(txt("p", "note", "You left " + (yt.n - yt.priced) + " items unpriced; they count as $0, which makes your total look lower than it really is."));
    if(!fullScope(s)) head.append(txt("p", "note", "Bidders' totals here add up only the same items you priced. The companies bid the whole job, so they may have moved money between items (for example into mobilization or traffic control)."));
    results.append(head);

    /* Ranking bars */
    const max = Math.max(...rows.map(r => r.total), fullScope(s) ? p.engineersEstimate : 0) || 1;
    const chart = el("div", "rankchart");
    const all = rows.slice().sort((a, b) => a.total - b.total);
    all.forEach(r => {
      const line = el("div", "rk" + (r.you ? " you" : "") + (r.b && r.b.awarded ? " won" : ""));
      const nm = el("div", "rk-name"); nm.append(txt("span", null, r.name));
      if(r.b && r.b.awarded) nm.append(txt("span", "tag won", "Awarded"));
      if(r.b && r.b.status) nm.append(txt("span", "tag nr", r.b.status));
      const bar = el("div", "rk-bar"); const fill = el("i"); fill.style.width = (r.total / max * 100).toFixed(1) + "%"; bar.append(fill);
      line.append(nm, bar, txt("div", "rk-val", money(r.total) + (r.you ? "" : "  " + pct(r.total / wTot - 1))));
      chart.append(line);
    });
    if(fullScope(s) && p.engineersEstimate){
      const line = el("div", "rk ee"); const nm = el("div", "rk-name"); nm.append(txt("span", null, "Caltrans engineer's estimate"));
      const bar = el("div", "rk-bar"); const fill = el("i"); fill.style.width = (p.engineersEstimate / max * 100).toFixed(1) + "%"; bar.append(fill);
      line.append(nm, bar, txt("div", "rk-val", money(p.engineersEstimate) + "  " + pct(p.engineersEstimate / wTot - 1))); chart.append(line);
    }
    results.append(chart);

    /* Biggest differences */
    const diffs = inScope(p, s).filter(x => !x.it.fixed).map(({ it, k }) => {
      const u = yourUnit(p, s, it, k); const wu = p.prices[w][k] || 0;
      return { it, k, you: u == null ? 0 : u * it.qty, win: wu * it.qty, priced: u != null };
    }).map(d => Object.assign(d, { gap: d.you - d.win })).sort((a, b) => Math.abs(b.gap) - Math.abs(a.gap)).slice(0, 8);
    results.append(txt("h3", null, "Where your number differed most from the winner"));
    const dw = el("div", "tablewrap"); const dt = el("table");
    dt.innerHTML = '<thead><tr><th>No.</th><th>Item</th><th class="num">Your amount</th><th class="num">Winner amount</th><th class="num">Difference</th></tr></thead>';
    const db = el("tbody");
    diffs.forEach(d => {
      const tr = el("tr");
      tr.append(txt("td", "mono", String(d.it.no)), txt("td", null, d.it.desc + (d.priced ? "" : " (not priced)")), txt("td", "num", money(d.you)), txt("td", "num", money(d.win)));
      const g = txt("td", "num", (d.gap > 0 ? "+" : "") + money(d.gap)); if(Math.abs(d.gap) >= 1) g.className += d.gap > 0 ? " hi" : " lo"; tr.append(g); db.append(tr);
    });
    dt.append(db); dw.append(dt); results.append(dw);

    const learn = el("div", "callout ex");
    learn.append(txt("span", "lbl", "How to learn from this"));
    learn.append(el("div", null, `<ul>
<li>Look at the <strong>low–median–high</strong> range on each item, not only the winner. One bidder's unit price can be odd; the median shows what the market usually charges.</li>
<li>Big gaps on <strong>lump sum items</strong> (plant establishment, mobilization, traffic control) usually mean a different idea of scope or duration. Reread that section of the Special Provisions.</li>
<li>Big gaps on <strong>unit items</strong> (pipe, plants, sprinklers) usually mean a production rate or material price that's off. Check your crew output and supplier quotes.</li>
<li>Write down three lessons in your bid notebook before you try the next job.</li></ul>`));
    results.append(learn);
  }

  drawSheet();
}
function ordinal(n){ const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

return { renderList, renderProject, projects: P };
})();

    s.time.forEach(r => { const row = el("div", "row"); row.append(el("span", null, r[0]), el("span", null, r[1])); tb.append(row); });
    g.append(left, tb); body.append(g);
    if(s.body) body.append(el("div", "prose", s.body));
  } else {
    body.append(el("h2", null, s.h));
    if(s.lead) body.append(el("p", "lead", s.lead));
    if(t === "terms"){
      const dl = el("dl", "terms");
      s.terms.forEach(([k, v]) => { const d = el("div"); d.append(el("dt", null, k), el("dd", null, v)); dl.append(d); });
      body.append(dl);
    } else if(t === "quiz"){
      body.append(renderQuiz(m, s));
    } else if(t === "practice"){
      body.append(renderPractice(m, s));
    } else if(t === "scorer"){
      body.append(renderScorer(m, s));
    }
    if(s.body) body.append(el("div", "prose", s.body));
  }
  if(s.ex) body.append(callout("ex", s.exLabel || "Example", s.ex));
  if(s.watch) body.append(callout("watch", "Watch out", s.watch));
  if(s.deeper){
    const d = el("details", "deeper"); d.append(el("summary", null, "Go deeper"));
    d.append(el("div", "inner", s.deeper)); body.append(d);
  }
  if(s.src) body.append(el("p", "src", "Sources: " + s.src));
  return body;
}

function renderQuiz(m, s){
  const key = "quiz:" + m.n + ":" + (s.id || "q");
  const ans = store.get(key, {});
  const box = el("div");
  const score = el("p", "score");
  function update(){
    const done = Object.keys(ans).length;
    const right = s.qs.reduce((a, q, k) => a + (ans[k] === q.c ? 1 : 0), 0);
    score.textContent = done ? right + " of " + done + " right · " + (s.qs.length - done) + " to go" : s.qs.length + " questions · tap an answer";
  }
  s.qs.forEach((q, k) => {
    const qd = el("div", "q");
    qd.append(el("div", "qt", (k + 1) + ". " + q.q));
    const opts = el("div", "opts");
    const why = el("p", "why", q.why); why.hidden = ans[k] == null;
    q.a.forEach((a, j) => {
      const b = el("button", "opt", a); b.type = "button";
      const paint = () => {
        if(ans[k] == null) return;
        b.disabled = true;
        if(j === q.c) b.classList.add("right");
        else if(j === ans[k]) b.classList.add("wrong");
      };
      b.onclick = () => { ans[k] = j; store.set(key, ans); opts.querySelectorAll(".opt").forEach(x => x._paint()); why.hidden = false; update(); };
      b._paint = paint; paint(); opts.append(b);
    });
    qd.append(opts, why); box.append(qd);
  });
  const reset = el("button", "ghost", "Clear my answers"); reset.type = "button";
  reset.onclick = () => { store.set(key, {}); render(false); };
  update(); box.prepend(score); box.append(reset); box.style.cssText = "display:grid;gap:14px";
  return box;
}

function renderPractice(m, s){
  const key = "prac:" + m.n + ":" + (s.id || "p");
  const st = store.get(key, {});
  const wrap = el("div"); wrap.style.cssText = "display:grid;gap:10px";
  const tally = el("p", "tally");
  const total = s.items.reduce((a, x) => a + x.hrs, 0);
  function upd(){ const d = s.items.reduce((a, x, k) => a + (st[k] ? x.hrs : 0), 0); tally.textContent = "Done: " + d + " of " + total + " practice hours"; }
  const ul = el("ul", "tasks");
  s.items.forEach((it, k) => {
    const li = el("li", "task" + (st[k] ? " done" : ""));
    const id = "t-" + m.n + "-" + (s.id || "p") + "-" + k;
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.id = id; cb.checked = !!st[k];
    cb.onchange = () => { st[k] = cb.checked; store.set(key, st); li.classList.toggle("done", cb.checked); upd(); };
    const mid = el("div"); const lab = el("label", null, it.h); lab.htmlFor = id; mid.append(lab, el("div", "d", it.d));
    li.append(cb, mid, el("span", "hrs", it.hrs + " h")); ul.append(li);
  });
  upd(); wrap.append(tally, ul); return wrap;
}

function renderScorer(m, s){
  const key = "score:" + m.n + ":" + (s.id || "s");
  const st = store.get(key, {});
  const box = el("div", "scorer");
  const totalBox = el("div", "sc-total");
  const n = el("span", "n"); const v = el("span", "sc-verdict"); const d = el("span", "note");
  totalBox.append(n, v, d);
  function upd(){
    let sum = 0, answered = 0;
    s.items.forEach((x, k) => { if(st[k] != null && st[k] !== ""){ sum += +st[k]; answered++; } });
    n.textContent = sum + " / " + s.items.length * 2;
    if(answered < s.items.length){ v.textContent = "Score all " + s.items.length + " items"; d.textContent = answered + " scored so far."; return; }
    const band = s.bands.find(b => sum >= b[0]); v.textContent = band[1]; d.textContent = band[2];
  }
  s.items.forEach((x, k) => {
    const row = el("div", "sc-row");
    const id = "sc-" + m.n + "-" + k;
    const lab = el("label", null, x[0]); lab.htmlFor = id; lab.append(el("span", "hint", x[1]));
    const sel = document.createElement("select"); sel.id = id;
    [["", "Score…"], ["2", "2 · Yes / strong"], ["1", "1 · Maybe / so-so"], ["0", "0 · No / weak"]].forEach(o => sel.add(new Option(o[1], o[0])));
    sel.value = st[k] == null ? "" : String(st[k]);
    sel.onchange = () => { st[k] = sel.value === "" ? null : +sel.value; store.set(key, st); upd(); };
    row.append(lab, sel); box.append(row);
  });
  upd(); box.append(totalBox); return box;
}

function renderModule(scroll){
  const m = MODS[cur.m]; const i = cur.i; const main = $("main"); main.innerHTML = "";
  markSeen(m.n, i); store.set("pos:" + m.n, i); store.set("last", { m: m.n, i });
  const o = OUT.find(x => x.n === m.n);
  const head = el("div", "mhead");
  head.append(el("span", "eyebrow", isDeck(m) ? m.kicker + " · " + m.hours + " hours" : "Module " + pad(m.n) + " of " + OUT.length + " · " + m.hours + " hours"));
  const h1 = el("h1"); h1.textContent = o ? o.title : m.title; head.append(h1);
  main.append(head);
  const strip = el("div", "strip"); strip.setAttribute("aria-label", "Slides in this module");
  const sn = seen(m.n);
  m.slides.forEach((s, k) => {
    const b = el("button"); b.type = "button"; b.title = (k + 1) + ". " + s.h.replace(/<[^>]+>/g, "");
    b.setAttribute("aria-label", "Slide " + (k + 1) + ": " + b.title);
    if(sn.has(k)) b.classList.add("seen"); if(k === i) b.setAttribute("aria-current", "true");
    b.onclick = () => go("module", m.n, k); strip.append(b);
  });
  main.append(strip);
  const sheet = el("article", "sheet"); sheet.setAttribute("aria-live", "polite");
  const top = el("div", "sheet-top");
  const label = el("span", "mono", shortLabel(m) + " · Slide " + (i + 1) + " / " + m.slides.length);
  const tools = el("div"); tools.style.cssText = "display:flex;gap:8px;flex-wrap:wrap";
  const rd = el("button", "ghost", "Read aloud"); rd.type = "button"; rd.setAttribute("aria-pressed", "false");
  if(!("speechSynthesis" in window)) rd.hidden = true;
  rd.onclick = () => {
    if(speaking){ stopSpeech(); rd.setAttribute("aria-pressed", "false"); rd.textContent = "Read aloud"; return; }
    const clone = sheet.querySelector(".sheet-body").cloneNode(true);
    clone.querySelectorAll("details:not([open]) .inner, select, .src").forEach(x => x.remove());
    try {
      const u = new SpeechSynthesisUtterance(clone.innerText.replace(/\s+/g, " "));
      u.rate = 0.95; u.onend = () => { speaking = false; rd.setAttribute("aria-pressed", "false"); rd.textContent = "Read aloud"; };
      speechSynthesis.cancel(); speechSynthesis.speak(u); speaking = true; rd.setAttribute("aria-pressed", "true"); rd.textContent = "Stop reading";
    } catch(e){ rd.hidden = true; }
  };
  tools.append(rd); top.append(label, tools);
  sheet.append(top, renderSlide(m, i)); main.append(sheet);
  const ctr = el("div", "controls");
  const prev = el("button", "btn", "← Back"); prev.type = "button"; prev.disabled = i === 0;
  prev.onclick = () => go("module", m.n, i - 1);
  const next = el("button", "btn primary"); next.type = "button";
  const last = i === m.slides.length - 1;
  const nextMod = isDeck(m) ? null : MODS[m.n + 1];
  next.textContent = last ? (nextMod ? "Start Module " + (m.n + 1) + " →" : "Back to course map") : "Next →";
  next.onclick = () => last ? (nextMod ? go("module", m.n + 1, 0) : go("home")) : go("module", m.n, i + 1);
  ctr.append(prev, el("span", "kbd", "← → keys work too"), next);
  main.append(ctr);
  if(scroll) main.scrollIntoView({ block: "start", behavior: "auto" });
}

function render(scroll){
  stopSpeech();
  renderNav();
  if(cur.view === "module" && MODS[cur.m]) renderModule(scroll);
  else if(cur.view === "lab" && window.LAB){
    const labGo = (v, id) => go("lab", id || null, 0);
    if(cur.m) window.LAB.renderProject($("main"), cur.m, labGo); else window.LAB.renderList($("main"), labGo);
    if(scroll) $("main").scrollIntoView({ block: "start" });
  }
  else { renderHome(); if(scroll) window.scrollTo(0, 0); }
}

document.addEventListener("keydown", e => {
  if(cur.view !== "module" || document.querySelector(".zoombox")) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "select" || tag === "textarea" || e.metaKey || e.ctrlKey || e.altKey) return;
  const m = MODS[cur.m];
  if(e.key === "ArrowRight" && cur.i < m.slides.length - 1) go("module", m.n, cur.i + 1);
  if(e.key === "ArrowLeft" && cur.i > 0) go("module", m.n, cur.i - 1);
});

function openZoom(src, alt){
  const box = el("div", "zoombox"); box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true"); box.setAttribute("aria-label", alt || "Plan sheet");
  const bar = el("div", "zoombar"); const t = el("span"); t.textContent = (alt || "Plan sheet") + " · scroll to pan";
  const z = el("div"); z.style.cssText = "display:flex;gap:8px";
  const fit = el("button", null, "Fit"); fit.type = "button"; const full = el("button", null, "Full size"); full.type = "button";
  const close = el("button", null, "Close"); close.type = "button";
  z.append(fit, full, close); bar.append(t, z);
  const sc = el("div", "zoomscroll"); const img = new Image(); img.src = src; img.alt = alt || "";
  const fitIt = () => { img.style.width = "100%"; img.style.maxWidth = "100%"; };
  const fullIt = () => { img.style.width = img.naturalWidth ? img.naturalWidth + "px" : "auto"; img.style.maxWidth = "none"; };
  fit.onclick = fitIt; full.onclick = fullIt; img.onload = fullIt;
  sc.append(img); box.append(bar, sc); document.body.append(box);
  const shut = () => { box.remove(); document.removeEventListener("keydown", esc); };
  const esc = e => { if(e.key === "Escape") shut(); };
  close.onclick = shut; document.addEventListener("keydown", esc); close.focus();
}
$("main").addEventListener("click", e => {
  const img = e.target.closest(".fig img"); if(!img) return;
  openZoom(img.dataset.full || img.src, img.alt);
});

cur = parseHash(); render(false);
})();
</script>
