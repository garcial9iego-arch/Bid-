{ h: "Paying subs and getting paid",
  lead: "California sets deadlines for passing payments down the chain. They protect you as a sub and bind you as a prime.",
  body: `<ul>
<li><strong>Progress payments:</strong> a prime or sub must pay its subs within 7 days of receiving each progress payment, unless agreed otherwise in writing. Late payment costs 2% per month.</li>
<li><strong>Retention:</strong> on public works, the agency must release retention within 60 days after completion, and the prime must pay each sub its share within 7 days of receiving it.</li>
<li><strong>Disputes:</strong> in a good faith dispute, no more than 150% of the disputed amount can be held back.</li>
<li><strong>Flow-down:</strong> your subcontracts must include the prevailing wage Labor Code sections (1771, 1775, 1776, 1777.5, 1813, 1815). Before final payment, get each sub's signed affidavit that it paid prevailing wages.</li>
</ul>`,
  ex: `<p>As a landscape sub, you'll see this from the other side: GCs hold your payment until your certified payroll is in, and the City of San Diego withholds payments when payroll records are late. Send payroll on time and your money moves on time.</p>`,
  deeper: `<p>Business and Professions Code §7108.5 (progress payments); Public Contract Code §7107 (retention); Public Contract Code §10262 has its own 7-day rule on state contracts like Caltrans. Module 16 covers billing and retention in detail.</p>`,
  src: "Cal. Bus. &amp; Prof. Code §7108.5; Cal. Public Contract Code §§7107, 10262; Cal. Labor Code §1775(b)."
},

{ h: "Pitfalls for residential landscape companies",
  lead: "These are the mistakes companies make on their first public jobs. Every one costs real money.",
  body: `<ul>
<li><strong>Bidding your residential crew rate.</strong> Public labor can cost twice as much. Rebuild the crew day from the determination.</li>
<li><strong>Using the printed rate when it has **.</strong> The scheduled raise is part of the minimum.</li>
<li><strong>Wrong craft.</strong> Paying a fitter's work at a tender rate, or forgetting the operator rate for equipment hours.</li>
<li><strong>Too many tenders.</strong> Breaking the ratio means paying journeyman rates for those hours, plus penalties.</li>
<li><strong>No DAS 140.</strong> Even short jobs over the $30,000 contract threshold need it.</li>
<li><strong>Late certified payroll.</strong> Payments stop and penalties start.</li>
<li><strong>Benefits not annualized.</strong> Claiming a full year's benefit cost against public hours only.</li>
<li><strong>Owner working without reporting.</strong> Owner hours still go on certified payroll.</li>
<li><strong>Using an unregistered sub or trucker.</strong> Check DIR registration for every sub before you list them.</li>
<li><strong>No time cards by craft.</strong> Without them you can't prove which rate applied.</li>
</ul>`,
  watch: `<p>Set up prevailing wage payroll with your payroll provider before you bid your first public job. Ask them if they can produce certified payroll and the DIR eCPR upload file (XML).</p>`
},

{ t: "terms", h: "Words to know",
  lead: "Add these to your notebook.",
  terms: [
    ["Public works", "Construction, alteration, installation, demolition, repair or maintenance paid for in whole or in part with public funds."],
    ["Prevailing wage", "The minimum hourly pay, wages plus benefits, the state sets for each craft in each county."],
    ["DIR", "California Department of Industrial Relations. Sets rates, registers contractors and enforces public works law."],
    ["General prevailing wage determination", "DIR's published rates for one craft and area, issued Feb 22 and Aug 22."],
    ["Bid advertisement date", "The date the job was advertised. It fixes which determination applies."],
    ["Predetermined increase", "A raise already scheduled in the determination (marked **). You must pay it when it takes effect."],
    ["Basic hourly rate", "The taxable wage part of the prevailing rate."],
    ["Employer payments (fringe)", "Health, pension, vacation, training and other amounts paid on top of the basic rate."],
    ["Total hourly rate", "Basic rate plus employer payments. The real minimum cost per hour."],
    ["Craft / classification", "The trade category a worker is paid under, like Landscape/Irrigation Laborer."],
    ["Tender / Tradesman", "Lower-paid helper classifications allowed only in set ratios with journeymen."],
    ["Journeyman", "A fully qualified worker in a craft."],
    ["Apprentice", "A registered trainee in a state-approved program, paid apprentice rates."],
    ["DAS 140", "Form notifying apprenticeship committees of your contract award."],
    ["DAS 142", "Form requesting dispatch of apprentices."],
    ["CAC-2", "Form sent with training fund payments to the California Apprenticeship Council."],
    ["Certified payroll (CPR)", "Weekly payroll record by worker and craft, signed under penalty of perjury."],
    ["eCPR", "Electronic certified payroll uploaded to DIR."],
    ["LCPtracker", "The certified payroll system Caltrans uses."],
    ["Davis-Bacon", "Federal prevailing wage law for federal and federally funded construction."],
    ["Annualization", "Spreading benefit credit over all hours worked in the year, public and private."]
  ]
},

{ t: "quiz", id: "m11", h: "Check yourself",
  lead: "Tap an answer to check it.",
  qs: [
    { q: "Which wage determination applies to a public job?", a: ["The one in effect on the day you start work", "The one in effect on the bid advertisement date", "The newest one when you sign the contract"], c: 1, why: "Rates are locked to the bid advertisement date so every bidder prices the same rates, plus any predetermined increases." },
    { q: "A determination's expiration date shows two asterisks (**). What does that mean?", a: ["The rate is good for the whole project", "A raise is already scheduled and must be paid after that date", "The determination was cancelled"], c: 1, why: "Double asterisks mean a predetermined increase. Price it for work after that date." },
    { q: "The 2026-2 Landscape/Irrigation Laborer total is $76.67 and the basic rate is $47.57. What is the daily overtime rate?", a: ["$115.01 (1.5 × $76.67)", "$100.455 ($47.57 × 1.5 + $29.10)", "$76.67, overtime isn't extra"], c: 1, why: "Overtime multiplies the basic rate, then the employer payments are added once." },
    { q: "Can a crew of four on a City landscape job include two Landscape/Irrigation Tenders?", a: ["No, tenders are never allowed", "Yes, the 3rd and 4th workers may be tenders if the 1st and 2nd are laborers (or an apprentice as 2nd)", "Yes, all four can be tenders"], c: 1, why: "Footnote d sets the laborer/tender order. Only plant establishment may be done entirely by tenders." },
    { q: "Your two laborers will work 640 journeyman hours. How many apprentice hours does the 1:5 ratio require?", a: ["128", "64", "320"], c: 0, why: "640 ÷ 5 = 128 apprentice hours." },
    { q: "Where do you submit certified payroll on a Caltrans job?", a: ["Only to DIR's eCPR system", "LCPtracker Pro, as the Caltrans specs require", "Nowhere, Caltrans doesn't require it"], c: 1, why: "Caltrans is exempt from DIR's eCPR and uses LCPtracker Pro." },
    { q: "On a federal-aid Caltrans job, the state rate is $59.81 and the federal rate is $55.78 for the same work. What do you pay?", a: ["$55.78", "The average", "At least $59.81"], c: 2, why: "You must not pay less than the higher of the state and federal rates." },
    { q: "What is the maximum penalty for underpaying prevailing wage, per worker per day, on top of back wages?", a: ["$25", "$200", "$1,000"], c: 1, why: "Labor Code §1775 allows up to $200 per worker per day, with minimums of $40, $80 or $120 depending on the case." }
  ]
},

{ t: "practice", id: "m11", h: "Practice assignments",
  lead: "These build the tools you'll use on every public bid. Save them in the bid-ready folder.",
  items: [
    { h: "Download today's San Diego determinations", hrs: 0.5, d: "<p>On <a href=\"https://www.dir.ca.gov/oprl/DPreWageDetermination.htm\" target=\"_blank\" rel=\"noopener\">DIR's determinations page</a>, open the current period. Save the PDFs for Landscape/Irrigation Laborer/Tender, Operating Engineer, Teamster and Laborer (Engineering Construction), plus the San Diego County subtrades page for Landscape/Irrigation Fitter and Tradesman. Save each craft's Increase, Holidays and Scope PDFs too. Write the issue and expiration dates (with asterisks) on a cover sheet.</p>" },
    { h: "Build a rate table", hrs: 0.75, d: "<p>In a spreadsheet, list each craft and group you'd use: basic rate, each employer payment, total, 1½× and 2× rates, training amount and the date of the next increase. Add a column for which tasks each craft covers, from the Scope PDFs. Check that your totals match DIR's to the cent.</p>" },
    { h: "Price two crew days", hrs: 0.75, d: "<p>Using your rate table, build an 8-hour cost for (1) a 4-person planting crew with the tender mix allowed and (2) a 4-person irrigation crew with a fitter and a skid steer operator. Add burden using your company's real payroll tax, workers' comp and insurance rates. Compare both to your current residential crew day.</p>" },
    { h: "Redo the 11-428704 crew with the higher rates", hrs: 0.5, d: "<p>Open the federal wage rates for <a href=\"#lab-11-428704\">11-428704</a> and DIR's superseded 2021-1 San Diego determinations. For each worker in the crew you built in Module 15, find both rates and use the higher. Look up the July 1, 2021 Operating Engineer increase and add it.</p>" },
    { h: "Map out the apprenticeship steps", hrs: 0.5, d: "<p>Download the <a href=\"https://www.dir.ca.gov/DAS/DASForm140.pdf\" target=\"_blank\" rel=\"noopener\">DAS 140</a> and <a href=\"https://www.dir.ca.gov/DAS/DASForm142.pdf\" target=\"_blank\" rel=\"noopener\">DAS 142</a>. Use DIR's apprenticeship search to find the committees that serve San Diego County for Landscape/Irrigation Laborer and Fitter. Fill in a sample DAS 140 for a made-up $250,000 City park job and write a one-page checklist with dates.</p>" },
    { h: "Talk to your payroll provider", hrs: 0.5, d: "<p>Ask: Can you run prevailing wage payroll by craft? Produce certified payroll and DIR eCPR XML files? Handle cash fringe and annualization? Upload to LCPtracker? What does it cost? Write down the answers and what you need to set up before your first public job.</p>" },
    { h: "Look at real certified payroll", hrs: 0.5, d: "<p>Use DIR's public <a href=\"https://services.dir.ca.gov/pw?id=ecpr_public_search\" target=\"_blank\" rel=\"noopener\">certified payroll search</a> to find a recent San Diego County park or landscape project. Open one redacted payroll. Note the crafts used, hours per day and rates paid. Compare them to your rate table.</p>" }
  ]
},

{ h: "Module 11 summary",
  lead: "Public work pays by the state's rates, and the state checks. Price it right and keep the paperwork clean.",
  body: `<ul>
<li>Public money in the job means prevailing wage for every worker over $1,000.</li>
<li>Use the DIR determinations in effect on the bid advertisement date, plus every predetermined increase (**) during the job.</li>
<li>Pick the craft by the work done. Landscape/Irrigation Laborer, Tender, Fitter, Operating Engineer and Teamster cover most landscape jobs. Follow the tender and tradesman ratios.</li>
<li>Pay at least the total hourly rate. Overtime multiplies the basic rate. Benefits not paid into plans go on the check.</li>
<li>On contracts of $30,000 or more: DAS 140, DAS 142, 1:5 apprentice hours and training fund payments.</li>
<li>Certified payroll weekly: DIR eCPR on most jobs, LCPtracker on Caltrans, plus the City's system on City jobs.</li>
<li>On federal-aid jobs, pay the higher of state and federal for each worker.</li>
<li>Rebuild the crew day from the rates. It can cost twice the residential number.</li>
</ul>
<p><strong>Next: Module 12 · Pre-Bid Meetings, RFIs, Addenda and Communication.</strong></p>`
}
]
});

{ h: "The rule: only written answers count",
  lead: "During bidding, the documents can only be changed in writing, by addendum. Anything said out loud has no effect.",
  body: `<p>Here is how real bid documents say it:</p>
<ul>
<li><strong>City of San Diego</strong> (bid K-24-1952, EMTS Boat Dock Esplanade, 2023): “Only questions answered by formal written addenda shall be binding. Oral and other interpretations or clarifications shall be without legal effect.”</li>
<li><strong>Caltrans:</strong> answers to bidder inquiries are posted publicly, but Caltrans says the responses do not become part of the contract and do not change it. Only an addendum changes the contract.</li>
<li><strong>Private GC bids:</strong> the GC's estimator may answer by email. Save it, and name it in your proposal (“per GC email dated 3/12”). Module 13 covers how.</li>
</ul>`,
  ex: `<p>At a job walk, the City's project engineer says, “Don't worry about the existing trees in the median, they're all coming out.” The plans show them protected in place. If no addendum changes the plans, you must price protecting them. Write the question down and send it in writing that afternoon.</p>`,
  watch: `<p>Submitting a bid usually counts as proof that you examined the site and the documents. The City's bid says submitting a bid “shall be conclusive evidence that the Bidder has investigated and is satisfied as to the conditions to be encountered.” If you didn't look or didn't ask, the risk is yours.</p>`,

{ h: "Pre-bid meetings: mandatory or optional",
  lead: "The bid notice tells you if there is a pre-bid meeting or job walk, and whether it is mandatory. Read that line first.",
  body: `<div class="tablewrap"><table>
<thead><tr><th></th><th>Mandatory</th><th>Optional</th></tr></thead>
<tbody>
<tr><td><strong>If you miss it</strong></td><td>You can't bid as prime. No exceptions.</td><td>You can still bid</td></tr>
<tr><td><strong>Sign-in</strong></td><td>The sign-in sheet is the proof you attended. Sign legibly with your company's exact legal name.</td><td>Sign in anyway; the list often becomes public</td></tr>
<tr><td><strong>Late arrival</strong></td><td>Often not allowed to sign in</td><td>Fine, but you miss the overview</td></tr>
<tr><td><strong>Who should go</strong></td><td>Someone who can read the plans: the estimator</td><td>Estimator, ideally with the field lead who will run the job</td></tr>
</tbody></table></div>
<p>A typical meeting: a short presentation by the agency or GC, a review of key bid rules (SLBE goals, bonds, dates), a question period, then a walk of the site.</p>`,
  ex: `<p>The sign-in sheet is also a lead list. On a public job, it shows every prime and sub who cared enough to attend. Ask for a copy, or watch for it in an addendum. Those primes are the GCs to send your landscape price to.</p>`,
  watch: `<p>A mandatory meeting usually requires attendance by the company bidding as prime. If you are only a sub to a prime, check the notice to see whether your attendance matters. When in doubt, go.</p>`
},

{ h: "What to bring",
  lead: "Show up ready to measure, photograph and take notes, with the plans in your hand.",
  body: `<div class="twocol">
<div><h3>Documents</h3><ul>
<li>Plans, printed or on a tablet, with your questions already marked</li>
<li>The landscape specs (Division 32 or Whitebook/Caltrans sections)</li>
<li>Your list of questions from your first read</li>
<li>Business cards</li>
</ul></div>
<div><h3>Tools</h3><ul>
<li>Phone or camera (turn on location and time stamps)</li>
<li>Measuring wheel and 25' tape</li>
<li>Pressure gauge with hose-bib adapter, if you're allowed to use a hose bib</li>
<li>Soil probe or long screwdriver</li>
<li>Hard hat, vest, safety glasses, boots (required on most active sites and all freeway shoulders)</li>
</ul></div>
</div>`,
  watch: `<p>Never open valves, controllers, backflow boxes or meter boxes on a public or occupied site without permission. Ask the host first. On a freeway, you may only look from where the agency allows. Never walk onto an open shoulder without traffic control.</p>`
},

{ h: "On the site · water and power",
  lead: "The point of connection and the power to the controller drive a lot of cost. Find them first.",
  body: `<ul>
<li><strong>Point of connection (POC) and meter:</strong> Is the meter there, or does it need to be set? Who pays the meter fee? What size is it? Is it a dedicated irrigation meter?</li>
<li><strong>Backflow preventer:</strong> existing to remain, new, or relocated? Is there room for an enclosure and the clearance the detail shows?</li>
<li><strong>Water source:</strong> potable or recycled? Recycled (purple) water brings its own pipe, signs, tags and county rules. Ask which water agency serves the site (City of San Diego, Otay, Sweetwater, Helix or others).</li>
<li><strong>Static pressure:</strong> if you can read it safely, write it down. Compare it to the design pressure on the irrigation legend.</li>
<li><strong>Controller power:</strong> is there a 120V circuit at the controller location, or is a new circuit, conduit and electrician needed? Who provides it (you, the GC's electrician, or the utility)?</li>
<li><strong>Communication:</strong> does the controller need cell, radio or Wi-Fi? Can a signal be found there?</li>
</ul>`,
  ex: `<p>On Caltrans 11-428704 (see Module 15), three drinking-water connections were shut off and the whole corridor was fed from one recycled-water connection at Palomar Street, with new Calsense controllers powered from an existing SDG&amp;E service on sheets E-1 and E-2. A site visit lets you see exactly where those pieces sit before you price them.</p>`
},

{ h: "On the site · ground, slopes and what's already there",
  lead: "Plans show what the designer expected. The site shows what's actually there.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Look at</th><th>Why it matters to your price</th></tr></thead>
<tbody>
<tr><td><strong>Existing irrigation</strong></td><td>If you must tie into it, keep it running, or demo it: is it working? Leaking? Old wire? Mixed brands? Note valve box locations.</td></tr>
<tr><td><strong>Soils</strong></td><td>Hard clay, rock, fill or caliche slows trenching and planting. Probe a few spots. Ask whether a soil test exists.</td></tr>
<tr><td><strong>Slopes</strong></td><td>Steeper than about 2:1 slows every task and may need jute or erosion control. Estimate the slope and note it.</td></tr>
<tr><td><strong>Existing plants to protect</strong></td><td>Trees to stay need fencing, hand digging near roots, maybe temporary water. Count them.</td></tr>
<tr><td><strong>Utilities</strong></td><td>Look for markers, pull boxes, gas and telecom signs. They mean hand digging and Dig Alert (811) before trenching.</td></tr>
<tr><td><strong>Weeds and debris</strong></td><td>Heavy weeds or trash add clearing and a longer weed control cycle.</td></tr>
<tr><td><strong>Drainage</strong></td><td>Low spots and standing water affect plant survival and your warranty.</td></tr>
</tbody></table></div>`,
  ex: `<p>The specs on 11-428704 warned of aerially deposited lead in the freeway soil, up to 556 mg/kg (see Module 15). You can't see lead on a site walk. That's why you read the specs before you walk: so you know what to look for and what to ask.</p>`
},

{ h: "On the site · access, staging and traffic",
  lead: "How your crew gets in, where materials sit, and when you can work are all costs.",
  body: `<ul>
<li><strong>Access:</strong> can a truck and trailer reach the work? Gates, curbs, narrow drives, overhead wires?</li>
<li><strong>Staging:</strong> where can you store pipe, plants and a bin? Is it secure overnight? On a GC job, ask where the GC will let you stage.</li>
<li><strong>Traffic:</strong> medians and street work need traffic control plans, signs and maybe flaggers. Freeway work may be nights only.</li>
<li><strong>Work hours:</strong> schools, hospitals, HOAs and retail centers often limit hours or noisy work.</li>
<li><strong>Neighbors:</strong> occupied buildings mean clean-up every day and care with sprinklers near windows and walks.</li>
<li><strong>Distance:</strong> drive time from your yard is paid time for every crew, every day.</li>
</ul>`,
  ex: `<p><strong>Keep a photo log.</strong> Take 30–60 photos on a walk: wide shots of each area, then close-ups of the POC, backflow, controller spot, existing heads, slopes and trees. Name the folder with the bid number and date. Photos taken before the job are your best evidence later if conditions turn out different from the plans.</p>`
},

{ h: "Asking questions at the meeting",
  lead: "Ask out loud to learn, then send the same question in writing so the answer counts.",
  body: `<ol class="steps">
<li><div><b>Bring a short list</b>Three to six real questions about scope, quantities or conflicts. Not “what's the budget?”</div></li>
<li><div><b>Ask clearly</b>“Sheet L-2.1 shows the 24-inch box oaks protected. Detail 4 on L-5.0 shows them removed. Which is correct?”</div></li>
<li class="hl"><div><b>Write down the answer, then send it in writing</b>The same day, submit the question through the official channel. Ask that the answer be issued by addendum.</div></li>
<li><div><b>Listen to other bidders' questions</b>They often find things you missed. Write them down too.</div></li>
<li><div><b>Watch for meeting minutes</b>Many agencies publish minutes and the sign-in sheet as an addendum. Read them.</div></li>
</ol>`,
  watch: `<p>Don't ask questions that give away your pricing strategy in front of competitors. “Can we use a cheaper controller?” tells everyone what you're thinking. Send “or equal” and substitution questions privately in writing.</p>`
},

{ h: "RFIs during bidding",
  lead: "An RFI (request for information) is a written question about the bid documents. During bidding, public agencies may call it a bidder question or bidder inquiry.",
  body: `<p><strong>Send an RFI when:</strong></p>
<ul>
<li>Two documents disagree (plan vs. detail, plan vs. spec, quantity table vs. bid item)</li>
<li>Information is missing (no POC shown, no controller location, no soil test)</li>
<li>A specified product is discontinued or unavailable</li>
<li>You want approval of an “or equal” product before bid day (if the documents allow it)</li>
<li>A quantity you checked doesn't match the bid item quantity</li>
</ul>
<p><strong>Don't send an RFI when</strong> the answer is already in the documents. Read the specs, details and general notes first. Questions that show you didn't read waste everyone's time and are seen by your competitors.</p>`,
  deeper: `<p>Caltrans's Notice to Bidders on 11-428704 says: “Questions about alleged patent ambiguity of the plans, specifications, or estimate must be asked before bid opening. After bid opening, the Department does not consider these questions as bid protests.” A patent ambiguity is a conflict you could have seen by reading carefully. If you saw it and didn't ask, you can't complain about it after the bid.</p>`,
  src: "Caltrans 11-428704 Notice to Bidders."
},

{ h: "Where and when to send questions",

<tbody>
<tr><td><strong>City of San Diego</strong> (public works)</td><td>The contact named in the bid documents. On K-24-1952 it was the Senior Contract Specialist, by email. Some solicitations use the PlanetBids Q&amp;A tab instead; check the bid's PlanetBids page.</td><td>K-24-1952: questions received less than 14 days before bid opening “may not be considered.”</td></tr>

</tbody></table></div>`,
  watch: `<p>Deadlines differ on every bid. A question sent after the cutoff may never be answered, and you'll have to price the risk yourself. Put the question deadline on your calendar the day you decide to bid.</p>`,
  ex: `<p>Find them: <a href="https://www.sandiego.gov/cip/bid-contracting" target="_blank" rel="noopener">City of San Diego bid and contracting opportunities</a> · <a href="https://ppmoe.dot.ca.gov/des/oe/bid-inquiries.php" target="_blank" rel="noopener">Caltrans Bidders' Inquiries</a> · <a href="https://ppmoe.dot.ca.gov/des/oe/weekly-ads/all-adv-projects.php" target="_blank" rel="noopener">Caltrans projects currently advertised</a>.</p>`,
  deeper: `<p>Caltrans's directive PD-07 says the Department aims to respond to an inquiry within two business days, even if only to acknowledge it, and that later responses or addenda may change an earlier response. Signing in to the Caltrans bid system requires an account; check the current sign-in rules on the Office Engineer site.</p>`,

{ h: "How to write a good RFI",
  lead: "A good RFI can be answered in one line. Point to the exact place, state the conflict, and offer an answer.",
  body: `<ol class="steps">
<li><div><b>Reference</b>Sheet number, detail number, spec section, bid item number. Be exact.</div></li>
<li class="hl"><div><b>The conflict or gap</b>Quote what each document says. Facts only, no opinions.</div></li>
<li class="hl"><div><b>Proposed answer</b>“Please confirm that…” This makes it easy to say yes, and shows you know the work.</div></li>
<li><div><b>Why it matters</b>One line: it changes the quantity, the product or the method.</div></li>
<li><div><b>One question per RFI</b>Numbered, dated, with your company name and contact.</div></li>
</ol>`,
  exLabel: "RFI template (fill in the brackets)",
  ex: `<p><strong>RFI #[number] · [Project name] · Bid No. [number] · [date]</strong></p>
<p><strong>Reference:</strong> Sheet [L-3.1], Detail [5/L-6.0], Spec Section [32 84 00, 2.4.B], Bid Item [12].</p>
<p><strong>Question:</strong> Sheet [L-3.1] shows [x]. Detail [5/L-6.0] shows [y]. Bid Item [12] lists [quantity and unit].</p>
<p><strong>Proposed answer:</strong> Please confirm that [x] is correct and bidders should price [quantity/product/method].</p>
<p><strong>From:</strong> [Name], [Company], [phone], [email]</p>`
},

{ h: "Real RFI example 1 · tree well sprinklers on 11-428704",
  lead: "On the I-805 job, the quantity table and the bid item disagreed on tree well sprinkler assemblies. Here's the RFI a careful bidder would send.",
  body: `<ul>
<li>Sheet IQ-1 (irrigation quantities) adds up to <strong>172</strong> tree well sprinkler assemblies.</li>
<li>Bid item 51, Tree Well Sprinkler Assembly, lists <strong>180 EA</strong>.</li>
<li>The plans show <strong>43</strong> box trees, and the tree well sprinkler detail shows 4 bubblers per tree. 43 × 4 = <strong>172</strong>.</li>
<li>Addendum 1 replaced the quantity sheets, but the revised IQ-1 still totals 172 and item 51 stayed at 180.</li>
</ul>`,
  exLabel: "Sample bidder inquiry",
  ex: `<p><strong>Reference:</strong> Plan sheet IQ-1 (Irrigation Quantities); Bid Item 51, Tree Well Sprinkler Assembly; planting plans PP-1 to PP-7 (43 Group K trees).</p>
<p><strong>Question:</strong> Sheet IQ-1 totals 172 tree well sprinkler assemblies, which equals 43 trees at 4 assemblies each. Bid Item 51 lists 180 EA.</p>
<p><strong>Proposed answer:</strong> Please confirm whether bidders should price 180 EA as listed, or whether Bid Item 51 will be revised to 172 EA by addendum.</p>`,
  watch: `<p>Without an addendum, you bid the quantity on the Bid Item List. On a unit-price item paid by count, you'll be paid for what you actually install. Price each unit so it covers its share of your setup and overhead, even if only 172 get built.</p>`,
  src: "Caltrans 11-428704 plans IQ-1, PP-1 to PP-7, PLD-1; Bid Item List; Addendum 1 (Aug 27, 2021) revised IQ-1."
},

{ h: "Real RFI example 2 · iceplant cuttings on 11-428704",
  lead: "Group H cuttings are planted at 1 foot on center, so the count should match the planted area. Adding the plan callouts found a gap of almost 2,000 plants.",
  body: `<ul>
<li>The planting sheets PP-1 to PP-7 label each Group H area with a count: 4,600 + 15,750 + 12,900 + 185 + 1,790 + 2,430 + 2,730 + 6,180 + 1,960 + 13,450 = <strong>61,975</strong>.</li>
<li>The original Planting Quantities sheet (PQ-1) and bid item 25 both said <strong>60,015</strong>.</li>
<li>Difference: 1,960 cuttings. That happens to equal one callout on the plans, a clue that one area was left out of the table.</li>
</ul>`,
  exLabel: "Sample bidder inquiry",
  ex: `<p><strong>Reference:</strong> Planting plans PP-1 to PP-7; Planting Quantities sheet PQ-1; Bid Item 25, Plant (Group H).</p>
<p><strong>Question:</strong> The Group H (Carpobrotus edulis) callouts on PP-1 to PP-7 total 61,975. PQ-1 and Bid Item 25 list 60,015. The difference (1,960) matches one callout.</p>
<p><strong>Proposed answer:</strong> Please confirm the correct quantity is 61,975 and revise Bid Item 25 and PQ-1 by addendum.</p>`,
  deeper: `<p><strong>What happened:</strong> Addendum 1 replaced PQ-1 and changed Bid Item 25 to 61,975. A bidder who had already checked the callouts knew the addendum was right. A bidder who never checked would only notice if they read the addendum carefully. On a big quantity, small prices multiply: at the winner's $0.80 each, 1,960 cuttings is $1,568.</p>`,
  src: "Caltrans 11-428704 plans PP-1 to PP-7 and PQ-1 (original and Addendum 1 versions); Bid Item List; Addendum 1."

{ h: "Addenda: read every one, log every one",
  lead: "An addendum is a formal change to the bid documents issued before bid day. You must price it and acknowledge it.",
  body: `<ol class="steps">
<li><div><b>Know where they're posted</b>PlanetBids for the City, the Caltrans addendum page and Bid Express for Caltrans, the GC's platform or email for private bids.</div></li>
<li><div><b>Turn on notifications</b>But don't rely on them. Check the portal yourself, including the morning of bid day.</div></li>
<li class="hl"><div><b>Log each addendum</b>Number, date, what changed, which estimate lines it affects, done or not done.</div></li>
<li class="hl"><div><b>Update the estimate</b>Replace sheets in your plan set, re-check quantities, change your prices.</div></li>
<li><div><b>Tell your suppliers and subs</b>The Caltrans addendum letter says it directly: “Inform subcontractors and suppliers as necessary.”</div></li>
<li><div><b>Acknowledge it on the bid form</b>List every addendum number. On a GC bid, list them in your proposal.</div></li>
</ol>`,
  watch: `<p>The City's bid documents say addenda “are made effective as though originally issued with the Bid” and that bidders “shall acknowledge the receipt of Addenda at the time of bid submission.” A missing acknowledgment can make a public bid non-responsive. Module 14 covers the bid forms.</p>`,
  src: "City of San Diego K-24-1952-DBB-3-A, Notice Inviting Bids item 9; Caltrans 11-428704 Addendum 1."
},

{ h: "Talking to GC estimators before bid day",
  lead: "GC estimators are busy, especially in the last week. Make every contact short, useful and easy to act on.",
  body: `<div class="twocol">
<div><h3>Do</h3><ul>
<li>Confirm you received the invite and say yes or no quickly</li>
<li>Ask scope questions early, by email, one list at a time</li>
<li>Ask what's in your package: the GC may split landscape, irrigation, site concrete, fencing and site furnishings differently</li>
<li>Ask about bid format: lump sum, unit prices, alternates, their scope sheet</li>
<li>Ask about schedule, labor (prevailing wage? union?), bonds and insurance</li>
</ul></div>
<div><h3>Don't</h3><ul>
<li>Call five times about the same thing</li>
<li>Ask what other subs bid</li>
<li>Go around the estimator to the owner or architect</li>
<li>Promise a number “by tomorrow” and miss it</li>
<li>Send a price with no scope description</li>
</ul></div>
</div>`,
  ex: `<p>A good phone call: “Hi, it's [Name] at [Company], about the Mission Valley medical office bid. Two quick things: is the bioswale planting in landscape or civil? And do you want a separate price for the 90-day maintenance? I'll send both questions by email too.”</p>`
},

{ h: "Bid day with GCs",
  lead: "On bid day, the GC is combining dozens of sub prices in a few hours. Send early, send clearly, and be reachable.",
  body: `<ol class="steps">
<li><div><b>Send a scope letter the day before</b>Inclusions, exclusions, clarifications, addenda acknowledged, with the price to follow if needed. Module 13 shows how to write it.</div></li>
<li class="hl"><div><b>Send the final number before the GC's cutoff</b>The GC sets its own deadline for sub prices, usually hours before the agency's.</div></li>
<li><div><b>Confirm they got it</b>A short call or reply: “Did my landscape number come through?”</div></li>
<li><div><b>Stay by your phone</b>Estimators call with “Does your number include the backflow enclosure?” Answer in minutes, not hours.</div></li>
<li><div><b>Don't change your price at the last minute without a reason</b>If you do, send the new number in writing with what changed.</div></li>
</ol>`,
  watch: `<p>On a public job, the prime must list subs on its bid. If you call after the bid with “I forgot something, my number is now higher,” the GC may be stuck with a listed sub it can't afford. That ends relationships. Check your number before you send it.</p>`
},

{ h: "After the bid: follow up and ask for feedback",
  lead: "Every bid is a chance to learn. Ask how you did, politely, a few days after bid day.",
  body: `<ul>
<li><strong>Public jobs:</strong> the results are public. Download the bid tab and find out which primes were low. Then ask those primes if they used your number.</li>
<li><strong>Private jobs:</strong> email the estimator 3–7 days after the bid. Ask whether the GC won, and how your number compared.</li>
<li><strong>Record the answer</strong> in your bid tracker: won, lost, how far off, why.</li>
<li><strong>If you won the sub price:</strong> thank them, confirm your scope and ask about the next step (Module 16).</li>
</ul>`,
  exLabel: "Follow-up email",
  ex: `<p><strong>Subject:</strong> [Project name] landscape bid: results?</p>
<p>Hi [Name], thanks for including us on [Project]. Do you know yet if you were awarded? If you're able to share, I'd appreciate knowing how our landscape number compared: were we in range, high or low, and was anything missing from our scope? It helps us sharpen our next number for you.</p>
<p>Thanks, [Name] · [Company] · [phone]</p>`,
  watch: `<p>Some GCs will give you a percent (“you were about 8% high”), some won't share anything. Never ask for a competitor's exact price, and never use what you learn to undercut after the bid. Just learn from it.</p>`
},

{ h: "Communication rules on public bids",
  lead: "Public agencies keep bidding fair by controlling who talks to whom. Break the rules and your bid can be thrown out.",
  body: `<ul>
<li><strong>One point of contact.</strong> Each solicitation names the person or channel for all questions. Talk only to them about the bid.</li>
<li><strong>No lobbying during the solicitation.</strong> Don't call council members, department staff, the design consultant or the inspector about the bid while it's open.</li>
<li><strong>Cone of silence.</strong> The City of San Diego's procurement manual describes a “cone of silence” that limits communication with prospective bidders once a solicitation is public, with the Purchasing &amp; Contracting Department controlling all communications. Read each solicitation's instructions for the exact rule and when it ends.</li>
<li><strong>Everyone gets the same answer.</strong> Answers go to all bidders by addendum or a public Q&amp;A, not just to you.</li>
<li><strong>Results are public.</strong> Bid tabs and the low bidder are posted; you can ask for them.</li>
</ul>`,
  watch: `<p>Gifts, lunches or favors to anyone involved in a public bid can violate agency ethics rules. On a public job, keep it strictly business.</p>`,
  deeper: `<p>The same City procurement manual discusses Government Code 1090: a consultant that helps scope a project generally can't then compete for the resulting contract. If your company ever does design-assist or budget pricing for a public owner, ask whether that keeps you from bidding the job.</p>`,
  src: "City of San Diego Procurement Manual (sandiego.gov, sd_procurement_manual.pdf); City of San Diego K-24-1952-DBB-3-A, Instructions to Bidders item 9."
},

    ["RFI", "Request for information: a written question about the documents."],

{ t: "practice", id: "m12", h: "Practice assignments",
  lead: "These use real San Diego bids and the real Caltrans job from Module 15.",
  items: [
    { h: "Walk a site with the checklist", hrs: 1, d: "<p>Find an upcoming pre-bid meeting on the <a href=\"https://www.sandiego.gov/cip/bid-contracting\" target=\"_blank\" rel=\"noopener\">City of San Diego bid page</a> or another agency's PlanetBids portal and attend it. If none is coming up, walk an existing commercial landscape you can see from public property (a shopping center or a street median). Use the water/power, ground and access checklists from this module. Take a 30-photo log and write one page of notes.</p>" },
    { h: "Write three bidder inquiries for 11-428704", hrs: 0.75, d: "<p>Open <a href=\"#lab-11-428704\">Real Bid Lab · 11-428704</a>. Write the tree well (item 51) and Group H (item 25) inquiries in your own words using the template. Then find one more question of your own in the plans or Special Provisions and write it the same way.</p>" },
    { h: "Build an addendum log", hrs: 0.5, d: "<p>Download Addendum 1 for 11-428704 from the lab. Make a spreadsheet log with columns: number, date, change, before, after, estimate lines affected, done. Fill it in for every change, including the wage modification.</p>" },
    { h: "Find the question rules on two live bids", hrs: 0.25, d: "<p>Open one current City of San Diego construction bid on PlanetBids and one advertised Caltrans District 11 job on the <a href=\"https://ppmoe.dot.ca.gov/des/oe/weekly-ads/all-adv-projects.php\" target=\"_blank\" rel=\"noopener\">Caltrans advertised projects</a> page. For each, write down: where questions go, the question deadline, the named contact, and how many addenda are posted. Read the posted Caltrans bidder inquiries to see how other contractors ask.</p>" },
    { h: "Write your email templates", hrs: 0.5, d: "<p>Write your own versions of five emails: RFI to a GC, scope letter cover note, bid-day confirmation, declining a bid, and post-bid follow-up. Save them where you can copy them fast.</p>" },

  ]
},

{ h: "Module 12 summary",
  lead: "You know how to see the site, ask the right questions in writing, and keep track of every change and every conversation.",
  body: `<ul>
<li>Only written answers count. Oral answers at a job walk have no effect unless an addendum follows.</li>
<li>Never miss a mandatory pre-bid meeting. Sign in clearly and bring the plans, tools and questions.</li>
<li>On the site, find the POC, backflow, water source, controller power, soils, slopes, plants to protect, utilities, access and staging.</li>
<li>Send questions through the one named channel, before the deadline: the named City contact or PlanetBids Q&amp;A, Caltrans Bidders' Inquiries, or the GC estimator.</li>

<li>Log every addendum, update the estimate and acknowledge it on the bid.</li>
<li>Be brief and reachable with GC estimators, and always follow up after the bid.</li>
<li>Keep one organized folder and a communication log for every bid.</li>
</ul>
<p><strong>Next: Module 13 · Writing the Proposal</strong></p>`

{ h: "What a proposal is, and why the words matter",
  lead: "Your proposal (also called a quote, bid or scope letter) is your written offer to the GC. If it's accepted, its words become part of your subcontract.",
  body: `<ul>
<li>The GC uses your proposal to build its own bid to the owner, often in the last hour before the deadline.</li>
<li>The GC compares your proposal to other landscape subs line by line. Anything unclear gets a “plug” (a guess) added to your number.</li>
<li>After award, the subcontract usually lists your proposal or its scope. What you included and excluded is what you'll be held to.</li>
<li>A good proposal answers the GC's questions before they're asked: what plans, what's in, what's out, how long, how much for changes.</li>
</ul>`,
  ex: `<p>Two subs bid $140,000. One proposal says “Landscape and irrigation per plans.” The other lists seven line items, references sheets L-1.0 to L-6.0 and Addenda 1–2, and states that the backflow preventer is by the plumber. The GC can carry the second one with confidence. The first one gets a plug.</p>`,
  watch: `<p>“Per plans and specs” with no plan dates is a blank check. If the plans change after you bid, you have no record of what you priced.</p>`
},

{ h: "The parts of a proposal",
  lead: "Every proposal has the same parts in the same order. Use one template so nothing gets left out.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Part</th><th>What goes in it</th></tr></thead>
<tbody>
<tr><td><strong>Header</strong></td><td>Your company, address, CSLB license # and classes, DIR # (public), contact, date, proposal #</td></tr>
<tr><td><strong>To / project</strong></td><td>GC name and estimator, project name and address, bid date</td></tr>
<tr><td><strong>Documents</strong></td><td>Plan sheets and dates, spec sections and dates, every addendum by number and date</td></tr>
<tr><td><strong>Scope by line item</strong></td><td>Each type of work with a short description and a price</td></tr>
<tr><td><strong>Base bid total</strong></td><td>The sum, in numbers (and words if you like)</td></tr>
<tr><td><strong>Inclusions</strong></td><td>Items you're providing that a GC might wonder about</td></tr>
<tr><td><strong>Exclusions</strong></td><td>Work near your scope that you are not providing</td></tr>
<tr><td><strong>Clarifications / assumptions</strong></td><td>How you read unclear items, and conditions your price depends on</td></tr>
<tr><td><strong>Alternates</strong></td><td>Each priced separately, add or deduct</td></tr>
<tr><td><strong>Unit prices</strong></td><td>Add and deduct prices for common changes</td></tr>
<tr><td><strong>Schedule</strong></td><td>Duration, crew size, sequence, lead times</td></tr>
<tr><td><strong>Establishment / maintenance</strong></td><td>Length, what's done, when it starts</td></tr>
<tr><td><strong>Warranty</strong></td><td>Plant and workmanship guarantee periods and conditions</td></tr>
<tr><td><strong>Terms</strong></td><td>Validity period, payment terms, insurance and bond notes</td></tr>
<tr><td><strong>Signature</strong></td><td>Name, title, signature, date; a line for the GC to accept</td></tr>
</tbody></table></div>`,
  deeper: `<p>The company already has a bid template; the <a href="https://claude.ai/artifact/Lya5kQRNBTrDcNgc7xeumK" target="_blank" rel="noopener">How to Make a Bid</a> process (Step 9) says to fill in every section and mark “N/A” on sections that don't apply instead of deleting them. That way a missing section is always a mistake you can see.</p>`
},

{ h: "Header and document references",
  lead: "List exactly which documents you priced. This one paragraph protects you more than any other part of the proposal.",
  body: `<ul>
<li><strong>Plans:</strong> sheet numbers and the date or revision on each set. Example: “Landscape sheets L-1.0 through L-6.0, 100% CD set dated 06/12/2026.”</li>
<li><strong>Specifications:</strong> the sections you priced and their dates. Example: “Sections 32 80 00 Irrigation, 32 91 13 Soil Preparation, 32 93 00 Plants, dated 06/12/2026.”</li>
<li><strong>Addenda:</strong> every one, by number and date. If an addendum doesn't affect you, list it anyway so the GC knows you saw it.</li>
<li><strong>Other documents:</strong> geotech report, soils report, GC scope sheet, job walk notes.</li>
<li><strong>Your credentials:</strong> license number and class (C-27), DIR registration number on public work.</li>
</ul>`,
  watch: `<p>Check the GC's portal for addenda right before you send. A proposal that lists Addenda 1–2 when Addendum 3 changed the planting plan is a proposal for the wrong job.</p>`
},

{ h: "Scope by line item",
  lead: "Break the price into the pieces a GC needs: by type of work, matched to the plans, and matched to the GC's own breakdown when they give one.",
  body: `<ul>
<li>Group by CSI section or type of work: irrigation (32 80 00 / 32 84 00), soil preparation (32 91 13), turf (32 92 00), plants (32 93 00), mulch, DG and boulders, establishment.</li>
<li>For each line: what it is, key quantities and sizes, the sheet or spec reference, and a price.</li>
<li>Use the GC's breakdown if they send a scope sheet or bid form (later slide). If they split “irrigation sleeves” out, price sleeves separately.</li>
<li>Give quantities where it helps the GC check you: “(18) trees: (14) 24" box, (4) 36" box.”</li>
<li>Keep descriptions short. One to four lines per item.</li>
</ul>`,
  exLabel: "Good vs. weak line items",
  ex: `<div class="tablewrap"><table>
<thead><tr><th>Weak</th><th>Clear</th></tr></thead>
<tbody>
<tr><td>Irrigation per plans</td><td>Irrigation system per L-3.0 to L-3.2 and 32 84 00, from the downstream side of the backflow preventer: smart controller, flow sensor, master valve, (14) remote control valves, drip and spray zones, mainline, laterals, wire and testing</td></tr>
<tr><td>Trees</td><td>(18) trees per L-4.0: (14) 24" box, (4) 36" box, with staking per detail 4/L-5.0 and root barrier where within 5' of paving</td></tr>
<tr><td>Maintenance</td><td>90-day maintenance and plant establishment after planting is accepted: weekly visits, watering schedule, weeding, replacement of failed plants</td></tr>
</tbody></table></div>`
},

{ h: "Inclusions",
  lead: "Inclusions answer the questions a GC will ask while leveling. Use them for the items most likely to be missed or argued about.",
  body: `<ul>
<li>Point of connection: where your irrigation starts (downstream of the backflow, from the meter, from a stub-out)</li>
<li>Controller: furnish and install, mounting, and who connects power</li>
<li>Soil testing: number of tests included and what happens after the report</li>
<li>Fine grading: tolerance you'll deliver, once rough grade is handed to you</li>
<li>Establishment or maintenance period and what's in it</li>
<li>Submittals, as-builts, controller charts, O&amp;M manuals</li>
<li>Mobilizations: how many trips are in the price</li>
<li>Prevailing wage and certified payroll, when the job requires it</li>
</ul>`,
  ex: `<p>“Includes (2) mobilizations: one for irrigation and planting, one for punch list. Additional mobilizations requested by the GC: $850 each.” A GC planning a phased job now knows what phases will cost.</p>`
},

{ h: "Exclusions: clear, not over-excluded",
  lead: "An exclusion tells the GC what someone else must provide. A good one names a real item near your scope. A bad one excludes things you're supposed to do.",
  body: `<div class="twocol">
<div><h3>Clear exclusions</h3><ul>
<li>Name a specific item: “Backflow preventer and enclosure (by plumbing).”</li>
<li>Point to who usually does it: “by electrical,” “by GC,” “by owner.”</li>
<li>Cover items the plans leave open, so the GC can assign them.</li>
<li>Match the GC's scope sheet; if the sheet gives an item to landscape, either include it or call it out clearly.</li>
</ul></div>
<div><h3>Over-excluding</h3><ul>
<li>Excluding work shown on the landscape plans (“tree staking excluded”)</li>
<li>Vague catch-alls: “anything not specifically listed”</li>
<li>Pages of boilerplate a GC won't read</li>
<li>Excluding risk you should price, like normal soil conditions</li>
</ul></div>
</div>`,
  watch: `<p>Every exclusion is a plug the GC adds to your number when leveling. Exclude ten items with $1,500 plugs each, and your “low” $140,000 becomes $155,000 on their spreadsheet. Exclude what truly belongs to others, and price the rest.</p>`,
  deeper: `<p>Exclusions only work if they don't conflict with what the GC's bid form or the specs require. The How to Make a Bid process (Step 5) says to check this before pricing. If the GC's bid instructions say “no qualified bids,” call the estimator and ask how to handle items you can't include.</p>`
},

<tbody>
<tr><td>Permits and fees</td><td>Building, grading, encroachment and plan check permits and fees by others</td></tr>
<tr><td>Water meter and connection</td><td>Water meter, meter fees, capacity and connection fees by owner/GC; irrigation starts at the point of connection stated above</td></tr>
<tr><td>Backflow preventer</td><td>Backflow preventer and enclosure by plumbing, unless listed in scope</td></tr>
<tr><td>Power to controllers</td><td>120V power, conduit and final electrical connection to the controller by electrical</td></tr>
<tr><td>Sleeves</td><td>Sleeves under hardscape by others; we provide a sleeve layout and will inspect before paving</td></tr>
<tr><td>Rough grading</td><td>Rough grade delivered to ±0.1 ft of finish grade, less soil and mulch depth, by others</td></tr>
<tr><td>Soil import/export</td><td>Import or export of soil excluded unless listed; amendments per the soil report included up to the rates in the spec</td></tr>
<tr><td>Rock and debris</td><td>Removal of rock, concrete, asphalt or construction debris from planting areas excluded</td></tr>
<tr><td>Hazardous materials</td><td>Testing, handling and disposal of contaminated or hazardous soils excluded</td></tr>
<tr><td>Work hours</td><td>Night, weekend and overtime work excluded unless required by the documents listed</td></tr>
<tr><td>Traffic control</td><td>Traffic control, flaggers and lane closures excluded</td></tr>
<tr><td>Bonds</td><td>Performance and payment bonds excluded; available at an added cost of [x]% if requested</td></tr>
<tr><td>Prevailing wage</td><td>Price based on non-prevailing wage unless stated; prevailing wage priced on request</td></tr>

<tr><td>Water</td><td>Water for establishment and maintenance supplied by owner through the permanent meter</td></tr>
<tr><td>Storm water</td><td>SWPPP preparation and BMPs by GC, except protection of our own stockpiles</td></tr>
<tr><td>Testing</td><td>Third-party testing and inspection fees by others, except soil tests listed above</td></tr>
</tbody></table></div>`,
  watch: `<p>Read the job's documents before keeping a line. If the specs put the backflow preventer in the irrigation section, excluding it makes you incomplete. Either include it or call the GC and ask.</p>`

{ h: "Clarifications and assumptions",
  lead: "A clarification explains how you read something unclear, or a condition your price depends on. Use them where an RFI wasn't answered in time.",
  body: `<ul>
<li><strong>Interpretations:</strong> “Plant legend lists 1,150 #1 groundcover; plan count is 1,210. We priced 1,210 per the plans.”</li>
<li><strong>Conditions:</strong> “Price assumes site access for a skid steer and 10-wheel delivery truck to all planting areas.”</li>
<li><strong>Sequence:</strong> “Price assumes planting areas turned over in no more than two phases.”</li>
<li><strong>Unanswered RFIs:</strong> “RFI #3 (controller location) not answered by bid date. Priced as shown on L-3.0.”</li>
<li><strong>Substitutions:</strong> “Priced as specified. Equal products available on request.”</li>
</ul>`,
  ex: `<p>The How to Make a Bid process says: if an RFI answer doesn't come back in time, price it with a stated assumption on the bid. That assumption goes here, in plain words, with the RFI number.</p>`,
  watch: `<p>A clarification that quietly removes scope is an exclusion in disguise. GCs notice. If you aren't providing it, put it in exclusions where the GC expects to look.</p>`
},

{ h: "Alternates and unit prices",
  lead: "Alternates price options the owner might choose. Unit prices price changes after the contract is signed. Both use the same markups as your base bid.",
  body: `<div class="twocol">
<div><h3>Alternates</h3><ul>
<li>Price every alternate the documents ask for, using the documents' numbers and names.</li>
<li>Say add or deduct, and what changes.</li>
<li>Price each alternate on its own. Note if two alternates interact.</li>
<li>Voluntary alternates (your own ideas, like a cheaper equal product) go in a separate section, clearly labeled.</li>
</ul></div>
<div><h3>Unit prices</h3><ul>
<li>Common adds and deducts: per plant by size, per tree, per valve, per head, per LF of drip or lateral, per CY of mulch.</li>
<li>Add prices include labor, material, overhead and profit.</li>
<li>Deduct prices are lower than adds: you keep mobilization and some overhead when work is removed.</li>
<li>State a limit: “Unit prices apply to changes up to 15% of the quantity.”</li>
</ul></div>
</div>`,
  watch: `<p>Unit prices you write today become the change order prices on the job. If you lowball them to look good on bid day, every change during the job loses money.</p>`
},

{ h: "Schedule, plant establishment and warranty",
  lead: "GCs need to know how long you'll take, what comes before you, and how long you're responsible for the plants.",
  body: `<ul>
<li><strong>Duration and crew:</strong> “Approximately 6 weeks with a 5-person crew after site turnover.”</li>
<li><strong>What must happen first:</strong> rough grade, sleeves, power at the controller, water at the point of connection.</li>
<li><strong>Lead times:</strong> specimen trees, controllers or specified products with long lead times. Give the date you need approval to order.</li>
<li><strong>Plant establishment / maintenance:</strong> length (from the specs), when it starts (usually acceptance of planting), what's included, and who pays water.</li>
<li><strong>Warranty:</strong> plant and workmanship guarantee periods from the specs, starting at acceptance. State what voids it: vandalism, owner neglect, loss of water or power, acts of nature.</li>
</ul>`,
  ex: `<p>Real example of how long establishment can run: Caltrans 11-428704 had 120 working days of construction followed by 250 working days of plant establishment (<a href="#m15-1">Module 15</a>). Private jobs are usually much shorter. Whatever the specs say, state it in your proposal so the GC prices the same period.</p>`,
  watch: `<p>“Warranty per specs” without reading the specs is risky. Some landscape specs require replacing plants for a full year. Price the replacements in your establishment cost (Module 10), then state the period.</p>`
},

{ h: "Validity, payment, insurance, bonds and signature",
  lead: "The last section of the proposal protects your price and your cash.",
  body: `<ul>
<li><strong>Validity:</strong> “This proposal is valid for 30 days from the date above.” Match it to your supplier quotes (Module 8); if work starts later, the price may need escalation.</li>
<li><strong>Payment terms:</strong> monthly progress billing, retention per the subcontract, and payment for materials stored on site if allowed.</li>
<li><strong>Insurance:</strong> your limits, and that you'll provide certificates and endorsements required by the subcontract. Note any special requirement you haven't priced.</li>
<li><strong>Bonds:</strong> excluded unless requested; give the added cost as a percent.</li>
<li><strong>Signature:</strong> name, title, signature and date, plus a line for the GC to sign and accept.</li>
</ul>`,
  deeper: `<p>California law sets some payment rules no matter what the proposal says. Business and Professions Code § 7108.5 requires a prime contractor to pay a sub its share within 7 days of receiving each progress payment, unless otherwise agreed in writing. On public works, Public Contract Code § 7201 limits retention to 5% for contracts entered on or after January 1, 2012, with exceptions. Check the current text on leginfo.legislature.ca.gov; Module 16 covers billing and retention.</p>`,
  src: "Business and Professions Code § 7108.5; Public Contract Code § 7201."
},

{ h: "How GCs level bids, and how to make yours easy",
  lead: "The GC lines up every landscape proposal on one spreadsheet and adds plugs for missing items. The easiest proposal to level is often the one that gets carried.",
  body: `<p>Review the leveling example in <a href="#m1-14">Module 1 · Bid leveling</a>. Then make your proposal easy to put on that spreadsheet:</p>
<ol class="steps">
<li><div><b>Use their breakdown</b>If the GC sends a scope sheet or bid form, follow its items and order.</div></li>
<li class="hl"><div><b>One price per line</b>Every line item has its own number, and the lines add up to the total.</div></li>
<li><div><b>Say where you start and stop</b>Point of connection, controller power, sleeves, rough grade.</div></li>
<li><div><b>Short exclusions</b>Specific items, in a list, with who provides them.</div></li>
<li class="hl"><div><b>Alternates and unit prices separate</b>Never mixed into the base bid.</div></li>
<li><div><b>Send it early</b>A proposal received 2 hours before bid time gets studied. One received 10 minutes before gets plugged.</div></li>
<li><div><b>PDF on letterhead, signed</b>Plus the GC's own form if they asked for one.</div></li>
</ol>`,
  ex: `<p>After bid day, ask the GC estimator: “Was our proposal easy to level? Did you add any plugs to it?” The answer tells you which exclusion or missing line cost you.</p>`
},

{ h: "Responding to a GC's bid form and scope sheet",
  lead: "When a GC sends its own bid form or scope sheet, that's the format they'll level in. Fill it in exactly, then attach your proposal.",
  body: `<ol class="steps">
<li><div><b>Read every line of the scope sheet</b>GCs often put items in landscape that you don't expect: sleeves, fine grading, erosion control, site furnishings, tree protection.</div></li>
<li class="hl"><div><b>Answer every line</b>Included, excluded, or priced separately. A blank line gets a plug.</div></li>
<li><div><b>Use their totals and alternates</b>Match their alternate numbers and names.</div></li>
<li><div><b>Attach your proposal</b>Your full proposal adds the detail; make sure the two say the same thing.</div></li>
<li><div><b>Adjust for each GC</b>Different GCs split scope differently. Change the line items so each proposal matches what that GC asked for (How to Make a Bid, Step 10).</div></li>
</ol>`,
  watch: `<p>If the GC's form and your attached proposal disagree (the form says “sleeves: included,” your proposal excludes them), you've created a dispute before the job starts. Read both together before you send.</p>`
},

{ h: "Public bids · The bid form is the proposal",
  lead: "When you bid a public job as the prime, you fill in the agency's bid form. You can't add exclusions, conditions or your own scope letter.",
  body: `<ul>
<li>Every bidder must offer to do the same work under the same terms, so the agency can compare prices fairly.</li>
<li>An exclusion or condition changes what you're offering. That gives you an advantage the other bidders didn't get, and it can make your bid non-responsive.</li>
<li>The City of San Diego's bid documents say it plainly: “Conditional Bids may be rejected as being non-responsive. Alternative proposals will not be considered unless called for.”</li>
<li>Caltrans: you bid “based on the bid item quantities shown on the Bid Item List,” and “failure to submit the forms and information as specified may result in a nonresponsive bid.”</li>
</ul>
<p><strong>Where your clarifications go instead:</strong> ask questions before bid day (RFIs or bidder inquiries, Module 12). The answers come back as addenda that every bidder bids on.</p>`,
  ex: `<p>A note on a City bid like “price excludes rock excavation” could get the whole bid thrown out, even if it's the low price. If you're worried about rock, ask before bid day. If the answer doesn't come, price the risk (Module 10) or don't bid.</p>`,
  watch: `<p>Don't write notes, letters or cover pages into a public bid unless the instructions ask for them. Fill in the forms completely and exactly as instructed.</p>`,
  src: "City of San Diego bidding documents, Bid No. K-24-1952-DBB-3-A, Instructions to Bidders 2.6; Caltrans 2018 Standard Specifications, sections 2-1.09 and 2-1.33A."
},

{ h: "Public bids · Quoting a prime as a sub",
  lead: "When you quote a landscape scope to a prime contractor on a public job, write your quote around the agency's bid items so the prime can drop it straight into its bid.",
  body: `<ul>
<li><strong>Quote by bid item number:</strong> item, description, unit, quantity, your unit price and extension, exactly as the Bid Item List shows them.</li>
<li><strong>Say which items, and what percent:</strong> the prime must list subs on its Subcontractor List with bid item numbers and the percent of each item (Module 14). If you do only part of an item, say which part.</li>
<li><strong>Give the listing information:</strong> company name and city, license number, DIR registration number, and DBE or SLBE certification if you have it.</li>
<li><strong>Keep exclusions very short:</strong> the prime can't carry them into its bid. Anything you exclude, the prime must price itself or replace you.</li>
<li><strong>Send it early on bid day:</strong> primes assemble dozens of quotes in the last hours. Many subs quote several primes; the City's bid documents say a sub who quotes one bidder may also quote others.</li>
</ul>`,
  ex: `<p><strong>Real example, 11-428704:</strong> Blue Pacific listed Diversified Landscape for all irrigation, bid items 32–67. The winner, ACCU, listed a boring sub for part of one item: “Item 66, 54%, boring only.” That's the level of detail a prime needs from your quote. See <a href="#m15-1">Module 15</a>.</p>`,
  deeper: `<p>Caltrans 2018 Standard Specifications 2-1.10: the prime lists each sub doing more than ½ of 1 percent of the total bid or $10,000, whichever is greater, with its business name and location, license number (non-federal-aid contracts), public works contractor registration number, bid item numbers, percent of each item, and a description when less than 100% of an item. Section 3-1.03: no contractor or subcontractor may be awarded public work unless registered with DIR.</p>`,
  src: "Caltrans 2018 Standard Specifications 2-1.10, 3-1.03; Caltrans Bid Summary and ACCU bid book, contract 11-428704; City of San Diego Bid No. K-24-1952-DBB-3-A, Instructions to Bidders 17."
},

{ h: "Using AI to draft line-item descriptions",
  lead: "AI can turn your priced line items and the plans into clear descriptions fast. You are still responsible for every word that goes out.",
  body: `<p>The company's <a href="https://claude.ai/artifact/Lya5kQRNBTrDcNgc7xeumK" target="_blank" rel="noopener">How to Make a Bid</a> process does this in Step 8, after pricing:</p>
<ol class="steps">
<li><div><b>Give it the right inputs</b>The plans and specs, your priced line items with quantities, and your exclusions list.</div></li>
<li><div><b>Ask for specific output</b>A short description for each line, grouped by type of work, with sheet and spec references, and nothing from the exclusions list.</div></li>
<li class="hl"><div><b>Check it against your estimate</b>Every quantity, size and product in the text must match what you priced.</div></li>
<li class="hl"><div><b>Check it against your exclusions</b>Delete anything that promises excluded work.</div></li>
<li><div><b>Check the sheet references</b>Open each sheet it cites. AI can invent a detail number that looks right.</div></li>
<li><div><b>Cut extra promises</b>Words like “complete,” “all,” “fully functional” or “per plans and specs” can promise more than you priced.</div></li>
</ol>`,
  watch: `<p>AI writes confident sentences even when it's wrong. A description that says “(18) 36" box trees” when you priced 24" box is a $10,000 problem with your signature on it.</p>`
},

{ h: "Sample proposal, page 2",
  lead: "Alternates, unit prices, inclusions, exclusions, clarifications, schedule and terms, all on one page.",
  exLabel: "Sample proposal, continued (made-up prices)",
  ex: `<div class="tablewrap"><table>

{ h: "Common mistakes",
  lead: "Most proposal mistakes are small on paper and expensive on the job.",
  body: `<ul>
<li>No plan dates or addenda listed, so you can't prove what you priced</li>
<li>Line items that don't add up to the total</li>
<li>Excluding work that's on the landscape plans, or that the GC's scope sheet gives to you</li>
<li>Pasting the full boilerplate exclusions list without reading the job</li>
<li>Leaving out the point of connection, controller power or sleeves</li>
<li>Unit prices with no markup, or lowballed to look good</li>
<li>Establishment period or warranty different from the specs</li>
<li>Validity period longer than your supplier quotes</li>
<li>Exclusions or notes written onto a public bid form</li>
<li>Sending the same proposal to every GC when their scope sheets differ</li>
<li>Sending at the last minute, unsigned, or as an editable file instead of a PDF</li>
</ul>`,
  ex: `<p>Before you send, read the proposal as if you were the GC estimator: “What would I have to plug? What would I argue about later?” Fix those first.</p>`
},

{ t: "terms", h: "Words to know",
  lead: "Add these to your notebook.",
  terms: [
    ["Proposal / quote / scope letter", "A sub's written offer to a GC: scope, price and terms."],
    ["Scope by line item", "The price broken into types of work, each with a description."],
    ["Inclusion", "An item you state you are providing, to remove doubt."],
    ["Exclusion", "An item near your scope that you are not providing."],
    ["Clarification", "How you read an unclear item, or a condition your price depends on."],
    ["Assumption", "A condition you priced on, stated in the proposal."],
    ["Alternate", "An option priced separately, as an add or a deduct."],
    ["Voluntary alternate", "An option you offer that the documents didn't ask for."],
    ["Unit price", "A price per unit for adding or deleting work after award."],
    ["Point of connection (POC)", "Where your irrigation system starts."],
    ["Plug", "An amount a GC adds to a sub's bid to cover a missing item."],
    ["Bid leveling", "Comparing sub proposals side by side and adding plugs."],
    ["Scope sheet", "A GC's list of what each trade's price must include."],
    ["Validity period", "How long your price holds."],
    ["Plant establishment", "Period after planting when you water, weed and replace plants."],
    ["Warranty / guarantee", "Your promise to replace failed plants or fix work for a set time."],
    ["Conditional bid", "A public bid with conditions added; may be rejected as non-responsive."],
    ["Non-responsive", "A bid that doesn't follow the bid documents' rules."],
    ["Subcontractor List", "Form where a public prime lists subs, their items and percents."]
  ]
},

{ t: "quiz", id: "m13", h: "Check yourself",

    { q: "Why list plan sheet dates and every addendum in your proposal?", a: ["It looks professional", "It records exactly which documents your price covers", "The GC requires it by law"], c: 1, why: "If plans change after you bid, the dates prove what you priced." },
    { q: "Your proposal excludes ten items near your scope. What will the GC likely do?", a: ["Ignore them", "Add a plug for each one when leveling", "Call every other sub to remove theirs"], c: 1, why: "Each exclusion is a gap the GC has to fill, usually with a plug on your number." },
    { q: "Which exclusion is clear?", a: ["Anything not specifically listed", "Backflow preventer and enclosure, by plumbing", "Excludes all extra work"], c: 1, why: "It names a specific item and who provides it." },

    { q: "Why are deduct unit prices usually lower than add unit prices?", a: ["To trick the GC", "You keep mobilization and some overhead when work is removed", "Deducts don't include material"], c: 1, why: "Removing work doesn't remove all of your fixed costs." },

{ t: "practice", id: "m13", h: "Practice assignments",

    { h: "Write the company's starting exclusions list", hrs: 0.5, d: "<p>Start from the list in this module. Rewrite each line in the company's own words, delete what you'd never exclude, add anything from past jobs that caused arguments. Review it with the owner and mark which items need a GC phone call before you exclude them.</p>" },
    { h: "Quote the 11-428704 landscape scope to a prime", hrs: 1, d: "<p>Using <a href=\"#lab-11-428704\">Real Bid Lab · 11-428704</a> and your prices from Module 15, write a sub quote to a made-up prime for the planting and irrigation items (items 20–69, leaving out what you'd subcontract or wouldn't do, such as electric service). List each item number, description, unit, quantity, unit price and extension; your license, DIR number and any certifications; the items and percents for the Subcontractor List; and no more than three short clarifications. Explain in two sentences why it has almost no exclusions.</p>" },
    { h: "Write a full proposal for a private-style job", hrs: 1, d: "<p>Use a landscape plan set from a current GC invitation (BuildingConnected or PlanHub). If you don't have one yet, download a landscape plan set from the <a href=\"https://www.sandiego.gov/cip/bidopps/\" target=\"_blank\" rel=\"noopener\">City of San Diego bid opportunities</a> page and write the proposal as if you were quoting a GC on a private job. Use your template: plan dates, at least six line items, inclusions, exclusions adjusted to that job, clarifications, two alternates, five unit prices, schedule, establishment, warranty and terms.</p>" },

{ h: "Module 13 summary",
  lead: "Your proposal tells the GC exactly what your number buys. Clear words get your price carried.",
  body: `<ul>
<li>Use one template with every part in the same order, and list plan dates and every addendum.</li>
<li>Break scope into line items that match the plans and the GC's breakdown, and add up to the total.</li>
<li>Exclude specific items that belong to others; don't exclude your own work.</li>
<li>Use clarifications for unclear items and unanswered RFIs, with the RFI number.</li>
<li>Price alternates and unit prices with the same markups as the base bid.</li>
<li>On public bids as prime, the bid form is the proposal: no exclusions or conditions. Quote primes by bid item number.</li>
<li>AI can draft descriptions; you check every quantity, size and promise before you sign.</li>
</ul>
<p><strong>Next: Module 14 · Submitting Public Bids and Bid Day</strong></p>`

{ h: "The bid schedule: unit prices and lump sums",
  lead: "The bid schedule (Caltrans calls it the Bid Item List) is where your price goes. Each line has an item number, description, unit, quantity and your price.",
  body: `<ul>
<li><strong>Unit price item:</strong> you enter a price per unit (LF, SF, EA, CY). The item total is unit price × quantity. You're paid for the units actually installed, unless the item is marked “final pay.”</li>
<li><strong>Lump sum (LS) item:</strong> one price for the whole item, like mobilization or plant establishment.</li>
<li><strong>Total bid:</strong> the sum of all item totals in the base bid.</li>
<li><strong>Allowance or contingency items:</strong> amounts the agency fills in; you carry them as printed.</li>
</ul>
<p><strong>Caltrans's own rules from the 11-428704 bid form:</strong></p>
<ul>
<li>If the unit price and item total don't match, <strong>the unit price prevails</strong> (with narrow exceptions).</li>
<li>If both are left blank, the bid may be found non-responsive.</li>
<li>“Do not round item totals or the total bid.”</li>
</ul>`,
  ex: `<p>The City's EMTS job was a “Lump Sum contract with Unit Price provisions,” and “the low Bid will be determined by the Base Bid.” Caltrans 11-428704 was “on a unit price basis,” so the low bid was the sum of the 70 item totals.</p>`,
  watch: `<p>Because the unit price wins, a typo in a unit price binds you. On 11-428704, 61,975 iceplant cuttings at $0.80 is $49,580. Type $0.08 and your item total is $4,958, and you're held to it: a $44,622 hole.</p>`,

},

{ h: "Alternates: additive and deductive",
  lead: "Alternates let the agency price options. Read how the agency will pick the low bidder before you price them.",
  body: `<ul>
<li><strong>Additive alternate:</strong> extra work the agency may add, like a second planting area or an upgraded controller. You price it separately.</li>
<li><strong>Deductive alternate:</strong> work the agency may take out, like deleting decomposed granite paving. You price the credit.</li>
<li><strong>Basis of award:</strong> the package says whether the low bidder is decided on the base bid alone or base plus some alternates. The City reserves the right to evaluate “the base bid and any proposed alternates or options as detailed herein.”</li>
<li><strong>Subs on alternates:</strong> the City uses a separate “Subcontractors For Alternates” form, marked additive or deductive, with each sub's license and DIR number and dollar value.</li>
</ul>`,
  watch: `<p>Price alternates honestly. If the agency awards base plus alternates, a cheap alternate you never meant to win can become your contract. And remember the prequalification limit covers your total including alternates.</p>`,
  deeper: `<p>For SLBE/ELBE percentages, the City doesn't count alternate items, field orders or City contingency items. Allowance items marked “EOC Type I” count; “EOC Type II” don't.</p>`,

{ h: "The bid bond",
  lead: "The bid bond promises the agency that if you win, you'll sign the contract and give performance and payment bonds. If you walk away, the surety pays the agency's loss, up to the bond amount.",
  body: `<ul>
<li><strong>Amount:</strong> usually at least 10% of the total bid, including additive items. The City requires bid security on bids of $250,000 and up.</li>
<li><strong>Forms allowed:</strong> a surety bond (most common), a cashier's check or a certified check.</li>
<li><strong>Electronic:</strong> Caltrans takes electronic bonds through a bond registry; you enter the bond ID. The City takes a PDF upload at bid time, then the paper original by 5 PM the next working day.</li>
<li><strong>Power of attorney:</strong> a surety bond is signed by the surety's attorney-in-fact, with the power of attorney attached. Check that it's included and current.</li>
</ul>`,
  ex: `<p><strong>Math:</strong> your bid on a City park job is $412,500. Bond at 10%: $412,500 × 0.10 = <strong>$41,250</strong>. Many sureties write the bid bond as “10% of the amount bid” so a late price change doesn't make it too small. ACCU's 11-428704 bond was for 10% of a $1,176,120 bid, or $117,612.</p>`,
  watch: `<p>Check the bond against the bid package: agency's exact name as obligee, project name and bid number, your exact legal name as on your CSLB license, the percent or amount, signatures and seal. The City rejects a bid if the PDF is missing at bid time or the original misses the next-day deadline.</p>`,
