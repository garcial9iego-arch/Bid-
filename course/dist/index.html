{ h: "Scales: turning inches into feet",
  lead: "A scale says how many real feet one inch on the paper stands for. 1\" = 50' means every inch on the sheet is 50 feet on the ground.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Scale</th><th>Where you'll see it</th><th class="num">1 inch on paper =</th></tr></thead>
<tbody>
<tr><td>1" = 10'</td><td>Small sites, courtyards, enlarged areas</td><td class="num">10 ft</td></tr>
<tr><td>1" = 20'</td><td>Most commercial site landscape plans</td><td class="num">20 ft</td></tr>
<tr><td>1" = 30'</td><td>Larger sites, parks</td><td class="num">30 ft</td></tr>
<tr><td>1" = 50'</td><td>Long corridors (all IP and PP sheets on 11-428704)</td><td class="num">50 ft</td></tr>
<tr><td>1/8" = 1'-0"</td><td>Architect's scale, building plans</td><td class="num">8 ft</td></tr>
<tr><td>NTS / No scale</td><td>Most details</td><td class="num">Don't measure</td></tr>
</tbody></table></div>
<p>Landscape and civil sheets use an <strong>engineer's scale</strong> (10, 20, 30, 40, 50, 60 parts per inch). Architects use an <strong>architect's scale</strong> (fractions of an inch per foot). Use the ruler that matches.</p>`,
  ex: `<p><strong>Worked example.</strong> On IP-1 (1" = 50'), you measure a run of new main at 3.4 inches.</p>
<p>3.4 in × 50 ft per in = <strong>170 ft</strong>.</p>
<p>A planting area on a 1" = 20' sheet measures 4.5" by 2.0". That's (4.5 × 20) × (2.0 × 20) = 90 ft × 40 ft = <strong>3,600 SF</strong>. Note that area grows with the square of the scale: the same rectangle on a 1" = 40' sheet would be four times bigger, 14,400 SF.</p>`,
  watch: `<p>A sheet can hold drawings at different scales: a plan at 1" = 20' and an enlargement at 1" = 10' side by side. Read the scale under each drawing, not just the title block.</p>`
},

{ h: "Checking the scale on PDFs and half-size prints",
  lead: "A scale is only true at the full printed size. Shrink the sheet and every measurement shrinks with it. Always check before you measure.",
  body: `<ol class="steps">
<li><div><b>Know the full size</b>The 11-428704 sheets are 22" × 34" (that's the page size in the PDF). Many private sets are 24" × 36" or 30" × 42".</div></li>
<li class="hl"><div><b>Find a check bar</b>Use the graphic scale bar (a ruler drawn on the sheet), or on Caltrans sheets the “relative border scale” bar, which is exactly 3 inches long at full size.</div></li>
<li><div><b>Measure the bar</b>If the 3-inch bar measures 3 inches, the printed scale is true. If it measures 1.5 inches, the print is half size.</div></li>
<li class="hl"><div><b>Fix the scale</b>Half size doubles the scale: 1" = 50' becomes 1" = 100'. In software, calibrate on the bar or on a long written dimension.</div></li>
<li><div><b>Check a known distance</b>Measure something with a written dimension or two stations (next slides). If it doesn't match, stop and recalibrate.</div></li>
</ol>`,
  ex: `<p><strong>Worked example.</strong> You print IP-3 on 11" × 17" paper. The relative border scale bar measures 1.5" instead of 3". Your ratio is 1.5 ÷ 3 = 0.5, so the print is half size. A run that measures 2.2" on your print is 2.2 × 100 = <strong>220 ft</strong>, not 110 ft.</p>`,
  watch: `<p>PDFs are often scanned, reduced or exported at odd sizes. The scale written on the sheet tells you the drawing scale at full size, not the scale of what's on your screen. Calibrate every sheet in your takeoff software, even sheets in the same set.</p>`
},

{ h: "North arrows and match lines",
  lead: "The north arrow tells you which way the sheet faces. Match lines tell you where one sheet ends and the next begins.",
  body: `<ul>
<li><strong>North arrow:</strong> every plan sheet has one. North is often <em>not</em> up. Long sites are rotated so they fit across the sheet. On the I-805 sheets the freeway runs north-south in real life but across the sheet on paper.</li>
<li>Use the north arrow to match the plan to the site walk, to the civil sheets and to the sun (shade plants on the north side of buildings).</li>
<li><strong>Match line:</strong> a heavy line with a note like “MATCH LINE SEE SHEET IP-2.” Everything past it is drawn on the other sheet.</li>
<li><strong>Key map:</strong> a small site map on each sheet showing which part of the project that sheet covers. Large private sets almost always have one.</li>
</ul>`,
  ex: `<p>IP-1 ends at the right edge with “MATCH LINE SEE SHEET IP-2.” Main that runs up to the match line is counted on IP-1; main past it is counted on IP-2. Sheet IQ-1 lists the 4" main by sheet: IP-1 has 440 LF and IP-2 has 1,365 LF.</p>`,
  watch: `<p>The most common double count happens at match lines: a valve or tree drawn on both sheets, or a pipe run measured twice. Mark the match line on both sheets in your takeoff and stop exactly there.</p>`
},

{ h: "Stationing: the address system for long jobs",
  lead: "On roads, medians and pipelines, locations are given by station: the distance in feet along a named survey line. Sta 262+48 means 262 hundreds plus 48 feet, or 26,248 feet from the start of that line.",
  body: `<ul>
<li><strong>How to read it:</strong> the number before the plus sign is hundreds of feet; after it, feet. 262+48 = 26,200 + 48 = 26,248 ft.</li>
<li><strong>The line name matters:</strong> 11-428704 has several lines: “SD-805” (the freeway), “O-6R” and “O-2” (ramps), “M-8”. Sta 261+00 on “O-6R” is not the same place as Sta 261+00 on “SD-805”.</li>
<li><strong>Lt / Rt:</strong> left or right of the line, looking in the direction the stations increase.</li>
<li><strong>Offset:</strong> the distance sideways from the line, like “12' Rt.”</li>
<li>Tick marks along the line show each 100-foot station; big labels (225, 230, 235) every 500 feet.</li>
</ul>`,
  ex: `<p><strong>Worked example from IQ-2 (irrigation conduit table):</strong></p>
<div class="tablewrap"><table>
<thead><tr><th>Sheet</th><th>Line</th><th>Station</th><th>Side</th><th class="num">8" PVC conduit</th><th class="num">4" main inside</th></tr></thead>
<tbody>
<tr><td>IP-4</td><td>“SD-805”</td><td>262+48</td><td>Lt</td><td class="num">85 LF</td><td class="num">85 LF</td></tr>
<tr><td>IP-5</td><td>“SD-805”</td><td>262+48</td><td>Rt</td><td class="num">85 LF</td><td class="num">85 LF</td></tr>
<tr><td>IP-5</td><td>“SD-805”</td><td>264+37</td><td>Rt</td><td class="num">(122 LF CHDPE)</td><td class="num">122 LF</td></tr>
</tbody></table></div>
<p>Distance between the two crossings on the right side: 264+37 − 262+48 = 26,437 − 26,248 = <strong>189 ft</strong>. On a 1" = 50' sheet that's 189 ÷ 50 = <strong>3.78 inches</strong>. Measure it on IP-5 to check your scale.</p>`,
  deeper: `<p>A note on IP-1 says “Install 4" supply line west of existing berm from Sta 235+50 to Sta 249+70 'SD-805' line.” That's 24,970 − 23,550 = 1,420 ft of main defined by stations alone. When a note gives stations, you can compute the length without measuring.</p>`
},

{ h: "Irrigation symbols: from the water source to the valve",
  lead: "Learn the legend before you look at the plan. Every irrigation set starts at the point of connection and works downstream to the valves.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Part (common abbreviation)</th><th>What it does</th><th>How it's priced</th></tr></thead>
<tbody>
<tr><td>Point of connection (POC)</td><td>Where your system starts: a tap, a meter, a stub-out left by the plumber or civil contractor</td><td>EA; check who installs it</td></tr>
<tr><td>Water meter (WM; RWM for recycled)</td><td>Measures water; usually set by the water agency</td><td>Often by others; agency fees excluded</td></tr>
<tr><td>Backflow preventer (BFP, RP, DC)</td><td>Keeps irrigation water out of drinking water</td><td>EA, plus enclosure and testing</td></tr>
<tr><td>Master valve (MV, RCV-M)</td><td>Shuts the mainline when no zone is running</td><td>EA</td></tr>
<tr><td>Flow sensor (FS)</td><td>Detects breaks and high flow</td><td>EA, plus wire to controller</td></tr>
<tr><td>Controller (Irr C, ICC = enclosure)</td><td>The timer; on commercial jobs often a smart or central-control unit</td><td>EA, plus pad, power, antenna</td></tr>
<tr><td>Mainline (supply line, main)</td><td>Pipe under constant pressure, upstream of the valves; heavy solid line</td><td>LF by size and class</td></tr>
<tr><td>Remote control valve (RCV)</td><td>Opens one zone; callout shows controller and station</td><td>EA by size</td></tr>
<tr><td>Quick coupler (QC)</td><td>Hose hookup on the mainline</td><td>EA</td></tr>
<tr><td>Gate or ball valve (GV)</td><td>Manual shutoff to isolate parts of the main</td><td>EA by size</td></tr>
<tr><td>Sleeve / conduit</td><td>Pipe under paving that carries main, lateral or wire</td><td>LF by size; check who installs</td></tr>
</tbody></table></div>`,
  ex: `<p>On 11-428704 the legend adds recycled-water parts: RWCA (recycled water connection assembly), RWM, CCTS (cross connection test station), RWWS (recycled water warning sign), CARV (combination air release valve), antenna mast and 2W (two-wire cable). The water source is an existing Otay Water District recycled-water meter at Palomar Street (IP-7).</p>`,
  watch: `<p>Mainline is pressurized all the time; laterals (downstream of the valves) are only pressurized when the zone runs. Specs usually require heavier pipe and deeper cover for the main. Never price main and lateral at the same rate.</p>`
},

{ h: "Irrigation symbols: heads, drip and the sprinkler schedule",
  lead: "Each head type has its own symbol. The sprinkler schedule (or irrigation legend) lists every type with its make, model, radius, pressure and flow.",
  body: `<ul>
<li><strong>Spray heads:</strong> fixed spray, short throw (about 4 to 15 ft). Symbols show the arc: full, half, quarter circle.</li>
<li><strong>Rotors:</strong> gear-driven or rotary nozzles, longer throw (about 15 to 50+ ft).</li>
<li><strong>Bubblers:</strong> flood water into a tree or shrub basin.</li>
<li><strong>Drip:</strong> usually shown as a hatched area with a note (in-line drip tubing at a set spacing) and a control zone kit at the valve. You measure the area, then figure the tubing.</li>
<li><strong>Lateral pipe:</strong> thinner or dashed line, size labeled on the run, or sized by a chart.</li>
</ul>`,
  ex: `<p>Real rows from ISS-1 (11-428704):</p>
<div class="tablewrap"><table>
<thead><tr><th>Type</th><th class="num">Radius</th><th class="num">Pressure</th><th class="num">Flow</th><th>Notes</th></tr></thead>
<tbody>
<tr><td>Riser sprinkler assembly (gear driven), type 5</td><td class="num">40 ft</td><td class="num">50 psi</td><td class="num">3.5 GPM</td><td>¾" inlet, on 10" riser</td></tr>
<tr><td>Pop-up sprinkler assembly (gear driven), type 6</td><td class="num">40 ft</td><td class="num">50 psi</td><td class="num">3.5 GPM</td><td>12" pop-up</td></tr>
<tr><td>Riser sprinkler assembly (gear driven), type 7</td><td class="num">48 ft</td><td class="num">50 psi</td><td class="num">7.5 GPM</td><td></td></tr>
<tr><td>Tree well sprinkler assembly (flood bubbler)</td><td class="num">n/a</td><td class="num">see sheet</td><td class="num">0.5 GPM</td><td>4 per 24" box tree</td></tr>
</tbody></table></div>
<p>The pipe sizing chart on the same sheet: 1" for 1 to 24 bubblers, 1¼" for 25 to 44, 1½" for 45 to 60, 2" for 61 to 100 (at 0.5 GPM each). Note 5 says any lateral not labeled must be 1", or as shown on the pipe sizing charts.</p>`,
  watch: `<p>On a private job the schedule usually names the make and model, sometimes with “or equal.” Price exactly the model shown. A cheaper “equal” must be approved (Module 5), and you may not get approval after you've won.</p>`
},

{ h: "Notes, keynotes and callouts",
  lead: "Notes are part of the contract. A single general note can add hours of labor to every valve or head on the job.",
  body: `<ul>
<li><strong>General notes:</strong> rules for the whole sheet or set, usually in a numbered list. Read every one.</li>
<li><strong>Keynotes:</strong> a number or letter in a symbol (a hexagon or circle) on the plan, explained in a keynote list on the side. Common on private sets.</li>
<li><strong>Callouts:</strong> text with a leader line pointing to one thing: a pipe size, a valve label, “Exist CAP”.</li>
<li><strong>Valve callouts:</strong> on 11-428704, a tag like “97G-26” means controller '97G', station 26.</li>
<li><strong>Abbreviations:</strong> “Exist” means existing. “(E)” and “(N)” mean existing and new on many private sets, but on Caltrans quantity tables “(N)” means <em>not a separate pay item</em>. Always read the abbreviation list on that set.</li>
</ul>`,
  ex: `<p>Real general notes on ISS-1 and what they cost you:</p>
<ul>
<li>Note 2: every 90° turn in the main needs two 45° elbows. (More fittings and labor.)</li>
<li>Note 3: all piping, equipment and sprinkler caps must be purple or labeled per San Diego County DEH rules for recycled water. (Purple parts cost more.)</li>
<li>Note 4: no ponding, runoff or overspray of recycled water. (Adjustment time, maybe different nozzles.)</li>
<li>Note 7: Calsense flow checking must be enabled at all times. (Programming and troubleshooting time.)</li>
<li>Note 8: no storage of materials or equipment within the dripline of existing trees. (Plan your staging.)</li>
</ul>`,
  watch: `<p>Notes on one sheet often apply to others. A “typical” note on the first irrigation sheet usually applies to every irrigation sheet. If a note seems to change your scope, it does, until an RFI says otherwise (Module 12).</p>`
},

{ h: "The planting legend and schedule",
  lead: "The plant legend is your shopping list. It tells you every species, the container size, the spacing and how each plant is installed.",
  body: `<p>Columns you'll see on most planting schedules:</p>
<ul>
<li><strong>Symbol</strong> (what it looks like on the plan), <strong>botanical name</strong> and <strong>common name</strong></li>
<li><strong>Size:</strong> #1 (1-gallon), #5, #15, 24" box, 36" box, flats, plugs, cuttings</li>
<li><strong>Quantity</strong> (sometimes; often you count), and <strong>spacing</strong> for groundcover and shrub masses</li>
<li><strong>Remarks:</strong> staking, multi-trunk, standard, matched specimens, water use (WUCOLS rating)</li>
</ul>`,
  ex: `<p>Caltrans PL-1 on 11-428704 has more columns than most: plant group (size), plant number, symbol, botanical and common name, hole diameter and depth, basin type, plant area (SF), wood mulch (CY), staking, application rates for iron sulfate and slow-release fertilizer, packet fertilizer, on-center spacing, minimum planting distance from the traveled way, edge of pavement, fence, wall and ditches, and remarks.</p>
<div class="tablewrap"><table>
<thead><tr><th>Group (size)</th><th>Example</th><th>Spacing</th><th>Extra work from the legend</th></tr></thead>
<tbody>
<tr><td>A (#1)</td><td>Salvia 'Bee's Bliss'</td><td>6 ft o.c.</td><td>Hole sized to the root ball, 1 fertilizer packet</td></tr>
<tr><td>B (#5)</td><td>Aloe striata 'Ghost Aloe'</td><td>3 ft o.c.</td><td>2 fertilizer packets</td></tr>
<tr><td>H (cutting)</td><td>Carpobrotus edulis (hottentot fig)</td><td>1 ft o.c.</td><td>37,980 SF and 14,020 SF areas, fertilizer per 1,000 SF</td></tr>
<tr><td>K (24" box)</td><td>Pinus canariensis, Pinus eldarica</td><td>As shown</td><td>48" hole, 60" basin, staking, 5 packets, 40 ft from traveled way</td></tr>
</tbody></table></div>`,
  deeper: `<p>Caltrans uses letters for container sizes in Standard Specifications section 20-3.01B(2)(a): A = No. 1 container, B = No. 5, U = No. 15, K = 24-inch box, H = cutting, among others. Private sets write the size out (#1, #5, #15, 24" box). Same plants, different labels.</p>`,
  src: "Plans PL-1 (11-428704); Caltrans 2018 Standard Specifications 20-3.01B(2)(a)."
},

{ h: "Groundcover hatches and spacing on center",
  lead: "Groundcover, mulch and drip areas are shown as hatch patterns, not individual symbols. You measure the area, then use the spacing to get a plant count.",
  body: `<ul>
<li>Each hatch (diagonal lines, dots, crosshatch) matches a row in the legend.</li>
<li><strong>O.C. (on center)</strong> is the distance from the center of one plant to the center of the next.</li>
<li><strong>Square spacing:</strong> plants in a grid. Plants per SF = 1 ÷ (spacing × spacing).</li>
<li><strong>Triangular spacing:</strong> rows offset like a honeycomb. It fits about 15% more plants: plants per SF = 1.155 ÷ (spacing × spacing).</li>
<li>The legend or a note says which pattern. If it doesn't, ask (Module 12). Module 7 covers the full planting takeoff.</li>
</ul>`,
  ex: `<p><strong>Worked example (example numbers for practice).</strong> A 2,400 SF shrub bed of #1 plants at 3 ft o.c.:</p>
<ul>
<li>Square: 2,400 ÷ (3 × 3) = 2,400 ÷ 9 = <strong>267 plants</strong></li>
<li>Triangular: 2,400 × 1.155 ÷ 9 = <strong>308 plants</strong></li>
</ul>
<p>The difference is 41 plants. At any price per installed plant, that's real money on one bed.</p>`,
  watch: `<p>Hatches can overlap: a groundcover hatch inside a mulch hatch inside a drip hatch. One area may need plants, mulch and drip. Make a list of every hatch in the legend and check each area for all of them.</p>`
},

{ h: "Details and detail callouts",
  lead: "Details show how each item is built. They usually add parts and labor that the plan view never shows.",
  body: `<ul>
<li><strong>Private sets:</strong> a callout bubble on the plan, split in two: the top number is the detail, the bottom is the sheet. “3 / L-5.1” means detail 3 on sheet L-5.1.</li>
<li><strong>Caltrans sets:</strong> details are on ID (irrigation) and PLD (planting) sheets, titled by item, plus statewide <strong>Standard Plans</strong> (for example H4, the sprinkler assembly, revised as RSP H4 and bound at the back of this set).</li>
<li>Most details say <strong>NTS</strong> or “No scale.” Read the written dimensions; never measure a detail.</li>
<li>When the detail and the plan disagree, the detail usually governs (Module 5 explains the order of precedence).</li>
</ul>`,
  ex: `<p>The tree well detail (ID-5 and PLD-1) turns one 24" box pine into: a 48" hole, a 60" basin, staking, a gravel sump, a perforated PVC drainpipe with a removable purple drain grate, 4 flood bubblers on a swing joint, iron sulfate, slow-release fertilizer and 5 fertilizer packets. The plan view shows a single tree symbol.</p>
<p>Other ID sheets show the antenna mast, master valve and flow sensor assembly, and the recycled water warning sign and detectable warning tape that runs “continuously along the entire trench.”</p>`,
  watch: `<p>Read every detail that applies to your scope before pricing, even if it looks standard. Valve box depth, gravel, thrust blocks, wire splices and staking are where “standard” stops being standard.</p>`,
  src: "Plans ID-1 to ID-6, PLD-1, RSP H4 (11-428704)."
},

{ h: "Quantity tables and schedules",
  lead: "Caltrans and many public sets include quantity tables. They help you check your takeoff and the bid item list, but they're not always right.",
  body: `<p>IQ-1 on 11-428704 lists the 4" Class 315 main by plan sheet:</p>
<div class="tablewrap"><table><thead><tr><th>IP-1</th><th>IP-2</th><th>IP-3</th><th>IP-4</th><th>IP-5</th><th>IP-6</th><th>IP-7</th><th>In conduits (IQ-2)</th><th>Total</th></tr></thead>
<tbody><tr><td class="num">440</td><td class="num">1,365</td><td class="num">1,210</td><td class="num">165</td><td class="num">1,150</td><td class="num">1,385</td><td class="num">1,130</td><td class="num">648</td><td class="num"><strong>7,493</strong></td></tr></tbody></table></div>
<p>440 + 1,365 + 1,210 + 165 + 1,150 + 1,385 + 1,130 = 6,845 LF on the plan sheets, plus 648 LF in conduits = <strong>7,493 LF</strong>, which matches bid item 63.</p>
<ul>
<li>Other tables: lateral pipe and heads by valve (IQ-1), conduit by station (IQ-2), plants by sheet and group (PQ-1).</li>
<li>Footnotes matter: on IQ-2, “(N) not a separate pay item, for information only” and “* included on IQ-1.”</li>
</ul>`,
  watch: `<p>Private plan sets rarely include quantities, and when they do they often say “for reference only.” The contractor is responsible for the takeoff. Use any table as a check, never as your count.</p>`,
  ex: `<p>Module 15 shows what checking IQ-1 against the bid list turns up on this job: the table adds to 172 tree well assemblies, but the bid item says 180. It's probably Caltrans rounding up, as on several other items, and a short written question confirms it.</p>`
},

{ h: "Finding your water and power on other sheets",
  lead: "The landscape sheets show where your system goes. The civil, utility and electrical sheets often show where it gets its water and power, and who builds those parts.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>You need to know</th><th>Look on</th></tr></thead>
<tbody>
<tr><td>Where the irrigation water service, meter and backflow are, and who installs them</td><td>Civil utility plan (C-sheets), plumbing site plan</td></tr>
<tr><td>Sleeves under drives, walks and parking</td><td>Civil, hardscape or irrigation sheets; check that someone installs them before paving</td></tr>
<tr><td>Power to the controller (circuit, conduit, who pulls wire)</td><td>Electrical site plan (E-sheets) and panel schedule</td></tr>
<tr><td>Existing utilities you'll trench near</td><td>Civil existing conditions or utility sheets (U-sheets)</td></tr>
<tr><td>Planters on structure, podium decks, building drains, wall footings</td><td>Architectural and structural sheets</td></tr>
<tr><td>Finish grades, swales and slope steepness</td><td>Civil grading plan</td></tr>
</tbody></table></div>`,
  ex: `<p>On 11-428704: the utility sheets (U-1 to U-7) show Otay Water District water and recycled-water lines in the work area. Electrical sheet E-1 shows an existing SDG&amp;E service enclosure, 120/240 V, with a 20-amp breaker labeled “Irr,” and a note to install 2 #10 conductors in conduit per the irrigation detail to the new controller enclosure. That's an electrician's work. The top three bidders in Module 15 all listed an electric service subcontractor.</p>`,
  watch: `<p>On private jobs, the POC is often “stub-out by plumbing contractor” on one sheet and “by landscape contractor” on another. Find every mention, and state in your proposal exactly where your work starts (Module 13).</p>`
},

{ h: "Revisions, clouds and addenda",
  lead: "Plans change during bidding. A revision cloud and a numbered triangle show exactly what changed. Pricing an old sheet is one of the most expensive mistakes you can make.",
  body: `<ul>
<li><strong>Revision cloud:</strong> a scalloped outline drawn around the changed area.</li>
<li><strong>Delta:</strong> a triangle with the revision number next to the cloud. It matches a line in the title block's revision list.</li>
<li><strong>Addendum:</strong> a formal change issued before bids are due. It may replace whole sheets, change spec sections, or answer questions. Each addendum is numbered.</li>
<li><strong>Bulletin / ASI:</strong> changes after the contract is signed (Module 16).</li>
</ul>`,
  ex: `<p>Addendum 1 on 11-428704 replaced sheet 45 (IQ-1). The new sheet carries a triangle with “1” next to the 2" remote control valve total (now 3) and the note “REPLACED PER ADDENDUM No. 1 DATED AUGUST 27, 2021.” The same addendum changed bid item 38 from 4 to 3 valves.</p>`,
  watch: `<p>Keep one current set. When an addendum arrives, replace the old sheets in your takeoff file right away, mark the date on your cover sheet, and re-check every quantity in the clouded areas. Module 12 covers tracking addenda.</p>`,
  src: "Caltrans Addendum No. 1, Aug. 27, 2021, contract 11-428704; Addendum 1 plans, sheet IQ-1."
},

{ h: "Digital plan tools",
  lead: "Most commercial estimators read and take off plans on screen. The tools differ, but they all do the same few jobs.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Tool type</th><th>Examples</th><th>What it's good for</th></tr></thead>
<tbody>
<tr><td>PDF markup and measuring</td><td>Bluebeam Revu; free PDF readers with measure tools</td><td>Calibrating scale, measuring length and area, counting symbols, markups, comparing two versions of a sheet</td></tr>
<tr><td>Dedicated takeoff software</td><td>PlanSwift, On Center's On-Screen Takeoff</td><td>Takeoff tied to item lists and assemblies, quantities that flow to a spreadsheet or estimate</td></tr>
<tr><td>Spreadsheet</td><td>Excel, Google Sheets</td><td>Your estimate itself, and checking totals from any tool</td></tr>
</tbody></table></div>
<ol class="steps">
<li><div><b>Calibrate each sheet</b>Use the scale bar or a long dimension, not the scale label alone.</div></li>
<li class="hl"><div><b>One color per item</b>4" main red, 2" main orange, laterals blue, and so on. Keep a legend.</div></li>
<li><div><b>Count, then check</b>Use the count tool for heads and plants, then compare to any schedule or quantity table.</div></li>
<li><div><b>Use overlay or compare</b>When an addendum replaces a sheet, compare the old and new to see every change.</div></li>
</ol>`,
  watch: `<p>Software measures what you trace. A wrong calibration or a missed match line goes straight into your bid. Spot check one measurement per sheet by hand or with the scale bar. Prices and plans for these tools change; check the vendors' sites and try free trials before buying.</p>`
},

{ h: "A routine for reading a new set",
  lead: "Read the set in the same order every time. The first pass is for understanding, not counting.",
  body: `<ol class="steps">
<li><div><b>Title sheet and index</b>Check you have every sheet. Note the date and issue name.</div></li>
<li><div><b>All addenda</b>Swap in replaced sheets before you start.</div></li>
<li class="hl"><div><b>Legends, schedules and general notes</b>ISS-1 and PL-1 on the example job. Learn every symbol and hatch.</div></li>
<li><div><b>Irrigation plans</b>Start at the POC and follow the main to the end. Find every controller.</div></li>
<li><div><b>Planting plans</b>Find every hatch and plant symbol; note trees and specimen sizes.</div></li>
<li class="hl"><div><b>Details</b>For each item in your scope, read its detail.</div></li>
<li><div><b>Other disciplines</b>Civil utility and grading, electrical, architectural site plan, traffic handling on road jobs.</div></li>
<li><div><b>Quantity tables</b>If there are any, use them to check.</div></li>
<li><div><b>Questions list</b>Write down every conflict or gap as you go. These become RFIs (Module 12).</div></li>
</ol>`,
  ex: `<p>Budget your time: a first read-through of a 10-sheet private landscape set might take 1 to 2 hours. On the 65-sheet I-805 set, reading only the 33 landscape sheets plus E-1, E-2 and the utility sheets carefully is a half day. That time saves you from pricing the wrong job.</p>`
},

{ h: "Common traps",
  lead: "Most plan-reading mistakes are the same few, made over and over. Check for each one before you price.",
  body: `<ul>
<li><strong>Wrong scale:</strong> half-size print, scanned PDF, or an enlargement at a different scale on the same sheet.</li>
<li><strong>Old sheets:</strong> pricing a sheet an addendum replaced.</li>
<li><strong>Double counts at match lines</strong>, or items missed between two sheets.</li>
<li><strong>Existing vs. new:</strong> “Exist” or “(E)” items drawn lightly that you don't install, or must protect, remove or modify.</li>
<li><strong>“By others”:</strong> POC, sleeves, controller power or backflow assumed by others but not shown anywhere as someone else's.</li>
<li><strong>Typical details:</strong> a “typ.” detail that applies to every valve, head or tree on the job.</li>
<li><strong>Notes far from the plan:</strong> general notes on a different sheet that change every item.</li>
<li><strong>Removal and demolition sheets</strong> (IR sheets on the example job) skipped because they aren't “new work.”</li>
<li><strong>Plant schedule counts</strong> that don't match the symbols on the plan.</li>
<li><strong>Missing sheets</strong> referenced in a callout but not in your set.</li>
</ul>`,
  watch: `<p>When the schedule and the plan disagree on a count, don't just pick one. Ask (RFI), and if there's no answer before bid day, state in your proposal which you priced.</p>`
},

{ t: "terms", h: "Words to know",
  lead: "Add these to your notebook.",
  terms: [
    ["Plan set", "All the drawings for one project."],
    ["Sheet index", "The list of every sheet in the set, usually on the title sheet."],
    ["Title block", "The border box with sheet title, number, stamp, dates and revisions."],
    ["Scale", "How many real feet one inch on the drawing stands for, like 1\" = 20'."],
    ["Graphic scale bar", "A ruler drawn on the sheet that stays true when the sheet is shrunk."],
    ["NTS", "Not to scale. Don't measure it."],
    ["Match line", "Line where one plan sheet continues on another."],
    ["Station (Sta)", "Distance in feet along a survey line, written like 262+48 (26,248 ft)."],
    ["Offset / Lt / Rt", "Sideways distance from the line, to the left or right."],
    ["POC", "Point of connection: where the irrigation system gets its water."],
    ["Mainline (supply line)", "Pipe under constant pressure upstream of the valves."],
    ["Lateral", "Pipe downstream of a valve, pressurized only when the zone runs."],
    ["RCV", "Remote control valve: opens one irrigation zone."],
    ["Sprinkler schedule", "Table of every head type with model, radius, pressure and flow."],
    ["Plant legend / schedule", "Table of every plant with size, spacing and installation notes."],
    ["O.C.", "On center: distance from one plant's center to the next."],
    ["Hatch", "A fill pattern showing an area, like groundcover or mulch."],
    ["Keynote", "A numbered tag on the plan explained in a list on the sheet."],
    ["Detail callout", "Bubble telling you which detail and which sheet, like 3 / L-5.1."],
    ["Revision cloud / delta", "Outline and numbered triangle marking a change."],
    ["Addendum", "A formal change to the bid documents issued before bids are due."]
  ]
},

{ t: "quiz", id: "m4", h: "Check yourself",
  lead: "Tap an answer to check it.",
  qs: [
    { q: "A sheet says 1\" = 50'. You measure 2.6 inches on a full-size print. How long is it?", a: ["52 ft", "130 ft", "260 ft"], c: 1, why: "2.6 × 50 = 130 ft." },
    { q: "You printed a 1\" = 50' sheet at half size. What is the scale of your print?", a: ["1\" = 25'", "1\" = 50'", "1\" = 100'"], c: 2, why: "Half size doubles the feet per inch, so each printed inch is 100 ft." },
    { q: "What does Sta 262+48 mean?", a: ["262.48 miles along the road", "26,248 feet along the named survey line", "Sheet 262, detail 48"], c: 1, why: "Before the plus is hundreds of feet: 262 × 100 + 48 = 26,248 ft." },
    { q: "How far apart are Sta 262+48 and Sta 264+37 on the same line?", a: ["189 ft", "1.89 ft", "211 ft"], c: 0, why: "26,437 − 26,248 = 189 ft." },
    { q: "A detail bubble reads 4 / L-5.2. Where is the detail?", a: ["Sheet 4, detail L-5.2", "Detail 4 on sheet L-5.2", "Keynote 4 on any L sheet"], c: 1, why: "Top is the detail number, bottom is the sheet." },
    { q: "Where would you usually find the power circuit for the irrigation controller?", a: ["The planting legend", "The electrical sheets", "The sprinkler schedule"], c: 1, why: "Power, conduit and breakers are on the electrical (E) sheets, as on E-1 of 11-428704." },
    { q: "On a Caltrans quantity table, what does “(N)” mean?", a: ["New work", "Not a separate pay item", "North side"], c: 1, why: "The IQ-2 footnote says “(N) not a separate pay item, for information only.” Always read the abbreviation list for each set." },
    { q: "A 1,800 SF bed is planted at 3 ft o.c., square spacing. About how many plants?", a: ["200", "600", "231"], c: 0, why: "1,800 ÷ (3 × 3) = 200. Triangular spacing would give about 231." }
  ]
},

{ t: "practice", id: "m4", h: "Practice assignments",
  lead: "Six hours with real plans. Use a PDF tool with a measure and markup feature (Bluebeam Revu trial or a free PDF reader with measuring).",
  items: [
    { h: "Download and index the real plan set", hrs: 0.5, d: "<p>From <a href=\"#lab-11-428704\">Real Bid Lab · 11-428704</a>, download the Plans and Addendum 1 plans. Make a one-page index: sheet number, code (ISS-1, IP-1 and so on) and title for sheets 24 to 58. Mark which sheets Addendum 1 replaced and swap them into your working copy.</p>" },
    { h: "Learn the two legends", hrs: 0.75, d: "<p>On ISS-1 and PL-1, list every symbol, hatch and abbreviation with its meaning, in your own words. Include the sprinkler schedule rows, the pipe sizing chart and the 8 general notes. Next to each note, write one way it affects price.</p>" },
    { h: "Mark up the irrigation plans", hrs: 1.25, d: "<p>On IP-1 and IP-7, mark in color: the point of connection (IP-7), the new 4\" main, every controller and antenna mast, every conduit crossing, gate valves, and both match lines. Write the controller and station for five valve callouts. Check your marked main on IP-1 against the 440 LF on IQ-1.</p>" },
    { h: "Scale and stationing exercise", hrs: 1, d: "<p>(1) On the relative border scale bar, check whether your PDF view or print is full size. (2) Calibrate IP-5 and measure the distance between the crossings at Sta 262+48 Rt and 264+37 Rt; compare to the 189 ft from the stations. (3) Using the IP-1 note, compute the length of main from Sta 235+50 to Sta 249+70. (4) Print one sheet at 11 × 17, measure three runs with a ruler, and convert them using the corrected scale. Write down every step.</p>" },
    { h: "Mark up a planting sheet", hrs: 1, d: "<p>On PP-1, highlight each hatch and plant symbol in a different color. Count the 1-gallon and 24\" box symbols you see, and add up the cutting callouts on that sheet. Compare to the PP-1 row on PQ-1. List any differences.</p>" },
    { h: "Follow details and other disciplines", hrs: 0.5, d: "<p>Follow a 24\" box pine from PP sheets to its details on PLD-1 and ID-5. List every part and step the details add. Then open E-1 and write down the power source, breaker and wire for the controllers.</p>" },
    { h: "Index a private or city plan set", hrs: 1, d: "<p>Get one current or recent commercial landscape plan set: a GC invitation, or a City of San Diego or other agency project found through <a href=\"https://www.sandiego.gov/purchasing/bids-contracts\" target=\"_blank\" rel=\"noopener\">the City's bid page</a> or an agency PlanetBids portal. Build the same sheet index, find the POC, controller power and sleeve sheets, and list five symbols or notes that differ from the Caltrans set.</p>" }
  ]
},

{ h: "Module 4 summary",
  lead: "You can now open a plan set, find your sheets and read them. Next, you'll read the specifications that go with them.",
  body: `<ul>
<li>Use the index and sheet codes to find every sheet that touches your scope, including civil, utility and electrical.</li>
<li>Check the scale on every sheet and print. Half size doubles the scale. Calibrate in software on a scale bar.</li>
<li>Read north arrows, match lines and stations. Sta 262+48 is 26,248 ft along a named line.</li>
<li>Learn the legend, schedule and notes before looking at the plan. Notes are part of the contract.</li>
<li>Follow every detail callout. Details add parts and labor the plan view doesn't show.</li>
<li>Use quantity tables to check, not to count. Keep one current set and watch for clouds and addenda.</li>
</ul>
<p><strong>Next: Module 5 · Reading Specifications</strong></p>`
}
]
});

{ h: "Plans vs. specifications",
  lead: "Plans answer “where and how much.” Specifications answer “what exactly, how well, and how do you prove it.” You need both to price a job.",
  body: `<div class="twocol">
<div><h3>Plans (drawings)</h3><ul>
<li>Locations, layout, sizes</li>
<li>Symbols, schedules, details</li>
<li>Quantities (by takeoff, or in tables)</li>
<li>Notes for specific items</li>
</ul></div>
<div><h3>Specifications (written)</h3><ul>
<li>Products, materials and approved brands</li>
<li>Installation methods and workmanship</li>
<li>Tests, inspections and submittals</li>
<li>Maintenance, warranty, closeout</li>
<li>How items are measured and paid</li>
</ul></div>
</div>`,
  ex: `<p>On 11-428704, the plans show a 4" Class 315 recycled-water main, 7,493 LF. The Special Provisions add that recycled-water mains are pressure tested “by method A with the testing pressure modified to 150 psi,” that the warning tape must be purple, at least 5 mil thick, with a metallic strip, marked “Caution Reclaimed Water Line Buried Below,” and run along the whole trench. None of that is on the plan view, and all of it costs money.</p>`,
  watch: `<p>On private work, specs are often a separate book (the project manual) that the GC doesn't send unless you ask. Always ask for the landscape and irrigation sections and Division 01. Pricing from plans alone means guessing at the specs.</p>`,
  src: "Special Provisions 20-2.01A(4)(b)(i), 20-2.01B(3), contract 11-428704."
},

{ h: "When they conflict: order of precedence",
  lead: "Every contract says which document wins when two disagree. Learn the order for each spec family you bid.",
  body: `<div class="twocol">
<div><h3>Caltrans (2018 Standard Specifications, 5-1.02)</h3><ol>
<li>Special provisions</li>
<li>Project plans</li>
<li>Revised standard specifications</li>
<li>Standard specifications</li>
<li>Revised standard plans</li>
<li>Standard plans</li>
<li>Supplemental project information</li>
</ol></div>
<div><h3>City of San Diego (Whitebook 2024, 3-7.2)</h3><ol>
<li>Permits</li>
<li>Change orders and supplemental agreements</li>
<li>The signed agreement</li>
<li>Addenda</li>
<li>Bid / proposal</li>
<li>Supplemental special provisions</li>
<li>Project plans</li>
<li>Standard drawings</li>
<li>Whitebook</li>
<li>Greenbook</li>
<li>Reference specifications</li>
</ol></div>
</div>
<p>Both also say: <strong>written numbers govern over scaled graphics</strong>, and <strong>detail drawings govern over general drawings</strong>. Caltrans adds that a specific spec governs over a general one.</p>`,
  watch: `<p>Precedence settles a conflict after the fact. It doesn't protect your price. If you find a conflict while bidding, ask before bid day (Module 12). Many private contracts say that when documents conflict, the contractor provides the better quality or greater quantity. If you can't get an answer, say in your proposal which version you priced.</p>`,
  deeper: `<p>Caltrans 5-1.02 also says the parts are complementary: “A component in one Contract part applies as if appearing in each.” A requirement in the specs applies even if the plans never mention it. The Whitebook adds that where documents conflict with the Municipal Code, the most stringent requirement controls. The 2024 Whitebook replaces Greenbook section 3-7.2 with the list above; older contracts may cite precedence as section 2-5.2. Private contracts set their own order; read the subcontract and the prime contract it points to.</p>`,
  src: "Caltrans 2018 Standard Specifications 5-1.02; City of San Diego Whitebook 2024 edition, Part 1(A), 3-7.2."
},

{ h: "The three spec families in San Diego",
  lead: "Almost every commercial landscape job you bid will use one of three spec systems. Know which one before you start reading.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Family</th><th>Who uses it</th><th>How it's built</th></tr></thead>
<tbody>
<tr><td><strong>Caltrans</strong></td><td>State highway jobs; some local road jobs that reference it</td><td>2018 Standard Specifications + Revised Standard Specifications + job Special Provisions + Standard Plans. Landscape is Section 20.</td></tr>
<tr><td><strong>Greenbook + agency supplement</strong></td><td>City of San Diego (with its Whitebook) and many other Southern California cities and agencies, often with their own supplement or special provisions</td><td>Greenbook (Standard Specifications for Public Works Construction) + supplement + project special provisions. Landscape is Part 8 (Sections 800, 801).</td></tr>
<tr><td><strong>Project manual (CSI)</strong></td><td>Private work, schools, colleges, many public buildings</td><td>Front end (Divisions 00, 01) + technical sections by CSI MasterFormat number. Landscape is Division 32.</td></tr>
</tbody></table></div>`,
  ex: `<p>A Chula Vista freeway job uses Caltrans. A City of San Diego median retrofit uses the Greenbook and Whitebook. A new medical office for a private developer uses a project manual with sections 32 84 00 and 32 93 00. School districts often use a project manual too, with their own Division 00 forms.</p>`,
  watch: `<p>Check which <em>edition</em> the contract names. The City lists the Whitebook 2024 edition as effective April 1, 2026, and the 2021 edition before it. A job advertised under one edition stays under it. Read the right book.</p>`,
  src: "City of San Diego, “The WHITEBOOK: San Diego Supplement to the GREENBOOK” page; Caltrans 2018 CCS Standard Plans and Standard Specifications page."
},

{ h: "Caltrans layering: the 11-428704 example",
  lead: "A Caltrans spec book mostly lists changes to the Standard Specifications. To know the full rule, you read the base section, then apply each change.",
  body: `<ol class="steps">
<li><div><b>Start with the 2018 Standard Specifications</b>20-2.01A(4)(b)(ii), Method A: fill the line, pressurize to 125 psi, hold 1 hour, no more than 5 psi drop.</div></li>
<li><div><b>Check the Revised Standard Specifications</b>Bound into the job's book (dated 04-16-21 here). Statewide updates, same numbering.</div></li>
<li class="hl"><div><b>Apply the Special Provisions</b>“Add to the end of section 20-2.01A(4)(b)(i): Test plastic pipe supply line mains used for recycled water by method A with the testing pressure modified to 150 psi.”</div></li>
<li><div><b>Result for your price</b>Recycled-water main is tested at 150 psi, for 1 hour, in the Engineer's presence, before backfill, with 48 hours' notice. Plan for test crews, standby time and repeat tests.</div></li>
</ol>
<p>Special Provisions use set phrases: <strong>“Add to section…”</strong>, <strong>“Replace … with…”</strong>, <strong>“Delete…”</strong>, <strong>“Replace Reserved in section…”</strong>. Each one changes the base text in a specific spot.</p>`,
  deeper: `<p>Caltrans sections follow their own pattern that works like the CSI three-part format, plus payment: <strong>A General</strong> (summary, definitions, submittals, quality assurance), <strong>B Materials</strong>, <strong>C Construction</strong>, <strong>D Payment</strong>. You can see it in Special Provisions 16-2.06A to 16-2.06D (temporary protection fence). Payment clauses matter: SP 20-3.02D says “Payment for tree hole and basin work is included in the payment for plant (group K).”</p>`,
  src: "Caltrans 2018 Standard Specifications 20-2.01A(4)(b)(i)–(ii); Special Provisions 11-428704, 20-2.01A(4)(b)(i), 20-3.02D, 16-2.06."
},

{ h: "Greenbook and the City of San Diego Whitebook",
  lead: "The Greenbook is the base public works spec used across Southern California. The City of San Diego's Whitebook changes it for City jobs, and the Whitebook wins when they conflict.",
  body: `<ul>
<li>The <strong>Greenbook</strong> must be bought from its publisher. The <strong>Whitebook</strong> is a free download from the City.</li>
<li>Whitebook changes use phrases like “DELETE in its entirety and SUBSTITUTE with the following” and “ADD the following.”</li>
<li>Landscape is <strong>Part 8</strong>: 800 Materials (topsoil, amendments, mulch, plants, pipe, valves, controllers), 801 Installation (soil prep, planting, irrigation, testing, plant establishment), 802 Native habitat.</li>
<li>City projects then add <strong>Supplemental Special Provisions</strong> for that job.</li>
</ul>`,
  ex: `<p>Same task, three specs. Pressure testing a mainline:</p>
<div class="tablewrap"><table>
<thead><tr><th>Spec</th><th class="num">Test pressure</th><th class="num">Duration</th></tr></thead>
<tbody>
<tr><td>Caltrans 2018 SS, Method A</td><td class="num">125 psi</td><td class="num">1 hour</td></tr>
<tr><td>11-428704 SP, recycled-water main</td><td class="num">150 psi</td><td class="num">1 hour</td></tr>
<tr><td>Whitebook 801-5.7.2.2, pressurized mains</td><td class="num">125 psi</td><td class="num">4 hours</td></tr>
<tr><td>Whitebook 801-5.7.2.2, non-pressurized laterals</td><td class="num">100 psi</td><td class="num">2 hours</td></tr>
</tbody></table></div>
<p>Same pipe, different rules. Never assume the last job's spec.</p>`,

},

{ h: "CSI MasterFormat and Division 32",
  lead: "Private project manuals are organized by CSI MasterFormat: numbered divisions and sections that are the same on every job. Learn your numbers and you can find your scope in any manual.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Number</th><th>Section</th><th>Why you read it</th></tr></thead>
<tbody>
<tr><td>Division 00</td><td>Procurement and contracting requirements</td><td>Bid forms, instructions, contract, bonds, insurance</td></tr>
<tr><td>Division 01</td><td>General requirements</td><td>Submittals, quality control, temporary facilities, closeout</td></tr>
<tr><td>32 80 00</td><td>Irrigation</td><td>Irrigation general</td></tr>
<tr><td>32 84 00</td><td>Planting irrigation</td><td>Pipe, valves, heads, controllers, testing</td></tr>
<tr><td>32 90 00</td><td>Planting</td><td>Planting general</td></tr>
<tr><td>32 91 13</td><td>Soil preparation</td><td>Soil tests, amendments, fine grading</td></tr>
<tr><td>32 92 00</td><td>Turf and grasses</td><td>Sod, seed, hydroseed</td></tr>
<tr><td>32 93 00</td><td>Plants</td><td>Trees, shrubs, groundcover, quality, warranty</td></tr>
<tr><td>Also check</td><td>31 (earthwork), 33 (utilities), 26 (electrical)</td><td>Rough grading, water service, controller power</td></tr>
</tbody></table></div>`,
  ex: `<p>Every section number has three pairs of digits. The first pair is the division (32 = Exterior Improvements). The more digits that aren't zeros, the narrower the topic: 32 90 00 is all planting, 32 91 13 is just soil preparation.</p>`,
  watch: `<p>Designers don't always use every section. A small job may put soil prep, plants and maintenance all in 32 90 00. Read the table of contents and search the whole manual for words like “landscape,” “irrigation,” “planting” and “maintenance.”</p>`,
  src: "CSI MasterFormat (Construction Specifications Institute), csiresources.org."
},

{ h: "Inside a section: Part 1, Part 2, Part 3",
  lead: "Every CSI section has the same three parts. Each part hides a different kind of cost.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Part</th><th>What's in it</th><th>Costs to look for</th></tr></thead>
<tbody>
<tr><td><strong>Part 1 · General</strong></td><td>Summary, related sections, references, submittals, quality assurance, delivery and storage, warranty, maintenance</td><td>Submittal prep, samples, mockups, nursery inspections, warranty length, maintenance period</td></tr>
<tr><td><strong>Part 2 · Products</strong></td><td>Manufacturers, materials, “or equal” rules, mixes and grades</td><td>Named brands, required models, amendment types, plant quality standards</td></tr>
<tr><td><strong>Part 3 · Execution</strong></td><td>Examination, preparation, installation, field quality control, cleaning, protection</td><td>Methods that slow production, tests and inspections, cleanup, protection of finished work</td></tr>
</tbody></table></div>`,
  ex: `<p>Reading strategy: read Part 1 completely (that's where most hidden costs are), skim Part 2 for brands and anything unusual, and read Part 3 for tests, inspections and anything that changes how fast your crew can work.</p>`,
  watch: `<p>“Related sections” in Part 1 tell you what other sections apply to your work. If 32 84 00 says “Section 26 05 00 Common Work Results for Electrical,” your controller wiring might be on you. Read each related section's scope.</p>`
},

{ h: "The front end: Divisions 00 and 01",
  lead: "Landscape estimators often skip the front end. That's where bid forms, insurance, bonds, retention, submittal rules and closeout live.",
  body: `<ul>
<li><strong>Instructions to bidders and bid form:</strong> due date, what to submit, alternates, unit prices, addenda acknowledgment.</li>
<li><strong>Agreement and general conditions</strong> (often an AIA or ConsensusDocs form on private jobs): payment, retention, changes, claims, termination.</li>
<li><strong>Supplementary conditions:</strong> changes to the general conditions for this job. Read them; they often change retention, insurance or schedule rules.</li>
<li><strong>Insurance and bonds:</strong> limits, endorsements, performance and payment bonds (Module 2).</li>
<li><strong>Submittal procedures</strong> (01 33 00): format, number of copies, review time, resubmittals.</li>
<li><strong>Quality requirements, temporary facilities</strong> (water, power, sanitation, fencing).</li>
<li><strong>Closeout</strong> (01 77 00, 01 78 00): record drawings, O&amp;M manuals, warranties, training, extra stock.</li>
</ul>`,
  ex: `<p>On a sub bid, the GC may not send you the front end. Ask for at least the supplementary conditions, insurance requirements, Division 01 and the subcontract form. They change your overhead, your cash flow and your risk.</p>`,
  watch: `<p>A short review time for submittals (or long one for the owner to answer) changes your schedule. A “provide water for construction” line in Division 01 means you pay for water and a meter or hydrant permit.</p>`
},

{ h: "Price changers 1 · Products, “or equal” and submittals",
  lead: "A spec that names one brand can lock in your cost. A spec that allows “or equal” still makes you prove it, on paper, on time.",
  body: `<ul>
<li><strong>Named brand only (sole source):</strong> you must use it. Get a quote from a distributor who carries it.</li>
<li><strong>Named brand “or equal”:</strong> you may propose another product, but the designer or agency decides if it's equal. Price the named product unless you have approval.</li>
<li><strong>Submittals:</strong> product data, samples, plant lists, nursery tags, soil tests. Each takes office time; some take testing fees.</li>
</ul>`,
  ex: `<p>11-428704 SP 20-2.06B(2)(a): controllers “must be Calsense and must have 2-way communication.” Caltrans then lists quoted prices from a named supplier (before tax and delivery), for example a Calsense 40-station base model for controller '97B' at $9,743.66, and in SP 20-2.05B the Calsense FM-2 2" flow sensor at $543.25 each (4 = $2,173.00). Prices “good until April 14, 2022.” You get real material costs, but you must still add tax, delivery and installation.</p>
<p>Submittal timing from the same job: the vendor statement that your plant order was accepted is due at least 60 days before planting (2018 SS 20-3.01A(3)(b)). Manufacturer's instructions for controller modification are due 15 days before installing (SP 20-10.02A(3)).</p>`,
  deeper: `<p>California Public Contract Code §3400 generally bars public agencies from writing specs that limit bidding to one brand unless “or equal” follows. It allows a brand-only spec when the agency makes a finding described in the bid documents, for reasons such as a field test, matching others in use on a public improvement, an item available from only one source, or an emergency. Check the current text on leginfo.legislature.ca.gov.</p>`,
  src: "SP 11-428704 20-2.05B, 20-2.06B(2)(a), 20-10.02A(3); Caltrans 2018 SS 20-3.01A(3)(b); Cal. Public Contract Code §3400."
},

{ h: "Price changers 2 · Soil tests and amendments",
  lead: "Many landscape specs require a lab soil test, then amendments based on the result. At bid time you don't know the result, so you have to price an assumption.",
  body: `<ul>
<li><strong>Agronomic soil test:</strong> an independent lab tests the soil and recommends amendments (organic matter, gypsum, fertilizer, pH correction).</li>
<li><strong>Who pays and when:</strong> some specs make the owner pay for the first test; others put all tests on you.</li>
<li><strong>Amendment rates:</strong> stated in the spec (for example CY per 1,000 SF) or “per the soils report.”</li>
<li><strong>Imported topsoil:</strong> must meet a class or a test; tested before it ships and after placement.</li>
</ul>`,
  ex: `<p><strong>Whitebook 800-1.1.2 (Class “A” topsoil):</strong> submit the source, a physical sample and current independent lab results within 15 working days of the notice to proceed; a second series of tests 15 working days before placement; and more tests after placement. Topsoil that fails “shall not be shipped to the project site.”</p>
<p><strong>11-428704:</strong> compost at 200 CY per acre (PL-1 sequence of work), and SP 21-2.02K sets compost quality limits by lab test methods (pH 6 to 8.5, soluble salts, organic matter, maturity, pathogens, contaminants). Your compost supplier must provide test results that meet them.</p>`,
  watch: `<p>When amendments are “per soils report” and no report exists yet, write your assumption into the proposal: the rate you priced, and that changes from the report will be priced as a change (Module 13).</p>`,
  src: "City of San Diego Whitebook 2024, 800-1.1.2; Plans PL-1 and SP 21-2.02K, contract 11-428704."
},

{ h: "Price changers 3 · Plant quality and inspection",
  lead: "Specs set how good the plants must be and who inspects them. Rejected plants cost you twice: once to buy, again to replace.",
  body: `<ul>
<li>Plants true to name, healthy, not root-bound, from inspected nurseries.</li>
<li>Inspection at the nursery (common on private jobs with specimen trees) or on site before planting.</li>
<li>Root inspection: the inspector knocks plants out of containers to check the roots.</li>
<li>Notice before delivery, tags on plants, nursery invoices as a submittal.</li>
<li>Reference standards such as ANSI Z60.1 (American Standard for Nursery Stock) are common in private specs.</li>
</ul>`,
  ex: `<p><strong>Caltrans 2018 SS 20-3.01A(4):</strong> the Engineer inspects roots by removing earth from the root ball of “not less than 2 plants, nor more than 2 percent of the total number of plants of each species or variety.” If the sample fails, “the entire lot represented by the noncompliant sample plants is rejected.” You must notify the Engineer at least 10 days before plants ship (20-3.01B(1)).</p>
<p><strong>Worked example:</strong> 450 plants of one species. Maximum inspected: 2% × 450 = 9 plants. Minimum: 2. Those plants are pulled apart; order a few extra so you still have 450 to plant.</p>`,
  watch: `<p>Ask your nursery to hold your order and confirm in writing (Caltrans wants a vendor statement 60 days before planting). Plants that are short in the market at planting time get substituted only with approval, which can take weeks.</p>`,
  src: "Caltrans 2018 Standard Specifications 20-3.01A(3)(b), 20-3.01A(4), 20-3.01B(1)."
},

{ h: "Price changers 4 · Establishment, maintenance and warranty",
  lead: "After planting, you keep the job alive for a set period, then the owner accepts it. The length and the success rules decide the cost.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Spec</th><th>Period</th><th>Key rules</th></tr></thead>
<tbody>
<tr><td>Caltrans (11-428704)</td><td>Type 1, 250 working days</td><td>Starts after all other work is done. Days you don't do adequate work aren't credited. Seasonal watering schedules, fertilizer 1st week of April, July, September.</td></tr>
<tr><td>Whitebook 801-6</td><td>90 calendar days (plants, sod); 120 (seed or stolon lawns), unless the contract says otherwise</td><td>Weekly maintenance; fertilize every 4 weeks; 100% container plant survival; zero weed cover; replace unhealthy plants within 2 weeks; PEP extended if criteria not met</td></tr>
<tr><td>Private (project manual)</td><td>Varies: read 32 93 00 Part 1 and any maintenance section</td><td>Maintenance period, then a warranty period with plant replacement</td></tr>
</tbody></table></div>`,
  ex: `<p>The six bidders on 11-428704 priced plant establishment from $10,000 to $300,000 (Module 15). Same spec, same 250 working days. The difference was how each one read the spec.</p>`,
  watch: `<p>The Whitebook says if the plant establishment period ends before the City's final acceptance, you keep maintaining until final acceptance. A late GC or another trade can stretch your maintenance with no extra pay unless your contract says otherwise.</p>`,
  deeper: `<p>Caltrans 2018 SS 20-4.01B defines Type 1 (starts after all work except establishment is complete) and Type 2 (starts after planting is complete; the contract isn't accepted until the establishment work has been done for the required days). 20-4.01A: working days when you fail to do adequate establishment work are not credited, and days with unauthorized manual irrigation aren't credited either.</p>`,
  src: "SP 11-428704 20-4.01A, 20-4.01C(1), 20-4.03C; Caltrans 2018 SS 20-4.01; City of San Diego Whitebook 2024, 801-6."
},

{ h: "Price changers 5 · Tests, as-builts, programming and extra stock",
  lead: "The last 5% of the job is mostly paperwork and small items. The spec lists every one, and each takes time or money.",
  body: `<ul>
<li><strong>Tests and inspections:</strong> pressure tests, coverage tests, backflow certification, pre-maintenance inspection, final inspection.</li>
<li><strong>As-builts / record drawings:</strong> a marked-up set kept current during the job, sometimes redrawn in CAD at the end. The Whitebook (3-7.3) requires red-lines kept current on a full-size set.</li>
<li><strong>Controller programming and charts:</strong> watering schedules, laminated zone charts in the controller, central-control setup.</li>
<li><strong>Training:</strong> Caltrans 20-4.01D requires training on the controllers “no more than 30 days before completion of the plant establishment period.”</li>
<li><strong>Extra stock:</strong> spare heads, nozzles, valve keys and controller keys turned over at the end.</li>
</ul>`,
  ex: `<p><strong>Worked example · Whitebook 800-2.5, extra equipment.</strong> The spec requires “Five (5) irrigation heads with nozzles of each type used for every 100 irrigation heads or portions thereof.” Your City job has 340 spray heads of one type and 85 rotors of another.</p>
<ul>
<li>Sprays: 340 ÷ 100 = 3.4, and “portions thereof” rounds up to 4. 4 × 5 = <strong>20 extra spray heads</strong>.</li>
<li>Rotors: 85 is one portion of 100. 1 × 5 = <strong>5 extra rotors</strong>.</li>
</ul>
<p>Plus 2 sets of special tools per head and valve type, valve keys and 2 sets of keys for each controller. Add them to your material list.</p>`,
  src: "City of San Diego Whitebook 2024, 800-2.5, 3-7.3; Caltrans 2018 SS 20-4.01D."
},

{ h: "Price changers 6 · Water use, MWELO and recycled water",
  lead: "California's water-efficient landscape rules shape the design, and they add paperwork at the end that the installer often has to deliver.",
  body: `<ul>
<li><strong>MWELO</strong> (Model Water Efficient Landscape Ordinance, California Code of Regulations, Title 23) applies to new landscapes of 500 SF or more and rehabilitated landscapes of 2,500 SF or more that need a permit, plan check or design review. Cities and counties can adopt their own ordinance if it is at least as effective in saving water.</li>
<li>For non-residential landscapes the water budget uses an evapotranspiration adjustment factor (ETAF) of 0.45 or less (0.55 for residential).</li>
<li>At the end, the project files a <strong>Certificate of Completion</strong>, which includes an irrigation audit report and proof that the soil report recommendations were carried out. The spec may make you responsible for the audit, the soil work, or both.</li>
<li><strong>Recycled water:</strong> purple pipe and parts, warning signs and tape, cross-connection testing, and no overspray or runoff, enforced locally by San Diego County DEH and the water agency.</li>
</ul>`,
  ex: `<p>11-428704 is a recycled-water job: ISS-1 note 3 requires purple or labeled equipment per DEH rules, ID-6 shows the recycled water warning sign (English and Spanish) and tape, and the mains test at 150 psi.</p>`,
  watch: `<p>MWELO was amended in 2025 and its section numbers changed. Check the current state text and the local agency's ordinance on each project. Don't rely on an old checklist.</p>`,

{ h: "A small rule with a big cost: weed germination",
  lead: "One sentence in a spec can add weeks to your schedule and days of crew time. Here's a real one.",
  body: `<p><strong>11-428704 SP 20-1.03E:</strong> “Do not perform planting work in weed germination areas for a period of 21 days after irrigation systems have been installed. For weed germination areas, keep the soil sufficiently moist to germinate weeds. Weeds that germinate must be controlled by the use of pesticides.”</p>
<ul>
<li><strong>Schedule:</strong> planting can't start in those areas until three weeks after the irrigation is done there.</li>
<li><strong>Water:</strong> you run the new system for 21 days with nothing planted.</li>
<li><strong>Labor and materials:</strong> a pesticide application after the weeds come up, using herbicides from the job's approved list in SP 20-1.02C.</li>
<li><strong>Sequence on PL-1:</strong> irrigation → weed germination → compost → planting → wood mulch.</li>
</ul>`,
  ex: `<p><strong>Example numbers for practice (use your own costs).</strong> If a 2-person spray crew costs you $120 per hour and treating the germination areas takes 2 days of 8 hours, that's 2 × 8 × $120 = <strong>$1,920</strong>, plus herbicide, plus site visits to check moisture during the 21 days. If you planned to plant the week after irrigation, your schedule just moved three weeks.</p>`,
  watch: `<p>Lines like this hide in the middle of long sections. Search the whole spec for words like “days,” “before,” “after,” “not until” and “notify.” Each one is a schedule rule.</p>`,

},

{ h: "What a takeoff is, and why it comes before pricing",
  lead: "A takeoff answers one question: how much of each thing is on this job? Price comes later, in a separate step.",
  body: `<ol class="steps">
<li class="hl"><div><b>Takeoff</b>Count and measure every item on the plans. Output: a list of items, units and quantities. No dollars yet.</div></li>
<li><div><b>Pricing</b>Put material, labor and equipment costs on each quantity (Modules 8 and 9).</div></li>
<li><div><b>Markup and final number</b>Add overhead and profit (Module 10).</div></li>
</ol>
<div class="twocol">
<div><h3>Why keep them apart</h3><ul>
<li>You can check a takeoff by itself. Another person can recount it.</li>
<li>When a supplier price changes, you change the price, not the counts.</li>
<li>When an addendum changes the plans, you change the counts, not the prices.</li>
<li>The same takeoff feeds your supplier quote requests.</li>
</ul></div>
<div><h3>What goes into a takeoff</h3><ul>
<li>Every item, with a clear name (size, type, class)</li>
<li>A unit: EA, LF, SF, CY, LS</li>
<li>A quantity, and where it came from (sheet number)</li>
<li>Notes: “by others,” “not paid separately,” “verify”</li>
</ul></div>
</div>`,
  watch: `<p>Don't mix guesses into the counts. If you think the plans are missing something, take off what's shown and add a separate line marked “allowance” or “not shown, added by estimator.” Mixed-up numbers can't be checked later.</p>`
},

{ h: "Set up before you count",
  lead: "Twenty minutes of setup saves hours of recounting. Know the sheets, learn the legend and check the scale before you count a single head.",
  body: `<ol class="steps">
<li><div><b>Make a sheet list</b>Write down every irrigation sheet, its number and what's on it: plans, legend, details, notes, quantity tables. Note the latest revision date on each.</div></li>
<li><div><b>Read the legend first</b>Copy every symbol into your takeoff as a line item before you count. If a symbol is on the legend, it gets a line, even if you end up with zero.</div></li>
<li class="hl"><div><b>Check the scale</b>Find the scale on each sheet. Measure something with a known length (a dimension or the graphic scale bar) to make sure your print or PDF is true to scale.</div></li>
<li><div><b>Pick a color code</b>One color per item type, the same on every job. Example: heads green, valves red, mainline blue, laterals by size, sleeves orange.</div></li>
<li><div><b>Mark as you go</b>Every symbol you count gets a check mark or a dot. Every pipe run you measure gets highlighted. When you're done, anything without a mark was missed.</div></li>
<li><div><b>Read the notes and details</b>Notes like “all unmarked laterals are 1 inch” change your pipe totals.</div></li>
</ol>`,

{ h: "Counting heads",

  body: `<ul>

<li><strong>Bubblers count per tree or per shrub.</strong> Read the detail. A tree detail may show 2, 3 or 4 bubblers per tree.</li>

{ h: "Measuring pipe: main, lateral, size and class",
  lead: "Pipe is taken off in linear feet, split by three things: mainline or lateral, pipe size, and pipe class.",
  body: `<div class="twocol">
<div><h3>Mainline</h3><ul>
<li>Always under pressure, from the POC to the valves</li>
<li>Usually heavier pipe and deeper trench</li>
<li>Often Class 315 or Schedule 40, gasketed on large sizes</li>
<li>Caltrans calls it “supply line, main supply side of control valve”</li>
</ul></div>
<div><h3>Laterals</h3><ul>
<li>Downstream of each valve, only pressurized when the zone runs</li>
<li>Usually lighter pipe and shallower trench</li>
<li>Often Class 200 or Schedule 40, depending on the spec</li>
<li>Caltrans calls it “supply line, lateral supply side”</li>
</ul></div>
</div>
<ol class="steps">
<li><div><b>Measure each size separately</b>Follow the line from fitting to fitting. Write each run's length next to it on the plan.</div></li>
<li><div><b>Use the sizing notes</b>Unlabeled pipe takes the default size from the notes or the sizing chart.</div></li>
<li class="hl"><div><b>Add the vertical pieces the plan can't show</b>Risers at valves and POC, depth changes at sleeves. A short allowance per valve is a common practice.</div></li>
<li><div><b>Total by size and class</b>One line each: 1" Class 200 lateral, 2" Schedule 40 main, and so on.</div></li>
</ol>`,
  deeper: `<p>Schedule 40 PVC (ASTM D1785) has a set wall thickness for each size, so its pressure rating goes down as the pipe gets bigger. Class pipe (ASTM D2241) is rated by pressure: Class 200 is SDR 21 and Class 315 is SDR 13.5, and the rating stays the same at every size. That's why specs often call Schedule 40 for small pipe and Class 315 for large mains. Read your job's spec section 32 80 00 for what it requires.</p>`,
  watch: `<p>Don't put two pipe classes on one line. On 11-428704, 2" pipe was Schedule 40 and 3" and 4" were Class 315. They are different bid items with different prices.</p>`
},

{ h: "Sleeves, conduits and boring",
  lead: "Every place pipe or wire crosses under paving needs a sleeve or a bore. These are short runs with big costs.",
  body: `<ul>
<li><strong>Sleeves</strong> are larger pipes laid under paving before it's poured, so pipe and wire can be pulled through later. Take them off by size and LF. A common practice is one sleeve for pipe and a separate one for wire.</li>
<li><strong>Length:</strong> paving width plus the extension past each edge that the detail calls for.</li>
<li><strong>Who installs them:</strong> on new construction, sleeves often go in before the GC paves. Note the timing, because it may mean an extra trip.</li>
<li><strong>Boring or jacking</strong> is used where paving already exists and can't be cut. Take it off as LF of bore by size, and get a sub quote if you don't own a boring machine.</li>
</ul>`,
  ex: `<p>Real example: sheet IQ-2 of 11-428704 lists seven conduit crossings under ramps:</p>
<div class="tablewrap"><table>
<thead><tr><th>Conduit</th><th class="num">IQ-2 total</th><th class="num">Bid item</th></tr></thead>
<tbody>
<tr><td>8" and 10" PVC pipe conduit (170 + 112)</td><td class="num">282 LF</td><td class="num">290 LF (item 66)</td></tr>
<tr><td>10" CHDPE pipe conduit</td><td class="num">366 LF</td><td class="num">370 LF (item 67)</td></tr>
<tr><td>4" Class 315 main inside the conduits</td><td class="num">648 LF</td><td class="num">included in item 63</td></tr>
</tbody></table></div>
<p>The 2" electrical conduits and pavement markers on IQ-2 are marked “(N)”: not a separate pay item. The winning bidder listed a boring subcontractor for 54% of the PVC pipe conduit item (item 66), “boring only.”</p>`,
  src: "11-428704 plans IQ-2; Bid Items 63, 66, 67; Bid Summary subcontractor list."
},

{ h: "Wire: conventional and two-wire",
  lead: "Wire is measured in LF, but the way you measure depends on the control system.",
  body: `<div class="twocol">
<div><h3>Conventional (multi-wire)</h3><ul>
<li>One control wire from the controller to each valve, plus a common wire</li>
<li>Control wire LF = add the distance from the controller to each valve, along the trench</li>
<li>Common wire LF = length of the route to the farthest valve on each branch</li>
<li>Spare wires if the spec asks for them (often to the farthest valve)</li>
<li>Add slack at every valve and splice box</li>
</ul></div>
<div><h3>Two-wire (decoder)</h3><ul>
<li>One two-wire cable runs past every valve</li>
<li>Cable LF = the length of the path, usually along the mainline</li>
<li>Count a decoder for each valve (or each group of valves on one decoder)</li>
<li>Count surge arrestors and ground rods the detail shows</li>
<li>Count splice kits at every connection</li>
</ul></div>
</div>`,
  ex: `<p>Real example: on 11-428704, wire was one lump sum item (“Control and neutral conductors”). The two-wire POC decoder and ground rod at the master valve were marked “(N)”, not a separate bid item. The specs listed a supplier price for the decoder and 1,000 ft of two-wire cable. (Module 15 shows those prices.)</p>`,
  watch: `<p>Wire usually runs in the mainline trench, so it adds little trench. Where a wire run leaves the mainline to reach a valve, that piece of trench is extra. Don't forget wire inside sleeves under paving.</p>`
},

{ h: "Trenching by depth",
  lead: "You price trench, not just pipe. Take off trench in LF by depth, because a deeper trench costs more per foot.",
  body: `<ol class="steps">
<li><div><b>Find the depth for each line</b>The installation detail or spec gives the cover over mainline, laterals and wire. Mainline is normally deeper.</div></li>
<li class="hl"><div><b>One trench line per depth</b>Example: mainline trench (deeper), lateral trench (shallower), drip header trench.</div></li>
<li><div><b>Don't double count shared trench</b>Where a lateral runs in the same trench as the main, count the trench once, at the deeper depth.</div></li>
<li><div><b>Take out sleeved and bored lengths</b>Pipe in a sleeve under paving isn't trenched by your crew in the usual way.</div></li>
<li><div><b>Note the conditions</b>Rock, roots, existing utilities, slopes, and hand-dig zones near trees all slow production. Note them now; you'll price them in Module 9.</div></li>
</ol>`,
  ex: `<p>Real example: the 11-428704 irrigation plan IP-7 has a note to “locate irrigation supply line to minimize trenching within the drip line of existing trees.” That's a hand-dig or careful-routing condition. Mark those stretches on your takeoff.</p>`,
  watch: `<p>Freeway, school and city jobs often have existing utilities everywhere. On 11-428704, the U sheets showed gas, sewer, telecom and Otay Water District lines near the new main. Trench near utilities means potholing and hand digging.</p>`
},

{ h: "Fittings and waste: pick a method and stick with it",
  lead: "Plans don't show most fittings, and pipe never installs at exactly the measured length. Estimators handle both with a method they trust, built from their own past jobs.",
  body: `<div class="twocol">
<div><h3>Fittings method A: assemblies</h3><ul>
<li>Price each device as an assembly: the head plus its swing joint, tee and nipples</li>
<li>Each valve assembly: valve, fittings, box, gravel, wire connectors</li>
<li>Pipe fittings at turns and branches: count tees and ells where the plan shows them</li>
<li>More work to build, but follows the plans closely</li>
</ul></div>
<div><h3>Fittings method B: percent allowance</h3><ul>
<li>Add a percent of the pipe material cost for fittings and glue</li>
<li>Different percents for laterals (many fittings) and mainline (fewer)</li>
<li>Fast, but only as good as the data behind it</li>
<li>Check it against supplier invoices on finished jobs</li>
</ul></div>
</div>
<div class="tablewrap"><table>
<thead><tr><th>Item</th><th>Example waste allowance (practice numbers, set yours from your own jobs)</th></tr></thead>
<tbody>
<tr><td>PVC pipe</td><td>About 5%: cut-offs, bad ends, small field changes</td></tr>
<tr><td>Wire</td><td>About 10%: slack at valves and splices</td></tr>
<tr><td>Drip tubing</td><td>About 10%: bed edges and loops</td></tr>
<tr><td>Heads, valves, controllers</td><td>None: count exactly</td></tr>
</tbody></table></div>`,
  watch: `<p>Keep waste and fittings out of the measured quantity. Show the net quantity in one column and the allowance in another. On a unit-price public bid you're paid for the bid or measured quantity of pipe, never for your cut-offs, so fittings and waste have to be built into the unit price.</p>`,
  deeper: `<p>The percentages above are example numbers for practice. Your real numbers come from comparing what you bought on finished jobs (supplier invoices) to what the plans showed. Module 9 covers checking estimates against finished jobs.</p>`
},

{ h: "Drip zones",
  lead: "Drip areas are usually drawn as shaded zones. You measure the area, then turn it into feet of tubing and number of emitters.",
  body: `<ol class="steps">
<li><div><b>Measure the drip area in SF</b>For each drip zone, from the plan.</div></li>
<li class="hl"><div><b>Tubing LF = area (SF) ÷ row spacing (ft)</b>Rows 18" apart means 1.5 ft. Rows 12" apart means 1.0 ft.</div></li>
<li><div><b>Emitters = tubing LF ÷ emitter spacing (ft)</b>For inline tubing, emitters come built in; you count them to check flow.</div></li>
<li><div><b>Add headers and footers</b>The PVC or blank tubing that feeds and connects the rows, measured as LF.</div></li>
<li><div><b>Count the parts the detail shows</b>Flush valves, air relief valves, operation indicators, staples, connectors.</div></li>
<li><div><b>For point-source drip</b>Count emitters per plant by plant size, using the detail (example: 2 emitters per 1-gallon, 4 per 15-gallon).</div></li>
</ol>`,
  ex: `<p><strong>Worked math (made-up example):</strong> a 1,050 SF drip zone with inline tubing, 0.6 GPH emitters at 12" spacing, rows 18" apart.</p>
<ul>
<li>Tubing: 1,050 SF ÷ 1.5 ft = <strong>700 LF</strong></li>
<li>Emitters: 700 LF ÷ 1.0 ft = <strong>700 emitters</strong></li>
<li>Flow check: 700 × 0.6 GPH = 420 GPH. 420 ÷ 60 = <strong>7 GPM</strong> for this zone.</li>
</ul>`,
  watch: `<p>Check that the flow you calculate fits the valve and drip kit size on the plan. If your math says 15 GPM and the drawing shows a low-flow drip kit, something is off: either your area or the design. Ask before you bid.</p>`
},

{ h: "Thrust blocks, testing and work nobody pays for separately",
  lead: "Some work has no symbol and no bid item, but it still takes labor and material. List it in your takeoff so it gets priced.",
  body: `<ul>
<li><strong>Thrust blocks:</strong> concrete at tees, bends, reducers and dead ends on gasketed mainline. Count them from the fittings on the mainline and the detail. Glued pipe in small sizes often doesn't need them; read the spec.</li>
<li><strong>Pressure testing:</strong> the spec sets the test pressure and time. Count tests by mainline section if the main will be built in stages.</li>
<li><strong>Coverage test and flushing:</strong> one line, LS.</li>
<li><strong>Warning tape, tracer wire, ID tags:</strong> LF along the mainline.</li>
<li><strong>Programming, as-builts, controller charts:</strong> LS.</li>
<li><strong>Recycled water labels and signs:</strong> per the plans and local rules.</li>
</ul>`,
  ex: `<p>Real example: on 11-428704, thrust blocks, warning tape, the two-wire decoder, ground rods and pavement markers were all marked “(N)”: no separate payment. The recycled water mains were pressure tested at 150 psi. You put the cost of these into the paid items they belong to, usually the 4" main.</p>`,
  watch: `<p>“Not separately paid” is about how you get paid. Take off the quantity anyway. If you skip the count, you'll skip the cost.</p>`,
  src: "11-428704 plans ISS-1, IQ-1, IQ-2; Special Provisions 20-2 (pressure testing modified to 150 psi)."
},

{ h: "Organizing the takeoff spreadsheet",
  lead: "Organize the same quantities two ways: by system (controller or POC) so you can check them, and by bid item so you can price them.",
  body: `<div class="twocol">
<div><h3>Tab 1: by system</h3><ul>
<li>Rows for each controller, then each valve under it</li>
<li>Columns for heads by type, pipe by size, drip SF</li>
<li>Lets you check: does each zone's flow fit its valve?</li>
<li>Matches the way the plans and Caltrans lateral tables are laid out</li>
</ul></div>
<div><h3>Tab 2: by bid item</h3><ul>
<li>One row per bid item or per line in your price list</li>
<li>Columns: item, description, unit, net quantity, waste %, order quantity, source sheets, notes</li>
<li>Totals pulled from Tab 1 with formulas</li>
<li>This is the tab that goes to pricing</li>
</ul></div>
</div>
<ol class="steps">
<li><div><b>Keep a source column</b>Sheet number for every quantity, so anyone can find it.</div></li>
<li><div><b>Keep a notes column</b>“(N) not paid,” “by others,” “verify with RFI.”</div></li>
<li class="hl"><div><b>Freeze the takeoff before pricing</b>Save a dated copy. Changes after that go in an addendum or revision column.</div></li>
</ol>`,
  ex: `<p>Caltrans does exactly this on 11-428704. Sheet IQ-1 has a lateral table organized by controller and valve number (97A-1, 97A-2, …) and a main supply table organized by plan sheet (IP-1 to IP-7). The totals at the bottom feed the bid items.</p>`
},

{ h: "Check your takeoff against the engineer's table",

<tbody><tr><td class="num">440</td><td class="num">1,365</td><td class="num">1,210</td><td class="num">165</td><td class="num">1,150</td><td class="num">1,385</td><td class="num">1,130</td><td class="num">648</td><td class="num"><strong>7,493</strong></td></tr></tbody></table></div>

<div class="tablewrap"><table><thead><tr><th>Size</th><th class="num">IQ-1</th><th class="num">Bid item</th></tr></thead>

<p>Every pipe item on this job (items 57–63) is marked <strong>(F)</strong>, final pay: you're paid the bid quantity, so these match the plan tables exactly. Your own takeoff of the main tells you whether 7,493 LF is really enough pipe for the price you put on it.</p>
