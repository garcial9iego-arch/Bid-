{ h: "Listing subcontractors: the Fair Practices Act",
  lead: "California's Subletting and Subcontracting Fair Practices Act makes a prime list its subs with the bid. It protects subs from bid shopping after award.",
  body: `<ul>
<li><strong>Who must be listed:</strong> every sub doing work over <strong>one-half of 1%</strong> of the prime's total bid. On streets and highways (including bridges), over one-half of 1% or <strong>$10,000, whichever is greater</strong>.</li>
<li><strong>What to list:</strong> name, location, CSLB license number, DIR registration number, and the portion of work. Many agencies also ask for the dollar value and certification (SLBE, DBE).</li>
<li><strong>One sub per portion.</strong> Two subs listed for the same work, or none, means the prime must do that work itself.</li>
<li><strong>Substitution after award</strong> only with the agency's consent and for reasons in the law, like the listed sub refusing to sign.</li>
<li>Breaking the Act can cost the prime the contract or a penalty up to 10% of the subcontract.</li>
</ul>`,
  ex: `<p><strong>Worked threshold math:</strong> ACCU's 11-428704 bid was $1,176,120.00. One-half of 1% = $1,176,120 × 0.005 = $5,880.60. It's a highway job, so the greater number, <strong>$10,000</strong>, sets the line. On the City EMTS job (estimate $1,600,000), 0.5% is $8,000. The City's instructions say list over 0.5%; its general provisions say over 0.5% or $10,000, whichever is greater. When the package isn't consistent, list every sub over the lower number.</p>`,
  watch: `<p>The City also requires the prime to self-perform at least 50% of the base bid (EMTS job). Check the self-performance rule before you plan to sub out large parts of a prime bid.</p>`,
  deeper: `<ul>
<li>PCC §4104: listing rule. A wrong license or DIR number can be corrected within 24 hours after opening if it matches the listed name.</li>
<li>PCC §4106: not listing means you do the work. §4107: substitution. §4107.5: claimed clerical error in listing, written notice within 2 working days. §4110: penalties. §4111: CSLB discipline.</li>
<li>A sub listed while not DIR-registered can be fixed if it registers (and pays the penalty) within 24 hours after opening, or is replaced under §4107.</li>
</ul>`,
  src: "Cal. Public Contract Code §§4100–4114 (esp. 4104, 4106, 4107, 4107.5, 4110, 4111); City of San Diego K-24-1952 Instructions §12, Attachment C §G, SSP 3-2, Attachment D §1.9.1."
},

{ h: "SLBE, ELBE and DBE: what's due when",
  lead: "Participation goals are judged partly at bid time and partly in the days after. Miss a deadline and the bid can be thrown out.",
  body: `<div class="twocol">
<div><h3>City of San Diego · SLBE/ELBE</h3><ul>
<li>EMTS job: mandatory 20% total (9.4% SLBE + 10.6% ELBE recommended).</li>
<li>List certified subs and suppliers at bid time. Firms must be certified by the bid due date.</li>
<li>Suppliers count at 60% of their dollar value unless they manufacture; mark which.</li>
<li>Short of the goal: Good Faith Effort file and Form AA60, searchable PDF, by 5 PM, 3 working days after opening.</li>
</ul></div>
<div><h3>Caltrans · DBE (federal-aid)</h3><ul>
<li>11-428704: 14% DBE goal.</li>
<li>DBE Commitment, Confirmations, quotes and any Good Faith Efforts file due by 4:00 PM on the 5th day after opening.</li>
<li>Check that each DBE is certified for the work it will do.</li>
<li>Late = non-responsive. It happened to the low bidder on 11-428704.</li>
</ul></div>
</div>`,
  ex: `<p>As a landscape sub, your certification status is part of your price. On the EMTS job the prime, HSCC, listed a landscape company, Coast Landscaping, among its subs. If your company is SLBE or ELBE certified, say so on every quote to a City prime.</p>`,
  watch: `<p>Start outreach the week you decide to bid. A Good Faith Effort file built on bid day looks like what it is.</p>`,
  src: "City of San Diego K-24-1952 Notice Inviting Bids §7, Instructions §12.2, Required Documents Schedule; K-26-2396; Caltrans 11-428704 Notice to Bidders and Bid Summary (see Module 15, Step 8)."
},

{ h: "The two weeks before bid day",
  lead: "Bid day goes smoothly only if the slow work is done by the day before.",
  body: `<ol class="steps">
<li><div><b>Questions in early</b>The City may not consider questions received less than 14 days before bid opening. Caltrans requires questions about unclear plans before opening. Module 12 covers RFIs.</div></li>
<li><div><b>Addenda log</b>Check the portal every day. Note each addendum number and what it changed.</div></li>
<li class="hl"><div><b>Request the bid bond</b>Send the surety the bid date, agency, project and your expected amount, at least several business days ahead.</div></li>
<li><div><b>Sub and supplier outreach</b>Send scope sheets, collect written quotes, and log SLBE/DBE contacts.</div></li>
<li><div><b>Pre-fill everything that isn't price</b>Company info, license and DIR numbers, certifications, sub list names and numbers.</div></li>
<li><div><b>Finish your own takeoff and labor</b>So bid day is for sub numbers and checking, not counting heads.</div></li>
<li><div><b>Book the people</b>Who prices, who checks, who submits, who signs. Have a backup computer and internet connection.</div></li>
</ol>`
},

{ h: "Bid day, hour by hour",
  lead: "A plan for a bid due at 2:00 PM. Adjust the times to your bid, but keep the order.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>When</th><th>What</th></tr></thead>
<tbody>
<tr><td>Day before, by 3 PM</td><td>All your own pricing done. Bond in hand or confirmed. Forms pre-filled. Final check for addenda.</td></tr>
<tr><td>Day before, by 5 PM</td><td>Call every sub and supplier: “Are we getting your number? By what time?”</td></tr>
<tr><td>Bid day, 7:00 AM</td><td>Check the portal for a late addendum. Log in to PlanetBids or Bid Express and make sure the digital ID works.</td></tr>
<tr><td>8:00–11:00 AM</td><td>Quotes come in. Level each one against your scope sheet. Enter them in the estimate.</td></tr>
<tr><td>11:00 AM</td><td>Decide on any missing quotes: plug a number or self-perform. Run markup and the total.</td></tr>
<tr><td>11:30 AM–12:15 PM</td><td>Late quotes. Final sub choices. Fill in the sub list with license and DIR numbers. Check SLBE/DBE totals.</td></tr>
<tr><td>12:15–12:45 PM</td><td>Enter prices into the bid form. A second person checks every unit price and extension.</td></tr>
<tr><td>12:45–1:00 PM</td><td>Owner's final review of the total. Sign.</td></tr>
<tr><td>By 1:00–1:15 PM</td><td><strong>Submit.</strong> Save the confirmation and screenshots.</td></tr>
<tr><td>1:15–1:55 PM</td><td>Only change the bid if a real error turns up. Resubmit and confirm again.</td></tr>
<tr><td>2:00 PM</td><td>Deadline. Watch the opening.</td></tr>
</tbody></table></div>`,
  watch: `<p>Never plan to submit in the last 15 minutes. Slow uploads, a required field the system won't skip, or an expired login can each eat 20 minutes.</p>`
},

{ h: "Last-minute quotes and plugs",
  lead: "Most sub and supplier prices arrive in the last few hours. Your job is to compare them fairly and fast.",
  body: `<ul>
<li><strong>Level every quote.</strong> Use the scope sheet from Module 13. Does it include the backflow, the pad, tax, freight, bonds, prevailing wage, traffic control? Add the missing pieces to the lower quote before you compare.</li>
<li><strong>Watch exclusions.</strong> A cheap quote with “excludes recycled-water signage” isn't cheap.</li>
<li><strong>Plug when you must.</strong> If a needed quote never comes, carry a plug number based on your own pricing or past bids, and mark it in the estimate. Then you must either do the work yourself or find a sub at that price after award without breaking the listing rules.</li>
<li><strong>Listing decides who you're stuck with.</strong> Once listed, you can't swap a sub just because someone cheaper calls after the bid.</li>
<li><strong>Quoting to several primes is allowed.</strong> As a sub you may quote every prime on the planholders list.</li>
</ul>`,
  ex: `<p>At 12:20 PM a traffic control sub quotes $38,000, $9,000 under the one you planned to use. Their quote excludes the attenuator truck the specs require every closure. Add it back and compare again before you change the sub list.</p>`,
  watch: `<p>A plug over the listing threshold, with no sub listed, means you're telling the agency you'll do that work with your own forces.</p>`,
  src: "Cal. Public Contract Code §4106; City of San Diego K-24-1952 Instructions §17."
},

{ h: "Math checks before you hit submit",
  lead: "Most bid disasters are arithmetic. Two people, two methods, every time.",
  body: `<ol class="steps">
<li><div><b>Check each extension</b>Unit price × quantity = item total, to the cent.</div></li>
<li><div><b>Check the quantities</b>Did you use the addendum quantities? (11-428704's Addendum 1 changed three items.)</div></li>
<li class="hl"><div><b>Add the total two ways</b>The bid form's total and your estimate summary must match exactly.</div></li>
<li><div><b>Look for decimal slips</b>Sort items by total. A $4,958 iceplant line next to a $35,000 establishment line is a red flag.</div></li>
<li><div><b>Check against the engineer's estimate and history</b>A total far from the estimate or from past bid results means look again (Module 15).</div></li>
<li><div><b>Every line priced</b>A blank unit price can make the bid non-responsive.</div></li>
</ol>`,
  ex: `<p><strong>Worked check:</strong> 4" main, 7,493 LF at $12.00 = $89,916.00. If the form shows $8,991.60, the decimal moved, and under Caltrans's rule the unit price you typed is what counts. Fix the unit price as well as the total.</p>`,
  watch: `<p>Don't build a big markup into one item and almost none into others unless you understand the risk. Read what the package says about unbalanced bids; some agencies reserve the right to reject them. Module 15 shows how real bidders moved money between items.</p>`
},

{ h: "Submitting early and confirming receipt",
  lead: "A bid isn't in until the agency's system says it is. Get proof.",
  body: `<ul>
<li><strong>PlanetBids:</strong> the system won't accept a bid missing any required field, price, sub list or upload. After you submit, check the bid status and save the confirmation.</li>
<li><strong>Bid Express:</strong> wait for the Bid Submittal Receipt email. Save it.</li>
<li><strong>Paper:</strong> hand-deliver early; get the clerk's time stamp. The agency's clock is the one that counts.</li>
<li><strong>Changes:</strong> before the deadline you can change, withdraw or resubmit. Each time, confirm the new version is the one received.</li>
<li><strong>Keep a bid-day file:</strong> final estimate, quotes received with times, screenshots, confirmation, bond.</li>
</ul>`,
  watch: `<p>If the system won't let you submit, don't keep retrying until 1:59 PM. Call the help desk right away (Bid Express and PlanetBids both have one) and note who you talked to and when.</p>`,
  src: "City of San Diego K-24-1952 Instructions §§2.3–2.7; Caltrans Electronic Bidding Guide."
},

{ h: "The bid opening and reading results",
  lead: "Right after the deadline, prices become public. The lowest number on the screen is the apparent low bidder. The agency still has to check that bid before anyone wins.",
  body: `<ul>
<li><strong>City of San Diego:</strong> once the deadline passes, bidders and the public can see results online in PlanetBids. That posting is the public announcement of the apparent low bidder.</li>
<li><strong>Caltrans:</strong> bids are opened and read through a webcast right after the deadline. Caltrans later posts a Bid Summary with every bidder's prices and subs.</li>
<li><strong>Then the agency checks:</strong> responsive (followed every rule and form) and responsible (licensed, qualified, able to do the work). The award goes to the lowest responsive, responsible bidder.</li>
</ul>
<div class="twocol">
<div><h3>If you're apparent low</h3><ul>
<li>Recheck your math today</li>
<li>Get the post-bid items in early</li>
<li>Call your surety about final bonds</li>
<li>Confirm subs and their DIR registration</li>
</ul></div>
<div><h3>If you're 2nd or 3rd</h3><ul>
<li>Stay ready: low bidders get rejected</li>
<li>Keep your bond and quotes alive</li>
<li>Watch the agency's notices</li>
<li>Download the bid tab</li>
</ul></div>
</div>`,
  src: "City of San Diego K-24-1952 Instructions §§2.5, 21; Caltrans 11-428704 Notice to Bidders."
},

{ h: "After the bid: the deadlines that follow",
  lead: "Several requirements are due in the first days after opening. Put them on the calendar before bid day.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>When after opening</th><th>City of San Diego (EMTS)</th><th>Caltrans (11-428704)</th></tr></thead>
<tbody>
<tr><td>24 hours</td><td>Fix a listed sub's license or DIR number; an unregistered listed sub can register and pay the penalty</td><td>Same state rules</td></tr>
<tr><td>1 working day, 5 PM</td><td>Original bid bond delivered</td><td></td></tr>
<tr><td>2 working days</td><td>Notice of a clerical error in listing a sub (PCC §4107.5)</td><td>Same</td></tr>
<tr><td>3 working days, 5 PM</td><td>SLBE Good Faith Effort file and AA60; bidder's notice of a clerical mistake in the bid</td><td></td></tr>
<tr><td>5th day, 4 PM</td><td></td><td>DBE Commitment, Confirmations and Good Faith Efforts</td></tr>
<tr><td>5 working days</td><td>State law deadline for a bid mistake notice (PCC §5103)</td><td>Same</td></tr>
<tr><td>10 days</td><td></td><td>Copies of the bid and sub list showing DIR numbers</td></tr>
<tr><td>After contract forms arrive</td><td>Bonds, insurance, signed contract, other-tier sub list (10 working days in the schedule)</td><td>Bonds and insurance before approval</td></tr>
</tbody></table></div>`,
  watch: `<p>On 11-428704 the lowest bid, Marina Landscape at $1,106,287.75, was rated non-responsive: “LATE DBE/DVBE SUBMITTAL.” The job went to ACCU at $1,176,120.00. A missed post-bid deadline cost the low bidder the job.</p>`,
  src: "City of San Diego K-24-1952 Required Documents Schedule and Attachment D §1.9.1; Cal. Public Contract Code §§4104, 4107.5, 5103; Caltrans 11-428704 Bid Summary (Module 15)."
},

{ h: "Bid mistakes: can you get out?",
  lead: "Only for a clerical mistake, proven fast. A bad judgment call or a missed spec is yours to keep.",
  body: `<p>California's relief rules (Public Contract Code §§5100–5110) let a bidder be released only if:</p>
<ul>
<li>It gives the agency <strong>written notice within 5 working days</strong> after opening, explaining in detail how the mistake happened.</li>
<li>The mistake made the bid <strong>materially different</strong> from what it meant to bid.</li>
<li>The mistake was in <strong>filling out the bid</strong>, not an error in judgment or carelessness in reading the plans, specs or site.</li>
</ul>
<p>If the agency won't release you, the bid stands, or you forfeit the bid bond and can sue to recover it. A bidder who claims a mistake can't bid that project again.</p>`,
  ex: `<p>The City's 2023 and 2026 instructions are tighter: written notice within <strong>3 working days</strong> of opening, with proof of “honest, credible, clerical error of a material nature” and of “reasonable care” in preparing the bid. Follow the shorter deadline in the package.</p>`,
  watch: `<p>“We forgot the traffic control” is a judgment error, not a clerical one. Relief is for things like a total copied wrong from your own worksheet. Keep your worksheets: they're your proof.</p>`,
  src: "Cal. Public Contract Code §§5101, 5103, 5105; City of San Diego K-24-1952 Instructions §20.4; K-26-2396 Instructions."
},

{ h: "Protests and non-responsive bids",
  lead: "When the apparent low bidder broke a rule, the next bidder can protest. When yours did, someone may protest you.",
  body: `<ul>
<li><strong>Non-responsive:</strong> the bid didn't follow the package (missing form, bond, sub list, late DBE file). The agency rejects it and moves to the next bidder.</li>
<li><strong>Waivable irregularity:</strong> agencies can waive small technical defects that give no advantage. They can't waive big ones.</li>
<li><strong>Protest:</strong> a written challenge to another bidder's bid, filed on the agency's schedule. The City follows the San Diego Municipal Code. Caltrans says questions about unclear plans must come before opening, not as protests after.</li>
<li><strong>What gets protested:</strong> missing listed sub numbers, wrong license class, missing acknowledgement of an addendum, late post-bid documents, self-performance short of the minimum.</li>
</ul>`,
  ex: `<p><strong>Marina example:</strong> on 11-428704, ACCU was second on price. Because Marina's DBE package was late, Caltrans found Marina non-responsive, ACCU became the low responsive bidder, and Caltrans awarded ACCU the contract on Oct 1, 2021.</p>`,
  watch: `<p>Protest deadlines are short, often a few working days after opening or after the notice of intent to award. Read the protest section of every package before bid day, so you know your window if you need it.</p>`,
  src: "City of San Diego K-24-1952 Instructions §§20.3, 20.5, 21.1; Caltrans 11-428704 Notice to Bidders and Bid Summary."
},

{ h: "Get the bid tab and use it",
  lead: "Every public bid result is free market data. Collect it whether you won, lost or only quoted as a sub.",
  body: `<ul>
<li><strong>City of San Diego:</strong> results show in PlanetBids after the deadline. The City won't give results by phone; you can request them by mail.</li>
<li><strong>Caltrans:</strong> the Bid Summary lists every bidder's total, every unit price and every listed sub. The <a href="#lab">Real Bid Lab</a> is built from these.</li>
<li><strong>As a sub:</strong> ask the primes you quoted for the result, and whether you were listed.</li>
<li><strong>What to record:</strong> every bidder's total, your rank, the gap to the winner, the engineer's estimate, and the landscape and irrigation items line by line.</li>
</ul>`,
  ex: `<p>On 11-428704 the top three bidders were within 5% of each other and 22% under the engineer's estimate. If you were 10% high, the line items tell you where.</p>`,
  watch: `<p>Write your lessons the same week. A month later you won't remember why you carried $16 a foot for pipe.</p>`,
  src: "City of San Diego K-24-1952 Instructions §21.2; Caltrans 11-428704 Bid Summary."
},

{ h: "Checklists",

<div><h3>Before bid day</h3><ul>
<li>License class allowed; DIR registration current</li>
<li>Prequalified for the total, alternates included (City)</li>

</ul></div>
<div><h3>Bid day and after</h3><ul>
<li>Late addendum check in the morning</li>

<li>Addenda acknowledged on the bid form</li>
<li>Bond uploaded or bond ID entered</li>

</ul></div>
</div>`

{ t: "terms", h: "Words to know",
  lead: "Add these to your notebook.",
  terms: [
    ["Bid schedule / Bid Item List", "The list of items, units and quantities you price."],
    ["Unit price", "Price per unit of work, like per LF or EA."],
    ["Lump sum (LS)", "One price for a whole item."],
    ["Extension / item total", "Unit price × quantity."],
    ["Base bid", "The main bid, without alternates."],
    ["Additive alternate", "Optional extra work priced separately that the agency may add."],
    ["Deductive alternate", "Work the agency may remove, priced as a credit."],
    ["Bid security", "The bid bond or check guaranteeing you'll sign if you win, usually 10%."],
    ["Power of attorney", "The surety's document showing who may sign bonds for it."],
    ["Obligee", "The agency the bond protects."],
    ["PlanetBids", "Online bidding system used by the City of San Diego and many local agencies."],
    ["Bid Express", "Online system Caltrans uses to receive bids."],
    ["Prequalification / MBC", "City approval to bid as prime, up to a maximum bidding capacity."],
    ["Subcontractor listing", "Naming subs with your bid, required by the Fair Practices Act."],
    ["Bid shopping", "Pressuring subs for lower prices after the bid. Listing laws limit it."],
    ["Plug", "A number you carry for work with no quote."],
    ["Self-performance", "The share of work the prime must do with its own forces."],
    ["Good Faith Effort (GFE)", "Proof you tried to meet SLBE or DBE goals."],
    ["Apparent low bidder", "Lowest price at opening, before the agency checks it."],
    ["Responsive / responsible", "Followed all bid rules / able and qualified to do the work."],
    ["Bid protest", "Written challenge to another bidder's bid or the award."],
    ["Bid tab", "The table of every bidder's prices after opening."]
  ]
},

{ t: "quiz", id: "m14", h: "Check yourself",
  lead: "Tap an answer to check it.",
  qs: [
    { q: "On a Caltrans bid, your unit price and item total don't match. Which one counts?", a: ["The item total", "The unit price, with narrow exceptions", "Whichever is lower"], c: 1, why: "Caltrans's bid form says the unit price prevails, so a typo in a unit price binds you." },
    { q: "Your highway bid is $1,176,120. Over what amount must you list a subcontractor?", a: ["$5,880.60", "$10,000", "$117,612"], c: 1, why: "For streets and highways it's one-half of 1% or $10,000, whichever is greater." },
    { q: "You don't list anyone for a $40,000 irrigation portion of your prime bid. What does the law assume?", a: ["You'll pick a sub after award", "You'll do that work yourself", "The bid is automatically rejected"], c: 1, why: "PCC §4106: failing to list means the prime agrees to perform that portion itself." },
    { q: "On a City of San Diego bid, when is the original paper bid bond due?", a: ["With the PlanetBids upload", "By 5 PM, 1 working day after opening", "Within 10 days of award"], c: 1, why: "The City requires the PDF at bid time and the original by 5 PM the next working day." },
    { q: "You missed the City's SLBE goal. When is your Good Faith Effort file due?", a: ["By 5 PM, 3 working days after opening", "With the bid", "Within 30 days"], c: 0, why: "The City's schedule sets 5 PM, 3 working days after bid opening, for the GFE and Form AA60." },
    { q: "Why did the lowest bidder on Caltrans 11-428704 lose the job?", a: ["Its price was too low", "Its DBE paperwork was late", "It had the wrong license"], c: 1, why: "Caltrans found Marina Landscape non-responsive for a late DBE/DVBE submittal." },
    { q: "Which mistake can get you released from a public bid?", a: ["Forgetting to price traffic control", "Copying the wrong total from your own worksheet, reported in writing within the deadline", "Misreading the plant legend"], c: 1, why: "Relief is only for clerical errors in filling out the bid, not judgment errors, with prompt written notice." },
    { q: "When is the best time to submit an electronic bid due at 2:00 PM?", a: ["1:55 PM", "About 1:00–1:15 PM, then confirm receipt", "The night before, before quotes arrive"], c: 1, why: "Submit early enough to fix upload problems and still include the bid-day quotes. You can resubmit before the deadline." }
  ]
},

{ t: "practice", id: "m14", h: "Practice assignments",
  lead: "Build a real bid package and run a real bid day, without actually submitting.",
  items: [
    { h: "Pick a real job and download it", hrs: 0.5, d: "<p>On the City of San Diego's PlanetBids portal (from <a href=\"https://www.sandiego.gov/cip/bid-contracting\" target=\"_blank\" rel=\"noopener\">Bid &amp; Contracting Opportunities</a>), find an open or recent job with landscape or irrigation. Download the full package and all addenda. If nothing fits, use the City's <a href=\"https://www.sandiego.gov/sites/default/files/2024-02/k-24-1952-dbb-3-a.pdf\" target=\"_blank\" rel=\"noopener\">EMTS Boat Dock Esplanade package</a> or Caltrans <a href=\"#lab-11-428704\">11-428704</a>.</p>" },
    { h: "Make the required-documents calendar", hrs: 0.5, d: "<p>From the package, list every form, who signs it, what it certifies and when it's due (at bid, 24 hours, 1, 3, 5, 10 days). Put the dates on a real calendar as if the bid were next week.</p>" },
    { h: "Fill in every non-price form", hrs: 0.75, d: "<p>Fill in the forms for your company (or the bidding entity being set up): pending actions, disclosure, debarment, certifications. Mark anything you can't answer and who in the company can. Don't sign or submit anything.</p>" },
    { h: "Build the sub list and check the threshold", hrs: 0.5, d: "<p>Using a made-up total bid, figure the listing threshold. Pick real local subs for traffic control, electrical and concrete. Look up each one's CSLB license and DIR registration and fill in the sub list as the package requires.</p>" },
    { h: "Ask your surety for a sample bid bond", hrs: 0.25, d: "<p>Ask your surety agent how they issue bonds for PlanetBids and for Caltrans electronic bids, how much notice they need, and for a sample bond with power of attorney. Check it against the bond checklist from the bid bond slide.</p>" },
    { h: "Run a timed bid-day drill", hrs: 1, d: "<p>With a coworker, take a priced estimate (your Module 15 lab prices work). Starting at 10:00 AM, have them send you three made-up sub quotes at 11:00, 12:00 and 12:30, one with a hidden exclusion. Level them, finish the sub list, enter prices in the bid form, have them check every extension, and be ready to submit by 1:15 PM. Write down where you lost time.</p>" },
    { h: "Read a real bid tab", hrs: 0.5, d: "<p>Find the results for a closed City landscape job on PlanetBids, or open the 11-428704 Bid Summary. Record every bidder's total, the gap from first to third, and any bid marked non-responsive and why. Write three lessons.</p>" }
  ]
},

{ h: "Module 14 summary",
  lead: "Public bids are won on price and lost on paperwork. A checklist and an early submit protect both.",
  body: `<ul>
<li>City of San Diego bids go through PlanetBids; Caltrans bids go through Bid Express. Set up accounts, prequalification and bonds weeks ahead.</li>
<li>Read how the low bid is decided. On Caltrans, the unit price you type is the price you're held to.</li>
<li>Know every required form and when it's due: at bid, 24 hours, 1, 3, 5 and 10 days after.</li>
<li>Bid bond: usually 10%, right obligee, right project, power of attorney attached; City original the next working day.</li>
<li>List every sub over one-half of 1% of the bid (or $10,000 on highways, whichever is greater). One sub per portion.</li>
<li>Plan bid day hour by hour, level every quote, check every extension, submit by about 1:15 PM and save proof.</li>
<li>Mistake relief covers only clerical errors, with written notice in 3 to 5 working days. Get and study every bid tab.</li>
</ul>
<p><strong>Next: Module 15 · Real Bid Practice: Price It, Then Compare to the Winner.</strong></p>`
}
]
});

{ h: "The road map",
  lead: "Every public bid follows the same path. This module follows it step by step for this job.",
  body: `<ol class="steps">
<li><div><b>Read the Notice to Bidders</b>Decide go or no-go: license, size, dates, DBE goal, bonding.</div></li>
<li><div><b>Learn how the spec book is built</b>Standard Specifications + revisions + job-specific Special Provisions.</div></li>
<li><div><b>Read the plans</b>Sheet by sheet: irrigation, planting, traffic, utilities, quantities.</div></li>
<li class="hl"><div><b>Check the quantities</b>Trace the bid item quantities back to the plans. Note anything that doesn't add up.</div></li>
<li><div><b>Read every addendum</b>Update quantities and wage rates.</div></li>
<li class="hl"><div><b>Find the hidden costs</b>Work hours, traffic control, lead in soil, monitors, submittals, plant establishment.</div></li>
<li><div><b>Get prices</b>Supplier quotes (some given in the specs!), labor at prevailing wage, subcontractor quotes.</div></li>
<li><div><b>Line up DBE subs and other subs</b>Meet the 14% DBE goal or document good faith efforts.</div></li>
<li class="hl"><div><b>Price every item and fill in the bid book</b>Bid bond, subcontractor list, certifications.</div></li>
<li><div><b>Submit on Bid Express before 2:00 PM</b>Then meet the after-bid deadlines (day 5, day 10).</div></li>
<li><div><b>Read the results</b>Learn from every bidder's prices.</div></li>
</ol>`
},

{ h: "Every document in the package",
  lead: "Here's what Caltrans published for this job and why each one matters to you.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Document</th><th>What it is</th><th>Why it matters to a landscape contractor</th></tr></thead>
<tbody>
<tr><td><strong>Notice to Bidders</strong> (first pages of the spec book)</td><td>The job summary: dates, license, DBE goal, time, estimate</td><td>Your go/no-go decision starts here</td></tr>
<tr><td><strong>Bid Item List</strong> (in the spec book)</td><td>70 numbered items with units and quantities</td><td>This is exactly what you put prices on</td></tr>
<tr><td><strong>Special Provisions</strong> (316 pages)</td><td>Job-specific rules plus statewide revisions to the Standard Specifications</td><td>Products, methods, testing, work hours, submittals: most hidden costs live here</td></tr>
<tr><td><strong>2018 Standard Specifications and Standard Plans</strong> (not in the package)</td><td>Caltrans's base rule book and standard details</td><td>The Special Provisions only list changes to these. You must read both.</td></tr>
<tr><td><strong>Plans</strong> (65 sheets)</td><td>Drawings: irrigation, planting, traffic handling, water pollution, utilities, quantity tables</td><td>Where the work is and how much of it there is</td></tr>
<tr><td><strong>Addendum 1</strong> (Aug 27, 2021)</td><td>Changes issued during bidding: 4 plan sheets, 3 bid items, new wage rates</td><td>You must bid the changed quantities and acknowledge the addendum</td></tr>
<tr><td><strong>Federal wage rates</strong></td><td>U.S. Dept. of Labor wage decision for San Diego County</td><td>Federal-aid job: you pay the higher of state or federal rates</td></tr>
<tr><td><strong>DBE forms</strong></td><td>Commitment, Confirmation, Good Faith Efforts</td><td>Due 5 days after bid. Late = bid thrown out (it happened here).</td></tr>

<tr><td><strong>Bid Summary</strong> (after opening)</td><td>Every bidder's total, subs and unit prices</td><td>Free market data for your next bid</td></tr>
</tbody></table></div>`
},

{ h: "Step 1 · The Notice to Bidders",
  lead: "Two pages that answer most go/no-go questions. Here's what this one said, and what each line means for you.",
  body: `<ul>
<li><strong>“Bids open Wednesday, September 8, 2021… until 2:00 p.m.… via Bid Express website. Bids received after this time will not be accepted.”</strong> Electronic only. You need a Bid Express account and a digital ID set up well before bid day.</li>
<li><strong>“Class A license or… C-27.”</strong> Your C-27 qualifies you as the prime.</li>
<li><strong>“The DBE Contract goal is 14 percent.”</strong> About $165,000 of a $1.18M bid should go to certified DBE firms, or you document good faith efforts.</li>
<li><strong>Federal-aid project.</strong> Brings federal wage rates, DBE rules and federal certifications.</li>
<li><strong>“Bids must be on a unit price basis.”</strong> You're paid per unit installed, not a fixed total.</li>
<li><strong>Three time clocks:</strong> 120 working days to build, 250 working days of plant establishment, 370 total.</li>
<li><strong>“Bidder's security equal to at least 10 percent of the bid.”</strong> A bid bond of about $118,000. Line up your surety early.</li>
<li><strong>Estimated cost $1,510,000.</strong> Bids came in well under it (next slides).</li>
<li><strong>No pre-bid meeting</strong> is listed. Visit the site yourself; you can see the shoulders from public roads.</li>
<li><strong>Bidder inquiries</strong> go through Caltrans's online bidder inquiry system. Questions about unclear plans “must be asked before bid opening.”</li>
</ul>`,
  ex: `<p><strong>Go/no-go for a C-27 company:</strong> license OK · DIR registration required · $118K bid bond and $1.2M performance and payment bonds needed · DBE goal 14% · freeway night work and traffic control (subcontract it) · one year of plant establishment (you're good at that). For a company with bonding in place, this is a realistic first public prime.</p>`
},

{ h: "Step 2 · How the Caltrans spec book is built",
  lead: "Caltrans specs come in layers. The book you download only contains the changes, so you have to know where to look for the rest.",
  body: `<ol class="steps">
<li><div><b>2018 Standard Specifications</b>The base rule book for every Caltrans job. Section 20 is Landscape. Not in the package; download it from Caltrans.</div></li>
<li><div><b>Revised Standard Specifications (dated 04-16-21)</b>Statewide updates to the 2018 book, bound into this job's spec book (262 pages).</div></li>
<li class="hl"><div><b>Special Provisions (44 pages)</b>Rules for this job only. Each one starts with a clause like “Add to section 20-2…” or “Replace the 1st paragraph of…”.</div></li>
<li><div><b>Standard Plans (2018) and Revised Standard Plans</b>Standard details, like sprinkler assembly (RSP H4) and swing joint (H5).</div></li>
</ol>
<p>Section numbers match across all of them. If the Special Provisions say “20-2.06B”, look up the same number in the Standard Specifications for the base text.</p>`,
  watch: `<p>Some big cost items are only in the 2018 Standard Specifications, not in this job's book: liquidated damages per day (section 8-1.10), bond requirements (3-1), how mobilization and time-related overhead are paid (9-1), and base plant establishment and plant replacement rules (20-4). If you only read the Special Provisions, you'll miss them.</p>`,
  deeper: `<p>Where to find what, for a landscape estimator:</p>
<ul>
<li>Section 2: bidding rules, DBE forms and deadlines</li>
<li>Section 7: insurance, prevailing wage, certified payroll</li>
<li>Section 12: traffic control and lane closure hours</li>
<li>Section 13: storm water (SWPPP)</li>
<li>Section 14: environmental: birds, paleontology, lead, solid waste</li>
<li>Section 20: landscape: weed control, irrigation, planting, plant establishment, existing planting</li>
<li>Section 21: erosion control, including compost</li>
<li>Sections 86–87: electrical, including power to controllers</li>
</ul>`
},

{ h: "Reading the irrigation design",
  lead: "The big idea: shut off three drinking-water connections and feed the whole corridor from one recycled-water connection.",
  body: `<ul>
<li><strong>One recycled-water source</strong> at Palomar Street (sheet IP-7): existing recycled water meters from Otay Water District, with a new 3" two-wire master valve, flow sensor, gate valves, air release valve and antenna mast.</li>
<li><strong>Three drinking-water connections cut off</strong> at Main Street, East Orange Avenue and one more location (IR sheets). The meters and backflow preventers stay; downstream parts are removed and the line capped.</li>
<li><strong>New 4" Class 315 main, 7,493 LF</strong>, running the corridor and tying into the existing laterals.</li>
<li><strong>Controllers:</strong> one modified ('97A') and six new ('97B'–'97G', 32–40 stations) replacing old satellites, which are removed and salvaged to Caltrans.</li>
<li><strong>Conduits under ramps:</strong> 648 LF of 8" and 10" conduit at seven crossings, each carrying the 4" main and wire.</li>
</ul>`,
  watch: `<p>Because it's recycled water, everything must be purple or labeled to San Diego County DEH rules: pipe, heads, caps, drain grates, warning tape along the whole main trench, and recycled-water warning signs (English and Spanish). Recycled mains are pressure tested at 150 psi. Overspray or runoff onto roads is not allowed.</p>`,
  src: "Plans IP-1 to IP-7, IR-1 to IR-7, ISS-1, ID-6, IQ-2; Special Provisions 20-2.01."
},

{ h: "Step 4 · Check the quantities",
  lead: "On a public bid, Caltrans gives you the quantities. Your job is to check that they match the plans and to ask about anything that doesn't.",
  body: `<p><strong>Example 1: 4" main (item 63 = 7,493 LF).</strong> Sheet IQ-1 breaks it down by plan sheet:</p>
<div class="tablewrap"><table><thead><tr><th>IP-1</th><th>IP-2</th><th>IP-3</th><th>IP-4</th><th>IP-5</th><th>IP-6</th><th>IP-7</th><th>In conduits</th><th>Total</th></tr></thead>
<tbody><tr><td class="num">440</td><td class="num">1,365</td><td class="num">1,210</td><td class="num">165</td><td class="num">1,150</td><td class="num">1,385</td><td class="num">1,130</td><td class="num">648</td><td class="num"><strong>7,493</strong></td></tr></tbody></table></div>
<p><strong>Example 2: iceplant cuttings (item 25).</strong> Add up the callouts on the 7 planting sheets: 4,600 + 15,750 + 12,900 + 185 + 1,790 + 2,430 + 2,730 + 6,180 + 1,960 + 13,450 = <strong>61,975</strong>. The original bid list said 60,015. The addendum fixed it.</p>
<p><strong>Example 3: small differences.</strong> IQ-1 adds up to 172 tree well sprinkler assemblies (43 trees × 4), but bid item 51 says 180. On this job Caltrans rounded many measured items up a little: valve box labels 197 → 200, compost 282 → 290, packet fertilizer 1,893 → 1,900. So 180 is probably rounding. If a gap is bigger than that pattern, or it's on a lump-sum or final-pay item, ask before bid day.</p>`,
  watch: `<p>Items marked <strong>(F)</strong> are “final pay”: you're paid the bid quantity even if you install a different amount, unless the Engineer changes the work. On this job that's the iceplant cuttings (item 25) and every supply pipe size (items 57–63), and those match the plan tables exactly. Other items are paid by the units actually installed. On final-pay items, a quantity error is your gain or loss, so check them hardest.</p>`,
  watch: `<p>Check for addenda the morning of bid day. Bidding the old quantities makes your extensions wrong, and failing to acknowledge an addendum can make your bid non-responsive.</p>`
},

{ h: "Step 6 · Hidden costs: freeway work hours and traffic",
  lead: "On a freeway, when you're allowed to work is a cost. This job's lane closure charts mostly allow night and early weekend work.",
  body: `<ul>
<li><strong>Lane closures on I-805</strong> (keeping at least 3 lanes open): roughly Monday–Thursday 9 PM to 5 AM, Friday until 5 AM, and early weekend mornings. Shoulder-only closures roughly 9 AM to 3 PM on weekdays. (Check the charts in Special Provisions 12-4.02C before you price.)</li>
<li><strong>Blackouts:</strong> holidays, special events, and from noon the day before Thanksgiving to Jan 2 at listed shopping areas, including Plaza Bonita.</li>
<li><strong>Every closure needs</strong> an impact attenuator truck, a certified traffic control technician, certified flaggers, weekly reports and requests through Caltrans's Lane Closure System.</li>
<li><strong>Bid items:</strong> traffic control system, construction area signs, 36 drums, 2 message signs, 1,700 LF of K-rail, 6 crash cushions.</li>
<li><strong>Work near traffic:</strong> within 6 feet of a lane at 45 mph or more, the next lane must be closed too.</li>
</ul>`,
  ex: `<p>Every bidder on this job subcontracted traffic control and K-rail to a traffic control company. You don't need to own attenuator trucks; you need a reliable traffic control sub quote before bid day.</p>`,
  src: "Special Provisions 12-3, 12-4.02C; Revised Standard Specifications 12."
},

{ h: "Step 6 · Hidden costs: environment, soil and paperwork",
  lead: "The Special Provisions add work that never appears on the planting or irrigation sheets.",
  body: `<ul>
<li><strong>Lead in the soil:</strong> freeway shoulders carry old lead from leaded gas, up to 556 mg/kg here, to 5 feet deep. Every trench and plant hole disturbs it, so you need a lead compliance plan (item 1), and hauling soil off-site is at your cost.</li>
<li><strong>Paleontology:</strong> no digging until the paleontological monitor is present; 15 days' notice and 1 hour of training for everyone who digs.</li>
<li><strong>Nesting birds:</strong> Feb 15 to Aug 31. Give 15 working days' notice before disturbing vegetation; active nests mean a 100-foot stop-work zone.</li>
<li><strong>Storm water:</strong> risk level 2, so a full SWPPP prepared by a QSD within 15 days of approval, a QSP-trained manager, rain event plans and sampling.</li>
<li><strong>Trash pickup:</strong> 300 hours of “manage solid waste generated by the public”: weekly, 2 laborers and a pickup with an arrow board per hour, disposal fees included.</li>
<li><strong>Start-of-work submittals:</strong> CPM schedule, SWPPP, closure contingency plan, work plan for existing planting, deficiency list, job hazard analyses. Caltrans can withhold payment when submittals are late.</li>
<li><strong>Partnering:</strong> required for jobs over $1M and 100+ working days, with a professional facilitator.</li>
</ul>`,
  watch: `<p>None of these show up on a landscape plan sheet. A landscape estimator who prices only from the plans will be low on cost and won't know why the job lost money.</p>`,
  src: "Special Provisions 7-1.02K(6)(j), 13-3.01A, 14-1, 14-7.04, 14-10.01A, 5-1.09."
},

{ h: "The subcontract: clauses to read every time",
  lead: "GC subcontracts are written to protect the GC. You can ask for changes, but only if you read it first.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Clause</th><th>What to check</th></tr></thead>
<tbody>
<tr><td><strong>Scope</strong></td><td>Matches your proposal: same sheets, spec sections, addenda, inclusions and exclusions. Attach your proposal as an exhibit.</td></tr>
<tr><td><strong>Price and payment</strong></td><td>Amount, billing date, when you get paid, pay-when-paid or pay-if-paid language</td></tr>
<tr><td><strong>Retention</strong></td><td>Percent held and when it's released (after your work, after the whole project, after plant establishment?)</td></tr>
<tr><td><strong>Changes</strong></td><td>Who can approve extra work, how fast you must give notice, allowed markup</td></tr>
<tr><td><strong>Schedule</strong></td><td>Start, finish, liquidated damages passed down to you, delays you're responsible for</td></tr>
<tr><td><strong>Indemnity</strong></td><td>Whose mistakes you're asked to pay for</td></tr>
<tr><td><strong>Insurance and bonds</strong></td><td>Limits, endorsements, bonds required from you</td></tr>
<tr><td><strong>Warranty</strong></td><td>How long, and whether it starts at your completion or the owner's acceptance</td></tr>
<tr><td><strong>Plant establishment</strong></td><td>Length, start date, and what “acceptance” means</td></tr>
<tr><td><strong>Disputes</strong></td><td>Notice, mediation, arbitration or court, and where</td></tr>
<tr><td><strong>Flow-down</strong></td><td>“Sub is bound to GC as GC is bound to owner” brings the whole prime contract in. Ask for a copy of it.</td></tr>
</tbody></table></div>`,
  ex: `<p>Make a one-page subcontract checklist with these rows. For each new GC, mark what's acceptable, what to ask to change, and what's a deal-breaker. After a few GCs, you'll know their forms by heart.</p>`
},

{ h: "Payment clauses: pay-when-paid vs. pay-if-paid",
  lead: "These two phrases sound alike but are very different. In California, the second kind is generally not enforceable.",
  body: `<div class="twocol">
<div><h3>Pay-when-paid</h3><ul>
<li>Sets the <strong>timing</strong>: the GC pays you within a set time after it gets paid</li>
<li>Common and generally allowed</li>
<li>Still means waiting on the owner</li>
</ul></div>
<div><h3>Pay-if-paid</h3><ul>
<li>Makes the owner paying the GC a <strong>condition</strong>: if the owner never pays, you never get paid</li>
<li>The California Supreme Court held these clauses unenforceable in <em>Wm. R. Clarke Corp. v. Safeco Ins. Co.</em> (1997)</li>
<li>Still shows up in subcontracts; ask to change it to pay-when-paid with a time limit</li>
</ul></div>
</div>
<p><strong>Prompt payment:</strong> California law requires a prime contractor to pay a sub its share of a progress payment within 7 days of receiving it, unless otherwise agreed in writing. A good-faith dispute lets the GC hold up to 150% of the disputed amount.</p>`,
  watch: `<p>“Unless otherwise agreed in writing” matters: some subcontracts set longer terms. Read the payment clause and push for the shortest terms you can get.</p>`,
  deeper: `<p><em>Clarke</em> reasoned that a true pay-if-paid clause works as an indirect waiver of the sub's mechanics lien rights, which the California Constitution protects. A later appellate case applied the rule to public works. The prompt payment rule is Business and Professions Code 7108.5; violations can mean license discipline and a penalty of 2% per month on the late amount. Check the current text before relying on it.</p>`,
  src: "Wm. R. Clarke Corp. v. Safeco Ins. Co. (1997) 15 Cal.4th 882; Cal. Business and Professions Code 7108.5."
},

{ h: "Retention: how much and when it comes back",
  lead: "Retention is money held back from each payment until the work is finished. In California, it's usually capped at 5%.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Job type</th><th>Cap</th><th>Release to the GC</th><th>GC pays your share</th></tr></thead>
<tbody>
<tr><td><strong>Public (city, school, water district)</strong></td><td>5% of each payment and of the contract, with limited exceptions</td><td>Within 60 days after completion</td><td>Within 7 days of receiving it</td></tr>
<tr><td><strong>Private, contracts signed on or after Jan 1, 2026</strong></td><td>5% (new law, SB 61), with exceptions such as some small residential jobs</td><td>Within 45 days after completion of the work of improvement</td><td>Within 10 days of receiving it</td></tr>
<tr><td><strong>Caltrans prime</strong></td><td>Caltrans holds no retention from progress payments (see Module 15)</td><td>Not applicable</td><td>Read your subcontract</td></tr>
</tbody></table></div>`,
  ex: `<p>On the City's K-24-1952, the City's pay estimate form calculated retention as 5% of the total billed to date, and the contract required primes to return retention to subs within 30 calendar days after the sub's work was satisfactorily completed and accepted, including partial acceptances.</p>`,
  watch: `<p>“Completion” often means the whole project, not your scope. Landscape finishes last and then has a plant establishment period, so your retention can sit for months. Ask the GC to release your retention when your work is accepted, and write it into the subcontract.</p>`,
  deeper: `<p><strong>Public:</strong> Public Contract Code 7201 caps retention at 5% for the agency, the prime and every sub tier; an agency can go higher only by finding, before bidding, that a project is substantially complex. A prime may also hold more than 5% from a sub who fails to provide bonds the prime required in writing before bid. AB 2173 made the 5% cap permanent from Jan 1, 2023. Release timing is Public Contract Code 7107 (60 days; sub's share within 7 days; 2% per month penalty).</p>
<p><strong>Private:</strong> SB 61 (2025) added Civil Code 8811, a 5% cap on private works contracts entered on or after Jan 1, 2026. Release timing is Civil Code 8812 (owner, 45 days after completion) and 8814 (direct contractor to sub, 10 days). Commentators disagree on the residential and mixed-use edges of SB 61, so check with an attorney on those jobs.</p>`,
  src: "Cal. Public Contract Code 7107, 7201; AB 2173 (2022); SB 61 (2025), Civil Code 8811; Civil Code 8812, 8814; City of San Diego K-24-1952 pay estimate form and EOCP Section J."
},

{ h: "Indemnity, insurance and bonds",
  lead: "Indemnity says who pays when something goes wrong. Insurance and bonds are how you prove you can pay.",
  body: `<ul>
<li><strong>Indemnity:</strong> you agree to defend and pay for claims arising from your work. California law limits how far a GC can push this onto you. On most commercial jobs, a sub can't be made to pay for the GC's or owner's own active negligence or willful misconduct, or for claims outside the sub's scope of work.</li>
<li><strong>Certificate of insurance (COI):</strong> proof of your general liability, auto, workers' comp and umbrella. The GC will list required limits.</li>
<li><strong>Endorsements:</strong> GCs usually require additional insured status, primary and non-contributory wording, and a waiver of subrogation. These are policy changes your agent issues; a COI alone isn't enough.</li>
<li><strong>Sub bonds:</strong> some GCs require performance and payment bonds from subs on larger scopes. Price the bond in your bid if the invitation asks for it (Module 2).</li>
</ul>`,
  watch: `<p>Send the subcontract's insurance page to your insurance agent the day you get it. Missing endorsements are the most common reason a sub can't start on time.</p>`,
  deeper: `<p>Civil Code 2782 voids indemnity for a party's sole negligence or willful misconduct and, on public agency contracts, for the agency's active negligence. Civil Code 2782.05 (contracts on or after Jan 1, 2013) applies similar limits to subs on most non-residential private work and lets a sub defend with its own counsel or pay a reasonable share of defense costs. There are exceptions (for example wrap-up insurance programs). Have an attorney review your standard indemnity markup once.</p>`,
  src: "Cal. Civil Code 2782, 2782.05 (SB 474, 2011)."
},

{ h: "Submittals",
  lead: "Submittals prove you'll install what was specified. Nothing gets ordered until they're approved.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Submittal</th><th>Typical contents</th></tr></thead>
<tbody>
<tr><td>Irrigation product data</td><td>Cut sheets for every head, nozzle, valve, backflow, controller, sensor, pipe and wire, marked with the exact model</td></tr>
<tr><td>Plant material</td><td>Nursery sources, sizes, quantities; photos or tagging for specimen trees and 24" box and larger</td></tr>
<tr><td>Soil</td><td>Agronomic soil test from an approved lab, with amendment recommendations</td></tr>
<tr><td>Soil amendments, compost and mulch</td><td>Product data, test results, samples</td></tr>
<tr><td>Recycled water items</td><td>Purple pipe, tags, signs per the local water agency and county rules</td></tr>
<tr><td>Schedule and work plans</td><td>Your installation schedule; plant establishment plan if required</td></tr>
</tbody></table></div>
<ol class="steps">
<li><div><b>Make a submittal log</b>Every spec section's submittal list, with due date, sent date, status.</div></li>
<li class="hl"><div><b>Submit early and complete</b>Partial packages get rejected and lose weeks.</div></li>
<li><div><b>Order long-lead items right after approval</b>Box trees, controllers and backflow enclosures can take weeks.</div></li>
</ol>`,
  ex: `<p>On Caltrans 11-428704, the specs named the controller supplier and quoted prices (see Module 15), and Caltrans could withhold payment when required start-of-work submittals were late. Submittals are money.</p>`
},

{ h: "The preconstruction meeting",
  lead: "The precon meeting sets the rules for the job. Bring questions, leave with names and dates.",
  body: `<p><strong>Bring:</strong> your schedule, submittal log, insurance, list of questions, emergency contact and the name of your foreman.</p>
<p><strong>Leave knowing:</strong></p>
<ul>
<li>Who approves changes, signs T&amp;M tickets and schedules inspections</li>
<li>Pay application due date, format and who to send it to</li>
<li>Where you can stage, park and get water</li>
<li>When sleeves must be in, and when paving, curbs and walls are scheduled</li>
<li>Inspection hold points and how much notice each needs</li>
<li>When plant establishment starts and who must accept the planting</li>
</ul>`,
  exLabel: "Real example: City inspection hold points",
  ex: `<p>The City's K-24-1952 landscape specs required the Resident Engineer to observe these steps, requested 3 working days ahead: preconstruction meeting, protection of existing plants, rough grade and soil tests, plant material, soil prep and finish grade, plant layout and installation, the substantial completion punch list, punch list completion (which authorizes the start of the maintenance period), maintenance completion, sleeve locations at hardscape layout, mainline and lateral pressure tests before backfill, a coverage check, and a final walk-through at the end of the 90-day maintenance period.</p>`,
  src: "City of San Diego K-24-1952-DBB-3-A, landscape Special Provisions (site observations)."
},

{ h: "Schedule of values",
  lead: "The schedule of values (SOV) breaks your contract price into lines you bill against each month. Build it the way the work happens.",
  exLabel: "Example numbers for practice: a $186,400 landscape subcontract",
  body: `<p>Scope from Module 1: landscape and irrigation per sheets L-1.0 to L-4.2, spec sections 32 84 00 and 32 93 00, with 90-day plant establishment.</p>
<div class="tablewrap"><table>
<thead><tr><th>#</th><th>Line</th><th class="num">Scheduled value</th></tr></thead>
<tbody>
<tr><td>1</td><td>Mobilization, bonds, submittals</td><td class="num">$7,500</td></tr>
<tr><td>2</td><td>Irrigation POC, backflow, controller</td><td class="num">$14,200</td></tr>
<tr><td>3</td><td>Irrigation mainline, sleeves, wire</td><td class="num">$22,600</td></tr>
<tr><td>4</td><td>Irrigation laterals, heads, drip</td><td class="num">$38,400</td></tr>
<tr><td>5</td><td>Soil prep and fine grade</td><td class="num">$16,300</td></tr>
<tr><td>6</td><td>Trees, 24" box</td><td class="num">$27,600</td></tr>
<tr><td>7</td><td>Shrubs and groundcover</td><td class="num">$34,800</td></tr>
<tr><td>8</td><td>Mulch</td><td class="num">$9,700</td></tr>
<tr><td>9</td><td>90-day plant establishment</td><td class="num">$12,000</td></tr>
<tr><td>10</td><td>Closeout: as-builts, controller charts, training</td><td class="num">$3,300</td></tr>
<tr><td></td><td><strong>Total</strong></td><td class="num"><strong>$186,400</strong></td></tr>
</tbody></table></div>`,
  watch: `<p>Don't load too much into early lines (front-loading). GCs and owners check it, and an SOV that bills 40% in month one gets rejected. Give plant establishment and closeout real values, so you get paid for them and so the GC has a reason to sign them off.</p>`
},

{ h: "Worked example: pay application #2 with retention",
  lead: "Each month you report percent complete by line. The math gives your payment after retention.",
  exLabel: "Example numbers for practice (continues the $186,400 subcontract)",
  body: `<p>Change order #1 (add two valves and a sleeve) was approved for <strong>$2,850</strong>. Pay app #1 billed $21,060 (line 1 at 100%, line 3 at 60%). Now it's the end of month 2:</p>
<div class="tablewrap"><table>
<thead><tr><th>Line</th><th class="num">Value</th><th class="num">% done</th><th class="num">To date</th><th class="num">Previous</th><th class="num">This period</th></tr></thead>
<tbody>
<tr><td>1 Mobilization</td><td class="num">7,500</td><td class="num">100%</td><td class="num">7,500</td><td class="num">7,500</td><td class="num">0</td></tr>
<tr><td>2 POC, backflow, controller</td><td class="num">14,200</td><td class="num">60%</td><td class="num">8,520</td><td class="num">0</td><td class="num">8,520</td></tr>
<tr><td>3 Mainline</td><td class="num">22,600</td><td class="num">100%</td><td class="num">22,600</td><td class="num">13,560</td><td class="num">9,040</td></tr>
<tr><td>4 Laterals</td><td class="num">38,400</td><td class="num">75%</td><td class="num">28,800</td><td class="num">0</td><td class="num">28,800</td></tr>
<tr><td>5 Soil prep</td><td class="num">16,300</td><td class="num">50%</td><td class="num">8,150</td><td class="num">0</td><td class="num">8,150</td></tr>
<tr><td>6–10</td><td class="num">87,400</td><td class="num">0%</td><td class="num">0</td><td class="num">0</td><td class="num">0</td></tr>
<tr><td>CO #1</td><td class="num">2,850</td><td class="num">100%</td><td class="num">2,850</td><td class="num">0</td><td class="num">2,850</td></tr>
<tr><td><strong>Total</strong></td><td class="num"><strong>189,250</strong></td><td class="num">41.4%</td><td class="num"><strong>78,420</strong></td><td class="num">21,060</td><td class="num"><strong>57,360</strong></td></tr>
</tbody></table></div>
<div class="tablewrap"><table><tbody>
<tr><td>A. Original contract</td><td class="num">$186,400.00</td></tr>
<tr><td>B. Approved change orders</td><td class="num">$2,850.00</td></tr>
<tr><td>C. Contract to date (A + B)</td><td class="num">$189,250.00</td></tr>
<tr><td>D. Completed to date</td><td class="num">$78,420.00</td></tr>
<tr><td>E. Retention, 5% of D (78,420 × 0.05)</td><td class="num">$3,921.00</td></tr>
<tr><td>F. Previous payments (21,060 − 5% = 21,060 − 1,053)</td><td class="num">$20,007.00</td></tr>
<tr><td><strong>G. Payment due now (D − E − F)</strong></td><td class="num"><strong>$54,492.00</strong></td></tr>
<tr><td>H. Balance to finish (C − D)</td><td class="num">$110,830.00</td></tr>
</tbody></table></div>`,
  ex: `<p><strong>Check it:</strong> this period's work is $57,360. Minus 5% retention ($2,868) = $54,492. Same answer. Still to collect: $110,830 of unbilled work + $3,921 retention held = $114,751.</p>`,
  deeper: `<p>The A–H summary follows the layout of the City of San Diego's pay estimate form (original amount, change orders, total authorized, billed to date, 5% retention, previous payments, payment due, remaining). Private GCs often use the AIA-style G702/G703 format with the same math. At 100% complete, total retention on this job would be 5% × $189,250 = $9,462.50, paid after completion under the rules on the retention slide.</p>`,
  watch: `<p><strong>Send a complete package every month, by the GC's cutoff</strong> (often the 20th–25th; ask at precon): the signed pay app and SOV sheet, a conditional progress release for this bill, an unconditional release for last month's payment only if that check has cleared, certified payroll on prevailing wage jobs (Module 11), and only change orders already approved in writing. Log each pay app: date sent, amount, date paid, days to pay. A GC who always pays slowly should affect whether you bid its next job (Module 3).</p>`,
  src: "City of San Diego K-24-1952-DBB-3-A pay estimate form (Appendix). Contract amounts are made up for practice."
},

{ h: "Lien rights and preliminary notices",
  lead: "California gives unpaid contractors strong payment rights, but only if you send the right notices on time.",
  body: `<div class="tablewrap"><table>
<thead><tr><th></th><th>Private job</th><th>Public job</th></tr></thead>
<tbody>
<tr><td><strong>Your payment tools</strong></td><td>Mechanics lien on the property, stop payment notice, payment bond claim (if there's a bond)</td><td>No lien on public property. Stop payment notice to the agency and claim on the prime's payment bond.</td></tr>
<tr><td><strong>Preliminary notice</strong></td><td>As a sub, serve a 20-day preliminary notice on the owner, the GC and any construction lender</td><td>Required for claimants without a direct contract with the prime. A sub hired directly by the prime is generally exempt for stop payment notices; your own suppliers and sub-subs are not.</td></tr>
<tr><td><strong>Timing</strong></td><td>Within 20 days of first furnishing work. Late notice covers only work from 20 days before you served it.</td><td>Same 20-day rule where a notice is required</td></tr>
<tr><td><strong>Deadline to act</strong></td><td>Record a lien within 90 days after completion, or 30 days after a recorded notice of completion. Sue to enforce within 90 days after recording.</td><td>Stop payment notice within 30 days after a recorded notice of completion or acceptance, or 90 days after completion if none was recorded</td></tr>
</tbody></table></div>`,
  watch: `<p>Send a preliminary notice on every private job, as standard practice, right after you start. It's routine, and it protects you. Calendar the lien and stop payment deadlines the day a notice of completion is recorded.</p>`,
  deeper: `<p>Private works: Civil Code 8200 and 8204 (preliminary notice), 8412 and 8414 (lien recording deadlines), 8460 (enforcement). Public works: Civil Code 9300 to 9304 (preliminary notice), 9356 (stop payment notice timing), 9550 (payment bond on public works over $25,000). Many sources summarize these rules differently; check the current code and talk to an attorney before relying on a deadline for a real claim.</p>`,
  src: "Cal. Civil Code 8200, 8204, 8412, 8414, 8460, 9300–9304, 9356, 9550."
},

{ h: "Lien releases: conditional and unconditional",
  lead: "California uses four statutory release forms. Sign the right one at the right time.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Form</th><th>Civil Code</th><th>When to sign</th></tr></thead>
<tbody>
<tr><td>Conditional waiver and release on <strong>progress</strong> payment</td><td>8132</td><td>With each pay app. Only takes effect when you're actually paid.</td></tr>
<tr><td>Unconditional waiver and release on <strong>progress</strong> payment</td><td>8134</td><td>Only after the progress check has cleared your bank</td></tr>
<tr><td>Conditional waiver and release on <strong>final</strong> payment</td><td>8136</td><td>With your final bill, including retention</td></tr>
<tr><td>Unconditional waiver and release on <strong>final</strong> payment</td><td>8138</td><td>Only after final payment has cleared</td></tr>
</tbody></table></div>`,
  watch: `<p><strong>Never sign an unconditional release before the money is in your account.</strong> An unconditional release works the moment you sign it, even if the check never comes. GCs sometimes ask for unconditional releases with the pay app. Send a conditional one instead.</p>`,
  deeper: `<p>A waiver is effective only if it is substantially in the statutory form and signed. The CSLB posts the forms and explains them. Progress releases cover work through a stated date and leave retention and disputed extras unpaid; list any exceptions on the form.</p>`,
  src: "Cal. Civil Code 8132, 8134, 8136, 8138; CSLB, Conditional and Unconditional Waiver and Release Forms (cslb.ca.gov)."
},

{ h: "Change orders and T&M tickets",
  lead: "Extra work without written approval is often free work. Document everything, the same day.",
  body: `<ol class="steps">
<li><div><b>Spot the change</b>Different from the plans, specs or your scope letter: an added bed, a relocated controller, rock where the soil report said none.</div></li>
<li class="hl"><div><b>Give written notice fast</b>Subcontracts often set short notice deadlines. Email the same day: what, where, why it's extra.</div></li>
<li><div><b>Price it, or work T&amp;M</b>Send a change order request with labor, material, equipment and markup per the subcontract. If there's no time, get written direction to proceed on time and materials.</div></li>
<li class="hl"><div><b>Daily T&amp;M tickets</b>Date, location, names and hours of each worker, equipment hours, materials with quantities. Signed by the GC's superintendent that day.</div></li>
<li><div><b>Bill only approved changes</b>Track pending changes in a log until they're signed.</div></li>
</ol>`,
  ex: `<p>Photo before, photo during, photo after, with a date stamp. When the superintendent who signed the ticket leaves the job, your photos and tickets still tell the story.</p>`,
  watch: `<p>On public prevailing wage jobs, T&amp;M labor must be at the correct classifications and appear on certified payroll. A ticket with hours that don't match payroll is a red flag to the agency.</p>`
},

{ h: "Coordinating with other trades",
  lead: "Landscape goes in last, but several pieces must happen early. Miss them and you'll be sawcutting and boring.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Before…</th><th>You must…</th></tr></thead>
<tbody>
<tr><td>Paving, curbs, sidewalks and walls</td><td>Install irrigation sleeves for pipe and wire, sized and located per plan, marked at both ends</td></tr>
<tr><td>Building and site electrical rough-in</td><td>Confirm controller power and conduit are in the electrician's scope and location</td></tr>
<tr><td>Fine grading by the grading sub</td><td>Check the grade is within tolerance before you accept the area</td></tr>
<tr><td>Hardscape layout</td><td>Verify sleeve locations with the inspector (a City hold point on K-24-1952)</td></tr>
<tr><td>Backfilling trenches</td><td>Pass the pressure test with the inspector present</td></tr>
<tr><td>Planting</td><td>Finish irrigation, test coverage, complete weed control cycles</td></tr>
</tbody></table></div>`,
  watch: `<p>Before you accept an area from the GC, walk it and note in writing: grade, debris, compacted soil, damaged sleeves, concrete washout. Once you start, you've accepted it. The City's K-24-1952 specs say exactly that: start of work “constitutes acceptance of the conditions.”</p>`,
  src: "City of San Diego K-24-1952-DBB-3-A, landscape Special Provisions."
},

{ h: "Inspections and the punch list",
  lead: "A punch list is the list of items to fix before your work is accepted. Get to it fast and close it in one round.",
  body: `<ol class="steps">
<li><div><b>Self-punch first</b>Walk the job with your foreman before the GC or inspector does. Fix heads, tilt, coverage, missing mulch, dead plants, debris.</div></li>
<li><div><b>Request the inspection</b>With the notice the specs require (the City's K-24-1952 required 3 working days).</div></li>
<li class="hl"><div><b>Get the punch list in writing</b>Number each item, assign it, set a date.</div></li>
<li><div><b>Close it and document it</b>Photo of each completed item; send the closed list back.</div></li>
<li class="hl"><div><b>Get acceptance in writing</b>The date your planting is accepted usually starts the plant establishment period.</div></li>
</ol>`,
  ex: `<p>On K-24-1952, the substantial completion punch list and the punch list completion each had 7 days in the City's inspection table, and punch list completion authorized the start of the maintenance period. A slow punch list delays your establishment start, your completion and your retention.</p>`,
  src: "City of San Diego K-24-1952-DBB-3-A, landscape Special Provisions (site observations)."
},

{ h: "Managing plant establishment",
  lead: "The establishment period is a small job of its own. Manage it with a schedule, a log and photos.",
  body: `<ul>
<li><strong>Know the start date in writing.</strong> On the City's K-24-1952, the 90-calendar-day plant establishment period began with acceptance of the planting installation.</li>
<li><strong>Visit on a schedule.</strong> Weekly is common. Log each visit: date, crew, hours, watering changes, weeds, pests, replacements.</li>
<li><strong>Adjust the controller for the season.</strong> Record every schedule change.</li>
<li><strong>Replace dead plants fast,</strong> with the same species and size.</li>
<li><strong>Photograph the same spots every month.</strong> It proves the site was kept up.</li>
<li><strong>Request the final walk-through</strong> before the period ends, so it doesn't drag on.</li>
</ul>`,
  exLabel: "Real requirements from Caltrans 11-428704 (see Module 15)",
  ex: `<p>A 250-working-day Type 1 establishment period. Four seasonal watering schedules built in the Calsense software. Fertilize the first week of April, July and September. A functional irrigation test with the Engineer every year. Keep the site “neat and presentable… including areas not visible to the public,” plus about 717,000 SF of existing planting. Bidders priced it from $10,000 to $300,000.</p>`,
  watch: `<p>Track your actual establishment hours and costs against what you bid. Establishment is where many landscape bids lose money quietly, one weekly visit at a time.</p>`,
  src: "City of San Diego K-24-1952-DBB-3-A, Special Provisions 6-1.1; Caltrans 11-428704 Special Provisions 20-4."
},

{ h: "Closeout, retention and warranty callbacks",
  lead: "Closeout is paperwork that releases your last dollars. Start it the day you start planting.",
  body: `<div class="twocol">
<div><h3>Closeout package</h3><ul>
<li><strong>As-builts</strong> (record drawings): mark changes daily on a field set; draft clean ones at the end</li>
<li><strong>Controller charts:</strong> reduced, color-coded zone maps, sealed or laminated, in each controller, when the specs require them</li>
<li>Product warranties and O&amp;M manuals</li>
<li>Spare parts or extra stock if specified (heads, nozzles, keys)</li>
<li>Owner training on the controller</li>
<li>Final punch list signed off</li>
</ul></div>
<div><h3>Then get paid</h3><ul>
<li>Bill retention with a conditional final release (8136)</li>
<li>Watch for the notice of completion; calendar your lien or stop payment notice deadline</li>
<li>Follow up weekly until retention is paid</li>
<li>Sign the unconditional final release (8138) only after it clears</li>
</ul></div>
</div>`,
  watch: `<p><strong>Warranty callbacks:</strong> answer every call within a day, fix it, and log it with the cost. A sub who comes back quickly gets invited again. Track callback cost per job: if one GC's jobs always generate callbacks, look for the cause (their maintenance crew? your installation?).</p>`
},

{ h: "Job cost: estimate vs. actual",
  lead: "Every job tests your estimate. Track hours and costs by the same lines you estimated, then compare.",
  exLabel: "Example numbers for practice",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Activity</th><th class="num">Est. hours</th><th class="num">Actual hours</th><th class="num">Difference</th></tr></thead>
<tbody>
<tr><td>Mainline trench and pipe</td><td class="num">120</td><td class="num">104</td><td class="num">−13%</td></tr>
<tr><td>Laterals and heads</td><td class="num">210</td><td class="num">248</td><td class="num">+18%</td></tr>
<tr><td>Planting, 1-gal and 5-gal (600 plants)</td><td class="num">150</td><td class="num">186</td><td class="num">+24%</td></tr>
<tr><td>24" box trees (24)</td><td class="num">48</td><td class="num">46</td><td class="num">−4%</td></tr>
<tr><td><strong>Total</strong></td><td class="num"><strong>528</strong></td><td class="num"><strong>584</strong></td><td class="num"><strong>+10.6%</strong></td></tr>
</tbody></table></div>
<p><strong>The math:</strong> 584 − 528 = 56 extra hours. 56 ÷ 528 = 10.6% over. At an example crew cost of $58 per hour, that's 56 × $58 = <strong>$3,248</strong> of profit lost.</p>
<p><strong>Production rate:</strong> planting was estimated at 600 ÷ 150 = 4.0 plants per hour. Actual: 600 ÷ 186 = 3.2 plants per hour.</p>`,
  ex: `<p><strong>Feed it back:</strong> the foreman's notes say the beds were hard clay and the crew had no auger. Next time: price clay sites at about 3.2 plants per hour, or add an auger rental and keep 4.0. Update your production rate table (Module 9) after every job, and note the conditions that caused the change.</p>`,
  watch: `<p>Job cost only works if crews log hours to the right activity every day. Keep it to 5–10 activity codes that match your estimate lines. Too many codes and the foreman guesses.</p>`
},

{ h: "The biweekly bid review meeting",
  lead: "The company's growth plan calls for a bid review meeting every two weeks. Keep it short, the same agenda every time, and decide things.",
  body: `<p><strong>Who:</strong> owner, estimator, field lead. <strong>How long:</strong> 45–60 minutes. <strong>Bring:</strong> the bid tracker and job cost reports.</p>
<ol class="steps">
<li><div><b>Open bids</b>What's due in the next two weeks, who's doing what, questions and addenda pending.</div></li>
<li class="hl"><div><b>Go / no-go on new invitations</b>Score them with the Module 3 scorecard and decide.</div></li>
<li><div><b>Results since last meeting</b>Won, lost, gap to low, feedback from GCs.</div></li>
<li class="hl"><div><b>Job cost check</b>Active jobs: hours and costs vs. estimate, change orders pending, pay apps outstanding.</div></li>
<li><div><b>One pricing lesson</b>Change one production rate, unit price or markup based on real results. Write it down.</div></li>
<li><div><b>Relationships</b>Which GCs to call, thank or follow up with before next meeting.</div></li>
</ol>`,
  ex: `<p>End every meeting with a short action list: who, what, by when. Start the next meeting by checking it.</p>`
},

{ h: "KPIs: measure the division",
  lead: "Key performance indicators (KPIs) are a few numbers that tell you if bidding is working. Track them monthly.",
  exLabel: "Example numbers for practice: first 6 months",
  body: `<div class="tablewrap"><table>
<thead><tr><th>KPI</th><th>How to calculate</th><th class="num">Example</th></tr></thead>
<tbody>
<tr><td><strong>Bid volume</strong></td><td>Bids submitted per month</td><td class="num">28 ÷ 6 = 4.7</td></tr>

{ t: "terms", h: "Words to know",
  lead: "Add these to your notebook.",
  terms: [
    ["Letter of intent (LOI)", "A GC's written notice that it plans to subcontract with you; not a full contract."],
    ["Notice of award", "The owner's notice that it has awarded the prime contract."],
    ["Subcontract", "Your contract with the GC: scope, price, payment and risk terms."],
    ["Flow-down clause", "Makes you bound to the GC the way the GC is bound to the owner."],
    ["Pay-when-paid", "A clause setting when you're paid after the GC is paid."],
    ["Pay-if-paid", "A clause making the owner's payment a condition of yours; generally unenforceable in California."],
    ["Retention", "Money held back from each payment until the work is complete; usually capped at 5% in California."],
    ["Indemnity", "A promise to defend and pay for certain claims."],
    ["Additional insured", "A policy endorsement that extends your insurance to the GC or owner."],
    ["Submittal", "Product data, samples or tests sent for approval before ordering."],
    ["Schedule of values (SOV)", "Your contract price split into lines for billing."],
    ["Pay application", "Your monthly bill showing percent complete by SOV line."],
    ["Preliminary notice", "The 20-day notice that preserves lien, stop payment and bond rights."],
    ["Mechanics lien", "A claim against private property for unpaid work."],
    ["Stop payment notice", "A notice that makes the owner or agency hold funds for an unpaid claimant."],
    ["Conditional release", "A lien release that takes effect only when you're paid."],
    ["Unconditional release", "A lien release that takes effect when signed, paid or not."],
    ["T&amp;M ticket", "A daily record of time and materials for extra work, signed by the GC."],
    ["Punch list", "The list of items to fix before work is accepted."],
    ["As-builts", "Drawings showing what was actually installed."],
    ["Job cost", "Tracking actual hours and costs against the estimate."],
    ["KPI", "Key performance indicator: a number that measures how the division is doing."]
  ]
},

<li>In California, pay-if-paid is generally unenforceable, primes must pay subs promptly, and retention is usually capped at 5%.</li>
<li>Submit early and completely; hold the precon to get names, dates and hold points.</li>
<li>Bill monthly from a fair schedule of values; know the retention math.</li>
<li>Send preliminary notices, use conditional releases, and never sign unconditional before you're paid.</li>
<li>Document changes the same day; put sleeves in before paving; close punch lists fast.</li>
