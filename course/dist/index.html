{ h: "When the numbers don't match",
  lead: "Small differences are normal. Your job is to sort them into three groups: rounding, your mistake, or a real question for the owner.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Item (11-428704)</th><th class="num">Plan table</th><th class="num">Bid item</th></tr></thead>
<tbody>
<tr><td>Replace valve box cover labels</td><td class="num">197</td><td class="num">200</td></tr>
<tr><td>PVC pipe conduit</td><td class="num">282 LF</td><td class="num">290 LF</td></tr>
<tr><td>10" CHDPE conduit</td><td class="num">366 LF</td><td class="num">370 LF</td></tr>
<tr><td>Tree well sprinkler assembly</td><td class="num">172</td><td class="num">180</td></tr>
<tr><td>Gate valves, flow sensors, RCVs, air release valves, controllers</td><td class="num">same</td><td class="num">same</td></tr>
</tbody></table></div>
<ol class="steps">
<li><div><b>Look for a pattern</b>On this job, several bid quantities are the plan total rounded up to the next 10. That looks like rounding, not a missing item.</div></li>
<li><div><b>Recheck your own count</b>If your takeoff differs from both, your count is the first suspect.</div></li>
<li class="hl"><div><b>Ask about real gaps</b>If a difference can't be explained, send a bidder inquiry or RFI before bid day (Module 12).</div></li>
<li><div><b>Know how the item is paid</b>Measured items are paid on what you actually install. “(F)” final pay items are paid at the bid quantity, so errors there hit your profit directly (Module 15). On this job the rounded items are measured items; the (F) pipe items match the plan tables to the foot.</div></li>
</ol>`,
  watch: `<p>On a lump-sum private bid there is no owner's quantity. Your takeoff is the only number, and every mistake is yours. Check yourself with a second count or a second person on the high-dollar items.</p>`,
  src: "11-428704 IQ-1, IQ-2 and Bid Item List items 48, 51, 66, 67."
},

{ h: "Bid forms and takeoff tools",
  lead: "How the owner wants the price shown changes what you do with the takeoff. The tools you use to count are your choice.",
  body: `<div class="twocol">
<div><h3>Unit-price bid forms</h3><ul>
<li>Common on Caltrans, city and water district jobs</li>
<li>The owner gives the items and quantities. You give a price per unit.</li>
<li>You still do a takeoff, to check their quantities and to price things that have no item</li>
<li>Your total = sum of (unit price × owner's quantity)</li>
</ul></div>
<div><h3>Lump-sum bids</h3><ul>
<li>Common with GCs on private jobs</li>
<li>You give one price for the whole scope, sometimes with a breakdown (schedule of values)</li>
<li>Your takeoff is the quantity. Errors are yours.</li>
<li>GCs may ask for unit prices for adds and deducts (Module 13)</li>
</ul></div>
</div>
<div class="tablewrap"><table>
<thead><tr><th>Tool</th><th>Good for</th><th>Watch out for</th></tr></thead>
<tbody>
<tr><td>Paper prints, scale, highlighters, counter</td><td>Learning, small jobs, job walks</td><td>Half-size prints; scale must match the print</td></tr>
<tr><td>PDF markup software with count, length and area tools</td><td>Most commercial work; marks stay with the file</td><td>Calibrate the scale on every sheet</td></tr>
<tr><td>Dedicated takeoff software</td><td>High volume, linking takeoff to pricing</td><td>Cost and learning time; garbage in, garbage out</td></tr>
<tr><td>Spreadsheet</td><td>Organizing and totaling, any method above</td><td>Formula errors; lock and check totals</td></tr>
<tr><td>AI tools</td><td>Pulling spec requirements, summarizing legends and notes</td><td>Check every number against the sheets yourself</td></tr>
</tbody></table></div>`
},

{ t: "terms", h: "Words to know",
  lead: "Takeoff words you'll use on every irrigation bid.",
  terms: [
    ["Takeoff", "The list of every item on the plans, counted or measured, with units. No prices."],
    ["Legend", "The table that explains each symbol on the plans."],
    ["POC (point of connection)", "Where the irrigation system connects to the water supply."],
    ["Backflow preventer", "An assembly that keeps irrigation water from flowing back into the drinking water supply."],
    ["RCV", "Remote control valve; opens and closes a zone when the controller signals it."],
    ["Master valve", "A valve near the POC that keeps the mainline closed when no zone is running."],
    ["Mainline", "Pipe that is always under pressure, from the POC to the valves."],
    ["Lateral", "Pipe downstream of a valve, pressurized only when the zone runs."],
    ["Schedule 40", "PVC pipe with a set wall thickness for each size."],
    ["Class 200 / Class 315", "PVC pipe rated by pressure (200 or 315 psi) at every size."],
    ["Sleeve", "A larger pipe placed under paving so pipe or wire can be pulled through later."],
    ["Bore / jack", "Pushing pipe under existing paving without cutting it."],
    ["Two-wire", "A control system using one two-wire cable and a decoder at each valve."],
    ["Common wire", "The shared return wire for all valves in a conventional system."],
    ["Thrust block", "Concrete placed at fittings on gasketed mainline to resist water pressure."],
    ["Inline drip tubing", "Tubing with emitters built in at a set spacing."],
    ["Waste factor", "Extra quantity added for cut-offs and losses, kept separate from the net quantity."],
    ["Assembly", "A device priced together with all the parts the detail shows."],

{ h: "Groundcover by area and spacing",
  lead: "Groundcover is drawn as a shaded area with a spacing. You measure the area and use a formula to get the number of plants.",
  body: `<div class="twocol">
<div><h3>Square spacing</h3><ul>
<li>Plants in rows and columns, like a grid</li>
<li>Each plant uses a square s × s</li>
<li><strong>Plants per SF = 1 ÷ s²</strong></li>
<li>s = spacing in feet</li>
</ul></div>
<div><h3>Triangular spacing</h3><ul>
<li>Each row offset by half a space, so every plant is s from its neighbors</li>
<li>Each plant uses 0.866 × s² (rows are only 0.866 × s apart)</li>
<li><strong>Plants per SF = 1.155 ÷ s²</strong></li>
<li>About 15.5% more plants than square</li>
</ul></div>
</div>
<div class="tablewrap"><table>
<thead><tr><th>Spacing</th><th class="num">s²</th><th class="num">Square (per SF)</th><th class="num">Triangular (per SF)</th></tr></thead>
<tbody>
<tr><td>12" (1 ft)</td><td class="num">1</td><td class="num">1.000</td><td class="num">1.155</td></tr>
<tr><td>18" (1.5 ft)</td><td class="num">2.25</td><td class="num">0.444</td><td class="num">0.513</td></tr>
<tr><td>24" (2 ft)</td><td class="num">4</td><td class="num">0.250</td><td class="num">0.289</td></tr>
<tr><td>36" (3 ft)</td><td class="num">9</td><td class="num">0.111</td><td class="num">0.128</td></tr>
</tbody></table></div>`,
  deeper: `<p>Where 1.155 comes from: in triangular spacing, rows are s × sin 60° = 0.866 × s apart, and plants in each row are s apart. So each plant uses 0.866 × s² of area, and plants per SF = 1 ÷ (0.866 × s²) = 1.1547 ÷ s². Rounded, 1.155 ÷ s².</p>`,
  watch: `<p>If the plan doesn't say square or triangular, look at the planting detail. Triangular is common for groundcover. If nothing says, ask, or state your assumption in the proposal. The difference is 15% of the plants.</p>`
},

{ h: "Spacing math, worked",
  lead: "Two worked examples: one made up, one from a real Caltrans job.",
  body: `<p><strong>Example 1 (made up):</strong> a 3,600 SF bed of rosemary groundcover, #1 containers at 36" on center, triangular.</p>
<ul>
<li>s = 3 ft, s² = 9</li>
<li>Triangular: 3,600 × 1.155 ÷ 9 = <strong>462 plants</strong></li>
<li>Square would be 3,600 ÷ 9 = 400 plants: 62 fewer</li>
<li>Edge setback: the detail says the first row is 18" from the curb, and 240 LF of the bed is along a curb. Take out 240 × 1.5 = 360 SF. Net area 3,240 SF × 1.155 ÷ 9 = 415.8, so <strong>416 plants</strong>.</li>
</ul>
<p><strong>Example 2 (real, 11-428704):</strong> the plant legend on PL-1 lists iceplant cuttings (Group H) at 1 ft on center over planting areas of 37,980 SF and 14,020 SF = 52,000 SF.</p>
<ul>
<li>Square: 52,000 × 1.000 = 52,000 cuttings</li>
<li>Triangular: 52,000 × 1.155 = <strong>60,060 cuttings</strong></li>
<li>The original bid item said 60,015, close to the triangular figure. The callouts on the planting sheets add up to 61,975, and Addendum 1 changed the bid item to that number.</li>
</ul>`,
  watch: `<p>When the plans also give callouts, an area-and-spacing count is your check. When they disagree, use the callouts the owner pays on, and ask about the difference. On 11-428704 Group H was an (F) final pay item, so the bid quantity was the paid quantity.</p>`,
  src: "11-428704 plans PL-1, PP-1 to PP-7, PQ-1; Addendum 1 (Aug 27, 2021); Bid Summary item 25 (F)."
},

{ h: "Soil prep and amendments",
  lead: "Soil prep is taken off by area, then turned into material quantities using rates from the specs or the soils report.",
  body: `<ol class="steps">
<li><div><b>Measure the planting area in SF</b>All planted beds and turf areas. Leave out paving, DG and rock areas unless the spec says to prep them.</div></li>
<li><div><b>Find the rates</b>The spec (32 91 13 on private jobs) or the agronomic soils report gives amendments per 1,000 SF, tilling depth and fertilizer rates. Some say “per the soils report,” which means you need the report.</div></li>
<li class="hl"><div><b>Material = area ÷ 1,000 × rate</b>Example: 21,400 SF at 4 CY per 1,000 SF = 21.4 × 4 = 85.6 CY.</div></li>
<li><div><b>Add plant pit backfill</b>If the detail calls for amended backfill per plant, take it off per plant size.</div></li>
<li><div><b>Fine grading</b>SF of finish grading in planting areas. Note if rough grading is by the GC or by you.</div></li>
<li><div><b>Soil tests</b>Count the samples the spec asks for, before and after amending.</div></li>
</ol>`,
  watch: `<p>If the spec says “amend per soils report” and no report is in the bid set, you can't take off the amendments. Ask for the report in an RFI, or state the rate you assumed in your proposal.</p>`,
  deeper: `<p>Unit conversions to keep handy: 1 CY = 27 CF. 1 acre = 43,560 SF. 1 SQYD = 9 SF. Caltrans often measures weed germination in SQYD and compost in CY; private specs usually use SF and CY.</p>`
},

{ h: "Compost by the acre: real math",
  lead: "On 11-428704, compost was 200 CY per acre. Here's how to turn that into quantities and check the engineer's numbers.",
  body: `<ol class="steps">
<li><div><b>Per 1,000 SF</b>1 acre = 43,560 SF. 200 CY ÷ 43.56 = <strong>4.59 CY per 1,000 SF</strong>.</div></li>
<li><div><b>Depth</b>200 CY × 27 = 5,400 CF spread over 43,560 SF = 0.124 ft = <strong>about 1.5 inches</strong>.</div></li>
<li class="hl"><div><b>Real check, sheet PP-7</b>The compost callout covers 310 SQYD. 310 × 9 = 2,790 SF. 2,790 ÷ 43,560 = 0.064 acre. 0.064 × 200 = 12.8 CY. The plan says <strong>13 CY</strong>.</div></li>
<li><div><b>Real check, sheet PP-1</b>440 SQYD × 9 = 3,960 SF ÷ 43,560 = 0.091 acre × 200 = 18.2 CY. PQ-1 says <strong>18 CY</strong>.</div></li>
</ol>`,
  ex: `<p>PQ-1 lists compost by sheet: 18 + 62 + 53 + 7 + 45 + 84 + 13 = <strong>282 CY</strong>. The bid item (68) is 290 CY.</p>
<p>Notice on PP-7 that weed germination covers 500 SQYD but compost only 310 SQYD of it. Compost goes only where the callouts say, so you can't just multiply the whole weed germination area by the rate.</p>`,
  src: "11-428704 plans PL-1 (Application and Sequence of Work: compost 200 CY/acre), PP-1, PP-7, PQ-1; Bid Item 68."
},

{ h: "Mulch: square feet to cubic yards",
  lead: "Mulch is sold by the cubic yard but drawn as an area. One formula does the conversion.",
  body: `<p style="font-size:1.15em"><strong>CY = SF × depth in inches ÷ 324</strong></p>
<p>Why 324? A cubic yard is 27 CF, and there are 12 inches in a foot. 27 × 12 = 324. So SF × (inches ÷ 12) ÷ 27 = SF × inches ÷ 324.</p>
<div class="tablewrap"><table>
<thead><tr><th>Area</th><th>Depth</th><th>Math</th><th class="num">CY</th></tr></thead>
<tbody>
<tr><td>1,000 SF</td><td>3"</td><td>1,000 × 3 ÷ 324</td><td class="num">9.26</td></tr>
<tr><td>19,000 SF</td><td>3"</td><td>19,000 × 3 ÷ 324</td><td class="num">175.9</td></tr>
<tr><td>2,000 SF</td><td>2"</td><td>2,000 × 2 ÷ 324</td><td class="num">12.3</td></tr>
<tr><td>Reverse: 82 CY</td><td>3"</td><td>82 × 324 ÷ 3</td><td class="num">8,856 SF covered</td></tr>
</tbody></table></div>
<p>Shortcut: at 3" deep, 1 CY covers 108 SF.</p>`,
  ex: `<p>Real example (11-428704): the plan calls for wood chip mulch 3" deep. PQ-1 shows 120 CY of area mulch (20 CY on PP-6 and 100 CY on PP-7) plus 65 CY of basin mulch around individual plants = <strong>185 CY</strong>. The bid item (31) is 190 CY. On PP-7, the 100 CY is two callouts: 18 CY and 82 CY.</p>`,
  watch: `<p>Mulch settles, and suppliers' loads aren't exact. Many estimators add a small allowance for settling and spreading loss. That's a practice number you set from your own jobs, kept in its own column.</p>`,
  src: "11-428704 plans PL-1 (wood chip, 3\" depth), PP-7, PQ-1; Bid Item 31."
},

{ h: "DG, rock, gravel and boulders",
  lead: "Caltrans pays these by the square foot, but suppliers sell them by the ton or yard. Take off the area, then convert.",
  body: `<ol class="steps">
<li><div><b>Measure the area by type</b>Each rock size or DG type is its own line. Rock mulch Type 1, 2 and 3 are different items.</div></li>
<li><div><b>Get the depth from the detail</b>DG paving might be 3" compacted; rock mulch 3" to 6"; cobble by size.</div></li>
<li class="hl"><div><b>CY = SF × inches ÷ 324</b>Same formula as mulch.</div></li>
<li><div><b>Convert to what the supplier sells</b>Ask the supplier how many tons per CY for that material. Weights vary by rock type and size.</div></li>
<li><div><b>Add compaction for DG</b>DG is delivered loose and compacted in place. Use an allowance from the supplier or your jobs.</div></li>
<li><div><b>Add the extras</b>Filter fabric under rock (SF plus overlap), stabilizer for DG, edging around it.</div></li>
<li><div><b>Boulders</b>Count by size (example: 2'–3', 3'–4', 4'–5'). Weight sets the equipment you'll need.</div></li>
</ol>`,
  ex: `<p>Real Caltrans units: on 11-422004 (I-5 Carmel Valley), 20 decorative boulders (EA), rock mulch Type 1 (1,910 SQFT) and Type 2 (1,330 SQFT), edging (240 LF). On 11-430674, decomposed granite was 55,900 SQFT and gravel mulch 204,000 SQFT.</p>`,
  watch: `<p>Don't guess the weight of rock. Get the conversion from the supplier who will quote it, in writing. Module 8 covers supplier quotes.</p>`,
  src: "Caltrans Bid Item Lists, contracts 11-422004 (items 19, 24, 25, 27) and 11-430674 (items 44, 45)."

{ h: "Weed control and weed germination",
  lead: "Weed work is taken off by area, then multiplied by the number of treatments or cycles the spec calls for.",
  body: `<ul>
<li><strong>Weed abatement:</strong> clearing and killing existing weeds before work. SF (or SQYD) of area.</li>
<li><strong>Weed germination (grow-and-kill):</strong> water the soil to sprout weeds, then kill them, before planting. Take off the area, count the cycles the spec requires, and note the waiting time.</li>
<li><strong>Pre-emergent herbicide:</strong> SF of area times the number of applications, if specified.</li>
<li><strong>Removing existing groundcover:</strong> its own line where the plans call for it.</li>
</ul>`,
  ex: `<p>Real example (11-428704): weed germination was 7,020 SQYD (= 63,180 SF), and PQ-1 and the bid item match exactly. The specs say: “Do not perform planting work in weed germination areas for a period of 21 days after irrigation systems have been installed,” keep the soil moist enough to germinate weeds, and control the weeds that sprout with pesticides. That's three weeks of watering and a pesticide application before you plant.</p>`,
  watch: `<p>Weed germination costs time as well as labor. The quantity is SF, but the cost includes the irrigation running, the wait and the return trip. Note the duration in your takeoff so pricing doesn't miss it.</p>`,
  src: "11-428704 Special Provisions 20-1.03E; plans PQ-1; Bid Item 21."
},

{ h: "Turf, seed, hydroseed and erosion control",

  body: `<div class="tablewrap"><table>
<thead><tr><th>Item</th><th>Takeoff</th><th>Material math</th></tr></thead>

<tr><td>Sod</td><td>SF of turf area</td><td>SF plus a small cutting allowance; suppliers sell by SF or by pallet</td></tr>

<tr><td>Bonded fiber matrix</td><td>SF of slope</td><td>By rate per acre from the spec</td></tr>
<tr><td>Erosion control blanket or jute</td><td>SF of slope</td><td>Add overlaps and anchor trench per detail; count staples</td></tr>
<tr><td>Fiber rolls</td><td>LF along the contour lines shown</td><td>Count stakes per roll per detail</td></tr>
</tbody></table></div>`,
  ex: `<p><strong>Seed math (made-up example):</strong> 12,000 SF of native seed at 4 LB per 1,000 SF = 12 × 4 = <strong>48 LB</strong>. If the spec gives 40 LB per acre: 12,000 ÷ 43,560 = 0.275 acre × 40 = 11 LB.</p>

  watch: `<p>Hydroseed rates are often per acre while areas are in SF. Convert carefully: divide SF by 43,560 to get acres. A slip here is a factor of 43 or more.</p>`,

{ h: "Plant establishment and maintenance quantities",
  lead: "Care after planting is priced from time. Take off the duration, the visits and the area you'll care for.",
  body: `<ol class="steps">
<li><div><b>Find the duration</b>The spec gives the establishment period (days, working days or months) and any maintenance period after it.</div></li>
<li class="hl"><div><b>Turn it into visits</b>Visits = duration ÷ how often you go. 90 days weekly is about 13 visits.</div></li>
<li><div><b>Area and count</b>The SF you maintain and the number of plants you'll replace if they die.</div></li>
<li><div><b>List the tasks per visit</b>Watering checks, weeding, pest control, irrigation checks, trash, reports.</div></li>
<li><div><b>List the one-time tasks</b>Fertilizing on set dates, seasonal schedules, final walk.</div></li>
<li><div><b>Water and power</b>Who pays for water during establishment? Note it.</div></li>
</ol>`,

  watch: `<p>Bidders on 11-428704 priced plant establishment from $10,000 to $300,000 (Module 15). A takeoff of duration, visits and tasks is what keeps your number grounded.</p>`,

{ t: "terms", h: "Words to know",
  lead: "Planting and soil takeoff words.",
  terms: [
    ["Callout", "A label on the plan giving a quantity and plant code, like “50 AEO HAW.”"],
    ["On center (o.c.)", "The distance from the center of one plant to the center of the next."],
    ["Square spacing", "Plants in a grid. Plants per SF = 1 ÷ s²."],
    ["Triangular spacing", "Rows offset by half a space. Plants per SF = 1.155 ÷ s²."],
    ["Plant group", "Caltrans letter for a container size, like A (1-gallon) or K (24\" box)."],
    ["Container size", "#1, #5, #15, 24\" box and so on. Each size is its own line."],
    ["Cutting", "A piece of a plant, like iceplant, planted to root (Caltrans Group H)."],
    ["Root barrier", "A panel along paving or around a root ball that guides roots down."],
    ["Soil amendment", "Material like compost mixed into soil to improve it, at a rate per area."],
    ["Agronomic soils report", "A lab report on soil samples that sets amendment and fertilizer rates."],
    ["Fine grading", "Final shaping of the soil surface before planting."],
    ["Weed germination", "Watering to sprout weeds, then killing them, before planting."],
    ["Mulch", "A layer of wood chips, bark or rock over the soil."],
    ["324", "The number to divide SF × inches by to get cubic yards."],
    ["DG (decomposed granite)", "Crushed granite used for paths and paving, compacted in place."],
    ["Hydroseed", "Seed, fiber mulch, tackifier and fertilizer sprayed on as a slurry."],
    ["Bonded fiber matrix", "A sprayed erosion control cover that bonds to the soil."],
    ["Fiber roll", "A rolled tube of fiber staked along a slope to slow runoff."],
    ["Plant establishment", "The period after planting when the contractor waters and cares for the plants."],
    ["C-27", "California landscaping contractor license; its scope is set in 16 CCR §832.27."]
  ]
},

{ t: "quiz", id: "m7", h: "Check yourself",
  lead: "Tap an answer to check it. Keep a calculator handy.",
  qs: [
    { q: "How many plants are needed for 1,800 SF at 18\" on center, triangular?", a: ["About 800", "About 924", "About 1,200"], c: 1, why: "1,800 × 1.155 ÷ 2.25 = 924." },
    { q: "How many cubic yards of mulch for 5,400 SF at 3 inches deep?", a: ["About 17 CY", "About 50 CY", "About 150 CY"], c: 1, why: "5,400 × 3 ÷ 324 = 50 CY." },
    { q: "Why do you divide by 324 to get cubic yards from SF and inches?", a: ["It's a supplier rule", "27 CF per CY × 12 inches per foot = 324", "It includes waste"], c: 1, why: "SF × (inches ÷ 12) ÷ 27 is the same as SF × inches ÷ 324." },
    { q: "Compost is specified at 200 CY per acre. About how much is that per 1,000 SF?", a: ["2 CY", "4.6 CY", "20 CY"], c: 1, why: "200 ÷ 43.56 = 4.59 CY per 1,000 SF." },
    { q: "On 11-428704, PQ-1 shows 185 CY of wood mulch and the bid item is 190 CY. What is the likely reason?", a: ["Rounding up of the plan total", "A missing planting sheet", "Waste added by Caltrans"], c: 0, why: "Many items on this job are the plan total rounded up (1,458 → 1,460, 282 → 290)." },
    { q: "A 24\" box tree and a 36\" box tree of the same species should be:", a: ["One line, since it's the same plant", "Two separate lines", "Counted as plant groups only"], c: 1, why: "Different sizes have different prices, labor and equipment." },
    { q: "The Group H callouts on 11-428704 added up to 61,975, but the original bid item said 60,015. What happened?", a: ["Nothing, Caltrans pays the actual count", "Addendum 1 changed the bid item to 61,975", "The bidders had to use 60,015"], c: 1, why: "The addendum replaced PQ-1 and the bid item to match the callouts." },
    { q: "The spec says “amend per the soils report,” and there's no report in the bid set. What should you do?", a: ["Guess a rate and say nothing", "Ask for the report in an RFI, or state your assumed rate in the proposal", "Leave amendments out"], c: 1, why: "You can't take off a rate you don't have. Ask, or make your assumption visible." }
  ]
},

{ t: "practice", id: "m7", h: "Practice assignments",
  lead: "A real planting takeoff on a Caltrans sheet, math drills, and a template you'll reuse.",
  items: [
    { h: "Read the plant legend", hrs: 0.5, d: "<p>Open <a href=\"#lab-11-428704\">Real Bid Lab · 11-428704</a> and the plans. On sheet PL-1 (PDF page 47), list each plant with its group, spacing, per-plant rates (packet fertilizer, iron sulfate, basin mulch) and remarks. Read the Application and Sequence of Work table.</p>" },
    { h: "Take off sheet PP-7", hrs: 1.25, d: "<p>On sheet PP-7 (PDF page 54), add up every callout: plants by code, weed germination SQYD, wood mulch CY, compost CY and temporary protection fence LF. Convert plant codes to Groups A and B with the legend. Then compare to the PP-7 row of PQ-1 (Addendum 1 version): 500 SQYD weed germination, 100 CY wood mulch, 13 CY compost, 600 LF fence. Explain any difference.</p>" },
    { h: "Check PQ-1 against the bid items", hrs: 0.5, d: "<p>For every item on PQ-1, find the matching bid item and write both numbers side by side. Mark each difference as rounding, error or question. Write one bidder inquiry for the item you'd most want answered.</p>" },
    { h: "Mulch and compost drills", hrs: 0.75, d: "<p>Work these, showing the math: (1) 6,500 SF at 3\". (2) 2,000 SF at 2\". (3) How many SF does 82 CY cover at 3\"? (4) Compost at 200 CY/acre on 310 SQYD. (5) Compost depth in inches at 200 CY/acre. (6) Cobble at 4\" on 2,750 SF. Answers: 60.2 CY; 12.3 CY; 8,856 SF; 12.8 CY; about 1.5\"; 34.0 CY.</p>" },
    { h: "Spacing drills", hrs: 0.5, d: "<p>Work square and triangular counts for: 3,600 SF at 24\"; 10,000 SF at 12\"; 850 SF at 18\"; 52,000 SF at 1 ft. Then redo the first one with an 18\" setback along 200 LF of curb. Answers: 900 / 1,040; 10,000 / 11,550; 378 / 436; 52,000 / 60,060; setback net 3,300 SF → 825 / 953.</p>" },
    { h: "Take off a local planting plan", hrs: 1, d: "<p>Use a planting sheet from a current San Diego public bid (for example the City of San Diego's <a href=\"https://www.sandiego.gov/cip/bidopps\" target=\"_blank\" rel=\"noopener\">bid opportunities</a>) or a GC invitation. Take off plants by size, soil prep SF, amendments, mulch CY and any DG or rock. Use the rates from that job's specs, not from this module.</p>" },
    { h: "Build your planting takeoff tab", hrs: 0.5, d: "<p>Add a planting tab to the spreadsheet you built in Module 6: plants by size, tree extras, area items with formulas for SF × inches ÷ 324 and area × spacing. Enter this module's worked example and check that your totals match.</p>" }

{ h: "Module 7 summary",
  lead: "You can now take off a planting plan and turn areas into the materials you'll buy.",
  body: `<ul>
<li>Count plants by symbol or callout, one line per species per size. Caltrans pays by plant group letter.</li>
<li>Groundcover: square = 1 ÷ s² per SF, triangular = 1.155 ÷ s² per SF. Take out edge setbacks.</li>
<li>Trees carry stakes, root barrier, basins and per-tree rates. Read the detail.</li>
<li>Soil prep and amendments: area ÷ 1,000 × rate, from the spec or soils report. 200 CY per acre = 4.59 CY per 1,000 SF.</li>
<li>Mulch, DG and rock: CY = SF × inches ÷ 324. Get weight conversions from the supplier.</li>
<li>Weed germination, establishment and maintenance are priced from area and time: cycles, days and visits.</li>
<li>Check against the engineer's quantity sheet. Most small differences are rounding; real gaps get asked about before bid day.</li>
</ul>
<p><strong>Next: Module 8 · Pricing Materials and Working with Suppliers</strong></p>`
}
]
});

</ol>
<p>Material is the easiest block to get right, because suppliers will tell you the price in writing. Use that.</p>`,
  watch: `<p>The most common material mistake is pricing from an old invoice. PVC, copper wire and brass prices can move a lot in a few months. If the number isn't from a quote or a price list updated in the last 90 days, call for a new one.</p>`
},

{ h: "Three kinds of prices",
  lead: "The same valve can have three different prices. Know which one you're looking at.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Kind</th><th>What it is</th><th>When to use it</th></tr></thead>
<tbody>
<tr><td><strong>List price</strong> (retail, MSRP)</td><td>The published price anyone pays at the counter</td><td>Almost never for bidding. It's the starting point for discounts.</td></tr>
<tr><td><strong>Contractor price</strong> (account pricing, price tier)</td><td>The discount your company gets on its account, based on how much you buy. Bigger buyers get better tiers.</td><td>Small jobs, quick checks, your price list</td></tr>
<tr><td><strong>Project quote</strong> (job quote, bid quote)</td><td>A written price for one job's full material list, often below your normal tier because of the volume</td><td>Every commercial bid of any size</td></tr>
</tbody></table></div>
<p>A project quote is usually the lowest price and the only one in writing for that job. On a bid, always ask for one.</p>`,
  ex: `<p>Ask your counter rep two questions when you open an account: “What price tier are we on?” and “What volume moves us to the next tier?” A new commercial division may start on a low tier. Project quotes help you get better pricing even before your volume grows.</p>`
},

{ h: "Nurseries and tree growers",

  body: `<ul>
<li><strong>Wholesale nurseries</strong> sell to licensed contractors at trade prices. You'll need a resale or contractor account. Examples in the county: <strong>Village Nurseries</strong> (San Diego landscape center on Governor Drive, formerly Miramar Wholesale Nurseries) and <strong>Devil Mountain Wholesale Nursery</strong> (Carmel Valley Rd, a SiteOne partner).</li>
<li><strong>Specialty and native growers</strong> for California natives, succulents and erosion-control plants. Caltrans and City jobs often specify natives.</li>
<li><strong>Tree growers and brokers</strong> for 24" box and larger trees. Big boxes may come from growers outside the county. Freight is a real cost.</li>
<li><strong>Plant brokers</strong> find and assemble large orders from several growers. Useful when one nursery can't fill the list.</li>
</ul>`,
  ex: `<p>For 11-428704 you'd have needed 1,460 one-gallon plants, 110 five-gallon ghost aloes, 43 Canary Island and Eldarica pines in 24" boxes, and 61,975 iceplant cuttings. One phone call won't cover that. Send the plant list to two or three nurseries the week you decide to bid.</p>`,
  watch: `<p>Nursery names and ownership change often. Confirm current locations, hours and trade-account rules on each nursery's website before you list them in an estimate.</p>`,
  src: "Village Nurseries acquisition of Miramar Wholesale Nurseries (trade press, 2013); SiteOne branch locator, store 1215 (Devil Mountain, 4343 Carmel Valley Rd); 11-428704 plans PL-1."
},

{ h: "Soil, mulch, compost and rock yards",
  lead: "Bulk materials are priced by the cubic yard or ton, and the delivery often costs as much as the material.",
  body: `<ul>
<li><strong>Compost and mulch:</strong> the City of San Diego's <a href="https://www.sandiego.gov/environmental-services/miramar/greenery/cmw" target="_blank" rel="noopener">Miramar Greenery</a> sells compost, mulch and wood chips by the cubic yard. Its posted prices include sales tax. Private composters and mulch yards also deliver by the truckload.</li>
<li><strong>Soil and amendments:</strong> soil yards sell planting mix, topsoil and amendments. Ask for a soil test or product data sheet if the specs set organic content or other limits.</li>
<li><strong>Rock, gravel, cobble, boulders and DG:</strong> landscape rock yards and quarries. Boulders are often priced by the ton; get the weight range.</li>
</ul>
<p>Ask every bulk yard: price per CY or ton, truck size (10, 20 or 40 CY loads), delivery charge per load, and how far they'll deliver.</p>`,
  ex: `<p>Practice numbers (made up for training): 190 CY of wood mulch at $28/CY = $5,320. Delivered in 40 CY loads: 5 loads × $225 = $1,125. Freight adds about 21% to the material. On 11-428704, the winning bidder subcontracted the wood mulch item.</p>`,
  watch: `<p>Check if a price is per CY or per ton, and if it includes tax. Miramar Greenery prices include tax; most private yards add it on the invoice. Don't add tax twice.</p>`,
  src: "City of San Diego, Miramar Greenery Products, Pricing and Pickup page; 11-428704 Bid Summary (subcontractor list)."
},

{ h: "Requesting a quote: what to send",
  lead: "Suppliers can only quote what you give them. A complete package gets a fast, accurate quote.",
  body: `<ol class="steps">
<li class="hl"><div><b>Your takeoff list</b>Every item with size, model, quantity and unit. Same order as your estimate, so the quote drops right in.</div></li>
<li><div><b>The specs that matter</b>The spec sections (for example 32 84 00 Planting Irrigation, 32 93 00 Plants) and the irrigation legend sheet. Note any “no substitutions” items.</div></li>
<li><div><b>Plans, if they ask</b>Most reps want at least the legend and details.</div></li>
<li><div><b>Delivery location</b>Job address or nearest cross streets. City matters for tax and freight.</div></li>
<li><div><b>Schedule</b>When you'd need material: “Irrigation about March, planting about May.”</div></li>
<li><div><b>Bid date and quote deadline</b>Ask for the quote 3 to 5 days before your bid is due.</div></li>
<li><div><b>Project name and owner</b>Public or private, and the GC if you know it.</div></li>
</ol>`,
  watch: `<p>Never send just “please quote the irrigation on the attached plans.” Without your takeoff, each supplier counts its own quantities, and you can't compare their prices.</p>`
},

{ h: "What a good quote must show",
  lead: "A number without terms is a guess. Read every quote for these items before you use it.",
  body: `<div class="twocol">
<div><h3>Prices</h3><ul>
<li>Unit price for every line, not just a total</li>
<li>Exact model numbers (and if they match the specs)</li>
<li>Quantity and unit for each line</li>
<li>Sales tax shown or clearly excluded</li>
<li>Delivery or freight charge</li>
<li>Minimum order or small-order charges</li>
</ul></div>
<div><h3>Terms</h3><ul>
<li><strong>Expiration date</strong> (how long the prices are good)</li>
<li><strong>Lead times</strong> (how long from order to delivery)</li>
<li><strong>Exclusions</strong> (what isn't included)</li>
<li><strong>Substitutions</strong> (any item swapped for an “equal”)</li>
<li>Returns and restocking fees</li>
<li>Payment terms (net 30, credit card, COD)</li>
</ul></div>
</div>`,
  ex: `<p>A quote says “Valid 30 days.” Your bid date is in 10 days, award is 45 days after that, and irrigation starts 60 days after award. That price will be long expired when you buy. See the price-risk slide below.</p>`,
  watch: `<p>Read the fine print for “prices subject to change,” “stock on hand only” or “freight to be determined.” Each one means the number can still move.</p>`
},

{ h: "Sales tax: who pays it",
  lead: "In California, a contractor who furnishes and installs materials usually pays the sales tax on them. Put it in your bid; don't add it to the customer's bill.",
  body: `<ul>
<li>California treats a construction contractor as the <strong>consumer</strong> of the materials it furnishes and installs. You pay sales tax when you buy them (or use tax if the seller didn't charge it).</li>
<li>So tax is a <strong>cost</strong> in your estimate, like freight. It goes into your unit prices. You don't add a “sales tax” line on top of a lump-sum price.</li>
<li>Pipe, fittings, wire, valves, mulch, soil and rock are typical materials.</li>
<li>Plants, trees and shrubs are treated differently: CDTFA generally treats them as <strong>fixtures</strong>, which makes the landscape contractor the retailer. On a lump-sum job, tax is generally measured by your cost of the plants. For bidding, the effect is the same: budget tax on your plant cost.</li>
</ul>`,
  watch: `<p>Whether you buy plants tax-paid or with a resale certificate, and whether you need a seller's permit, is a question for your CPA. Get it settled before your first commercial job. A wrong setup can mean paying tax twice or owing it later in an audit.</p>`,
  deeper: `<p>CDTFA Publication 9 (Construction and Building Contractors, Feb. 2025): “Construction contractors are always the consumers of materials that they furnish and install in the performance of a lump sum contract.” Its section on landscape contractors says: “Plants, trees, and shrubs are generally considered fixtures, and the contractor is considered the retailer of these items when they are installed in connection with their services… In the case of lump sum contracts, the selling price of the plants, trees, and shrubs is generally regarded as the cost price to the landscape contractor.” Sod and flowers are generally materials. The legal rule is Regulation 1521, Construction Contractors (materials in Appendix A, fixtures in Appendix B). Time-and-material contracts can change who is the retailer; read Publication 9 if you bill that way.</p>`,
  src: "CDTFA Publication 9 (Feb. 2025), pages on contract types and landscape contractors; CDTFA Regulation 1521. <a href=\"https://www.cdtfa.ca.gov/formspubs/pub9.pdf\" target=\"_blank\" rel=\"noopener\">cdtfa.ca.gov/formspubs/pub9.pdf</a>"
},

{ h: "Sales tax: which rate",
  lead: "Rates differ by city. Use the rate where the job is, and look it up for every bid.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Location (rates effective Oct. 1, 2026)</th><th class="num">Rate</th></tr></thead>
<tbody>
<tr><td>City of San Diego, unincorporated county, Carlsbad, Coronado, Encinitas, Poway, Santee</td><td class="num">7.75%</td></tr>
<tr><td>El Cajon, Oceanside, Vista</td><td class="num">8.25%</td></tr>
<tr><td>La Mesa</td><td class="num">8.50%</td></tr>
<tr><td>Chula Vista, Del Mar, Escondido, Imperial Beach, Lemon Grove, National City, San Marcos, Solana Beach</td><td class="num">8.75%</td></tr>
</tbody></table></div>
<p>The statewide base is 7.25%. Local district taxes add the rest. Check the <a href="https://www.cdtfa.ca.gov/taxes-and-fees/rates.aspx" target="_blank" rel="noopener">CDTFA rate table</a> or its address lookup for every job.</p>`,
  ex: `<p>$40,000 of material on a Chula Vista job: $40,000 × 0.0875 = $3,500 tax. The same material on a City of San Diego job: $40,000 × 0.0775 = $3,100. A $400 difference from the address alone.</p>`,
  deeper: `<p>For district taxes, CDTFA Publication 9 says “the contractor's jobsite is considered the place of business.” District sales tax applies where you pick up material, and district use tax applies when you install material at a jobsite in a district at a higher rate than you paid. You report and pay the difference. Simplest bid rule: budget the jobsite rate, or the higher of the pickup and jobsite rates.</p>`,
  watch: `<p>Rates change, sometimes twice a year. Don't keep a single “tax %” in your template. Look it up for each bid and write the rate and date in the estimate.</p>`,
  src: "CDTFA, California City and County Sales and Use Tax Rates (effective Oct. 1, 2026); CDTFA Publication 9, District Taxes section."
},

{ h: "Freight, delivery and minimums",
  lead: "Getting material to the job costs money. Price it on purpose, item by item.",
  body: `<ul>
<li><strong>Supply house delivery:</strong> often free over a minimum order, with a charge for small orders or a special trip. Ask for the rules.</li>
<li><strong>Bulk loads:</strong> mulch, soil, compost and rock are priced per load. Partial loads cost about the same as full ones.</li>
<li><strong>Boxed trees:</strong> may need a flatbed and an unloading machine (forklift or crane). Ask if the grower unloads.</li>
<li><strong>Long items:</strong> 20' pipe, large backflows and enclosures may need a special truck.</li>
<li><strong>Your own pickups:</strong> driver time and truck cost. Module 9 shows how to price your trucks.</li>
<li><strong>Minimum charges:</strong> “minimum order $250” or “$50 small-order fee” on small add-ons.</li>
</ul>`,
  ex: `<p>Practice example (made up): 43 box trees from a grower 90 miles away. Freight quote: $1,350 for one flatbed trip that carries 30 trees. Two trips = $2,700, or $62.79 per tree. On a $350 tree, that's an 18% add you'd miss by using the nursery's “price each.”</p>`,
  deeper: `<p>Whether a delivery charge is taxable in California depends on how and by whom it is delivered and billed (CDTFA Regulation 1628, Transportation Charges). Your supplier's invoice will show it. In your estimate, list freight on its own line so you can see it.</p>`
},

{ h: "Waste and overage",
  lead: "You buy more than the takeoff, because material comes in set lengths and sizes, and some gets cut, broken or lost.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Material</th><th>Why there's waste</th><th>Example allowance (for practice)</th></tr></thead>
<tbody>
<tr><td>PVC pipe</td><td>20' lengths, cut-offs, bell ends</td><td>5%–10%, then round up to full lengths</td></tr>
<tr><td>Wire</td><td>Spool sizes, slack loops at valves and controllers</td><td>10%–15%, round up to full spools</td></tr>
<tr><td>Fittings</td><td>Field changes, breakage</td><td>Count them, then add a few of each size</td></tr>
<tr><td>Mulch, soil, compost</td><td>Settling, uneven grades, partial loads</td><td>5%–15% depending on depth and site</td></tr>
<tr><td>Plants</td><td>Usually bought exact; losses are covered by replacement during establishment</td><td>Price replacements in establishment (Module 7 and Module 16)</td></tr>
</tbody></table></div>
<p>Use your own past jobs to set these numbers. Write the allowance you used in the estimate so you can check it later.</p>`,
  watch: `<p>Don't add waste twice. If your takeoff already includes 10% on pipe (Module 6), don't add another 10% here. Keep waste in one place, and label it.</p>`
},

{ h: "Price validity and escalation",
  lead: "Landscape goes in last. You bid today, but you may buy plants and controllers six months to a year from now. Price that risk.",
  body: `<ul>
<li><strong>Check the dates.</strong> Bid date, award date, start date, and when each material will actually be bought.</li>
<li><strong>Ask for a longer hold.</strong> Ask suppliers to hold prices through your expected buying date, or to say how prices will be adjusted.</li>
<li><strong>Add escalation when you can't lock prices.</strong> A percent on the material you'll buy later, based on what suppliers tell you about expected increases.</li>
<li><strong>Buy early when it pays.</strong> Controllers and backflows with long lead times can be ordered and stored once you have the contract.</li>
<li><strong>On private work, limit the risk in the proposal:</strong> “Material prices good for 30 days” or a clause allowing adjustment for big increases (Module 13).</li>
</ul>`,
  ex: `<p>Practice example (made up): $60,000 of irrigation material, bought 8 months after bid. Your suppliers expect about 4% increases over the year. Escalation: $60,000 × 4% × (8 ÷ 12) = $1,600. Add it to the estimate as its own line.</p>`,
  deeper: `<p>Caltrans bid books include a form called “Opt Out of Payment Adjustments for Price Index Fluctuations.” Under Standard Specifications section 9-1.07, Caltrans adjusts payment on asphalt items when a monthly crude-oil-based index moves more than 5% from the bid-time index. A bidder can opt out at bid time. On 11-428704 the winner left the form blank. These adjustments cover asphalt only. Pipe, controllers and plants have no index, so the landscape contractor carries that price risk. Read each agency's specs for any escalation clause.</p>`,
  src: "11-428704 Special Provisions 2-1.33 (bid form schedule); Caltrans Standard Specifications 9-1.07; Caltrans California Statewide Crude Oil Price Index page; Caltrans memo CPD 24-11."
},

{ h: "Plant availability and contract growing",
  lead: "A low plant price is useless if the plants aren't available when you need them. Check availability before bid day.",
  body: `<ol class="steps">
<li><div><b>Send the plant list early</b>Botanical name, container size, quantity and expected planting month.</div></li>
<li class="hl"><div><b>Ask about availability</b>“Do you have these now? Will you have them in [month]? In what quantities?”</div></li>
<li><div><b>Find substitutes for problem plants</b>Ask the nursery for available alternates. Before bid day, ask the designer through an RFI (Module 12). After award, submit substitutions for approval.</div></li>
<li><div><b>Consider contract growing</b>For large orders or unusual plants, the nursery grows them for you. Usually needs a signed agreement and a deposit, and months of lead time.</div></li>
<li><div><b>Tag trees</b>For box trees, visit the grower and tag the specific trees you're buying, if the specs or the owner require inspection.</div></li>
</ol>`,
  ex: `<p>Example: 11-430674 called for 741,405 iceplant cuttings and about 37,350 container plants. Quantities like that are usually grown or gathered on purpose. Ask how many months they need and what deposit they want.</p>`,
  watch: `<p>Contract growing ties up money and creates a promise you must keep. Don't sign a growing agreement before you have a signed contract or subcontract.</p>`
},

<tr><td>Supplier and contact</td><td>Branch, rep name</td></tr>
<tr><td>Source</td><td>Quote #, invoice # or counter price</td></tr>
<tr><td>Date priced</td><td>The date you got the price</td></tr>
<tr><td>Next update due</td><td>Date priced + 90 days</td></tr>
<tr><td>Lead time and notes</td><td>“Controllers 4–6 weeks”</td></tr>
</tbody></table></div>`,

  watch: `<p>The price list is for quick budgets and for checking quotes. On a real bid, use a project quote whenever the material total is large. A list price that's 89 days old is still 89 days old.</p>`
},

{ h: "Supplier credit and payment",
  lead: "Supplier credit is cash flow. Set it up before you need it, and understand what suppliers do to protect themselves.",
  body: `<ul>
<li><strong>Credit application:</strong> each supplier asks for company information, bank and trade references, and often a personal guarantee from the owner. Read the guarantee before signing.</li>
<li><strong>Net 30:</strong> the invoice is due 30 days after the invoice date (or by the end of the following month, depending on the supplier's terms). Late payment can mean interest charges and losing your account.</li>
<li><strong>Job accounts:</strong> for big jobs, suppliers may open a separate account tied to one project.</li>
<li><strong>Preliminary notice:</strong> a supplier who sells to you for a job often sends a 20-day preliminary notice to the owner and GC. It's routine, and it protects the supplier's payment rights.</li>
<li><strong>Joint checks:</strong> a check made out to both you and your supplier. Both must sign it. Suppliers or GCs may ask for one on large orders.</li>
</ul>`,
  ex: `<p>Cash flow (Module 3): if you pay for material on day 30 and the GC pays you on day 60 to 75, net 30 covers only part of the gap. Ask big suppliers about longer terms on a big order.</p>`,
  deeper: `<p>Supplier payment rights in California: on private jobs, suppliers have mechanics lien rights (Civil Code §8000 and following). On public jobs they can't lien public property, so they use stop payment notices and payment bond claims (Civil Code §9000 and following). For a public job, a preliminary notice under Civil Code §9300 is generally required before a supplier can use those remedies, except for claimants who contract directly with the direct contractor. Joint checks: under the California joint check rule (<em>Post Bros. Construction Co. v. Yoder</em>, 1977), when a supplier endorses a joint check and there's no other agreement about splitting it, the supplier is generally treated as paid what it was owed up to the check amount. Joint check agreements are contracts. Have the company's attorney review one before you sign it, and check current law.</p>`,
  watch: `<p>Never let a supplier go unpaid while the GC or owner has paid you for that material. The supplier can make a claim against the job, and the GC will hear about it.</p>`,
  src: "California Civil Code §§8000 et seq. (private works), §§9000 et seq. and §9300 (public works preliminary notice); Post Bros. Constr. Co. v. Yoder, 20 Cal.3d 1 (1977)."
},

{ h: "Worked example · Material for one irrigation zone",

  body: `<p><strong>Takeoff:</strong> 22 spray heads, one 1" valve, 160 LF of 1" lateral and 240 LF of ¾" lateral, two 150' runs of valve wire.</p>
<div class="tablewrap"><table>
<thead><tr><th>Item</th><th class="num">Qty bought</th><th class="num">Unit price</th><th class="num">Extended</th></tr></thead>

<tr><td>1" Sch 40 PVC (160 LF + 10% = 176, round up to 9 lengths)</td><td class="num">180 LF</td><td class="num">$0.58</td><td class="num">$104.40</td></tr>
<tr><td>¾" Sch 40 PVC (240 LF + 10% = 264, round up to 14 lengths)</td><td class="num">280 LF</td><td class="num">$0.44</td><td class="num">$123.20</td></tr>

{ t: "terms", h: "Words to know",
  lead: "Add these to your notebook.",
  terms: [
    ["List price", "The published retail price before any discount."],
    ["Contractor price / price tier", "Your account's discount level, based on how much you buy."],
    ["Project quote", "A written price for one job's material list."],
    ["Outside sales rep", "The supplier's person who handles bids and project quotes."],
    ["Manufacturer rep", "A product maker's local representative, helpful on specified items."],
    ["Lead time", "Time from order to delivery."],
    ["Quote expiration", "The last date the quoted prices are good."],
    ["Substitution / “or equal”", "A different product offered in place of the specified one."],
    ["Sole source", "Only one product, or one supplier, is allowed by the specs."],
    ["Consumer (sales tax)", "The one who uses the material and owes the tax; usually the contractor for materials it installs."],
    ["Fixture (sales tax)", "An item that keeps its identity after installation; plants and trees are generally fixtures."],
    ["District tax", "Local sales tax added to the 7.25% statewide base."],
    ["Freight", "The cost to get material to the job."],
    ["Waste factor", "Extra material bought for cutting, breakage and set lengths."],
    ["Escalation", "An allowance for prices rising between bid and purchase."],
    ["Contract growing", "A nursery growing plants to order for your job."],
    ["Net 30", "Invoice due 30 days after the invoice date."],
    ["Credit application", "The form a supplier uses to approve your account."],
    ["Preliminary notice", "A supplier's notice to the owner and GC that it's providing material, protecting its payment rights."],
    ["Joint check", "A check payable to both you and your supplier."]
  ]
},

{ t: "quiz", id: "m8", h: "Check yourself",

  qs: [
    { q: "Which price should you use on a large commercial bid?", a: ["The list price", "A written project quote for that job", "Last year's invoice price"], c: 1, why: "A project quote is current, in writing and usually the lowest price for that volume." },
    { q: "Supplier B's quote is lowest but leaves out the controller. What do you do?", a: ["Use it as is", "Add the missing controller cost before comparing", "Throw it out"], c: 1, why: "Plug every gap so all quotes cover the same scope, then compare." },
    { q: "On a lump-sum job, who usually pays sales tax on irrigation pipe the contractor installs?", a: ["The owner, as a line on your invoice", "The contractor, when buying it, so it goes into your price", "Nobody, construction is exempt"], c: 1, why: "California treats contractors as consumers of materials they furnish and install." },
    { q: "Your job is in Chula Vista. Which tax rate do you budget (as of Oct. 2026)?", a: ["7.25%", "7.75%", "8.75%"], c: 2, why: "The CDTFA table lists Chula Vista at 8.75%. Always look up the jobsite's rate." },
    { q: "The 11-428704 Calsense quotes in the specs included what?", a: ["Tax and delivery", "Neither tax nor delivery", "Delivery only"], c: 1, why: "The specs said the quoted prices did not include sales tax and delivery." },
    { q: "A quote is good for 30 days, but you'll buy the material in 8 months. What should you do?", a: ["Use the quote as is", "Ask for a longer hold and add escalation if you can't get it", "Double the price"], c: 1, why: "Price the risk between quote date and buying date." },
    { q: "How old can a price on the company's material price list be?", a: ["90 days at most", "One year", "Any age if it's from our supplier"], c: 0, why: "The company's rule is to refresh every price at least every 90 days." },
    { q: "Your takeoff already includes 10% waste on pipe. What should the pricing sheet do?", a: ["Add another 10%", "Round up to full lengths only", "Skip the pipe"], c: 1, why: "Keep waste in one place. Rounding up to full lengths is still needed." }
  ]

{ t: "practice", id: "m8", h: "Practice assignments",
  lead: "By the end, you'll have supplier accounts, real quotes and a starter price list.",
  items: [
    { h: "Meet two supply house reps", hrs: 0.5, d: "<p>Call or visit two San Diego irrigation suppliers (for example SiteOne, Ewing or Horizon). Get the outside sales rep's name, cell and email. Ask what price tier the company is on and what moves it up. Ask for a credit application.</p>" },
    { h: "Open nursery and bulk accounts", hrs: 0.5, d: "<p>Contact two wholesale nurseries and one mulch or soil yard. Ask about trade accounts, delivery charges, minimums and contract growing. Look up the current <a href=\"https://www.sandiego.gov/environmental-services/miramar/greenery/cmw\" target=\"_blank\" rel=\"noopener\">Miramar Greenery price sheets</a> and note which products and load sizes it sells.</p>" },
    { h: "Send a real quote request", hrs: 0.75, d: "<p>Use a takeoff from Module 6 or 7 (or the irrigation items from <a href=\"#lab-11-428704\">11-428704</a>). Send the quote request email to two suppliers with your list, specs and schedule. Log the date sent and follow up by phone in two days.</p>" },
    { h: "Level the quotes", hrs: 0.5, d: "<p>When the quotes come back, put them side by side like the comparison slide. Mark missing items, substitutions, delivery, expiration and lead times. Plug the gaps and pick the best adjusted total.</p>" },
    { h: "Settle the sales tax setup", hrs: 0.25, d: "<p>Read the landscape contractor and lump-sum sections of <a href=\"https://www.cdtfa.ca.gov/formspubs/pub9.pdf\" target=\"_blank\" rel=\"noopener\">CDTFA Publication 9</a>. Write three questions for the company's CPA: how we buy plants (tax-paid or resale), whether we need a seller's permit, and how we report district use tax. Look up the rate for three job addresses on the <a href=\"https://www.cdtfa.ca.gov/taxes-and-fees/rates.aspx\" target=\"_blank\" rel=\"noopener\">CDTFA rate page</a>.</p>" },
    { h: "Build the starter price list", hrs: 0.75, d: "<p>Make a spreadsheet with the columns from the price list slide. Enter at least 40 items you use on most jobs, from your quotes or recent invoices. Fill in the date priced and the next update date (90 days later). Set a calendar reminder.</p>" },
    { h: "Price one zone yourself", hrs: 0.25, d: "<p>Pick one zone from a real plan. Repeat the worked example with your own takeoff and your new prices: round up to full lengths and spools, add tax for the job's city, and add delivery. Write the material cost per head.</p>" }
  ]
},

{ h: "Module 8 summary",
  lead: "You can now turn a takeoff into material dollars you can trust.",
  body: `<ul>
<li>Use written project quotes for bids; keep a price list for quick checks, refreshed at least every 90 days.</li>
<li>Send suppliers your takeoff, specs, location and schedule. Read their quotes for expiration, lead times, exclusions and substitutions.</li>
<li>Level quotes line by line before comparing totals.</li>
<li>When the specs name a product or supplier, price exactly that. Sometimes the specs give you the price.</li>
<li>Sales tax on materials is your cost in California. Use the jobsite rate, and ask your CPA how to handle plants.</li>
<li>Add freight, waste and escalation on purpose, each on its own line.</li>
<li>Set up supplier credit early, pay suppliers on time, and get legal review before signing joint check agreements.</li>
</ul>
<p><strong>Next: Module 9 · Labor, Production Rates and Equipment</strong></p>`
}
]
});

  time: [["Reading and slides", "2 h"], ["Practice assignments", "5 h"], ["Module total", "7 h"]],

{ h: "The labor formula",
  lead: "Every labor price comes from two numbers: how many hours the work takes, and what each hour costs.",
  body: `<div class="tablewrap"><table><tbody>
<tr><td><strong>Labor hours</strong></td><td>= quantity × labor hours per unit (production rate)</td></tr>
<tr><td><strong>Labor cost</strong></td><td>= labor hours × burdened cost per hour</td></tr>
<tr><td><strong>Equipment cost</strong></td><td>= equipment hours or days × equipment rate, plus moving it to the job</td></tr>
</tbody></table></div>
<p>The rest of this module is about getting each of those numbers right.</p>`,
  ex: `<p>22 spray heads × 0.30 labor hours each = 6.6 labor hours. At $36.04 per burdened labor hour, that's $237.86. If your real rate is 0.40 hours per head, you're 33% low on every head in the bid.</p>`,
  watch: `<p>A small error in the production rate multiplies across thousands of units. On 11-428704, one bidder priced iceplant cuttings at $6.00 each instead of about $0.80, adding about $322,000 to its bid (Module 15).</p>`
},

{ h: "What a crew hour really costs",
  lead: "The wage is only the start. Every hour of pay carries taxes, insurance and benefits. Together these are called labor burden.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Part</th><th>What it is</th><th>Where the real number comes from</th></tr></thead>
<tbody>
<tr><td><strong>Wage</strong></td><td>Hourly pay for each worker</td><td>Your payroll; on public work, the prevailing wage determination</td></tr>
<tr><td><strong>Social Security and Medicare (FICA)</strong></td><td>Employer share: 6.2% + 1.45% = 7.65% of wages (Social Security stops at a yearly wage cap)</td><td>IRS</td></tr>
<tr><td><strong>Unemployment taxes</strong></td><td>Federal (FUTA) and California (UI and ETT), on the first part of each worker's yearly wages</td><td>Your CPA or payroll service (rates change yearly)</td></tr>
<tr><td><strong>Workers' compensation</strong></td><td>Insurance for job injuries, priced per $100 of payroll by job class. Landscape work is usually class 0042, Landscape Gardening.</td><td>Your insurance agent</td></tr>
<tr><td><strong>General liability</strong></td><td>Often priced on payroll or sales</td><td>Your insurance agent</td></tr>
<tr><td><strong>Benefits (fringe)</strong></td><td>Health insurance, paid time off, retirement, union or prevailing wage fringe</td><td>Your company's benefit costs; the wage determination on public work</td></tr>
</tbody></table></div>`,
  watch: `<p>Workers' comp is often the biggest piece of burden for landscape crews, and it depends on your class codes and your experience modification (your claims history). Don't copy another company's percentage. Ask your agent for your real rate per $100 of payroll for each class you use.</p>`,
  deeper: `<p>The employer share of FICA is set by federal law: 6.2% Social Security and 1.45% Medicare (IRS Topic 751). California employers pay FUTA, state UI and ETT on a limited wage base each year; California has had a FUTA credit reduction in recent years, which raises the federal rate. These change every year, so get the current numbers from your CPA. The WCIRB's class 0042 includes sprinkler and drainage work when the employer is mainly doing landscape work at that job; irrigation-only work can fall in another class. Your agent will tell you which classes apply.</p>`,
  src: "IRS Tax Topic 751 (Social Security and Medicare withholding rates); EDD, Federal Unemployment Tax Act page; WCIRB classification 0042, Landscape Gardening."
},

{ h: "Worked example · Crew day cost",
  lead: "A four-person private-work irrigation crew. The wages and the percentages are practice examples, except FICA.",
  exLabel: "Practice example (made-up wages and rates; get yours from payroll, your CPA and your insurance agent)",
  ex: `<div class="tablewrap"><table>
<thead><tr><th>Worker</th><th class="num">Wage per hour</th></tr></thead>
<tbody>
<tr><td>Foreman</td><td class="num">$34.00</td></tr>
<tr><td>Irrigation installer</td><td class="num">$26.00</td></tr>
<tr><td>Laborer</td><td class="num">$22.00</td></tr>
<tr><td>Laborer</td><td class="num">$22.00</td></tr>
<tr><td><strong>Crew wages per hour</strong></td><td class="num"><strong>$104.00</strong></td></tr>
</tbody></table></div>
<div class="tablewrap"><table>
<thead><tr><th>Burden on wages</th><th class="num">Rate</th></tr></thead>
<tbody>
<tr><td>FICA (real rate)</td><td class="num">7.65%</td></tr>
<tr><td>Unemployment taxes (example)</td><td class="num">3.00%</td></tr>
<tr><td>Workers' comp (example)</td><td class="num">12.00%</td></tr>
<tr><td>General liability (example)</td><td class="num">2.50%</td></tr>
<tr><td><strong>Total burden</strong></td><td class="num"><strong>25.15%</strong></td></tr>
</tbody></table></div>
<p><strong>Math:</strong></p>
<ul>
<li>Burden: $104.00 × 25.15% = $26.16 per hour</li>
<li>Benefits (example $3.50 per worker-hour): 4 × $3.50 = $14.00 per hour</li>
<li><strong>Crew cost per hour: $104.00 + $26.16 + $14.00 = $144.16</strong></li>
<li><strong>Crew cost per 8-hour day: $144.16 × 8 = $1,153.28</strong></li>
<li>Average per labor hour: $144.16 ÷ 4 = <strong>$36.04</strong></li>
</ul>`,
  body: `<p>Trucks, tools, supervision above the foreman and equipment come next, as separate lines. Keep the crew rate “pure” so you can reuse it.</p>`,
  watch: `<p>Paid hours aren't all productive hours. Drive time, morning meeting, loading the truck and cleanup are paid. Either count them in your production rates (best, if your rates come from timecards) or add them as their own hours.</p>`
},

{ h: "Production rates",
  lead: "A production rate says how fast work gets done. Write it as labor hours per unit, so it works for any crew size.",
  body: `<div class="twocol">
<div><h3>Labor hours per unit (LH/unit)</h3><ul>
<li>0.30 LH per spray head</li>
<li>0.04 LH per LF of lateral</li>
<li>Works for a crew of 2 or 6</li>
<li>Best for estimating</li>
</ul></div>
<div><h3>Units per crew-hour or crew-day</h3><ul>
<li>“Our 4-person crew sets 13 heads an hour”</li>
<li>“We put in 250 LF of main a day”</li>
<li>Easy to picture in the field</li>
<li>Depends on crew size</li>
</ul></div>
</div>
<p><strong>Converting:</strong> units per crew-hour = crew size ÷ LH per unit. With 4 people and 0.30 LH per head: 4 ÷ 0.30 = 13.3 heads per crew-hour.</p>`,
  watch: `<p>Production rates found online or in national cost books come from other crews, other soils and other wage levels. Use them only as a rough check. Your own timecards are the best source.</p>`
},

{ h: "Building rates from your past jobs",
  lead: "Your company has done C-27 work for years. That history is your best production data, if you dig it out.",
  body: `<ol class="steps">
<li><div><b>Pick 3 to 5 finished jobs</b>Ones similar to what you'll bid: commercial or large residential irrigation and planting.</div></li>
<li class="hl"><div><b>Get the installed quantities</b>From the plans, as-builts or invoices: LF of pipe by size, heads, valves, plants by size.</div></li>
<li class="hl"><div><b>Get the hours by task</b>From timecards or daily reports. If hours weren't split by task, ask the foreman to help divide them.</div></li>
<li><div><b>Divide</b>Hours ÷ quantity = LH per unit.</div></li>
<li><div><b>Write down the conditions</b>Soil, slope, access, crew size, season. A rate means little without them.</div></li>
<li><div><b>Compare across jobs</b>Use the middle value as your standard rate, and note why the high and low jobs were different.</div></li>
</ol>`,
  ex: `<p>Practice example: a past job had 2,400 LF of 1" and ¾" lateral, and timecards show 88 labor hours of trenching, pipe and backfill. 88 ÷ 2,400 = 0.037 LH per LF. Two other jobs came out at 0.041 and 0.052 (rocky site). Standard rate: about 0.04, with a rock adjustment.</p>`,
  deeper: `<p>From now on, set up cost codes on every job (for example: 01 mainline, 02 laterals, 03 heads, 04 valves and wire, 05 controller, 10 soil prep, 11 plants by size, 12 mulch, 20 establishment) and have foremen record hours by code every day. In a year you'll have far better rates than any book.</p>`
},

{ h: "Adjusting for site conditions",
  lead: "Your standard rates assume a normal site. Most commercial sites aren't normal somewhere. Adjust the rate for the part of the job where conditions change.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Condition</th><th>What it does</th><th>Example adjustment (practice)</th></tr></thead>
<tbody>
<tr><td>Slopes</td><td>Slower walking, hand carrying, safety lines on steep slopes</td><td>3:1 slope ×1.15–1.3; 2:1 slope ×1.3–1.6</td></tr>
<tr><td>Rock, hardpan, caliche</td><td>Trencher can't cut, or wears out fast</td><td>×1.5–3, or change the method (rock trencher, breaker)</td></tr>
<tr><td>Tight access</td><td>No machines, hand digging, long carries</td><td>×1.2–1.5</td></tr>
<tr><td>Existing utilities</td><td>Potholing, hand digging near lines</td><td>Add hours per crossing</td></tr>
<tr><td>Freeway or night work</td><td>Short windows, setup and teardown of closures, lighting</td><td>Figure productive hours per shift (later slide)</td></tr>
<tr><td>Recycled water</td><td>Purple materials, warning tape along the main, signs, separation from drinking water lines, inspections, 150 psi tests on 11-428704</td><td>Add the extra tasks as their own hours</td></tr>
<tr><td>Working around an open site</td><td>Tenants, traffic, other trades in the way</td><td>×1.1–1.25</td></tr>
</tbody></table></div>`,
  ex: `<p>A job has 3,000 LF of lateral: 2,000 LF on flat ground and 1,000 LF on a 2:1 slope. Flat: 2,000 × 0.04 = 80 LH. Slope: 1,000 × 0.04 × 1.5 = 60 LH. Total 140 LH, instead of 120 LH if you'd used one rate for everything.</p>`,
  watch: `<p>Walk the site before you price it (Module 12). Rock, slope and access are much easier to see in person than on a plan.</p>`
},

{ h: "From takeoff to labor hours",
  lead: "Put a production rate next to every takeoff line. The sum is the labor for the job.",
  exLabel: "Worked example: the spray zone from Module 8 (example rates)",
  ex: `<div class="tablewrap"><table>
<thead><tr><th>Item</th><th class="num">Qty</th><th class="num">LH per unit</th><th class="num">Labor hours</th></tr></thead>
<tbody>
<tr><td>Spray heads with swing joints</td><td class="num">22 EA</td><td class="num">0.30</td><td class="num">6.6</td></tr>
<tr><td>Lateral pipe (160 LF 1" + 240 LF ¾")</td><td class="num">400 LF</td><td class="num">0.04</td><td class="num">16.0</td></tr>
<tr><td>Valve with box and wiring</td><td class="num">1 EA</td><td class="num">1.5</td><td class="num">1.5</td></tr>
<tr><td>Valve wire</td><td class="num">300 LF</td><td class="num">0.005</td><td class="num">1.5</td></tr>
<tr><td>Flush, test and adjust</td><td class="num">1 LS</td><td class="num">2.0</td><td class="num">2.0</td></tr>
<tr><td colspan="3"><strong>Total labor hours</strong></td><td class="num"><strong>27.6</strong></td></tr>
</tbody></table></div>
<p><strong>Labor cost:</strong> 27.6 LH × $36.04 = <strong>$994.70</strong>, or $994.70 ÷ 22 = $45.21 per head.</p>
<p><strong>With material from Module 8</strong> ($43.87 per head), the zone costs about $89.08 per head before equipment, overhead and profit.</p>`,
  body: `<p>Check the result in crew-days: 27.6 LH ÷ 4 people ÷ 8 hours = 0.86 crew-days. Ask yourself: “Could my crew finish this zone in a day?” If your gut says no, find out which rate is off.</p>`
},

{ h: "Supervision, small tools and trucks",
  lead: "Some costs don't belong to any one item but grow with the job's length. Price them per day or as a percent of labor.",
  body: `<ul>
<li><strong>Supervision above the foreman:</strong> superintendent or PM site visits, meetings, inspections. Price as days or hours per week for the length of the job. Module 10 decides what's job cost and what's overhead.</li>
<li><strong>Small tools and consumables:</strong> shovels, pipe cutters, saw blades, glue brushes, safety gear. Many estimators use a small percent of labor (an example range for practice is 2% to 5%). Check it against what you actually spend in a year.</li>
<li><strong>Trucks:</strong> crew trucks, a dump truck, a trailer. Price as a daily rate times the days on the job.</li>
<li><strong>Job site extras:</strong> portable toilet, water for testing, storage container, fencing, trash. Price them per month.</li>
</ul>`,
  exLabel: "Practice example: daily cost of a crew truck (made-up numbers)",
  ex: `<ul>
<li>Ownership and insurance: $13,800 per year ÷ 230 working days = $60.00 per day</li>
<li>Fuel: 6 gallons × $5.00 = $30.00 per day</li>
<li>Maintenance and tires: $5.00 per day</li>
<li><strong>Truck cost: $95.00 per working day</strong></li>
</ul>`,
  watch: `<p>If a job runs longer than planned, every one of these costs keeps adding up. That's why schedule matters to price.</p>`
},

{ h: "Equipment: own or rent?",
  lead: "Owned equipment isn't free just because it's paid off. Rented equipment costs more per day but nothing when it's idle.",
  body: `<div class="twocol">
<div><h3>Own it when</h3><ul>
<li>You use it most working days (a mini excavator, a trencher, a skid steer for a busy company)</li>
<li>You can keep it maintained</li>
<li>You have a place to store it</li>
<li>Cash or financing is available</li>
</ul></div>
<div><h3>Rent it when</h3><ul>
<li>You need it a few weeks a year (stump grinder, auger, large excavator, rock trencher)</li>
<li>The job needs a special machine</li>
<li>You want the rental yard to handle repairs</li>
<li>You're not sure the work will continue</li>
</ul></div>
</div>
<p>Either way, every bid carries an equipment cost for each machine. Owned equipment gets an hourly rate (next slide). Rented equipment gets the rental rate plus delivery, pickup, fuel and damage waiver.</p>`,
  deeper: `<p>Caltrans publishes <a href="https://dot.ca.gov/programs/construction/equipment-rental-rates-and-labor-surcharge" target="_blank" rel="noopener">Labor Surcharge and Equipment Rental Rates</a>, used to pay for extra work done at force account. Its equipment rates show how ownership and operating costs are built for many machine types. They're a useful check on your own rates and the basis for pricing change order work on Caltrans jobs.</p>`
},

{ h: "Worked example · Hourly cost of an owned machine",
  lead: "Owned equipment cost has two parts: owning it (whether it runs or not) and operating it (only when it runs).",
  exLabel: "Practice example: mini excavator (made-up numbers)",
  ex: `<p><strong>Ownership cost per year</strong></p>
<ul>
<li>Purchase $60,000; expected resale after 5 years $18,000</li>
<li>Depreciation: ($60,000 − $18,000) ÷ 5 = $8,400</li>
<li>Interest on money tied up: 6% × average value ($60,000 + $18,000) ÷ 2 = 6% × $39,000 = $2,340</li>
<li>Insurance, registration and storage: $2,400</li>
<li><strong>Ownership: $13,140 per year</strong></li>
</ul>
<p><strong>Operating cost per hour</strong></p>
<ul>
<li>Fuel: 1.5 gallons × $5.00 = $7.50</li>
<li>Maintenance and repairs: $6.00</li>
<li>Wear parts (tracks, teeth, hoses): $3.00</li>
<li><strong>Operating: $16.50 per hour</strong></li>
</ul>
<div class="tablewrap"><table>
<thead><tr><th>Hours used per year</th><th class="num">Ownership per hour</th><th class="num">Operating per hour</th><th class="num">Total per hour</th></tr></thead>
<tbody>
<tr><td>800</td><td class="num">$13,140 ÷ 800 = $16.43</td><td class="num">$16.50</td><td class="num"><strong>$32.93</strong></td></tr>
<tr><td>400</td><td class="num">$13,140 ÷ 400 = $32.85</td><td class="num">$16.50</td><td class="num"><strong>$49.35</strong></td></tr>
</tbody></table></div>`,
  body: `<p>The fewer hours a machine works, the more each hour costs. If your excavator sits half the year, renting may be cheaper.</p>`,
  watch: `<p>The operator is labor, not equipment. Don't put the operator's wage in the machine rate and again in the crew rate.</p>`
},

{ h: "Rentals and mobilization",
  lead: "A rental's daily rate is only part of its cost. Price the whole trip.",
  body: `<ul>
<li><strong>Rate periods:</strong> day, week and 4-week month. A week usually costs much less than 5 days; a month much less than 4 weeks. Price the period you'll actually need.</li>
<li><strong>Delivery and pickup:</strong> each way, often more for larger machines or far locations.</li>
<li><strong>Fuel:</strong> returned full, or refueling charges.</li>
<li><strong>Damage waiver and environmental fees:</strong> often a percent of the rental.</li>
<li><strong>Sales tax on rentals.</strong></li>
<li><strong>Mobilization of owned equipment:</strong> your truck, trailer and driver time to move it to the job and back. Count every move. If the job is phased, you'll move it several times.</li>
</ul>`,
  ex: `<p>Practice example (made up): a ride-on trencher at $425/day or $1,300/week. Delivery $150 each way. For 4 working days, the week rate ($1,300) beats 4 days ($1,700). Total: $1,300 + $300 delivery and pickup = $1,600, plus fuel.</p>`,
  watch: `<p>Get rental quotes from two San Diego rental yards for the machines you rent most, and add them to your price list with the date, just like materials (Module 8).</p>`
},

{ h: "Trenching methods",
  lead: "The trench is often the biggest labor cost in irrigation. The method you pick sets the production rate.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Method</th><th>Best for</th><th>Watch for</th></tr></thead>
<tbody>
<tr><td>Hand trenching</td><td>Short runs, tight spots, near utilities and roots</td><td>Slowest; needed near existing lines</td></tr>
<tr><td>Walk-behind trencher</td><td>Laterals in planting areas, moderate access</td><td>Struggles in rock and hard clay</td></tr>
<tr><td>Ride-on trencher</td><td>Long laterals and mainlines, open sites</td><td>Needs room to turn and a trailer to move</td></tr>
<tr><td>Mini excavator</td><td>Mainlines, deep or wide trenches, valve and backflow pits</td><td>Wider trench means more backfill and compaction</td></tr>
<tr><td>Vibratory plow (pulling pipe)</td><td>Small poly or flexible lines in turf, where the specs allow it</td><td>Rarely allowed for commercial PVC</td></tr>
<tr><td>Boring (directional or jack-and-bore)</td><td>Under paving, driveways and ramps</td><td>Usually subcontracted</td></tr>
</tbody></table></div>`,
  ex: `<p>On 11-428704, the winning bidder subcontracted boring for the ramp crossings: its subcontractor list shows “Item 66, 54%, boring only.” The landscape company did the rest of the trenching itself.</p>`,
  watch: `<p>Call DigAlert (811) before you dig, and price the hand digging and potholing needed near marked utilities. The utility sheets on 11-428704 showed gas, sewer, telecom and Otay Water District recycled lines along the work.</p>`,
  src: "11-428704 ACCU Construction bid book (subcontractor list); 11-428704 plans U-1 to U-7."
},

{ h: "Productivity losses",
  lead: "Some days your crew is paid for 8 hours and works far fewer. Price those lost hours, or you'll pay for them yourself.",
  body: `<ul>
<li><strong>Weather:</strong> rain stops trenching and planting, and wet soil slows everything for days after. Heat slows work and adds water breaks.</li>
<li><strong>Short work windows:</strong> hours allowed by the owner, school schedules, noise rules, tenant hours.</li>
<li><strong>Traffic closures:</strong> on freeway jobs, you can only work while a closure is up.</li>
<li><strong>Stop-and-go work:</strong> phased jobs, waiting on other trades, many small move-ins.</li>
<li><strong>Waiting periods in the specs:</strong> for example, 11-428704 required 21 days after irrigation before planting in weed germination areas.</li>
<li><strong>Overtime and long shifts:</strong> output per hour drops when people are tired.</li>
</ul>`,
  exLabel: "Example using the 11-428704 closure windows",
  ex: `<p>The lane closure charts allowed I-805 lane closures roughly 9 PM to 5 AM Monday through Thursday, and right shoulder closures roughly 9 AM to 3 PM on weekdays (see Module 15).</p>
<ul>
<li><strong>Shoulder work:</strong> a 6-hour window. If the closure takes about 30 minutes to set and 30 to remove (an assumption for practice), about 5 productive hours remain. Crew paid 8 hours: 5 ÷ 8 = 62.5% of a normal day.</li>
<li><strong>Night lane closure:</strong> an 8-hour window, minus about 1.5 hours for setup and pickup (practice assumption) = 6.5 hours. 6.5 ÷ 8 = 81%, plus lighting and any night pay required by the wage determination.</li>
<li>A crew that puts in 250 LF of main a day on an open site would make about 250 × 0.625 = 156 LF in a shoulder shift.</li>
</ul>`,
  deeper: `<p>Check each job's closure charts and work hour rules before you set production. On 11-428704 they were in Special Provisions 12-4.02C. Holidays, special events and the holiday shopping blackout near Plaza Bonita removed more days.</p>`,
  src: "11-428704 Special Provisions 12-4.02C (Charts G1–G3), 20-1.03E."
},
