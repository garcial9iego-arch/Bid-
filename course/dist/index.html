<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body style="margin:0">
<title>Commercial Landscape Bidding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&family=Saira+Condensed:wght@600;700&display=swap">
<style>
/* Layout: a plan-set title block across the top, a sheet index of modules on the left, one slide "sheet" at a time on the right. */
:root{
  --paper:#f2f5f1;      /* page ground, a faint green-grey like vellum */
  --sheet:#ffffff;      /* the slide surface */
  --ink:#1b2a21;        /* text */
  --muted:#56675c;      /* secondary text */
  --line:#cfd9d0;       /* rules and borders */
  --accent:#663c9e;     /* recycled-water purple pipe */
  --accent-soft:#efe8f8;
  --leaf:#2b7246;       /* examples, correct answers */
  --leaf-soft:#e3f1e7;
  --caution:#9a5a06;    /* watch-outs */
  --caution-soft:#fbf0dc;
  --wrong:#a3342a;
  --wrong-soft:#f8e3e0;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111813; --sheet:#18211b; --ink:#e3ebe5; --muted:#9caca1; --line:#2d3a31;
  --accent:#b996ea; --accent-soft:#2a2138; --leaf:#7ccb98; --leaf-soft:#18301f;
  --caution:#e6aa58; --caution-soft:#33270f; --wrong:#f0a197; --wrong-soft:#3a1d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111813; --sheet:#18211b; --ink:#e3ebe5; --muted:#9caca1; --line:#2d3a31;
  --accent:#b996ea; --accent-soft:#2a2138; --leaf:#7ccb98; --leaf-soft:#18301f;
  --caution:#e6aa58; --caution-soft:#33270f; --wrong:#f0a197; --wrong-soft:#3a1d1a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-size:.82em;letter-spacing:.02em}

/* Title block */
.titleblock{border-bottom:2px solid var(--ink);background:var(--sheet)}
.tb-inner{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;text-decoration:none;color:var(--ink)}
.brand-k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand-n{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;text-transform:uppercase;line-height:1.05}
.tb-meta{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.tb-meta span{white-space:nowrap}

/* Layout */
.layout{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}

/* Sheet index (module nav) */
.navtoggle{display:none;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-weight:700}
@media (max-width:900px){.navtoggle{display:block}.sheetindex.collapsed{display:none}}
.sheetindex{background:var(--sheet);border:1px solid var(--line);border-radius:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 40px);overflow:auto}
@media (max-width:900px){.sheetindex{position:static;max-height:none;margin-top:8px}}
.si-head{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.si-list{list-style:none;margin:0;padding:0}
.si-item{border-bottom:1px solid var(--line)}
.si-item:last-child{border-bottom:0}
.si-btn{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;width:100%;text-align:left;background:none;border:0;padding:9px 14px;align-items:start}
.si-btn:hover{background:var(--paper)}
.si-btn[aria-current="true"]{background:var(--accent-soft)}
.si-btn[disabled]{cursor:default;opacity:.62}
.si-btn[disabled]:hover{background:none}
.si-no{font-family:var(--mono);font-size:12px;color:var(--accent);padding-top:2px}
.si-t{font-size:14.5px;line-height:1.35;font-weight:700;display:block}
.si-s{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:2px}
.bar{height:4px;background:var(--line);border-radius:2px;flex:1;max-width:80px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf)}

/* Main */
main{min-width:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.home-hero{display:grid;gap:10px;padding-block:6px 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.home-hero h1{font-size:clamp(34px,5vw,52px);text-transform:uppercase}
.home-hero p{max-width:66ch;margin:0;font-size:18px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:6px;padding:9px 16px;font-weight:700;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:26px}
.how div{border-top:3px solid var(--ink);padding-top:10px;min-width:0}
.how h3{font-size:20px;text-transform:uppercase;margin-bottom:4px}
.how p{margin:0;font-size:15.5px;color:var(--muted)}
.tablewrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--paper)}
td.num,th.num{text-align:right;white-space:nowrap}
.status{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;white-space:nowrap}
.status.ready{background:var(--leaf-soft);color:var(--leaf)}
.status.soon{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.rowlink{background:none;border:0;padding:0;text-align:left;font-weight:700;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.note{font-size:14px;color:var(--muted);max-width:75ch}

/* Module header + slide */
.mhead{display:grid;gap:6px;margin-bottom:14px}
.mhead h1{font-size:clamp(28px,4vw,40px);text-transform:uppercase}
.strip{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:14px}
.strip button{flex:1 1 14px;min-width:14px;max-width:44px;height:10px;border:0;border-radius:2px;background:var(--line);padding:0}
.strip button.seen{background:var(--leaf)}
.strip button[aria-current="true"]{background:var(--accent);height:14px;margin-top:-2px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:8px;min-width:0}
.sheet-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line)}
.sheet-body{padding:22px 24px 26px;display:grid;gap:16px;min-width:0}
@media (max-width:520px){.sheet-body{padding:18px 16px 22px}.sheet-top{padding:10px 16px}}
.sheet h2{font-size:clamp(26px,3.6vw,36px)}
.lead{font-size:20px;line-height:1.5;margin:0;max-width:62ch}
.prose{max-width:70ch;min-width:0}
.prose p{margin:0 0 10px}
.prose p:last-child{margin-bottom:0}
.prose ul,.prose ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.prose li::marker{color:var(--accent)}
.prose strong{font-weight:700}
.prose table{font-size:15px}
.prose .tablewrap{margin-block:4px}
.callout{border-radius:6px;padding:12px 16px;max-width:72ch;min-width:0}
.callout .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;display:block;margin-bottom:4px}
.callout p{margin:0 0 8px}.callout p:last-child{margin:0}
.callout ul,.callout ol{margin:0;padding-left:1.2em;display:grid;gap:4px}
.ex{background:var(--leaf-soft)}.ex .lbl{color:var(--leaf)}
.watch{background:var(--caution-soft)}.watch .lbl{color:var(--caution)}
details.deeper{border:1px dashed var(--line);border-radius:6px;max-width:72ch}
details.deeper summary{cursor:pointer;padding:10px 14px;font-weight:700;color:var(--accent);list-style-position:inside}
details.deeper .inner{padding:0 16px 14px}
details.deeper .inner p{margin:0 0 8px}
details.deeper .inner ul,details.deeper .inner ol{margin:0 0 8px;padding-left:1.2em;display:grid;gap:4px}
.src{font-size:13.5px;color:var(--muted)}

/* Cover slide */
.cover-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px}
@media (max-width:700px){.cover-grid{grid-template-columns:minmax(0,1fr)}}
.objectives{margin:0;padding-left:1.3em;display:grid;gap:6px}
.timebox{border:1.5px solid var(--ink);border-radius:6px;padding:12px 16px;align-self:start}
.timebox .row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-block:6px;font-variant-numeric:tabular-nums}
.timebox .row:last-child{border-bottom:0;font-weight:700}
.bignum{font-family:var(--display);font-size:64px;line-height:1;color:var(--accent)}

/* Diagrams */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.flow .node{border:1.5px solid var(--ink);border-radius:6px;padding:8px 12px;background:var(--sheet);min-width:0;flex:1 1 140px}
.flow .node b{display:block;font-family:var(--display);font-size:19px;text-transform:uppercase;line-height:1.1}
.flow .node span{font-size:13.5px;color:var(--muted)}
.flow .node.you{border-color:var(--accent);background:var(--accent-soft)}
.flow .arrow{align-self:center;color:var(--muted);font-family:var(--mono)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:st}
.steps li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);counter-increment:st}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(st,decimal-leading-zero);font-family:var(--mono);color:var(--accent);font-size:14px;padding-top:2px}
.steps li b{display:block}
.steps li.hl{background:var(--accent-soft);border-radius:4px}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.twocol>div{border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.twocol h3{font-size:21px;text-transform:uppercase;margin-bottom:6px}
.twocol ul{margin:0;padding-left:1.2em;display:grid;gap:4px}

/* Glossary */
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 22px}
.terms div{border-bottom:1px solid var(--line);padding:9px 0;min-width:0}
.terms dt{font-weight:700}
.terms dd{margin:0;color:var(--muted);font-size:15.5px}

/* Quiz */
.q{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.q:first-child{border-top:0;padding-top:0}
.q .qt{font-weight:700}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:6px;padding:8px 12px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--leaf);background:var(--leaf-soft)}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-soft)}
.why{font-size:15px;margin:0;padding-left:12px;border-left:3px solid var(--line)}
.score{font-family:var(--display);font-size:24px;text-transform:uppercase}

/* Practice */
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.task{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.task.done{background:var(--leaf-soft);border-color:var(--leaf)}
.task input{width:20px;height:20px;margin-top:3px;accent-color:var(--leaf)}
.task label{font-weight:700;cursor:pointer}
.task .d{font-size:15.5px;margin-top:3px}
.task .d p{margin:0 0 6px}
.task .d ul,.task .d ol{margin:0;padding-left:1.2em;display:grid;gap:3px}
.task .hrs{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:3px}
.tally{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* Scorer */
.scorer{display:grid;gap:8px}
.sc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.sc-row select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);max-width:150px}
.sc-row .hint{display:block;font-size:13.5px;color:var(--muted)}
.sc-total{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;border:1.5px solid var(--ink);border-radius:6px;padding:12px 16px}
.sc-total .n{font-family:var(--display);font-size:40px;line-height:1}
.sc-verdict{font-weight:700}

/* Controls */
.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.controls .mid{font-family:var(--mono);font-size:13px;color:var(--muted)}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:14px}
.ghost[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.kbd{font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:in .16s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<header class="titleblock">
  <div class="tb-inner">
    <a class="brand" href="#home" id="homeLink"><span class="brand-k">Course · Bid Division Training</span><span class="brand-n">Commercial Landscape Bidding</span></a>
    <div class="tb-meta"><span>San Diego County</span><span>Private &amp; public work</span><span>C-27 landscape · irrigation · planting</span><span>16 modules · 100 hours</span></div>
  </div>
</header>
<div class="layout">
  <div>
    <button class="navtoggle" id="navToggle" type="button" aria-expanded="false" aria-controls="sheetIndex">Course map ▾</button>
    <nav class="sheetindex collapsed" id="sheetIndex" aria-label="Course modules"></nav>
  </div>
  <main id="main"></main>
</div>

<script>
window.COURSE_OUTLINE = [
  { n: 1,  hours: 6, title: "How Construction Bidding Works", desc: "The players, how money and paperwork move, private vs. public work, and how a contractor actually wins a job." },
  { n: 2,  hours: 6, title: "Your License, Your Company and Getting Bid-Ready", desc: "B and C-27 licenses, the new-company question, insurance, bonds, DIR registration, SLBE/ELBE and the bid-ready folder." },
  { n: 3,  hours: 6, title: "Finding Work and Deciding What to Bid", desc: "Getting on GC bid lists, bid platforms, public agency portals, reading a bid notice, go/no-go decisions and cash flow." },
  { n: 4,  hours: 8, title: "Reading Landscape and Irrigation Plans", desc: "Sheet order, scales, legends, symbols, details, notes, and finding the civil and electrical sheets that touch your scope." },
  { n: 5,  hours: 6, title: "Reading Specifications", desc: "The project manual, CSI Division 32, the Greenbook and the City of San Diego Whitebook, and spec items that change your price." },
  { n: 6,  hours: 8, title: "Irrigation Takeoff", desc: "Counting heads, valves, controllers and backflow; measuring mainline and laterals by size; drip zones; sleeves and wire." },
  { n: 7,  hours: 7, title: "Planting, Soil and Hardscape Takeoff", desc: "Plant counts by container size, square footage for groundcover and mulch, soil amendments, trees, boulders and DG." },
  { n: 8,  hours: 5, title: "Pricing Materials and Working with Suppliers", desc: "Getting written quotes from irrigation supply houses and nurseries, tax, freight, escalation and keeping a price list." },
  { n: 9,  hours: 7, title: "Labor, Production Rates and Equipment", desc: "Crew day cost, burden, production rates per unit, equipment and rentals, and checking estimates against finished jobs." },
  { n: 10, hours: 5, title: "Overhead, Markup and Your Final Number", desc: "Knowing your real overhead, setting markup by job type, minimum margins and the final price review." },
  { n: 11, hours: 6, title: "Prevailing Wage and Public Works Compliance", desc: "Wage determinations, certified payroll, apprentices, DIR enforcement and building those costs into a public bid." },
  { n: 12, hours: 5, title: "Pre-Bid Meetings, RFIs, Addenda and Communication", desc: "What to ask at job walks, writing RFIs, tracking addenda, and how to talk to agencies and GC estimators." },
  { n: 13, hours: 5, title: "Writing the Proposal", desc: "Scope letters, inclusions, exclusions, clarifications, alternates, unit prices and a proposal GCs can level easily." },
  { n: 14, hours: 6, title: "Submitting Public Bids and Bid Day", desc: "Agency bid forms, bid bonds, subcontractor listing, SLBE/ELBE forms, electronic bidding and the bid opening." },
  { n: 15, hours: 8, title: "Real Bid Practice: Price It, Then Compare to the Winner", desc: "Price real past San Diego landscape and irrigation bids, then compare your line items to the winning and losing bids." },
  { n: 16, hours: 6, title: "After the Bid: Contracts, Billing and Growing the Division", desc: "Subcontracts, submittals, pay applications, retention, change orders, plant establishment and building a repeatable division." }
];

(window.COURSE_MODULES = window.COURSE_MODULES || []).push({
n: 1, hours: 6, title: "How Construction Bidding Works",
slides: [

{ t: "cover",
  h: "How Construction Bidding Works",
  lead: "Before you price a single sprinkler head, you need to know how the commercial world works: who is involved, how money and paperwork move, and how a contractor wins a job.",
  objectives: [
    "Explain in your own words what a bid is and why it is a promise",
    "Name every player on a commercial project and what each one does",
    "Describe how contracts, bills and payments move between them",
    "Tell the difference between private work and public work",
    "Explain why the cheapest bid does not always win",
    "Follow a bid from invitation to award, day by day"
  ],
  time: [["Reading and slides", "1.5 h"], ["Practice assignments", "4.5 h"], ["Module total", "6 h"]],
  body: "<p>You already know how to install landscape and irrigation. This module adds the part nobody at the company knows yet: how commercial work is bought and sold.</p>"
},

{ h: "How to use this course",
  lead: "Every slide starts in plain words. Extra detail is there when you want it, but you never need it to keep going.",
  body: `<ul>
<li><strong>Main text</strong> is what you must know. Read this on every slide.</li>
<li><strong>Example</strong> boxes show how it looks on a real job.</li>
<li><strong>Watch out</strong> boxes are mistakes that cost contractors money.</li>
<li><strong>Go deeper</strong> opens extra detail: laws, numbers and fine print. Skip it the first time if you like.</li>
<li><strong>Read aloud</strong> (top right of each slide) reads the slide to you.</li>
<li><strong>Words to know</strong> near the end of each module lists new terms. Keep your own list too.</li>
<li><strong>Practice</strong> is where most of the hours are. The course only works if you do the practice.</li>
</ul>`,
  deeper: `<p>About accuracy: fees, limits and rules change. Numbers in this course were checked in 2026. Before you rely on one for a real bid, confirm it at the source listed on the slide.</p>
<p>This course is training, not legal advice. For how your company is set up, contracts and bonding, the right people are a construction attorney, a CPA and a surety (bonding) agent.</p>`
},

{ h: "What is a bid?",
  lead: "A bid is a written promise: “We will do this exact work, under these conditions, for this price.”",
  body: `<p>Every bid has three parts:</p>
<ol>
<li><strong>Scope.</strong> The work you will do. On commercial jobs this comes from the plans and specifications, not from a conversation.</li>
<li><strong>Price.</strong> One total, often broken into line items.</li>
<li><strong>Terms.</strong> What is <em>not</em> included (exclusions), assumptions you made, and how long the price is good for.</li>
</ol>
<p>If the client accepts it, your bid becomes the basis of a contract. You are expected to build it for that number.</p>`,
  ex: `<p>“Landscape and irrigation per sheets L-1.0 to L-4.2 and spec sections 32 84 00 and 32 93 00, including 90-day plant establishment. Excludes permits, bonds and water meter fees. Total: $186,400. Price good for 60 days.”</p>`,
  watch: `<p>Never send a number you are not willing to build for. “We'll fix it later” does not work in commercial bidding. A low number you can't live with is worse than losing the bid.</p>`,
  deeper: `<p><strong>Public bids:</strong> in California, once public bids are opened you generally can't withdraw yours. The Public Contract Code (sections 5100–5110) gives relief only for certain clerical mistakes (not bad judgment), and you must notify the agency in writing within five working days after the bid opening.</p>
<p><strong>Private bids to a GC:</strong> a subcontractor's bid can still bind you. In the California case <em>Drennan v. Star Paving</em> (1958), a GC used a sub's low bid in its own bid; the sub tried to back out, and the court held the sub to its price because the GC had relied on it. That idea, called promissory estoppel, is still applied today.</p>`,
  src: "California Public Contract Code §§5100–5110; Drennan v. Star Paving Co., 51 Cal.2d 409 (1958)."
},

{ h: "Residential vs. commercial: what changes",
  lead: "Installing landscape is the same skill. What changes is who hires you, the paperwork, the competition and how you get paid.",
  body: `<div class="tablewrap"><table>
<thead><tr><th></th><th>Residential (what you know)</th><th>Commercial (what you're learning)</th></tr></thead>
<tbody>
<tr><td><strong>Who hires you</strong></td><td>A homeowner</td><td>A general contractor (GC), or a public agency directly</td></tr>
<tr><td><strong>Who designs</strong></td><td>Often you</td><td>A landscape architect. You build exactly what is drawn.</td></tr>
<tr><td><strong>Documents</strong></td><td>A sketch or an idea</td><td>A plan set, a specification book and a contract</td></tr>
<tr><td><strong>How price is set</strong></td><td>You quote, they decide</td><td>Several contractors price the same plans; the comparison decides</td></tr>
<tr><td><strong>Payment</strong></td><td>Deposit and progress payments</td><td>Monthly bill (“pay application”), paid 30–60+ days later, with 5–10% held back until the end (“retention”)</td></tr>
<tr><td><strong>Paperwork</strong></td><td>Light</td><td>Insurance certificates, submittals, schedules, lien releases, certified payroll on public jobs</td></tr>
<tr><td><strong>Changes</strong></td><td>Talk it over and adjust</td><td>Only by a written, signed change order</td></tr>
<tr><td><strong>Schedule</strong></td><td>Flexible</td><td>Tied to the GC's schedule. Delays can cost you money.</td></tr>
</tbody></table></div>`,
  deeper: `<p>California's home improvement rules limit a homeowner down payment to 10% of the contract or $1,000, whichever is less (Business and Professions Code §7159). Commercial contracts don't have that cap, but they have their own terms: retention, pay-when-paid clauses, insurance requirements and more. You will read those in Module 16.</p>`,
  src: "Cal. Business & Professions Code §7159."
},

{ h: "The players on a commercial project",
  lead: "Every commercial job has the same cast. Learn who each one is, because each one affects your bid.",
  body: `<div class="flow" role="list">
<div class="node" role="listitem"><b>Owner</b><span>Pays for the project: a developer, business, HOA, city, school district</span></div>
<div class="node" role="listitem"><b>Designers</b><span>Landscape architect, civil engineer, architect</span></div>
<div class="node" role="listitem"><b>General contractor</b><span>Signs with the owner, runs the job, hires the trades</span></div>
<div class="node you" role="listitem"><b>You: landscape sub</b><span>Irrigation, planting, soil, mulch, establishment</span></div>
<div class="node" role="listitem"><b>Suppliers</b><span>Irrigation supply house, nurseries, soil yards, rental yards</span></div>
<div class="node" role="listitem"><b>Inspectors</b><span>City inspector, owner's rep, agency resident engineer</span></div>
</div>
<ul>
<li>The <strong>landscape architect (LA)</strong> draws the planting and irrigation plans and writes the landscape specs. They answer design questions and approve your products.</li>
<li>The <strong>civil engineer</strong> draws grading, drainage and utilities. Your water source (the point of connection) is often on their sheets.</li>
<li>The <strong>GC</strong> is your customer on most private jobs. Their estimator invites you to bid; their project manager and superintendent run the job.</li>
</ul>`,
  ex: `<p>A new drive-thru coffee shop. <strong>Owner:</strong> a developer. <strong>LA:</strong> draws three landscape sheets. <strong>GC:</strong> builds everything and hires you for landscape and irrigation. <strong>Suppliers:</strong> you buy irrigation parts from a supply house such as Ewing or SiteOne, and plants from a wholesale nursery. <strong>Inspector:</strong> the city checks the backflow device and the final landscape.</p>`
},

{ h: "How contracts, bills and money move",
  lead: "Contracts flow down. Bills flow up. Money flows back down, slowly, with some held back.",
  body: `<ol class="steps">
<li><div><b>Owner signs a contract with the GC.</b>The GC promises to build the whole project.</div></li>
<li class="hl"><div><b>GC signs a subcontract with you.</b>You promise to build the landscape scope.</div></li>
<li><div><b>You buy from suppliers.</b>Purchase orders for pipe, heads, plants, soil.</div></li>
<li class="hl"><div><b>Each month you bill the GC.</b>A “pay application” for the percent of work you finished.</div></li>
<li><div><b>The GC bills the owner.</b>Your bill goes inside theirs.</div></li>
<li><div><b>The owner pays the GC, then the GC pays you.</b>Often 30–60+ days after you billed, minus retention.</div></li>
<li class="hl"><div><b>Retention comes at the end.</b>The 5–10% held back is released after the job is accepted.</div></li>
</ol>`,
  watch: `<p>You pay your crew every week and your suppliers within 30 days, but you may not see the GC's money for two months. A job can be profitable on paper and still run you out of cash. Module 3 shows this with real numbers.</p>`,
  deeper: `<ul>
<li>On private jobs in California, a GC generally must pay a sub within 7 days of receiving payment for that sub's work, unless the contract says otherwise (Business and Professions Code §7108.5).</li>
<li>On California public works, retention is generally capped at 5% (Public Contract Code §7201).</li>
<li>Many subcontracts include “pay-when-paid” language. It affects how long you wait, so read it before you sign.</li>
<li>With each payment you sign a lien release. California uses statutory forms (Civil Code §§8132–8138). Never sign an unconditional release before the money clears.</li>
</ul>`,
  src: "Cal. B&P Code §7108.5; Public Contract Code §7201; Civil Code §§8132–8138."
},

{ h: "The life of a project",
  lead: "Landscape is one of the last trades on most jobs. You bid early, but you may install many months later.",
  body: `<ol class="steps">
<li><div><b>Design</b>The owner hires designers. Plans and specs are drawn.</div></li>
<li class="hl"><div><b>Bidding</b>GCs and subs price the plans. This is what this course teaches.</div></li>
<li><div><b>Award and contract</b>The owner picks a GC. The GC picks subs and signs subcontracts.</div></li>
<li class="hl"><div><b>Submittals</b>You send product data, plant sources, soil tests and samples for approval before you order.</div></li>
<li><div><b>Construction</b>Grading, utilities, building, paving. You install sleeves early, then come back near the end.</div></li>
<li class="hl"><div><b>Landscape installation</b>Irrigation, soil prep, planting, mulch, controller programming.</div></li>
<li><div><b>Inspection and punch list</b>The LA and inspector walk the job and list fixes.</div></li>
<li class="hl"><div><b>Plant establishment / maintenance period</b>You water, weed and replace dead plants for a set time, often 90 days or more.</div></li>
<li><div><b>Final acceptance and warranty</b>Retention is released. Your warranty period starts, often one year.</div></li>
</ol>`,
  ex: `<p>You bid an apartment project in March. The building takes 14 months. You install landscape the next May. If plant or PVC prices rise 8% in that time, that comes out of your profit unless your bid planned for it.</p>`,
  deeper: `<p>The plant establishment (or maintenance) period is set in the specs. Public projects often require 90 days to a year, sometimes longer, with weekly visits, reports and plant replacement. It is real labor that must be in your price. Module 5 shows where to find it in the specs.</p>`
},

{ h: "Two markets: private and public",
  lead: "Private and public jobs use the same estimating skills but different rules. You will learn both.",
  body: `<div class="twocol">
<div><h3>Private work</h3><ul>
<li>Owner is a business, developer or HOA</li>
<li>You usually bid to a GC, not the owner</li>
<li>The GC can pick any sub it wants, not only the lowest</li>
<li>Relationships matter a lot</li>
<li>Invites come by email and bid platforms</li>
<li>Prices can be discussed and adjusted</li>
<li>Prevailing wage usually doesn't apply</li>
</ul></div>
<div><h3>Public work</h3><ul>
<li>Owner is a city, county, school district, water district or state agency</li>
<li>Must be advertised; any qualified contractor can bid</li>
<li>Award goes to the “lowest responsive, responsible bidder”</li>
<li>All bid prices become public after opening</li>
<li>Strict forms and deadlines; small mistakes get bids thrown out</li>
<li>Prevailing wage, DIR registration and certified payroll apply</li>
<li>Bonds are usually required</li>
</ul></div>
</div>`,
  watch: `<p>Some “private” projects are paid partly with public money, such as affordable housing with city or state funds. That can make them public works for prevailing wage. Always check the bid documents for prevailing wage language.</p>`,
  deeper: `<p>California Labor Code §1720(a)(1) defines public works as construction “paid for in whole or in part out of public funds.” That is why some privately owned projects still require prevailing wages.</p>`,
  src: "Cal. Labor Code §1720."
},

{ h: "How projects get contracted",
  lead: "How the owner hires the GC changes how and when you get to bid.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Method</th><th>In plain words</th><th>What it means for you</th></tr></thead>
<tbody>
<tr><td><strong>Design-bid-build</strong></td><td>Design is finished, then contractors bid, then it gets built. Most common on public work.</td><td>You bid on finished plans. Price competition is strongest.</td></tr>
<tr><td><strong>Hard bid</strong></td><td>Lowest qualified price wins.</td><td>Your number has to be sharp, and your scope complete.</td></tr>
<tr><td><strong>Negotiated</strong></td><td>A private owner picks a GC they trust.</td><td>The GC still asks subs for prices, but may also weigh relationships and quality.</td></tr>
<tr><td><strong>Design-build</strong></td><td>One team designs and builds.</td><td>You may help design the irrigation system and give budgets early.</td></tr>
<tr><td><strong>CM at risk / CMAR</strong></td><td>A builder joins the team during design and guarantees a maximum price.</td><td>You may give early budget numbers, then bid formally later.</td></tr>
</tbody></table></div>`,
  ex: `<p>A school district hires a GC by CMAR to modernize a campus. In design, the GC asks you for a budget price for the new playfield irrigation. Months later, the GC sends out formal bid packages and you bid the final plans with other landscape subs.</p>`
},

{ h: "Where a landscape contractor fits",
  lead: "Depending on the job, you are either a subcontractor to a GC or the main (“prime”) contractor yourself.",
  body: `<div class="twocol">
<div><h3>As a subcontractor</h3><ul>
<li>Landscape on buildings: retail centers, offices, apartments, hotels, medical, schools</li>
<li>Landscape on bigger civil jobs, under a general engineering (Class A) contractor: street projects, large parks, stormwater basins</li>
<li>Your customer is the GC</li>
</ul></div>
<div><h3>As the prime contractor</h3><ul>
<li>Landscape-only public jobs: median planting, park irrigation retrofits, water-saving turf conversions, landscape renovations</li>
<li>Only when the bid notice allows your license class (Module 2)</li>
<li>Your customer is the agency, and you handle all the paperwork</li>
</ul></div>
</div>`,
  ex: `<p>Typical San Diego County landscape bids: a median irrigation retrofit for a city, a school field renovation, planting and irrigation for a new apartment complex, an HOA common-area renovation, planting in a stormwater basin on a street project, and landscape for a new medical office building.</p>`
},

{ h: "“Lowest responsive, responsible bidder”",
  lead: "Public jobs don't go to the lowest number alone. They go to the lowest bid that followed the rules, from a company that can do the work.",
  body: `<ul>
<li><strong>Lowest:</strong> the lowest total price.</li>
<li><strong>Responsive:</strong> the bid follows the instructions exactly. Every form filled and signed, every addendum acknowledged, the bid bond included, subcontractors listed, submitted on time.</li>
<li><strong>Responsible:</strong> the company can actually do the job: right license, registered with DIR, experience, a clean record, financial strength.</li>
</ul>
<p>Miss any one and the agency can throw out your bid, even if it was the cheapest.</p>`,
  ex: `<p>Bidder A: $412,000, everything complete. Bidder B: $398,000, but forgot to acknowledge Addendum 2, which added 40 trees. The agency finds Bidder B non-responsive and awards to Bidder A. Bidder B did all the work of estimating for nothing.</p>`,
  deeper: `<p>Agencies can choose to waive a truly minor irregularity that gives no bidder an advantage. You can't count on it. Anything that touches price, such as an addendum or a missing bond, usually can't be waived.</p>`
},

{ h: "What's inside a bid package",
  lead: "When you get invited to bid, you receive a package of documents. All of it matters, not only the drawings.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Document</th><th>What it tells you</th></tr></thead>
<tbody>
<tr><td><strong>Invitation to bid / Notice inviting bids</strong></td><td>Project name, due date and time, where to submit, job walk date, license needed, bond needed</td></tr>
<tr><td><strong>Instructions to bidders</strong></td><td>The rules for how to bid. Follow them exactly.</td></tr>
<tr><td><strong>Bid form</strong></td><td>The form your price goes on. Public jobs often have line items with quantities.</td></tr>
<tr><td><strong>Plans (drawings)</strong></td><td>What to build and where. Landscape sheets usually start with “L”.</td></tr>
<tr><td><strong>Specifications (project manual)</strong></td><td>Products, quality, methods, testing, warranty, establishment period</td></tr>
<tr><td><strong>Addenda</strong></td><td>Changes issued during bidding. Each one changes the job.</td></tr>
<tr><td><strong>Contract and bond forms</strong></td><td>What you'll sign if you win</td></tr>
<tr><td><strong>Wage information</strong></td><td>On public work: prevailing wage requirements</td></tr>
<tr><td><strong>Reports</strong></td><td>Soil or geotechnical reports, sometimes an agronomic soil test</td></tr>
</tbody></table></div>`,
  watch: `<p>The landscape sheets aren't the only ones that matter. The water meter and point of connection may be on civil sheets, and controller power on electrical sheets. Module 4 teaches you to search the whole set.</p>`
},

{ h: "What a landscape scope usually includes",
  lead: "Commercial landscape bids are bigger than “plants and sprinklers.” Here is what usually falls in your package.",
  body: `<div class="twocol">
<div><h3>Irrigation</h3><ul>
<li>Point of connection to the water source</li>
<li>Backflow preventer and enclosure</li>
<li>Master valve and flow sensor</li>
<li>Controller, weather or soil sensor</li>
<li>Mainline (pressure pipe), by size</li>
<li>Remote control valves and valve boxes</li>
<li>Lateral lines, spray heads, rotors, drip</li>
<li>Control wire, sleeves under paving</li>
<li>Testing, as-built drawings, controller chart</li>
</ul></div>
<div><h3>Planting</h3><ul>
<li>Weed removal before planting</li>
<li>Fine grading</li>
<li>Soil testing and amendments</li>
<li>Trees with staking or guying, and root barrier</li>
<li>Shrubs and groundcover by container size</li>
<li>Turf: sod or seed (less common now)</li>
<li>Mulch, decomposed granite, boulders</li>
<li>Plant establishment / maintenance period</li>
<li>Warranty and plant replacement</li>
</ul></div>
</div>`,
  watch: `<p>Sleeves under paving are often drawn on the landscape sheets but must be installed before paving, months before you start. Ask early who installs them.</p>`
},

{ h: "Bid leveling: how a GC compares subs",
  lead: "GCs don't just pick the lowest number. They line up every bid and fill in anything missing with their own estimate, called a “plug.”",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Item</th><th class="num">Sub A</th><th class="num">Sub B</th><th class="num">Sub C</th></tr></thead>
<tbody>
<tr><td>Base bid as submitted</td><td class="num">$182,000</td><td class="num">$164,000</td><td class="num">$176,000</td></tr>
<tr><td>90-day establishment</td><td class="num">Included</td><td class="num">Excluded → plug $14,000</td><td class="num">Included</td></tr>
<tr><td>Backflow and enclosure</td><td class="num">Included</td><td class="num">Excluded → plug $6,000</td><td class="num">Included</td></tr>
<tr><td>Sleeves under paving</td><td class="num">Included</td><td class="num">Included</td><td class="num">Included</td></tr>
<tr><td><strong>Leveled total</strong></td><td class="num"><strong>$182,000</strong></td><td class="num"><strong>$184,000</strong></td><td class="num"><strong>$176,000</strong></td></tr>
</tbody></table></div>
<p>Sub B looked cheapest, but after leveling, Sub C is the real low bid. The GC calls Sub C.</p>`,
  ex: `<p>The lesson for you: a complete, clear bid is easier for a GC to say yes to. If you exclude something, say it plainly so the GC isn't surprised later. That builds trust, and trust gets you invited again.</p>`,
  deeper: `<p>GCs usually plug missing items on the high side to protect themselves. So a missing item can make a sub look more expensive than they really are. Clear inclusions and exclusions keep the comparison fair. Module 13 covers how to write them.</p>`
},

{ h: "Why bids are won and lost",
  lead: "Price matters most, but plenty of bids are lost before price is even compared.",
  body: `<div class="twocol">
<div><h3>Common reasons for losing</h3><ul>
<li>Price too high (often from missing production efficiency or a high markup)</li>
<li>Scope gaps or unclear exclusions</li>
<li>Late. Even one minute late on a public bid.</li>
<li>Missing forms, signatures, bond or addenda</li>
<li>Not registered (DIR) or wrong license class</li>
<li>No relationship; the GC already trusts another sub</li>
<li>Can't meet the schedule or insurance requirements</li>
</ul></div>
<div><h3>What winners do</h3><ul>
<li>Read every document, including addenda</li>
<li>Know their real costs from past jobs</li>
<li>Send clean, complete, easy-to-compare proposals</li>
<li>Submit early and confirm it was received</li>
<li>Follow up after bid day and ask for feedback</li>
<li>Track results and learn the market's prices</li>
<li>Keep relationships with GC estimators</li>
</ul></div>
</div>`
},

{ h: "A bid from start to finish",
  lead: "A typical bid takes two to four weeks from invitation to due date. Here's what happens along the way.",
  body: `<ol class="steps">
<li><div><b>Day 1: Invitation arrives</b>Download everything. Put the due date and job walk on the calendar. Decide go or no-go.</div></li>
<li><div><b>Day 3: Job walk / pre-bid meeting</b>See the site. Note access, existing conditions, water source.</div></li>
<li class="hl"><div><b>Days 3–12: Study and take off</b>Read plans and specs. Count and measure everything.</div></li>
<li><div><b>Day 10: Question deadline</b>Last day to send RFIs (questions).</div></li>
<li><div><b>Day 13: Last addendum</b>Answers and changes are issued. Update your takeoff.</div></li>
<li class="hl"><div><b>Days 12–16: Price it</b>Supplier quotes, labor, equipment, overhead and markup.</div></li>
<li><div><b>Day 17: Sub bids due to GCs</b>Often the day before, or the morning of, the GC's deadline.</div></li>
<li><div><b>Day 18, 2:00 PM: GC bids due to the owner</b>Public bids are opened and read, often the same day.</div></li>
<li><div><b>Weeks later: Award and contract</b>Then the notice to proceed, the official start.</div></li>
</ol>`,
  deeper: `<p>On public jobs the bid results (“bid tabulation” or “bid tab”) are usually posted online within days. Even when you don't bid, these are a free education in what the market pays. Module 3 shows how to read them.</p>`
},

{ h: "Bid day, for real",
  lead: "On bid day a GC estimator is collecting dozens of prices from every trade in a few hours. Make it easy for them.",
  body: `<ul>
<li><strong>Send your scope early</strong> (a day or two before) so the estimator can read it before the rush.</li>
<li><strong>Send your price on time</strong>, using the GC's bid form if they have one.</li>
<li><strong>Confirm they received it.</strong> A short call or email: “Did you get our landscape number?”</li>
<li><strong>Be reachable.</strong> Estimators call with last-minute questions. A missed call can mean a missed job.</li>
<li><strong>Send to every GC</strong> bidding the project, not only one. Each GC is a separate chance to win.</li>
</ul>`,
  watch: `<p>Many subs send their price in the final hour so competitors can't “shop” it. That's normal, but if your email arrives after the GC has finished their spreadsheet, you're out. Know each GC's cutoff time.</p>`
},

{ h: "What carries over, and what's new",
  lead: "You're not starting from zero. Your field knowledge is a big advantage once you add the office skills.",
  body: `<div class="twocol">
<div><h3>You already have</h3><ul>
<li>How irrigation systems are built</li>
<li>Plant knowledge and sizes</li>
<li>How long installation really takes</li>
<li>Supplier relationships</li>
<li>A crew that knows the work</li>
<li>A C-27 license and history</li>
</ul></div>
<div><h3>You're adding</h3><ul>
<li>Reading formal plans and specifications</li>
<li>Precise takeoffs and estimating</li>
<li>Written communication: RFIs, proposals</li>
<li>Insurance, bonds and registrations</li>
<li>Public works rules and prevailing wage</li>
<li>Tracking bids and learning from results</li>
</ul></div>
</div>`,
  ex: `<p>Many new commercial estimators come from the office and have never installed a valve. You have the opposite advantage: when you count labor hours, you know what a day of trenching really looks like. Keep that advantage as you learn the paperwork.</p>`
},

{ t: "terms", h: "Words to know",
  lead: "Add these to your own notebook. You'll see every one of them again.",
  terms: [
    ["Bid", "A written promise to do specific work for a specific price."],
    ["General contractor (GC)", "The company hired by the owner to build the whole project. Hires subs."],
    ["Subcontractor (sub)", "A specialty company hired by the GC for one part of the work."],
    ["Prime contractor", "The contractor hired directly by the owner. On landscape-only jobs, that can be you."],
    ["Owner", "Whoever pays for the project: developer, business, HOA or agency."],
    ["Landscape architect (LA)", "Designs the landscape and irrigation and writes the landscape specs."],
    ["Scope of work", "Exactly what work is included in your bid."],
    ["Plans / drawings", "The sheets showing what to build and where."],
    ["Specifications (specs)", "The written book of products, methods and requirements."],
    ["Addendum (plural: addenda)", "An official change to the bid documents issued before bids are due."],
    ["Takeoff", "Counting and measuring everything on the plans."],
    ["RFI", "Request for information. A written question about the documents."],
    ["Bid leveling", "When the GC compares sub bids side by side and fills gaps."],
    ["Plug", "The GC's own estimate for something a sub left out."],
    ["Pay application", "Your monthly bill for the work completed."],
    ["Retention", "Part of each payment (often 5–10%) held back until the job is finished."],
    ["Change order", "A signed, written change to the contract scope or price."],
    ["Punch list", "The list of fixes found at the final walk-through."],
    ["Plant establishment period", "Time after planting when you maintain and replace plants, set by the specs."],
    ["Prevailing wage", "Minimum wages set by the state for public works."],
    ["Responsive", "A bid that followed all the instructions."],
    ["Responsible", "A bidder able to do the work: licensed, registered, qualified."],
    ["Bid tab", "The posted list of every bidder's price after a public bid opening."],
    ["Notice to proceed (NTP)", "The official go-ahead to start the work."]
  ]
},

{ t: "quiz", id: "m1", h: "Check yourself",
  lead: "Tap an answer to see if you got it. You can try again any time.",
  qs: [
    { q: "What is a bid?", a: ["A rough guess at the cost", "A written promise to do specific work for a specific price", "A question about the plans"], c: 1, why: "A bid is a promise. If it's accepted, it becomes the basis of a contract you're expected to honor." },
    { q: "On a new office building, who usually hires the landscape contractor?", a: ["The owner directly", "The landscape architect", "The general contractor"], c: 2, why: "On building projects, the GC holds the contract with the owner and hires the trades as subs." },
    { q: "What is retention?", a: ["Part of each payment held back until the job is finished", "A penalty for being late", "The deposit the owner pays up front"], c: 0, why: "Retention (often 5–10%, capped at 5% on most California public works) is released after the job is accepted." },
    { q: "Sub B had the lowest number but excluded the maintenance period. What will the GC most likely do?", a: ["Award to Sub B because it's cheapest", "Add a plug for the missing maintenance and compare again", "Ask the owner to remove the maintenance period"], c: 1, why: "That's bid leveling. After plugs are added, a 'cheap' bid often isn't the lowest anymore." },
    { q: "A public bid is the lowest but the bidder forgot to acknowledge an addendum. What can happen?", a: ["Nothing, the price is all that matters", "The bid can be rejected as non-responsive", "The agency must call the bidder to fix it"], c: 1, why: "Public jobs go to the lowest responsive, responsible bidder. Missing an addendum usually makes a bid non-responsive." },
    { q: "Which is usually TRUE of public work but not most private work?", a: ["Prevailing wage and DIR registration apply", "Relationships decide who wins", "Prices are kept secret after bidding"], c: 0, why: "Public works require prevailing wages and DIR registration, and bid results are public." },
    { q: "How are changes made on a commercial job?", a: ["A phone call with the superintendent", "A written, signed change order", "Adding it to the next invoice"], c: 1, why: "Without a signed change order, extra work is often never paid." },
    { q: "Why does landscape bidding carry extra price risk?", a: ["Plants are always on sale", "Landscape is installed near the end, often months after the bid", "Landscape contracts can't be changed"], c: 1, why: "Prices for plants, pipe and labor can rise between bid day and installation. Your bid should account for it." }

<li>A bid is a promise. Scope, price and terms must all be clear.</li>

{ h: "Why paperwork comes before pricing",
  lead: "On commercial and public jobs, your company has to qualify before your price is even looked at.",
  body: `<p>Before a GC or agency compares prices, they check:</p>
<ul>
<li>Is the license active, and is it the right class for this work?</li>
<li>Is the company registered with the state for public work (DIR)?</li>
<li>Does the insurance meet their limits?</li>
<li>Can the company get the bonds the job requires?</li>
<li>Does the company have experience and a safety record?</li>
</ul>
<p>Any “no” can end your chances. The good news: once this is set up, it carries over to every bid.</p>`,
  ex: `<p>A GC's estimator likes your number but their prequalification form shows no bonding letter and an expired insurance certificate. They give the job to the next sub on the list, who sent everything the first time.</p>`
},

{ h: "California contractor licenses, the basics",
  lead: "In California the Contractors State License Board (CSLB) licenses contractors. A license belongs to a business, not a person.",
  body: `<ul>
<li><strong>The license belongs to the business entity</strong>: a sole owner, partnership, corporation or LLC.</li>
<li><strong>A qualifying individual (the “qualifier”)</strong> passed the exams or was waived and is responsible for the company's construction work. A qualifier is either an <strong>RMO</strong> (responsible managing officer, an owner or officer) or an <strong>RME</strong> (responsible managing employee).</li>
<li><strong>Classifications</strong> say what work the company can do:
  <ul>
  <li><strong>A:</strong> general engineering (streets, utilities, large civil work)</li>
  <li><strong>B:</strong> general building (structures)</li>
  <li><strong>C-xx:</strong> specialty trades. <strong>C-27 is Landscaping.</strong></li>
  </ul></li>
</ul>`,
  deeper: `<p>California requires a license for any job of $1,000 or more in labor and materials combined, or any job that needs a building permit (B&P Code §7048; the limit was $500 before 2025). On commercial and public work you'll always be over that.</p>
<p>Look up any company's license, including competitors and GCs, with CSLB's free Instant License Check. It shows classifications, bond, workers' comp, and any complaints or discipline.</p>`,
  src: "CSLB, cslb.ca.gov; Cal. B&P Code §§7048, 7055–7059, 7068."
},

{ h: "What your B and C-27 licenses allow",
  lead: "For commercial landscape and irrigation bids, the C-27 is the license that matters. The B alone isn't enough.",
  body: `<div class="twocol">
<div><h3>C-27 Landscaping</h3><ul>
<li>Landscape systems for public and private property</li>
<li>Grading and preparing land for landscape</li>
<li>Irrigation systems</li>
<li>Planting, soil prep, mulch</li>
<li>Landscape hardscape such as walks, low garden walls, patios and drainage tied to the landscape</li>
<li>Lets you bid landscape as a sub, or as prime on landscape-only jobs</li>
</ul></div>
<div><h3>B General Building</h3><ul>
<li>Lets you be the GC on buildings</li>
<li><strong>Can't</strong> take a contract for one specialty trade (like landscape only) unless it also includes framing or carpentry, or you hold that specialty license</li>
<li>So a B alone can't bid a landscape-only subcontract</li>
<li>With the C-27 too, the company can do both</li>
</ul></div>
</div>`,
  watch: `<p>Read the official CSLB wording for C-27 before bidding anything unusual, like large retaining walls, pools, fountains, electrical for site lighting, or major grading. Those may need another classification.</p>`,
  deeper: `<p>B&P Code §7057 limits a B contractor from taking a contract for a single specialty trade other than framing or carpentry, unless the B contractor also holds that specialty license or subcontracts the work to someone who does. The C-27 description comes from CSLB's classification regulations (California Code of Regulations, Title 16, §832.27).</p>`,
  src: "Cal. B&P Code §7057; 16 CCR §832.27; CSLB classification pages."
},

{ h: "Who can bid what on public work",
  lead: "Each public bid notice says which license class can bid as the prime. Check it before you spend any time.",
  body: `<ul>
<li><strong>Landscape-only jobs</strong> (median planting, park irrigation retrofits, turf conversions) often allow a C-27 prime. You bid directly to the agency.</li>
<li><strong>Mixed civil jobs</strong> (streets, parks with grading, concrete and utilities) often require an <strong>A</strong> license to be prime. You bid your landscape scope to the A contractors as a sub.</li>
<li><strong>Building jobs</strong> (schools, libraries, fire stations) usually require a <strong>B</strong> prime. Your company's B could let it bid as GC, but that's a different business. For this division you'd normally bid landscape to the B contractors.</li>
</ul>`,
  ex: `<p>Notice says: “Bidders must possess a valid Class A or C-27 license at the time of bid.” → Your company can bid as prime.</p>
<p>Notice says: “Class A license required.” → You can't be prime. Find out which A contractors are bidding (often listed on the planholders list) and send them your landscape price.</p>`,
  deeper: `<p>B&P Code §7059 lets the awarding agency decide which classifications can bid, and allows a specialty contractor to bid when the work is in its specialty. Public Contract Code §3300 requires agencies to state the license class in the bid documents.</p>`,
  src: "Cal. B&P Code §7059; Public Contract Code §3300."
},

{ h: "The new company question",
  lead: "If the company forms a new business to bid commercial work, that new business needs its own license. Licenses can't be transferred.",
  body: `<ul>
<li>CSLB ties the license to the business entity. A new LLC or corporation must apply for its own license, even with the same qualifier.</li>
<li>An existing qualifier can often skip the exams by applying with an exam waiver.</li>
<li>The new entity will usually get a <strong>new license number</strong>, with no work history attached.</li>
<li>Until that license is issued, the new company can't bid.</li>
</ul>
<p><strong>The qualifier rules decide what's possible:</strong></p>
<ul>
<li>An <strong>RMO</strong> can qualify more than one company only if there's at least 20% common ownership, and no more than three firms in one year.</li>
<li>An <strong>RME</strong> can qualify only one active license and must work at least 32 hours a week (or 80% of operating hours) for it.</li>
<li>If a qualifier leaves a license, that company has 90 days to replace them or the license is suspended.</li>
</ul>`,
  watch: `<p>A new company starts with no track record. Sureties set bonding from financial history, and prequalification forms ask for years in business and completed projects. The new company will qualify for smaller jobs at first, even with the same people.</p>`,
  ex: `<p><strong>Decision for the owner:</strong> bid under the existing company (license, history and financials already in place), or start the new company (cleaner separation, but slower start)? There can be good liability or tax reasons for a new company. This is a question for a construction attorney, a CPA and a surety agent together, and it should be settled before any registrations are done, because they all attach to one entity.</p>`,
  deeper: `<p>An LLC license requires a $100,000 employee/worker bond in addition to the standard $25,000 contractor bond, and liability insurance of at least $1 million (more with more than five listed members). A corporation needs only the $25,000 contractor bond.</p>
<p>CSLB reissues an existing license number only in limited cases. Ask CSLB directly if you think yours qualifies.</p>`,
  src: "CSLB: Change in Business Entity; CSLB: Licenses for LLCs; Cal. B&P Code §§7068.1, 7071.6, 7071.6.5, 7071.19."
},

{ h: "Insurance: what GCs and agencies ask for",
  lead: "Every commercial job requires proof of insurance, called a certificate of insurance (COI). The contract sets the limits and wording.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Coverage</th><th>What it covers</th><th>Commonly required</th></tr></thead>
<tbody>
<tr><td><strong>General liability (GL)</strong></td><td>Injury or damage you cause to others</td><td>$1M per occurrence / $2M aggregate</td></tr>
<tr><td><strong>Auto liability</strong></td><td>Your trucks and vehicles</td><td>$1M combined single limit</td></tr>
<tr><td><strong>Workers' compensation</strong></td><td>Your employees' injuries. Required by law if you have employees.</td><td>Statutory, plus $1M employer's liability</td></tr>
<tr><td><strong>Umbrella / excess</strong></td><td>Extra coverage above the others</td><td>$1M–$5M on larger jobs</td></tr>
</tbody></table></div>
<p>Those are typical amounts, not rules. Each contract lists its own.</p>`,
  watch: `<p>Commercial contracts also ask for special <strong>endorsements</strong>, wording added to your policy. If your agent can't add them, you can't sign the contract. Ask your agent about them now:</p>
<ul>
<li><strong>Additional insured</strong>: the GC and owner are covered by your policy (forms often called CG 20 10 for ongoing work and CG 20 37 for completed work).</li>
<li><strong>Primary and non-contributory</strong>: your policy pays first.</li>
<li><strong>Waiver of subrogation</strong>: your insurer won't sue the GC to recover a claim.</li>
</ul>`,
  deeper: `<p>Raising your limits and adding endorsements costs money. Find out the cost before you bid, so it's in your overhead or job cost. If a project has a wrap-up insurance program (OCIP or CCIP), the owner or GC provides some coverage and you may have to deduct your own insurance cost from your bid. The bid documents will say.</p>`
},

{ h: "Bonds, in plain words",
  lead: "A bond is a guarantee from a surety company that you'll do what you promised. If you don't, the surety pays, and then you pay the surety back.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Bond</th><th>What it guarantees</th><th>Usual amount</th></tr></thead>
<tbody>
<tr><td><strong>Bid bond</strong></td><td>If you win, you'll sign the contract at your bid price</td><td>Usually 10% of your bid</td></tr>
<tr><td><strong>Performance bond</strong></td><td>You'll finish the work as the contract requires</td><td>Usually 100% of the contract</td></tr>
<tr><td><strong>Payment bond</strong></td><td>You'll pay your workers, subs and suppliers</td><td>Usually 100% of the contract</td></tr>
<tr><td><strong>Maintenance / warranty bond</strong></td><td>You'll fix problems during the warranty period</td><td>Varies</td></tr>
</tbody></table></div>
<p>A bond is <strong>not insurance for you</strong>. It protects the owner. If the surety pays a claim, your company and usually its owners personally must pay it back.</p>`,
  ex: `<p>You win a $300,000 park irrigation job. The City requires a 10% bid bond at bid time, then 100% performance and payment bonds before the contract is signed. If the bond premium is around 2%, that's about $6,000, and it belongs in your bid price.</p>`,
  deeper: `<ul>
<li>California public works contracts over $25,000 require a payment bond (Civil Code §9550). Most agencies also require a performance bond.</li>
<li>Premiums for smaller contractors often run about 1%–3% of the contract. Strong financials earn lower rates. Bid bonds are often free or cheap once you have a surety.</li>
<li>Some GCs require subs to provide bonds on larger subcontracts. Many will ask in their prequalification form whether you <em>can</em>.</li>
</ul>`,
  src: "Cal. Civil Code §9550."
},

{ h: "Bonding capacity",
  lead: "A surety decides how much work your company can bond. That number sets the biggest job you can take as a bonded contractor.",
  body: `<p>Sureties set two limits:</p>
<ul>
<li><strong>Single-job limit:</strong> the largest one contract they'll bond.</li>
<li><strong>Aggregate limit:</strong> the total of all bonded work you can have going at once.</li>
</ul>
<p>To set those, they look at:</p>
<ul>
<li>Financial statements, ideally prepared by a CPA who knows construction</li>
<li>Working capital (cash and receivables minus short-term bills)</li>
<li>Net worth (equity) of the company</li>
<li>The owners' personal credit and finances</li>
<li>Experience: largest jobs completed, years in business</li>
<li>Backlog and how past jobs turned out</li>
</ul>`,
  ex: `<p><strong>Questions to ask a surety agent on your first call:</strong> What bonding capacity can we qualify for today? What financial statements do you need? What would raise our limit in a year? What's your rate? Can you issue bid bonds quickly when we need them?</p>`,
  watch: `<p>Use a <strong>surety agent who specializes in construction</strong>, not just your regular insurance agent. Specialists know the sureties that work with small and growing contractors.</p>`
},

{ h: "DIR registration for public works",
  lead: "Before your company can bid public work, or even be listed as a sub on someone else's public bid, it must be registered with the California Department of Industrial Relations (DIR).",
  body: `<ul>
<li><strong>Cost:</strong> $400 per year (check DIR for the current fee). You can pay for up to three years at once.</li>
<li><strong>Year:</strong> registration runs July 1 to June 30. Renew before it expires.</li>
<li><strong>Requirements include:</strong> an active CSLB license, workers' compensation coverage, and no unpaid wage judgments or debarment.</li>
<li><strong>Where:</strong> online at the DIR public works contractor registration page.</li>
</ul>`,
  watch: `<p>Bidding without registration can disqualify the bid. DIR allows late registration in limited cases only with a $2,000 penalty. Register first, then bid.</p>`,
  deeper: `<ul>
<li><strong>Small project exemption:</strong> registration isn't required on public works of $25,000 or less for new construction, or $15,000 or less for alteration, demolition, repair or maintenance. But prevailing wage still applies to public works over $1,000.</li>
<li>Registered contractors must submit certified payroll records electronically to DIR (eCPR) on most projects and follow apprenticeship rules. Module 11 covers this in detail.</li>
<li>You can look up any contractor's DIR registration on DIR's public search.</li>
</ul>`,
  src: "DIR Public Works Contractor Registration; Cal. Labor Code §§1725.5, 1771, 1771.1."
},

{ h: "SLBE/ELBE: the City of San Diego's small business program",
  lead: "The City certifies small, local construction firms. Certified firms get access to jobs and to primes who need them.",
  body: `<ul>
<li><strong>SLBE:</strong> Small Local Business Enterprise. <strong>ELBE:</strong> Emerging Local Business Enterprise (smaller).</li>
<li>To qualify, the firm must be based in San Diego County and stay under revenue limits. City bid documents in 2026 listed limits of $6.5M for SLBE and $3.5M for ELBE for specialty construction. Check the current figures.</li>
<li>Some City jobs are <strong>reserved</strong> for SLBE/ELBE firms only.</li>
<li>Larger City jobs set <strong>required SLBE/ELBE participation percentages</strong>. Prime contractors must find certified subs, and they come looking for them.</li>
<li>Certification is done through the City's Equal Opportunity Contracting program.</li>
</ul>`,
  ex: `<p>A $2.4M City street project requires 20% SLBE/ELBE participation. The A-licensed prime needs certified subs to hit that number. A certified landscape sub with a fair price becomes very valuable to that prime, often more valuable than a cheaper sub without certification.</p>`,
  deeper: `<p>Other certifications to know about:</p>
<ul>
<li><strong>California Small Business (SB)</strong> through the Department of General Services, used on state contracts.</li>
<li><strong>DBE</strong> (Disadvantaged Business Enterprise) through the California Unified Certification Program, used on federally funded transportation work. Requires 51% ownership by socially and economically disadvantaged individuals.</li>
<li><strong>DVBE</strong> (Disabled Veteran Business Enterprise), if an owner qualifies.</li>
</ul>
<p>Certifications attach to the business entity. Settle the new-company question first.</p>`,
  src: "City of San Diego, Equal Opportunity Contracting: SLBE program; City of San Diego bidding documents (2026)."
},

{ h: "Other registrations",
  lead: "A few more accounts and documents make the company ready to bid anywhere in the county.",
  body: `<ul>
<li><strong>City of San Diego business tax certificate</strong>, if the company does business in the City.</li>
<li><strong>PlanetBids vendor accounts</strong>: the City of San Diego and many other local agencies use PlanetBids. Each agency has its own portal and its own free registration.</li>
<li><strong>Cal eProcure</strong>: the State of California's bidding site.</li>
<li><strong>Bid platforms</strong> where GCs invite subs: BuildingConnected, PlanHub and others (Module 3).</li>
<li><strong>SAM.gov</strong>: only needed for federal jobs (military bases, federal buildings). Federal jobs have their own wage rules (Davis-Bacon).</li>
</ul>`,
  watch: `<p>Every registration should be in the exact legal name of the bidding entity, matching the CSLB license. Mismatched names cause rejected bids and payment delays.</p>`
},

{ h: "Safety: required and checked",
  lead: "GCs check your safety record before they let you on their site. Some won't invite you to bid without it.",
  body: `<ul>
<li><strong>IIPP:</strong> every California employer must have a written Injury and Illness Prevention Program. GCs ask for a copy.</li>
<li><strong>EMR</strong> (experience modification rate): a number from your workers' comp history. 1.0 is average; under 1.0 is better; over 1.0 is worse. Many GCs prefer 1.0 or lower. Ask your workers' comp carrier or agent for your EMR letter.</li>
<li><strong>Injury logs:</strong> Cal/OSHA Form 300 logs, if your company is required to keep them.</li>
<li><strong>Training:</strong> OSHA 10-hour for workers and 30-hour for supervisors is common on commercial sites.</li>
<li><strong>Site-specific needs:</strong> heat illness prevention (important in landscape work), trenching and excavation safety, equipment training.</li>
</ul>`,
  deeper: `<p>The IIPP requirement is in Title 8 of the California Code of Regulations, §3203. Cal/OSHA's heat illness standard (§3395) applies to all outdoor work and is checked on landscape crews. A new company without enough claims history may not have its own EMR yet; ask your agent how that will be shown.</p>`,
  src: "8 CCR §3203; 8 CCR §3395."
},

{ h: "The bid-ready folder",
  lead: "Keep one folder with everything GCs and agencies ask for, current and ready to send the same day.",
  body: `<div class="twocol">
<div><h3>Company documents</h3><ul>
<li>CSLB license printout</li>
<li>Sample certificate of insurance (COI)</li>
<li>W-9</li>
<li>DIR registration printout</li>
<li>Business tax certificate</li>
<li>SLBE/ELBE or other certification letters</li>
<li>Bonding capacity letter from your surety</li>
</ul></div>
<div><h3>Qualifications</h3><ul>
<li>One-page capabilities statement</li>
<li>Project list with dollar sizes and references</li>
<li>Equipment list</li>
<li>Key staff resumes</li>
<li>IIPP and safety program, EMR letter</li>
<li>Financial statements (send only when needed)</li>
<li>Standard exclusions and proposal template</li>
</ul></div>
</div>`,
  watch: `<p>Put an expiration date next to every document that expires: insurance, DIR, certifications. Check the folder on the first of each month. Sending an expired COI looks careless.</p>`
},

{ h: "Your capabilities statement",
  lead: "A one-page summary of what the company does. You'll attach it to every introduction email and prequalification form.",
  body: `<p><strong>What goes on it:</strong></p>
<ul>
<li>Company name, license number and classes, DIR number</li>
<li>Services: irrigation, planting, soil prep, establishment and maintenance, landscape renovation</li>
<li>Project types and size range you want</li>
<li>Service area: for example, San Diego County</li>
<li>3–5 representative projects, with photos if possible</li>
<li>Certifications (SLBE/ELBE when you have it)</li>
<li>Contact: estimator name, phone and email</li>
</ul>`,
  exLabel: "Example opening (edit to fit)",
  ex: `<p>“[Company] is a San Diego landscape and irrigation contractor (CSLB #XXXXXX, B and C-27) with [X] years of installation experience. We build commercial planting and irrigation systems, landscape renovations and water-efficient retrofits from $25,000 to $500,000 across San Diego County, and provide plant establishment and maintenance. DIR #XXXXXXX.”</p>`
},

{ h: "Prequalification forms",
  lead: "Many GCs and some agencies make you fill out a prequalification form before you can bid. Fill it out once, completely, and save the answers.",
  body: `<p><strong>Common questions:</strong></p>
<ul>
<li>Years in business and legal structure</li>
<li>Annual revenue for the last 3 years</li>
<li>Largest completed job and current backlog</li>
<li>Bonding capacity and surety contact</li>
<li>EMR and safety program</li>
<li>Insurance limits and carrier</li>
<li>References: GCs, owners, suppliers</li>
<li>Any lawsuits, claims, or contracts you didn't finish</li>
<li>Financial statements (often kept confidential)</li>
</ul>`,
  ex: `<p>Keep a “master prequal answers” document. When a new form arrives, copy and paste from it. A form that took four hours the first time then takes thirty minutes.</p>`,
  watch: `<p>Answer every question truthfully. A false statement on a public prequalification can disqualify you from future work with that agency.</p>`,
  deeper: `<p>Some California school districts and other agencies require formal prequalification for larger projects, often using a standard questionnaire scored on points. Check each agency's bid documents. Prequalification deadlines are often well before the bid date.</p>`
},

{ h: "Getting ready: the order of operations",
  lead: "Do these in order. Each step depends on the one before it.",
  body: `<ol class="steps">
<li class="hl"><div><b>Decide which company will bid</b>Existing company or new entity. Settle this with the owner, attorney and CPA.</div></li>
<li><div><b>Confirm the license</b>Look it up on CSLB. C-27 active? Right entity? Bonds and workers' comp current?</div></li>
<li><div><b>Call your insurance agent</b>Get current limits, ask about endorsements, get a sample COI.</div></li>
<li><div><b>Call a construction surety agent</b>Find out bonding capacity and what financials they need.</div></li>
<li class="hl"><div><b>Register with DIR</b>Required before any public bid.</div></li>
<li><div><b>Apply for SLBE/ELBE</b>If the company qualifies.</div></li>
<li><div><b>Register on PlanetBids and bid platforms</b>Module 3 covers this.</div></li>
<li class="hl"><div><b>Build the bid-ready folder</b>Capabilities statement, project list, safety documents.</div></li>
</ol>`
},

{ h: "Key terms in every notice",
  lead: "A few lines in a bid notice change your price and your risk.",
  body: `<ul>
<li><strong>Engineer's estimate:</strong> the agency's own guess at the cost. Good for sizing the job. Bids often land above or below it.</li>
<li><strong>Working days:</strong> how long you have to finish. Usually counts weekdays except holidays. Too short a schedule means more crews and overtime.</li>
<li><strong>Liquidated damages:</strong> a set dollar amount per day you're late, taken from your payment. At $1,500 a day, two weeks late costs $21,000.</li>
<li><strong>Mandatory pre-bid meeting:</strong> if it says mandatory and you miss it, you can't bid. No exceptions.</li>
<li><strong>Bid security:</strong> the bid bond, usually 10%.</li>
<li><strong>Bid opening:</strong> the time bids are opened and results read. Bids received one second late are rejected.</li>
</ul>`,
  watch: `<p>“Mandatory” means mandatory. Put mandatory meetings on the calendar the day you see the notice, and arrive early. Late arrivals often aren't signed in.</p>`

{ h: "Cash flow: the math nobody shows you",
  lead: "You pay for labor and materials now, but get paid much later, minus retention. Here's a simple example.",
  body: `<p><strong>Example:</strong> a $150,000 landscape subcontract over three months. Your costs are $120,000 ($40,000 a month). You bill $50,000 at the end of each month. The GC pays about 45 days later and holds 5% retention.</p>
<div class="tablewrap"><table>
<thead><tr><th>Month</th><th class="num">You spend</th><th class="num">You receive</th><th class="num">Cash position</th></tr></thead>
<tbody>
<tr><td>1</td><td class="num">−$40,000</td><td class="num">$0</td><td class="num">−$40,000</td></tr>
<tr><td>2</td><td class="num">−$40,000</td><td class="num">$0</td><td class="num">−$80,000</td></tr>
<tr><td>3</td><td class="num">−$40,000</td><td class="num">+$47,500</td><td class="num">−$72,500</td></tr>
<tr><td>4</td><td class="num">$0</td><td class="num">+$47,500</td><td class="num">−$25,000</td></tr>
<tr><td>5</td><td class="num">$0</td><td class="num">+$47,500</td><td class="num">+$22,500</td></tr>
<tr><td>Later</td><td class="num">$0</td><td class="num">+$7,500 retention</td><td class="num">+$30,000</td></tr>
</tbody></table></div>
<p>The job makes $30,000. But the company needs about <strong>$80,000 of cash</strong> before the first payment arrives, and it doesn't see its profit until month 5 or later.</p>`,
