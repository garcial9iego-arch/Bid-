{ h: "Worked example · 1,000 LF of 4\" mainline",
  lead: "Labor and equipment to install 1,000 LF of 4\" Class 315 PVC mainline on an open, flat site with normal soil. Production rates and costs are practice examples.",
  body: `<p><strong>Plan:</strong> the 4-person private crew from earlier, with a rented ride-on trencher and a plate compactor. Example production: 250 LF per crew-day for trench, lay, glue, thrust blocks, warning tape, backfill and compaction.</p>
<div class="tablewrap"><table>
<thead><tr><th>Step</th><th>Math</th><th class="num">Result</th></tr></thead>
<tbody>
<tr><td>Install days</td><td>1,000 LF ÷ 250 LF per day</td><td class="num">4.0 days</td></tr>
<tr><td>Pressure test, inspection, punch</td><td>Example</td><td class="num">0.5 day</td></tr>
<tr><td>Crew hours</td><td>4.5 days × 8 hours</td><td class="num">36 crew-hours</td></tr>
<tr><td>Labor hours (check)</td><td>36 × 4 people = 144 LH, or 0.144 LH per LF</td><td class="num">144 LH</td></tr>
<tr><td><strong>Labor</strong></td><td>36 × $144.16</td><td class="num"><strong>$5,189.76</strong></td></tr>
<tr><td>Trencher</td><td>Week rate</td><td class="num">$1,300.00</td></tr>
<tr><td>Trencher delivery and pickup</td><td>2 × $150</td><td class="num">$300.00</td></tr>
<tr><td>Trencher fuel</td><td>4 days × $45</td><td class="num">$180.00</td></tr>
<tr><td>Plate compactor</td><td>2 days × $95</td><td class="num">$190.00</td></tr>
<tr><td>Crew truck</td><td>4.5 days × $95</td><td class="num">$427.50</td></tr>
<tr><td><strong>Equipment</strong></td><td></td><td class="num"><strong>$2,397.50</strong></td></tr>
<tr><td>Small tools</td><td>3% × $5,189.76</td><td class="num">$155.69</td></tr>
<tr><td><strong>Labor, equipment and tools</strong></td><td>$5,189.76 + $2,397.50 + $155.69</td><td class="num"><strong>$7,742.95</strong></td></tr>
<tr><td><strong>Per LF</strong></td><td>$7,742.95 ÷ 1,000</td><td class="num"><strong>$7.74</strong></td></tr>
</tbody></table></div>`,
  ex: `<p><strong>Same work at the 2021 prevailing wage crew rate ($289.53):</strong> labor 36 × $289.53 = $10,423.08, tools 3% = $312.69, equipment $2,397.50. Total $13,133.27, or <strong>$13.13 per LF</strong> before pipe, fittings, tax, overhead and profit.</p>
<p><strong>Compare to the real bids:</strong> on 11-428704 (7,493 LF of 4" main), bids ran $12.00 to $35.00 per LF all-in, median $16.00, and the winner bid $12.00. On 11-430674 (33,604 LF), the winner bid $18.00 and the median was $18.00. A $12.00 all-in price means the winner produced far more than 250 LF a day on long, straight shoulder runs. On long runs, production rate is the whole game.</p>`,
  watch: `<p>If this main were on a freeway shoulder with a 9 AM to 3 PM window, production would drop to about 156 LF per day (previous slide) and labor would rise by about 60%. Always set production for the actual work window.</p>`,
  src: "Caltrans Bid Summaries 11-428704 item 63 and 11-430674 item 88."
},

{ h: "Check estimates against finished jobs",
  lead: "Every job is a test of your production rates. Compare what you estimated to what actually happened, and update your rates.",
  exLabel: "Practice example: estimated vs. actual hours log",
  ex: `<div class="tablewrap"><table>
<thead><tr><th>Cost code</th><th class="num">Qty</th><th class="num">Est. LH/unit</th><th class="num">Est. hours</th><th class="num">Actual hours</th><th class="num">Actual LH/unit</th><th class="num">Difference</th></tr></thead>
<tbody>
<tr><td>02 Laterals</td><td class="num">2,400 LF</td><td class="num">0.04</td><td class="num">96</td><td class="num">88</td><td class="num">0.037</td><td class="num">−8%</td></tr>
<tr><td>03 Spray heads</td><td class="num">310 EA</td><td class="num">0.30</td><td class="num">93</td><td class="num">109</td><td class="num">0.35</td><td class="num">+17%</td></tr>
<tr><td>04 Valves and wire</td><td class="num">14 EA</td><td class="num">1.5</td><td class="num">21</td><td class="num">26</td><td class="num">1.86</td><td class="num">+24%</td></tr>
<tr><td>11 1-gallon plants</td><td class="num">600 EA</td><td class="num">0.12</td><td class="num">72</td><td class="num">66</td><td class="num">0.11</td><td class="num">−8%</td></tr>
<tr><td><strong>Total</strong></td><td></td><td></td><td class="num"><strong>282</strong></td><td class="num"><strong>289</strong></td><td></td><td class="num"><strong>+2%</strong></td></tr>
</tbody></table></div>`,
  body: `<ul>
<li>The total looks fine, but heads and valves ran 17% to 24% over. On a heads-heavy job, that would hurt.</li>
<li>Ask the foreman why: different head type, rocky area, missing parts, rework?</li>
<li>Update the rate only after you see the same result on two or three jobs, or when the reason is clear.</li>
<li>Write the reason next to the number in your rate table.</li>
</ul>`,
  watch: `<p>This only works if foremen record hours by cost code every day. Make it simple: a short daily form or a phone app with the job's cost codes. Hours written up at the end of the week are guesses.</p>`
},

{ t: "terms", h: "Words to know",
  lead: "Add these to your notebook.",
  terms: [
    ["Labor burden", "Payroll taxes, insurance and benefits added on top of wages."],
    ["Burdened labor rate", "Wage plus burden: the true cost of one hour of a worker."],
    ["Crew rate", "The combined hourly cost of everyone on a crew."],
    ["FICA", "Social Security and Medicare taxes; the employer pays 7.65% of wages."],
    ["Workers' comp class code", "The category that sets your workers' comp rate (landscape is usually 0042)."],
    ["Experience mod", "A multiplier on workers' comp based on your claims history."],
    ["Prevailing wage", "The minimum wage and fringe set by the state for public work."],
    ["Fringe", "Benefit payments that are part of prevailing wage."],
    ["Production rate", "How fast work gets done, as labor hours per unit or units per crew-hour."],
    ["Labor hour (LH)", "One worker working one hour."],
    ["Crew-day", "One full crew working one day."],
    ["Cost code", "A label for each task so hours can be tracked by task."],
    ["Adjustment factor", "A multiplier on a production rate for harder site conditions."],
    ["Ownership cost", "Equipment cost that happens whether it runs or not: depreciation, interest, insurance, storage."],
    ["Operating cost", "Equipment cost per running hour: fuel, maintenance, wear parts."],
    ["Mobilization", "Moving crews and equipment to the job and setting up."],
    ["Small tools", "Hand tools and consumables, often priced as a percent of labor."],
    ["Work window", "The hours you're allowed to work, such as a lane closure period."],
    ["Productivity loss", "Paid hours that don't produce work, from weather, windows or delays."],
    ["Estimated vs. actual", "Comparing estimated hours to real hours to improve your rates."]
  ]
},

{ t: "quiz", id: "m9", h: "Check yourself",
  lead: "Tap an answer to check it.",
  qs: [

{ h: "Module 9 summary",
  lead: "You can now price labor and equipment from your own numbers and check them against the market.",
  body: `<ul>
<li>Labor cost = quantity × LH per unit × burdened rate. Get each piece right.</li>
<li>Burden adds payroll taxes, workers' comp, insurance and benefits to every hour. Get the real rates from your CPA and agent.</li>
<li>Prevailing wage crews can cost about twice as much per hour as private crews. Use current DIR rates on every public bid.</li>
<li>Build production rates from your own timecards, and adjust them for slope, rock, access, work windows and recycled water rules.</li>
<li>Owned equipment has ownership and operating costs; the fewer hours it works, the more each hour costs. Rentals cost more than the day rate.</li>
<li>Use the Caltrans bid data to check your all-in prices, and compare estimated to actual hours on every job.</li>
</ul>
<p><strong>Next: Module 10 · Overhead, Markup and Your Final Number</strong></p>`
}
]

{ h: "Markup vs. margin",
  lead: "Markup is a percent of your cost. Margin is a percent of your price. They are different numbers for the same dollars.",
  body: `<ul>
<li><strong>Markup</strong> = (price − cost) ÷ <strong>cost</strong></li>
<li><strong>Margin</strong> = (price − cost) ÷ <strong>price</strong></li>
<li>Markup to margin: <strong>margin = markup ÷ (1 + markup)</strong></li>
<li>Margin to markup: <strong>markup = margin ÷ (1 − margin)</strong></li>
<li>To hit a target margin: <strong>price = cost ÷ (1 − margin)</strong></li>
</ul>
<p><strong>Example:</strong> cost $100,000, price $120,000. Profit $20,000. Markup = $20,000 ÷ $100,000 = 20%. Margin = $20,000 ÷ $120,000 = 16.7%.</p>
<div class="tablewrap"><table>
<thead><tr><th class="num">Markup on cost</th><th class="num">Equals margin on price</th></tr></thead>
<tbody>
<tr><td class="num">10%</td><td class="num">9.1%</td></tr>
<tr><td class="num">15%</td><td class="num">13.0%</td></tr>
<tr><td class="num">20%</td><td class="num">16.7%</td></tr>
<tr><td class="num">25%</td><td class="num">20.0%</td></tr>
<tr><td class="num">30%</td><td class="num">23.1%</td></tr>
<tr><td class="num">35%</td><td class="num">25.9%</td></tr>
<tr><td class="num">40%</td><td class="num">28.6%</td></tr>
</tbody></table></div>`,
  watch: `<p><strong>The common mistake:</strong> the owner says “we need a 20% margin,” and the estimator multiplies cost by 1.20. That's a 20% markup, which is only a 16.7% margin. On $100,000 of cost, the right price for a 20% margin is $100,000 ÷ 0.80 = <strong>$125,000</strong>, not $120,000. That $5,000 gap repeats on every job.</p>`,
  deeper: `<p>Accountants and financial statements use margin (profit as a percent of revenue). Estimators usually build prices with markup. Agree with the owner on which word you're using, and write it at the top of your recap sheet.</p>`
},

{ h: "Setting profit: job type, risk and how badly you want it",
  lead: "Profit isn't one fixed number. It moves with the risk you're taking and how much the job is worth to the company.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Push profit up when…</th><th>Push profit down when…</th></tr></thead>
<tbody>
<tr><td>Small job: fixed costs are a bigger share</td><td>Large, simple, repetitive scope</td></tr>
<tr><td>Long plant establishment or maintenance period</td><td>Short schedule, clean handoff</td></tr>
<tr><td>Unclear plans, many unknowns, RFIs not answered</td><td>Complete plans, quantities given</td></tr>
<tr><td>New GC or agency, slow-pay reputation, heavy liquidated damages</td><td>Repeat GC who pays on time</td></tr>
<tr><td>Crews are already busy</td><td>Crews will be idle without it</td></tr>
<tr><td>Few qualified bidders</td><td>Many bidders, tight bid history</td></tr>
</tbody></table></div>`,
  exLabel: "Example markup policy (made up; set yours with the owner)",
  ex: `<div class="tablewrap"><table>
<thead><tr><th>Job type</th><th class="num">Profit on cost + overhead</th></tr></thead>
<tbody>
<tr><td>Private, GC sub, under $50,000</td><td class="num">12–15%</td></tr>
<tr><td>Private, GC sub, $50,000–$500,000</td><td class="num">8–12%</td></tr>
<tr><td>Public, as sub to a prime</td><td class="num">8–10%</td></tr>
<tr><td>Public, as prime (bonds, paperwork, LDs)</td><td class="num">10–15%</td></tr>
<tr><td>Strategic job you badly want</td><td class="num">Down to the minimum (next slide)</td></tr>
</tbody></table></div>`,
  watch: `<p>“How badly we want it” is a real reason to cut profit, but only profit. Never cut overhead or cost to win. If the numbers only work by assuming crews will go faster than they ever have, the job will lose money.</p>`

{ h: "The minimum margin rule",
  lead: "Decide your walk-away number before bid day, when you're calm. Below it, you don't bid, no matter who asks.",
  body: `<ol class="steps">
<li><div><b>Floor 1: cover all costs</b>Direct cost + job overhead + allowances. Below this you lose money on the job itself.</div></li>
<li class="hl"><div><b>Floor 2: cover overhead</b>Add your full company overhead rate. Below this the job helps no one; it just keeps crews busy.</div></li>
<li><div><b>Floor 3: minimum profit</b>Add the owner's minimum profit (for example 5% on cost). This is the walk-away price.</div></li>
</ol>
<p>Put the walk-away price on the recap sheet in a separate box. If a GC asks you to “sharpen your pencil,” you know how far you can go.</p>`,
  ex: `<p>Using the worked example later in this module: cost $153,672 → plus 20% overhead = $184,406 → plus 5% minimum profit = $193,627, plus insurance and bond ≈ $200,300. That's the walk-away number. The bid price was $209,800, so there's about $9,500 of room, and no more.</p>`,
  watch: `<p>Busy seasons tempt you to bid high; slow seasons tempt you to bid at cost. A bid at cost still loses the overhead it was supposed to carry. A few of those in a row can sink a year.</p>`
},

{ h: "Bond premium and insurance, per job",
  lead: "Bonds and some insurance are charged on the size of the contract. Calculate them on each bid; don't bury them in overhead.",
  body: `<div class="twocol">
<div><h3>Bond premium</h3><ul>
<li>Performance and payment bonds are priced as a percent of the contract amount.</li>
<li>Your surety sets your rate. It often steps down as the contract gets bigger, and depends on your company's finances and history.</li>
<li>Private GCs often don't require sub bonds. Show the bond cost as a separate add in your proposal (Module 13) unless the bid documents require it.</li>
<li>Public prime bids: the bond is required, so it goes into the price. Caltrans's specs treat bond cost as part of mobilization when the job has a mobilization item (see “deeper”).</li>
</ul></div>
<div><h3>Insurance</h3><ul>
<li>Workers' comp is in your labor burden (Module 9). Don't add it twice.</li>
<li>General liability is often rated on payroll or sales. Ask your agent which, and the rate.</li>
<li>Extra costs per job: higher limits, umbrella, additional insured endorsements, wrap-up (OCIP/CCIP) credits or charges.</li>
</ul></div>
</div>`,
  exLabel: "Example (made-up rates; get yours from your agent and surety)",
  ex: `<p>Price before bond and insurance: $202,847. GL rated at $9.00 per $1,000 of sales: $202,847 × 0.009 = $1,826. Bond at 2.5%: ($202,847 + $1,826) × 0.025 = $5,117.</p>`,
  deeper: `<p>The Caltrans 2018 Standard Specifications say that for lump-sum items paid by a schedule of values, “for a contract with a bid item for mobilization, accept progress payments for bond costs as included in the mobilization bid item” (section 9-1.16B). Module 2 covers how bonding capacity works.</p>`,
  src: "Caltrans 2018 Standard Specifications, section 9-1.16B."
},

{ h: "Escalation allowance",
  lead: "Escalation is the price increase between the day you bid and the day you buy. Add it when the gap is long and the quote won't hold.",
  body: `<ul>
<li>Check the expiration date on every supplier quote (Module 8). Many hold for 30 days.</li>
<li>Estimate when each material will actually be bought: trees and pipe are often bought months after bid day.</li>
<li>Ask the supplier what increase they expect. Write down what they said.</li>
<li>Apply the allowance only to the materials exposed to the gap, not to labor you've already priced at next year's rates.</li>
<li>Public jobs: prevailing wage rates often have scheduled increases. Price labor at the rate in effect when the work will be done (Module 11).</li>
</ul>`,
  exLabel: "Example (made-up)",
  ex: `<p>Materials $62,400. Work starts in 5 months; the supplier's quote holds 30 days and the rep expects about 3% higher by then. Escalation = $62,400 × 3% = <strong>$1,872</strong>. One line on the recap, with a note saying why.</p>`,
  watch: `<p>If you get a quote that's guaranteed through the purchase date, you don't need escalation on those items. Adding it anyway just makes you high.</p>`
},

{ h: "Contingency: when and how",
  lead: "Contingency is money for a specific risk you can name but can't price exactly. It's not a cushion for sloppy takeoff.",
  body: `<div class="twocol">
<div><h3>Use contingency when</h3><ul>
<li>Plans say “verify in field” about the existing point of connection</li>
<li>A geotech report mentions cobbles or rock in planting areas</li>
<li>An RFI wasn't answered before bid day, and you priced an assumption</li>
<li>The job ties into an old irrigation system you couldn't test</li>
</ul></div>
<div><h3>Don't use it when</h3><ul>
<li>The risk is already in your production rate (Module 9)</li>
<li>You added waste factors to materials (Module 7)</li>
<li>You excluded or clarified the risk in your proposal (Module 13)</li>
<li>You just don't trust your takeoff (fix the takeoff)</li>
</ul></div>
</div>`,
  exLabel: "Example (made-up)",
  ex: `<p>The plans show an existing 2" mainline as the point of connection, marked “contractor to verify size and condition.” You carry $2,000 contingency for a possible repair or reroute, and write the reason next to it on the recap.</p>`,
  watch: `<p><strong>Double counting</strong> is the most common way good estimates lose bids. A slower production rate, plus extra waste, plus contingency, plus a higher profit “because it's risky” can price the same risk four times. Each risk gets handled in one place.</p>`
},

{ h: "Worked example, part 2 · From total cost to final bid",
  lead: "Add overhead, then profit, then the costs charged on the price. Round, then check.",
  ex: `<div class="tablewrap"><table>
<thead><tr><th>Step</th><th>Math</th><th class="num">Running total</th></tr></thead>
<tbody>
<tr><td>Total cost</td><td>From part 1</td><td class="num">$153,672.00</td></tr>
<tr><td>+ Company overhead 20%</td><td>$153,672 × 0.20 = $30,734.40</td><td class="num">$184,406.40</td></tr>
<tr><td>+ Profit 10%</td><td>$184,406.40 × 0.10 = $18,440.64</td><td class="num">$202,847.04</td></tr>
<tr><td>+ General liability</td><td>$202,847.04 × 0.009 = $1,825.62</td><td class="num">$204,672.66</td></tr>
<tr><td>+ Bond 2.5% (only if required)</td><td>$204,672.66 × 0.025 = $5,116.82</td><td class="num">$209,789.48</td></tr>
<tr><td><strong>Final bid (rounded up to $100)</strong></td><td></td><td class="num"><strong>$209,800</strong></td></tr>
</tbody></table></div>`,
  body: `<p><strong>What the final number means:</strong></p>
<ul>
<li>Job cost (total cost + insurance + bond) = $160,614. Gross profit = $209,800 − $160,614 = $49,186, a <strong>23.4% gross margin</strong>.</li>
<li>Overhead recovered: $30,734. Net profit: $49,186 − $30,734 = $18,452, an <strong>8.8% net margin</strong>.</li>
<li>Overall markup on total cost: $209,800 ÷ $153,672 − 1 = <strong>36.5%</strong>. That's what “we mark up 36%” really contains.</li>
<li>Cost per SF: $209,800 ÷ 24,000 SF = <strong>$8.74/SF</strong>.</li>
</ul>`,
  watch: `<p>A 20% overhead plus 10% profit is not a 30% markup. Applied in steps, it's 1.20 × 1.10 = 1.32, a 32% markup before insurance and bond. Pick one method, stepped or added, and use it every time.</p>`
},

{ h: "Public bids · Caltrans time-related overhead (TRO)",
  lead: "Some Caltrans jobs have a bid item called time-related overhead, paid per working day. It changes where your overhead goes.",
  body: `<ul>
<li><strong>What it pays for:</strong> time-related field overhead (project managers, superintendents, field office) and home-office overhead (administration, insurance, accounting, estimating) for the time needed to do the work.</li>
<li><strong>The rule:</strong> if the job has a TRO item, “you must exclude the time-related overhead from every other bid item price.” Don't load it in both places.</li>
<li><strong>Quantity:</strong> working days, not counting plant establishment days.</li>
<li><strong>Payment:</strong> per working day as reported, up to a cap of 20% of the total bid ÷ the original working days. The balance is paid once all non-plant-establishment work is done.</li>
<li><strong>Not included:</strong> mobilization, permits, licenses and other one-time costs, and your subs' overhead.</li>
</ul>`,
  ex: `<p><strong>Real bids, 11-428704 (I-805 Chula Vista):</strong> item 2, TRO, 120 working days. The six bidders put <strong>$250 to $1,500 per day</strong> on it: $600 (winner ACCU), $520, $570, $600, $1,500 and $250. The winner's TRO total was 120 × $600 = $72,000, about 6% of its $1,176,120 bid. The 250 working days of plant establishment weren't part of the TRO quantity. On another lab job, 11-422004, one bidder put $1 per day on TRO. A price like that is something to study in the bid tab, not something to copy.</p>
<p><strong>Your number:</strong> with $1,680/day of company overhead (earlier slide), if this job would be about 30% of the company's work while it runs, its share is about $500/day, plus field supervision time. That lands inside the real range. See <a href="#m15-1">Module 15</a> for the full job.</p>`,
  watch: `<p>If the TRO quantity grows because the job runs long, Caltrans pays the same daily price up to 149% of the bid quantity. Beyond that, either side can ask for an adjustment backed by a CPA audit. Price it at your real daily overhead, not as a place to hide profit.</p>`,
  src: "Caltrans 2018 Standard Specifications, section 9-1.11; Bid Summary, contract 11-428704, item 2."
},

{ h: "Public bids · The mobilization item",
  lead: "Mobilization pays for getting set up: moving equipment in, bonds, the first submittals. On Caltrans jobs, how much of it you get paid early is limited by law.",
  body: `<p>Caltrans pays mobilization in steps as the job progresses (Public Contract Code 10264(a), used by Standard Specifications 9-1.16D):</p>
<div class="tablewrap"><table>
<thead><tr><th>When this much of the original contract is earned</th><th>Caltrans may pay up to the lesser of</th></tr></thead>
<tbody>
<tr><td>5%</td><td>50% of the mobilization bid, or 5% of the contract</td></tr>
<tr><td>10%</td><td>75% of the mobilization bid, or 7.5% of the contract</td></tr>
<tr><td>20%</td><td>95% of the mobilization bid, or 9.5% of the contract</td></tr>
<tr><td>50%</td><td>100% of the mobilization bid, or 10% of the contract</td></tr>
<tr><td>All work complete</td><td>Any mobilization above 10% of the contract</td></tr>
</tbody></table></div>`,
  ex: `<p><strong>Real bids, 11-428704, item 70 mobilization, as a share of each bid:</strong> ACCU (winner) $20,000 = 1.7% · Diversified $99,100 = 8.4% · Griffith $58,000 = 4.7% · Blue Pacific $120,000 = 7.5% · Mercer-Fraser $330,000 = 10.0% · Marina $80,000 = 7.2%. The winner kept mobilization small and carried its costs in the work items.</p>`,
  watch: `<p>Mobilization above 10% of the contract waits until the end of the job. A big mobilization number doesn't bring cash in sooner than the law allows.</p>`,
  src: "Public Contract Code § 10264(a); Caltrans 2018 Standard Specifications, section 9-1.16D; Bid Summary, contract 11-428704, item 70."
},

{ h: "Public bids · Front-loading and unbalanced bids",
  lead: "Moving money between items keeps your total the same but changes when and how you get paid. Done too far, it can cost you the job or the profit.",
  body: `<ul>
<li><strong>Front-loading:</strong> putting extra money in early items (mobilization, removals, mainline) and less in late items (plant establishment) to get cash sooner.</li>
<li><strong>Unbalanced bid:</strong> item prices that don't reflect each item's real cost plus its fair share of overhead and profit.</li>
<li><strong>Why agencies care:</strong> if quantities change, an unbalanced bid can end up costing the agency more than a balanced bid that looked higher on bid day.</li>
</ul>
<p><strong>The risks to you:</strong></p>
<ul>
<li>On Caltrans jobs, if a quantity goes above 125% or below 75% of the bid quantity, the unit price can be adjusted (Standard Specifications 9-1.06). An overloaded item that's cut, or an underpriced item that overruns, can wipe out the profit you thought you moved.</li>
<li>If the Engineer eliminates an item, Caltrans pays only your costs incurred, not the money you loaded into it.</li>
<li>On federal-aid jobs, a bid that is both mathematically and materially unbalanced can lose federal concurrence in the award.</li>
<li>Many local agencies' bid instructions say they may reject an unbalanced bid. Read the instructions to bidders on every job.</li>
</ul>`,
  ex: `<p>On 11-428704 the six bidders priced plant establishment from $10,000 to $300,000 (<a href="#m15-1">Module 15</a>). A very low price on a late item and a high one on an early item is the pattern reviewers look for.</p>`,
  watch: `<p>Price every item at its real cost plus its share of overhead and profit. That's the safe default for a new estimator, and it makes your bid history useful, because each unit price means something.</p>`,
  deeper: `<p>Federal rules (23 CFR 635.102) define a <em>mathematically unbalanced</em> bid as one with items that don't reflect reasonable actual costs plus a proportionate share of profit, overhead and indirect costs, and a <em>materially unbalanced</em> bid as one that creates reasonable doubt that the award would give the lowest ultimate cost. Under 23 CFR 635.114, a bid that is only mathematically unbalanced may be awarded; when it's both, FHWA acts to protect the federal interest. The Caltrans 2018 Standard Specifications don't have a separate unbalanced-bid section; the changed-quantity rules in 9-1.06 are what bite.</p>`,
  src: "Caltrans 2018 Standard Specifications, sections 9-1.06A–D; FHWA summary of 23 CFR 635 (fhwa.dot.gov/construction/contracts/910814.cfm)."
},

{ h: "Rounding and the final review",
  lead: "Before you sign, check the number four ways: the math, your benchmarks, the market, and your gut.",
  body: `<ol class="steps">
<li><div><b>Math check</b>Totals foot and cross-foot. Every quantity × unit price = extension. Every addendum quantity is in. Recompute one big item by hand.</div></li>
<li><div><b>Benchmarks</b>Cost per SF of landscape, per tree, per valve, labor as a percent of total. Compare to your own finished jobs.</div></li>
<li class="hl"><div><b>Market</b>Public: compare to the engineer's estimate and to bid tab history for similar items. Private: compare to what you've learned from GCs after past bids.</div></li>
<li><div><b>Gut check</b>Ask: would I sign a contract for this number tomorrow? Could I explain each layer to the owner?</div></li>
<li><div><b>Round</b>Round the private lump sum up to a clean figure ($100 or $500). Don't round public unit prices you've already extended; the bid form's math must be exact.</div></li>
</ol>`,
  ex: `<p>Engineer's estimates aren't the market. On 11-428704 the winning bid was 22% under the engineer's estimate (<a href="#m15-1">Module 15</a>). If you're right at the estimate, you may be high. Bid tabs for similar items tell you more.</p>`,
  watch: `<p>If a benchmark is far off (say, $14/SF when your similar jobs ran $7–$10), don't adjust the price to match. Find the reason first: a missed scope, a quantity error, or a real difference in this job.</p>`,
  deeper: `<p>On a Caltrans bid, if the unit price and the item total don't agree, the unit price governs (<a href="#m15-1">Module 15</a>). On private bids, have a second person check the recap before it goes out; the How to Make a Bid process calls for this in Step 9.</p>`
},

{ h: "The bid recap sheet",
  lead: "One page that shows every layer of the price. It's what the owner signs off on, and what you'll compare to the job's final cost.",
  exLabel: "Recap sheet layout (build this in your spreadsheet)",
  ex: `<div class="tablewrap"><table>
<thead><tr><th>Section</th><th>Lines</th></tr></thead>
<tbody>
<tr><td><strong>Header</strong></td><td>Project, GC or agency, bid date, plan and addenda dates, estimator, reviewer</td></tr>
<tr><td><strong>Direct cost by scope</strong></td><td>Irrigation · Soil prep · Planting · Mulch, DG and boulders · Establishment/maintenance · Each with material, labor, equipment, sub columns</td></tr>
<tr><td><strong>Job overhead</strong></td><td>Supervision · Trucks · Temporary facilities · Permits · Paperwork · Cleanup</td></tr>
<tr><td><strong>Allowances</strong></td><td>Escalation (reason) · Contingency (reason)</td></tr>
<tr><td><strong>Markups</strong></td><td>Company overhead % · Profit % · Insurance · Bond</td></tr>
<tr><td><strong>Totals</strong></td><td>Bid price · Walk-away price · Gross margin % · Net margin %</td></tr>
<tr><td><strong>Checks</strong></td><td>Cost per SF · Labor hours and crew weeks · Labor % of cost · Engineer's estimate or bid tab comparison</td></tr>
<tr><td><strong>Alternates and unit prices</strong></td><td>Each priced with the same markups</td></tr>
<tr><td><strong>Sign-off</strong></td><td>Estimator, reviewer, owner, date</td></tr>
</tbody></table></div>`,
  body: `<p>Keep the recap for every bid, won or lost. On jobs you win, the recap becomes the budget the field is measured against (Module 16).</p>`
},

{ h: "Use your bid history to tune markup",
  lead: "Your bid tracker shows whether your markup is working. Review it every quarter, not after one lost bid.",
  body: `<p>Log every bid in the <a href="https://claude.ai/artifact/BfM3VhU69VAesNWb6kbEnP" target="_blank" rel="noopener">Commercial Bid Tracker</a> with your price, the low or winning price, and your profit %.</p>
<ul>
<li><strong>Hit rate</strong> = bids won ÷ bids submitted, by job type and by GC.</li>
<li><strong>Distance from low</strong> = (your price − low price) ÷ low price.</li>
<li><strong>Money left on the table</strong> on jobs you won = (2nd place − your price) ÷ your price.</li>
</ul>`,
  exLabel: "Example review (made-up data)",
  ex: `<div class="tablewrap"><table>
<thead><tr><th>Job type</th><th class="num">Bids</th><th class="num">Won</th><th class="num">Avg. distance from low</th><th>What it suggests</th></tr></thead>
<tbody>
<tr><td>Private retail, GC A</td><td class="num">5</td><td class="num">3</td><td class="num">+1%</td><td>Pricing fits; check if you left money on the table</td></tr>
<tr><td>Private multifamily</td><td class="num">6</td><td class="num">0</td><td class="num">+14%</td><td>Check scope and costs before touching markup</td></tr>
<tr><td>Public, sub to primes</td><td class="num">4</td><td class="num">1</td><td class="num">+4%</td><td>Close; compare unit prices item by item</td></tr>
</tbody></table></div>`,
  watch: `<p>When you're far from low, cutting profit is the last step, not the first. A 14% gap is usually scope, production rates or material pricing. Find the cause in the bid tab or the GC's feedback, then fix that.</p>`
},

{ t: "terms", h: "Words to know",
  lead: "Add these to your notebook.",
  terms: [
    ["Direct cost", "Material, labor, equipment and subs for the installed work."],
    ["Indirect cost", "Costs that keep the job or company running but aren't part of one item."],
    ["Job overhead", "Indirect costs caused by one job: supervision, trucks, temporary facilities."],
    ["Company (general) overhead", "Costs of running the business shared by all jobs: office, estimator, accounting, yard."],
    ["Overhead rate", "Company overhead ÷ direct job costs, as a percent."],
    ["Markup", "Profit (or overhead and profit) as a percent of cost."],
    ["Margin", "Profit as a percent of price."],
    ["Gross margin", "Price minus job cost, as a percent of price."],
    ["Net margin", "Profit after company overhead, as a percent of price."],
    ["Walk-away price", "The lowest price you'll bid: cost + overhead + minimum profit."],
    ["Bond premium", "What the surety charges for a bond, as a percent of the contract."],
    ["Escalation", "Expected price increase between bid day and purchase."],
    ["Contingency", "Money for a named risk that can't be priced exactly."],
    ["Double counting", "Pricing the same risk in more than one place."],
    ["Time-related overhead (TRO)", "Caltrans bid item paying field and home-office overhead per working day."],
    ["Mobilization", "Bid item for setup costs, paid in steps on Caltrans jobs."],
    ["Front-loading", "Putting extra money in early items to get paid sooner."],
    ["Unbalanced bid", "Item prices that don't reflect each item's real cost plus its share of overhead and profit."],
    ["Bid recap sheet", "One-page summary of every layer of a bid price."],
    ["Hit rate", "Bids won ÷ bids submitted."]
  ]
},

{ t: "quiz", id: "m10", h: "Check yourself",
  lead: "Tap an answer to check it.",
  qs: [
    { q: "Your foreman spends 2 hours a day in meetings and paperwork. Where does that cost go?", a: ["Direct labor on the planting items", "Job overhead", "Company overhead"], c: 1, why: "It's caused by this job but isn't part of any one item, so it's job overhead." },
    { q: "Last year: $300,000 company overhead, $1,500,000 direct job costs. What's the overhead rate on cost?", a: ["15%", "20%", "25%"], c: 1, why: "$300,000 ÷ $1,500,000 = 20%." },
    { q: "You add a 20% markup to cost. What's your margin?", a: ["20%", "16.7%", "25%"], c: 1, why: "Margin = markup ÷ (1 + markup) = 0.20 ÷ 1.20 = 16.7%." },
    { q: "Cost is $80,000 and the owner wants a 20% margin. What's the price?", a: ["$96,000", "$100,000", "$104,000"], c: 1, why: "Price = cost ÷ (1 − margin) = $80,000 ÷ 0.80 = $100,000." },
    { q: "You slowed the production rate for rocky soil and added contingency for rock. What's the problem?", a: ["Nothing, more is safer", "You priced the same risk twice", "Contingency isn't allowed on private jobs"], c: 1, why: "That's double counting. Handle each risk in one place." },
    { q: "A Caltrans job has a time-related overhead item. What must you do with other bid items?", a: ["Add TRO to them too", "Exclude time-related overhead from them", "Put all overhead in mobilization"], c: 1, why: "Standard Specifications 9-1.11A: exclude TRO from every other item price." },
    { q: "On a $1,000,000 Caltrans job you bid $150,000 for mobilization. When is the part above $100,000 paid?", a: ["At the first progress payment", "When 50% of the work is earned", "After all work is complete"], c: 2, why: "Mobilization above 10% of the original contract is paid on completion (PCC 10264(a)(5))." },
    { q: "You've lost 6 multifamily bids, each about 14% over low. What should you check first?", a: ["Cut profit to zero", "Scope, production rates and material prices", "Stop bidding forever"], c: 1, why: "A gap that big is usually cost or scope, not markup." }
  ]
},

{ t: "practice", id: "m10", h: "Practice assignments",
  lead: "Use your company's real numbers. By the end you'll have an overhead rate, a markup policy and a recap sheet ready for the next bid.",
  items: [
    { h: "Calculate the company's overhead rate", hrs: 0.75, d: "<p>Get last year's profit and loss statement from the owner or CPA. Sort every account into direct job cost or company overhead, using the lists in this module. Calculate the overhead rate on cost and as a share of revenue. Then build next year's overhead budget with the commercial division's added costs, and calculate the forward-looking rate and the daily overhead figure.</p>" },
    { h: "Write the markup policy and minimum margin", hrs: 0.25, d: "<p>Sit down with the owner. Agree on profit ranges by job type (like the example table), the minimum profit for the walk-away price, and whether you'll talk in markup or margin. Write it on one page and make a markup-to-margin conversion card for your desk.</p>" },
    { h: "Get your real bond and insurance rates", hrs: 0.25, d: "<p>Call the surety agent and ask for the company's bond rate schedule by contract size. Call the insurance agent and ask how general liability is rated (payroll or sales), the rate, and the cost of common additional insured and higher-limit requirements. Write the per-job formulas into your recap template.</p>" },
    { h: "Build the bid recap sheet", hrs: 0.5, d: "<p>Build the recap layout from this module in a spreadsheet. Formulas for every layer: job overhead, escalation, contingency, overhead %, profit %, insurance, bond, walk-away price, gross and net margin, cost per SF. Test it with the worked example and confirm you get $209,789.48 before rounding.</p>" },
    { h: "Take a real estimate to a final number", hrs: 0.75, d: "<p>Take the takeoff and pricing you built in Modules 6–9 (or any landscape job you've estimated). Run it through your recap sheet: job overhead, allowances with written reasons, overhead, profit, insurance, bond. Calculate the walk-away price, cost per SF and both margins. Have the owner review it.</p>" },
    { h: "Analyze TRO and mobilization on real Caltrans bids", hrs: 0.5, d: "<p>Open <a href=\"#lab-11-428704\">Real Bid Lab · 11-428704</a> and one other job in the <a href=\"#lab\">Real Bid Lab</a> that has a time-related overhead item. For each bidder, calculate mobilization as a percent of its total and TRO per day × days. Then calculate what your company's daily overhead share would be on that job and compare it to the range.</p>" },
    { h: "Review your bid history", hrs: 0.5, d: "<p>Enter every bid you've submitted so far into the <a href=\"https://claude.ai/artifact/BfM3VhU69VAesNWb6kbEnP\" target=\"_blank\" rel=\"noopener\">Commercial Bid Tracker</a> with the low price where you know it. Calculate hit rate and average distance from low by job type. Write three sentences on what it suggests, and set a quarterly review date with the owner.</p>" }
  ]
},

{ h: "Module 10 summary",
  lead: "You can now turn a cost estimate into a price you can defend, layer by layer.",
  body: `<ul>
<li>Keep the layers separate: direct cost, job overhead, allowances, company overhead, profit, insurance and bond.</li>
<li>Calculate your overhead rate from last year's real numbers, and budget forward for the new division.</li>
<li>Markup is on cost, margin is on price. A 20% markup is a 16.7% margin; a 20% margin needs a 25% markup.</li>
<li>Set profit by risk and job type, and decide your walk-away price before bid day.</li>
<li>Use escalation and contingency only for named reasons, and price each risk once.</li>
<li>On Caltrans jobs, keep time-related overhead in the TRO item only, know how mobilization is paid, and price items honestly.</li>
<li>Check the final number with a recap sheet, benchmarks, the market and your bid history.</li>
</ul>
<p><strong>Next: Module 11 · Prevailing Wage and Public Works Compliance</strong></p>`
}
]
});

{ h: "When is a job “public works”?",
  lead: "If public money pays for any part of the construction, it is almost always public works, and every worker on it must get at least the prevailing wage.",
  body: `<ul>
<li><strong>Public works</strong> means construction, alteration, demolition, installation or repair done under contract and paid for in whole or in part with public funds. Street work and improvement work done for a city or district counts too.</li>
<li><strong>Prevailing wage</strong> is the minimum hourly pay (wages plus benefits) the state sets for each trade in each county.</li>
<li>It applies to public works <strong>over $1,000</strong>. That includes maintenance work, like landscape maintenance on a city contract.</li>
<li>It applies to <strong>everyone who does the work</strong>: your crew, your subs' crews, and you, if the owner works on the job.</li>
<li>It applies whether you are the prime or a sub. A GC's school or park job is public works for you too.</li>
</ul>`,
  ex: `<p>A private developer builds an affordable housing project with City housing money and asks you to price the landscape. It feels private, but public funds pay part of it. Read the bid documents for prevailing wage language before you price. Module 1 covers this trap.</p>`,
  watch: `<p>Agencies can't split a job into small pieces to stay under the limits. If the bid documents say prevailing wage applies, it applies, even to your small scope.</p>`,
  deeper: `<ul>
<li>Labor Code §1720(a)(1) defines public works; §1771 requires prevailing wage on public works over $1,000, including maintenance.</li>
<li><strong>Small project exemption:</strong> DIR registration and electronic certified payroll aren't required on projects of $25,000 or less (new construction, alteration, installation, demolition or repair) or $15,000 or less (maintenance). The limit is the whole prime contract, not your subcontract. Prevailing wage still applies over $1,000.</li>
<li>If you aren't sure, anyone can ask DIR for a coverage determination (pwcoverage@dir.ca.gov).</li>
</ul>`,
  src: "Cal. Labor Code §§1720, 1771; DIR Public Works FAQ (dir.ca.gov/Public-Works/PublicWorksSB854FAQ.html)."

{ h: "The wage determination, in plain words",
  lead: "DIR publishes the rates as “general prevailing wage determinations,” one for each craft and area. The one that applies to your job is the one in effect on the date the job was advertised for bids.",
  body: `<ul>
<li><strong>Issued twice a year:</strong> February 22 and August 22. Each goes into effect 10 days later.</li>
<li><strong>By craft and county:</strong> one document for Landscape/Irrigation Laborer in San Diego County, another for Operating Engineer, and so on.</li>
<li><strong>Locked to the bid advertisement date:</strong> all bidders use the same rates, so nobody wins by paying less.</li>
<li><strong>Expiration date with one asterisk (*):</strong> the rate stays good for the life of the project.</li>
<li><strong>Expiration date with two asterisks (**):</strong> a raise is already scheduled. If work goes past that date, you must pay the new rate. This is called a <strong>predetermined increase</strong>, and you must price it in your bid.</li>
</ul>`,
  ex: `<p><strong>Real example:</strong> Caltrans advertised job 11-428704 on Aug 2, 2021. The San Diego Landscape/Irrigation Laborer determination in effect that day (SD-102-X-14-2021-1) expired “July 31, 2021**”. DIR's predetermined increase notice said: “Effective August 1, 2021, there will be an increase of $2.15 allocated as follows: $1.04 Basic Hourly Rate, $0.10 to Health &amp; Welfare and $1.01 to Pension.” So every laborer hour on that job cost at least $57.66 + $2.15 = <strong>$59.81</strong>, not the $57.66 printed on the determination.</p>`,
  watch: `<p>Two asterisks mean the printed rate is already out of date for most of your job. Open the “Increase” link next to the craft every time.</p>`,
  deeper: `<p>The effective date is 10 days after issue (8 CCR §16000). If a craft you need isn't covered, the agency can ask DIR for a special determination at least 45 days before the bid advertisement date. The awarding body must state the rates, or that they are on file, in the call for bids (Labor Code §1773.2).</p>`,
  src: "DIR Prevailing Wage FAQ (dir.ca.gov/oprl/FAQ_PrevailingWage.html); DIR SD-102-X-14-2021-1 and its Predetermined Increase notice; Cal. Labor Code §1773.2."
},

{ h: "How to find the right rate",
  lead: "DIR's site walks you through six steps. For San Diego County landscape work you will use steps 2B, 3 and 4 most.",
  body: `<ol class="steps">
<li><div><b>Open the determinations page</b>Go to <a href="https://www.dir.ca.gov/oprl/DPreWageDetermination.htm" target="_blank" rel="noopener">DIR General Prevailing Wage Determinations</a> and pick the period that was current on the bid advertisement date (for example “2026-2”).</div></li>
<li><div><b>Step 1 · Statewide</b>Trades that apply in most counties.</div></li>
<li><div><b>Step 2B · Southern California</b>Includes Laborer, Operating Engineer, Landscape Maintenance Laborer and Tree Maintenance (Laborer) when marked “Includes San Diego County.”</div></li>
<li class="hl"><div><b>Step 3 · San Diego</b>Landscape Irrigation Laborer, Laborer (Engineering Construction), Operating Engineer, Teamster.</div></li>
<li class="hl"><div><b>Step 4 · County subtrades</b>Choose San Diego. This is where the Plumber crafts live, including Landscape/Irrigation Fitter and Landscape/Irrigation Tradesman.</div></li>
<li><div><b>Step 6 · Important notices</b>Check for corrections that change a rate.</div></li>
</ol>
<p>For each craft, also open the <strong>Increase</strong>, <strong>Holidays</strong>, <strong>Scope</strong> (what work the craft covers) and <strong>Travel</strong> links. Apprentice rates are on a separate DIR page.</p>`,
  ex: `<p>Save a PDF of every determination you used, with the date you downloaded it, in the bid folder. If a question comes up during the job, you can prove which rate you bid.</p>`,
  src: "DIR Index 2026-2 general prevailing wage journeyman determinations (dir.ca.gov/oprl/2026-2/PWD/index.htm)."
},

{ h: "The crafts landscape work uses",
  lead: "Each hour is paid by the work the person actually does that hour, whatever their job title at your company. These are the DIR crafts a San Diego landscape crew uses most.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>DIR craft (San Diego County, 2026-2)</th><th>Where on DIR's site</th><th>Typical work</th></tr></thead>
<tbody>
<tr><td><strong>Landscape/Irrigation Laborer</strong> (also Landscape Hydro Seeder)</td><td>San Diego · SD-102-X-14</td><td>Planting, soil prep, trenching and installing irrigation as a laborer</td></tr>
<tr><td><strong>Landscape/Irrigation Tender</strong></td><td>Same determination</td><td>Helper work under the ratio rules; plant establishment</td></tr>
<tr><td><strong>Plumber: Landscape/Irrigation Fitter</strong> and <strong>Landscape/Irrigation Tradesman</strong></td><td>County subtrades · San Diego</td><td>Irrigation pipefitting when the fitter scope applies</td></tr>
<tr><td><strong>Operating Engineer</strong></td><td>San Diego · SD-23-63-3</td><td>Skid steer (Group 3), mini backhoe and boring machine (Group 4)</td></tr>
<tr><td><strong>Teamster</strong></td><td>San Diego · SD-023-261-3</td><td>Dump truck and water truck driving on site</td></tr>
<tr><td><strong>Laborer (Engineering Construction)</strong></td><td>San Diego</td><td>General construction labor, demolition, flagging</td></tr>
<tr><td><strong>Tree Maintenance (Laborer)</strong></td><td>Southern California</td><td>Tree trimming and removal</td></tr>
<tr><td><strong>Landscape Maintenance Laborer</strong></td><td>Southern California</td><td>Maintenance contracts (not new construction)</td></tr>
</tbody></table></div>`,
  watch: `<p>A worker who spends the morning running the skid steer and the afternoon planting gets the Operating Engineer rate for the morning hours and the laborer rate for the afternoon. Track hours by craft on the time card, or pay the higher rate for the whole day.</p>`,
  deeper: `<p>Read the <strong>Scope</strong> PDF for each craft. It is labeled advisory, but it's the best guide to which craft covers which task. If two crafts could fit, many contractors pay the higher one to stay safe. When in doubt, ask DIR's Research Unit at (415) 703-4774 before bid day.</p>`,
  src: "DIR 2026-2 San Diego basic trades index, Southern California index, and San Diego County subtrades (SDI-2026-2)."
},

{ h: "Reading one line of a determination",
  lead: "Each line gives a basic hourly rate plus employer payments. Together they are the total hourly rate, the real minimum cost of one hour.",
  body: `<p><strong>Landscape/Irrigation Laborer, San Diego County, determination SD-102-X-14-2026-1</strong> (issued Aug 22, 2026; expires July 31, 2027**):</p>
<div class="tablewrap"><table>
<thead><tr><th>Part</th><th class="num">Per hour</th><th>What it is</th></tr></thead>
<tbody>
<tr><td>Basic hourly rate</td><td class="num">$47.57</td><td>Taxable wage on the paycheck</td></tr>
<tr><td>Health and welfare</td><td class="num">$9.85</td><td>Medical and similar benefits</td></tr>
<tr><td>Pension</td><td class="num">$12.92</td><td>Retirement</td></tr>
<tr><td>Vacation and holiday</td><td class="num">$5.02</td><td>Includes supplemental dues</td></tr>
<tr><td>Training</td><td class="num">$0.80</td><td>Apprenticeship training fund</td></tr>
<tr><td>Other</td><td class="num">$0.51</td><td>Other funds named by the craft</td></tr>
<tr><td><strong>Total hourly rate</strong></td><td class="num"><strong>$76.67</strong></td><td>Straight time, 8-hour day</td></tr>
<tr><td>Daily and Saturday overtime (1½×)</td><td class="num">$100.455</td><td>Footnote b</td></tr>
<tr><td>Sunday and holiday (2×)</td><td class="num">$124.24</td><td></td></tr>
</tbody></table></div>`,
  ex: `<p><strong>Check the math yourself:</strong> $47.57 + $9.85 + $12.92 + $5.02 + $0.80 + $0.51 = $76.67. Overtime: $47.57 × 1.5 = $71.355, plus the $29.10 of employer payments = $100.455. Overtime multiplies only the basic rate.</p>`,
  watch: `<p>Read the footnotes. Here footnote b says the 1½× rate covers only the first 4 daily overtime hours and the first 12 hours on Saturday; after that, double time. Footnote c lets Saturday be worked at straight time only as a weather make-up day.</p>`,
  src: "DIR determination SD-102-X-14-2026-1, Landscape/Irrigation Laborer/Tender, San Diego County."
},

{ h: "Tenders, tradesmen and the ratio rules",
  lead: "The lower-paid helper classifications can only be used in a set mix with journeymen. Price only the mix the rules allow.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>2026-2 San Diego rates</th><th class="num">Basic</th><th class="num">Total hourly</th></tr></thead>
<tbody>
<tr><td>Landscape/Irrigation Laborer</td><td class="num">$47.57</td><td class="num">$76.67</td></tr>
<tr><td>Landscape/Irrigation Tender</td><td class="num">$21.97</td><td class="num">$30.19</td></tr>
<tr><td>Landscape/Irrigation Fitter (Plumber)</td><td class="num">$47.85</td><td class="num">$76.40</td></tr>
<tr><td>Landscape/Irrigation Tradesman (Plumber)</td><td class="num">$21.98</td><td class="num">$27.54</td></tr>
</tbody></table></div>
<p><strong>Laborer/Tender rule (footnote d):</strong> 1st worker on site is a Laborer; 2nd is an Apprentice or Laborer; 3rd and 4th may be Tenders; 5th is a Laborer; 6th an Apprentice or Laborer; 7th and 8th may be Tenders; after that 50/50.</p>
<p><strong>Plant establishment may be done entirely by Tenders</strong>, without a journeyman on site.</p>
<p><strong>Fitter/Tradesman rule:</strong> 1st worker a Fitter, 2nd a Fitter or apprentice Fitter, 3rd and 4th may be Tradesmen, 5th a Fitter, then 50/50.</p>`,
  watch: `<p>On a federally funded Caltrans job, Caltrans “does not accept lower State wage rates not specifically included in the federal minimum wage determinations,” including helper classifications. The 2021 federal decision for 11-428704 had no landscape tender, so a tender there had to be paid at least the federal laborer rate.</p>`,
  ex: `<p>A year of plant establishment priced with two Tenders instead of two Laborers: 2 × $30.19 × 8 = $483.04 per day, compared with 2 × $76.67 × 8 = $1,226.72. That difference decides who wins establishment-heavy jobs, as long as the job allows it.</p>`,
  src: "DIR SD-102-X-14-2026-1 footnote d; DIR SDI-2026-2 (Landscape/Irrigation Fitter and Tradesman, footnote AV); Caltrans 11-428704 Special Provisions, Notice to Bidders."
},

{ h: "Fringe benefits (employer payments)",
  lead: "You must spend at least the full total hourly rate on each worker. The benefit part can go into real plans, or to the worker as extra wages.",
  body: `<ul>
<li><strong>Paid into plans:</strong> health insurance, pension or 401(k), vacation fund, and training contributions count as credit toward the total, if the plan is real and the payments are irrevocable.</li>
<li><strong>Not paid into a plan:</strong> pay the difference to the worker on the check as wages. Then payroll taxes apply to it, which raises your cost.</li>
<li><strong>Training</strong> is separate: it goes to an apprenticeship committee or to the California Apprenticeship Council (next slide).</li>
<li><strong>Union or not:</strong> you don't have to be union to bid or work public works. You do have to meet the total rate.</li>
</ul>`,
  ex: `<p>Your company pays $3.00 an hour toward health insurance for a Landscape/Irrigation Laborer and has no pension plan. The determination's employer payments add up to $29.10. After the $0.80 training payment and your $3.00 health payment, $25.30 an hour is left, and it goes on the paycheck as extra taxable wages.</p>`,
  watch: `<p>A residential company's benefits are usually spread over every hour worked all year. Labor Code §1773.1 says that when you pay more benefits per hour on public jobs than on private ones, credit is figured on an annual basis. You can't count a whole year's health premium against one month of public work. Have your payroll provider or CPA set this up before your first public job.</p>`,
  deeper: `<p>Labor Code §1773.1 lists which employer payments count (health and welfare, pension, vacation and holiday, apprenticeship training and others) and says credit can't reduce the straight-time or overtime wage below the prevailing amount, and isn't given for benefits other laws already require.</p>`,
  src: "Cal. Labor Code §1773.1; DIR SD-102-X-14-2026-1."
},

{ h: "Overtime, holidays, travel and shifts",
  lead: "Public works has its own overtime rule, and each craft adds its own holiday, travel and shift rules on top.",
  body: `<ul>
<li><strong>Overtime:</strong> hours over 8 in a day or 40 in a week must be paid at least 1½ times the basic rate. Check each craft's footnotes for double time.</li>
<li><strong>Holidays:</strong> the craft's holidays come from its union agreement on file with DIR, or Government Code §6700 if it isn't union-based. Download the “Holidays” PDF for each craft.</li>
<li><strong>Travel and subsistence:</strong> some crafts require travel pay or per-diem depending on distance. Download the “Travel” PDF.</li>
<li><strong>Shift work:</strong> night work for crafts marked “+” (like Operating Engineer) has its own shift rates. Night freeway closures (Module 15) trigger them.</li>
<li><strong>Agency work hours:</strong> the City of San Diego's normal working hours are 7:00 AM to 5:00 PM, Monday through Friday, unless the permit says otherwise.</li>
</ul>`,
  watch: `<p>Each worker who works over 8 hours a day and 40 a week without overtime pay costs a $25 penalty per worker per day under Labor Code §1813, on top of the back pay.</p>`,
  ex: `<p>A crew works a 10-hour Monday to finish a valve manifold. For each Landscape/Irrigation Laborer, the 2 extra hours cost 2 × $100.455 = $200.91, not 2 × $76.67 = $153.34.</p>`,
  src: "Cal. Labor Code §§1810–1815; DIR Prevailing Wage FAQ Q14; City of San Diego K-24-1952 Supplementary Special Provisions 1-2."
},

{ h: "Apprenticeship rules",
  lead: "On public works contracts of $30,000 or more, every contractor in an apprenticeable craft must notify, request and use apprentices, and pay training funds.",
  body: `<ol class="steps">
<li><div><b>DAS 140 · Notice of contract award</b>Send within 10 days of signing your contract or subcontract, and no later than the first day you have workers on the job. Send it to your own apprenticeship committee if you're approved to train, or to every committee that can supply apprentices to the site.</div></li>
<li><div><b>DAS 142 · Request for dispatch</b>If you don't already have enough apprentices, request them in writing at least 3 business days before you need them.</div></li>
<li class="hl"><div><b>Ratio</b>At least 1 hour of apprentice work for every 5 hours of journeyman work, per craft.</div></li>
<li><div><b>Training fund</b>Pay the training amount from the determination for every hour, overtime included, of every journeyman and apprentice. Pay it to your apprenticeship program, or to the California Apprenticeship Council with an online CAC-2 form, by the 15th of the following month.</div></li>
</ol>
<p>Crafts marked “#” on DIR's determinations are apprenticeable. Landscape/Irrigation Laborer, Landscape/Irrigation Fitter and Operating Engineer are all marked #.</p>`,
  ex: `<p><strong>Ratio math:</strong> your two Landscape/Irrigation Laborers will work 8 hours a day for 40 days: 2 × 8 × 40 = 640 journeyman hours. Minimum apprentice hours: 640 ÷ 5 = <strong>128</strong>. Training fund on the journeyman hours at the 2026-2 rate: 640 × $0.80 = <strong>$512</strong>, plus the apprentice training amount on the apprentices' hours.</p>`,
  watch: `<p>The duty applies to subs too, even if your subcontract is under $30,000, when the prime contract is $30,000 or more. Send the DAS 140 even on a short job.</p>`,
  deeper: `<p>Labor Code §1777.5 sets the 1:5 ratio and the $30,000 threshold. Knowing violations cost up to $100 per day of noncompliance, and up to $300 per day for a repeat within 3 years (§1777.7). If a committee won't dispatch apprentices after you asked all programs in the area, you have met the duty. Keep copies of every DAS 140, DAS 142 and CAC-2 receipt.</p>`,
  src: "DIR Division of Apprenticeship Standards, Public Works requirements and “More Information” page (dir.ca.gov/das/publicworks.html); Cal. Labor Code §§1777.5, 1777.7."
},

{ h: "Certified payroll",
  lead: "Every week you pay workers on a public job, you produce a certified payroll record: who worked, which craft, how many hours, what you paid, signed under penalty of perjury.",
  body: `<ul>
<li><strong>What it shows:</strong> each worker's name, address, last 4 of the social security number, craft, hours each day, rate paid, gross pay, deductions and benefits paid.</li>
<li><strong>Most jobs: eCPR to DIR.</strong> Each contractor and sub uploads its own certified payroll to DIR's online system, at least every 30 days while working and within 30 days after the last day of work. Weekly is best practice.</li>
<li><strong>Caltrans:</strong> exempt from DIR's eCPR. Caltrans jobs use <strong>LCPtracker Pro</strong> (the 11-428704 specs said so in section 7-1.02K(3)).</li>
<li><strong>City of San Diego:</strong> weekly certified payroll through the City's own Labor Compliance Program system <strong>and</strong> to DIR. The City withholds payments when payroll is late or incomplete.</li>
<li><strong>No work this week?</strong> File a Statement of Non-Performance so the record has no gaps.</li>
</ul>`,
  watch: `<p>If you're the owner and work on the job yourself, you still report your hours, craft and pay. Your pay for that work must equal at least the prevailing rate.</p>`,
  deeper: `<ul>
<li>Labor Code §1771.4: missing eCPR uploads cost $100 per day, up to $5,000 per project (starting 14 days after the deadline).</li>
<li>Labor Code §1776: when an agency or DIR asks in writing for payroll records, you have 10 days; after that, $100 per calendar day per worker until you comply.</li>
<li>Small projects ($25,000 / $15,000 or less): no DIR upload, but keep the records 3 years and produce them on request.</li>
</ul>`,
  src: "Cal. Labor Code §§1771.4, 1776; DIR Public Works FAQ, Certified Payroll Reporting; Caltrans 11-428704 Special Provisions 7-1.02K(3); City of San Diego K-24-1952 Attachment D."
},

{ h: "DIR registration, job site posting and records",
  lead: "You must be registered before you bid. Once you're working, the wage rates and DIR's notice go up on site, and your records must be ready to show.",
  body: `<div class="twocol">
<div><h3>Registration (recap)</h3><ul>
<li>Every contractor and sub on a public works job must be DIR-registered to bid, be listed or work. See <a href="#m2-10">Module 2</a>.</li>
<li>$400 per fiscal year (July 1 to June 30). Late registration: $2,000 penalty, once in 12 months.</li>
<li>The agency registers the project with DIR and gets a DIR project ID. You use it on eCPR.</li>
<li>Unregistered contractors on a job can be removed by a stop order.</li>
</ul></div>
<div><h3>On site and in the office</h3><ul>
<li>Post the wage determinations at each job site.</li>
<li>Post DIR's job site notice telling workers how to report wage problems.</li>
<li>Keep time cards by craft, payroll, benefit payment proof, DAS 140/142, CAC-2 receipts and the determinations you used.</li>
<li>Keep records at least 3 years after the work.</li>
</ul></div>
</div>`,
  ex: `<p>The City of San Diego's EMTS Boat Dock Esplanade contract (K-24-1952) required the contractor and subs to “post a copy of the prevailing rate of per diem wages determination at each job site,” and to give the City a list of all subcontractors, at any tier, with DIR numbers, before work starts and with every invoice.</p>`,
  deeper: `<p>Labor Code §1773.2 has the agency post the determination at each job site; most contracts pass that duty to the contractor. Labor Code §1771.4(a)(2) has the agency post, or require the prime to post, DIR's job site notice. Labor Code §1725.5 sets registration; §1771.1 bars unregistered contractors from bidding or working.</p>`,
  src: "DIR Public Works FAQ; Cal. Labor Code §§1725.5, 1771.1, 1771.4, 1773.2; City of San Diego K-24-1952 Attachment D, §§1.1.1, 1.11."
},

{ h: "Penalties: what mistakes cost",
  lead: "Underpaying is never cheaper. You owe the back wages to the worker plus a penalty for every worker, every day.",
  body: `<div class="tablewrap"><table>
<thead><tr><th>Violation</th><th>Penalty</th><th>Law</th></tr></thead>
<tbody>
<tr><td>Paying less than prevailing wage</td><td>Back wages, plus up to $200 per worker per day. Minimum $40 (unless a good faith mistake promptly fixed), $80 with a prior violation in 3 years, $120 if willful.</td><td>LC §1775</td></tr>
<tr><td>No overtime on public works</td><td>$25 per worker per day</td><td>LC §1813</td></tr>
<tr><td>Payroll records not given within 10 days of a written request</td><td>$100 per worker per day</td><td>LC §1776</td></tr>
<tr><td>eCPR not uploaded to DIR</td><td>$100 per day, up to $5,000 per project</td><td>LC §1771.4</td></tr>
<tr><td>Knowing apprenticeship violation</td><td>Up to $100 per day; $300 per day for a repeat</td><td>LC §1777.7</td></tr>
<tr><td>Working without DIR registration</td><td>Removal by stop order; $2,000 to register late</td><td>LC §§1725.5, 1771.1</td></tr>
</tbody></table></div>`,
  ex: `<p><strong>Worked example:</strong> three Tenders were paid as Tenders on a federal-aid job where the federal laborer rate was required, for 15 days. Penalty alone: 3 workers × 15 days × $40 = $1,800 at the minimum, up to 3 × 15 × $200 = $9,000. Back wages are on top, and the agency withholds the money from your progress payments.</p>`,
  watch: `<p>The prime is also on the hook for a sub's underpayment if it didn't flow down the Labor Code sections in the subcontract, review the sub's certified payroll, act when it found a problem, and get a signed affidavit before final payment. Expect GCs to check your payroll closely.</p>`,
  src: "Cal. Labor Code §§1775, 1776, 1771.4, 1777.7, 1813; DIR Public Works FAQ (registration penalties)."
},

{ h: "Federal jobs: Davis-Bacon and “pay the higher”",
  lead: "When federal money is in the job, a federal wage decision applies too. On a state or local agency job with federal money, you pay whichever rate is higher for each classification.",
  body: `<ul>
<li><strong>Davis-Bacon</strong> is the federal prevailing wage law for federal construction contracts over $2,000. Its wage decisions are on SAM.gov and are bound into the bid documents.</li>
<li><strong>Federal-aid jobs run by California agencies</strong> (most Caltrans highway work, some City jobs) must follow <strong>both</strong> state and federal rules, including DIR registration.</li>
<li>Caltrans's rule on 11-428704: “the Contractor and subcontractors must not pay less than the higher wage rate.”</li>
<li>Jobs fully controlled by a federal agency (for example, on a military base) follow only the federal rules.</li>
</ul>
<div class="tablewrap"><table>
<thead><tr><th>11-428704 (advertised Aug 2, 2021)</th><th class="num">State (DIR) total</th><th class="num">Federal total</th><th class="num">Pay at least</th></tr></thead>
<tbody>
<tr><td>Landscape laborer (federal Laborer Group 1)</td><td class="num">$59.81</td><td class="num">$55.78</td><td class="num">$59.81</td></tr>
<tr><td>Irrigation laborer (federal Laborer Group 2)</td><td class="num">$59.81</td><td class="num">$56.24</td><td class="num">$59.81</td></tr>
<tr><td>Landscape/Irrigation Fitter</td><td class="num">$60.53</td><td class="num">$59.40</td><td class="num">$60.53</td></tr>
<tr><td>Skid steer (Operating Engineer Group 3)</td><td class="num">$78.31*</td><td class="num">$76.52</td><td class="num">$78.31*</td></tr>
</tbody></table></div>
<p>*State 2021-1 rate before its July 1, 2021 predetermined increase. The real minimum was higher.</p>`,
  watch: `<p>Module 15 lists the federal rates for this job. On its own, the federal table would have priced every classification here too low. Always pull the DIR rates too and compare line by line.</p>`,
  deeper: `<p>State rates: Landscape/Irrigation Laborer SD-102-X-14-2021-1 ($57.66) plus the Aug 1, 2021 increase ($2.15); Landscape/Irrigation Fitter, San Diego County subtrades 2021-1 ($35.30 + $8.91 + $13.30 + $1.89 + $1.13 = $60.53); Operating Engineer SD-23-63-3-2021-1 Group 3 ($78.31). Federal rates: General Decision CA20210001, Mod. 12 (LABO0089-004, PLUM0345-001, ENGI0012-003). Federal certified payroll rules also apply on federal-aid jobs.</p>`,
  src: "40 U.S.C. §3142; Caltrans 11-428704 Notice to Bidders and Addendum 1 federal wage rates; DIR 2021-1 determinations; DIR Public Works FAQ."
},

{ h: "Building prevailing wage into a bid",
  lead: "Labor on a public job is priced the same way as any job (Module 9), but every rate comes from the determination, and several costs are added.",
  body: `<ol class="steps">
<li><div><b>Find the advertisement date</b>It sets which determinations apply.</div></li>
<li><div><b>List the tasks and pick the craft for each</b>Planting, irrigation install, fitting, equipment, trucking, establishment.</div></li>
<li class="hl"><div><b>Pull each craft's total hourly rate and its increases</b>Spread the job over your schedule and use the rate in effect when each part of the work happens.</div></li>
<li><div><b>Build the crew mix the ratio rules allow</b>Laborer/Tender and Fitter/Tradesman rules, plus apprentices at 1 hour per 5.</div></li>
<li><div><b>Add burden on the wages you pay on the check</b>Payroll taxes, workers' comp and liability insurance. Ask your agent which pay your comp rate is charged on.</div></li>
<li><div><b>Add overtime, shift and travel</b>Night closures, weekend make-up days, travel and subsistence.</div></li>
<li><div><b>Add the compliance cost</b>Office time for certified payroll every week, LCPtracker or eCPR setup, DAS forms, training fund remittances.</div></li>
</ol>`,
  watch: `<p>Don't take your residential crew cost and add a percentage. Rebuild the crew day from the determination. The difference is too big to guess.</p>`
},

{ h: "Worked example: a planting crew day, 2026",
  lead: "The same four-person planting crew costs more than twice as much on a public job. Here's the math.",
  body: `<p><strong>Crew:</strong> 2 Landscape/Irrigation Laborers + 2 Landscape/Irrigation Tenders (allowed by footnote d). 8-hour day. 2026-2 San Diego rates.</p>
<div class="tablewrap"><table>
<thead><tr><th>Line</th><th class="num">Public works</th><th class="num">Private (made-up)</th></tr></thead>
<tbody>
<tr><td>Laborers: 2 × rate × 8 h</td><td class="num">2 × $76.67 × 8 = $1,226.72</td><td class="num">2 × $25.00 × 8 = $400.00</td></tr>
<tr><td>Tenders / helpers: 2 × rate × 8 h</td><td class="num">2 × $30.19 × 8 = $483.04</td><td class="num">2 × $21.00 × 8 = $336.00</td></tr>
<tr><td>Wages and benefits</td><td class="num">$1,709.76</td><td class="num">$736.00</td></tr>
<tr><td>Wages on the check (basic rates)</td><td class="num">(2 × $47.57 + 2 × $21.97) × 8 = $1,112.64</td><td class="num">$736.00</td></tr>
<tr><td>Burden at 20% of check wages (example)</td><td class="num">$222.53</td><td class="num">$147.20</td></tr>
<tr><td><strong>Crew day</strong></td><td class="num"><strong>$1,932.29</strong></td><td class="num"><strong>$883.20</strong></td></tr>
</tbody></table></div>
<p>Public ÷ private = $1,932.29 ÷ $883.20 = <strong>2.19 times</strong>.</p>
<p><strong>Effect on a unit price:</strong> if the crew plants 60 one-gallon shrubs a day (example rate), labor per plant is $1,932.29 ÷ 60 = <strong>$32.20</strong> on the public job, compared with $883.20 ÷ 60 = $14.72 privately.</p>`,
  ex: `<p>If the job won't let you use Tenders (federal-aid Caltrans work, or crew size too small), four Laborers cost 4 × $76.67 × 8 = $2,453.44, plus 20% burden on $1,522.24 of check wages ($304.45) = <strong>$2,757.89</strong> a day.</p>`,
  watch: `<p>The private wages and the 20% burden are example numbers for practice. Use your own payroll costs and your insurance agent's rates. The public rates are real 2026-2 DIR rates; pull current ones for every bid.</p>`,
  src: "DIR SD-102-X-14-2026-1."
},

{ h: "Worked example: a 2021 federal-aid irrigation crew",
  lead: "Using the higher rate for each worker, here is the minimum hourly cost of an irrigation crew on Caltrans 11-428704.",
  body: `<p><strong>Crew:</strong> 1 Landscape/Irrigation Fitter, 2 irrigation laborers, 1 skid steer operator. No tenders (not in the federal decision).</p>
<div class="tablewrap"><table>
<thead><tr><th>Worker</th><th class="num">Higher rate (state)</th><th class="num">Federal only</th></tr></thead>
<tbody>
<tr><td>Fitter</td><td class="num">$60.53</td><td class="num">$59.40</td></tr>
<tr><td>2 irrigation laborers</td><td class="num">2 × $59.81 = $119.62</td><td class="num">2 × $56.24 = $112.48</td></tr>
<tr><td>Skid steer operator</td><td class="num">$78.31</td><td class="num">$76.52</td></tr>

</tbody></table></div>
<p>Pricing from the federal table alone would be $80.48 a day short, before burden. Over 100 crew-days that's about <strong>$8,048</strong> of wages you'd owe but never priced, plus penalties if you paid only the federal rate.</p>`,
